<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Twilights — Маршрут</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/styles.css">
<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#eee);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;user-select:none;-webkit-user-select:none;}
.wrap{width:100%;max-width:380px;text-align:center;}
.ready-title{font-size:1.45rem;font-weight:700;margin-bottom:8px;}
.ready-info{font-size:0.92rem;color:var(--tg-theme-hint-color,#aaa);margin-bottom:16px;line-height:1.45;}
.hud{display:flex;justify-content:space-around;margin-bottom:12px;padding:8px;background:rgba(255,255,255,0.05);border-radius:12px;}
.hud-item{text-align:center;}
.hud-l{font-size:0.65rem;color:var(--tg-theme-hint-color,#aaa);text-transform:uppercase;}
.hud-v{font-size:1.15rem;font-weight:700;}
.hint{font-size:0.8rem;color:var(--tg-theme-hint-color,#aaa);margin-top:10px;min-height:1.2em;}
.result{display:none;margin-top:14px;}
.result-t{font-size:1.35rem;font-weight:700;margin-bottom:6px;}
.result-s{font-size:0.95rem;color:var(--tg-theme-hint-color,#aaa);}
.play{display:none;}
.chip-btn{padding:12px 18px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:inherit;font-size:1rem;font-weight:700;cursor:pointer;min-width:56px;margin:4px;}
.chip-btn:active{transform:scale(0.96);}
.chip-btn.active{border-color:#00b894;background:rgba(0,184,148,0.2);}
.grid{display:grid;gap:3px;width:100%;}.cell{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,0.06);font-size:0.7rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}.cell.wall{background:#2d3436;}.cell.start{background:#00b894;}.cell.end{background:#e74c3c;}.cell.path{background:#6c5ce7;}.cell.fog{background:rgba(255,255,255,0.02);color:transparent;}
</style>
</head>
<body>
<div class="wrap">
  <div id="g-ready">
    <div class="ready-title" id="g-title">🗺️ Маршрут</div>
    <div class="ready-info" id="g-info">Дойди от зелёного к красному. Тапай соседние клетки.</div>
    <button class="confirm-btn" onclick="gStart()">Начать</button>
  </div>
  <div class="play" id="g-play">
    <div class="hud" id="g-hud"></div>
    <div class="grid" id="grid"></div>
    <div class="hint" id="g-hint"></div>
    <div class="result" id="g-result"><div class="result-t" id="g-rt"></div><div class="result-s" id="g-rs"></div></div>
  </div>
</div>
<script src="../shared/core.js"></script>
<script>

function tierBy(pct){
  if(pct>=0.9)return {outcome:'Идеально',level:4};
  if(pct>=0.75)return {outcome:'Отлично',level:3};
  if(pct>=0.55)return {outcome:'Хорошо',level:2};
  if(pct>=0.35)return {outcome:'Неплохо',level:1};
  return {outcome:'Слабо',level:0};
}
function showReady(defTitle, defInfo){
  document.getElementById('g-title').textContent=gameData.prompt||defTitle;
  document.getElementById('g-info').textContent=defInfo;
}
function goPlay(){
  document.getElementById('g-ready').style.display='none';
  document.getElementById('g-play').style.display='block';
}
function finish(game, payload, title, sub){
  document.getElementById('g-rt').textContent=title;
  document.getElementById('g-rs').textContent=sub;
  document.getElementById('g-result').style.display='block';
  setTimeout(()=>sendResultToBot(Object.assign({game},payload)),800);
}

let S={};
function gStart(){
  goPlay();
  const n=Math.max(5,Math.min(9,gameData.size||6));
  const grid=Array.from({length:n*n},()=>0);
  // walls
  for(let i=0;i<n*n*0.22|0;i++) grid[rng()*n*n|0]=1;
  grid[0]=0; grid[n*n-1]=0;
  S={n,grid,path:[0],start:Date.now(),done:false,steps:0};
  render(); hud();
}
function hud(){document.getElementById('g-hud').innerHTML=`<div class="hud-item"><div class="hud-l">Шаги</div><div class="hud-v">${S.steps}</div></div>`;}
function render(){
  const g=document.getElementById('grid'); g.style.gridTemplateColumns=`repeat(${S.n},1fr)`; g.innerHTML='';
  const cur=S.path[S.path.length-1];
  for(let i=0;i<S.n*S.n;i++){
    const d=document.createElement('div'); d.className='cell';
    if(S.grid[i]===1)d.classList.add('wall');
    if(i===0)d.classList.add('start');
    if(i===S.n*S.n-1)d.classList.add('end');
    if(S.path.includes(i))d.classList.add('path');
    // fog: only show neighbours of path
    const r=i/S.n|0,c=i%S.n; const cr=cur/S.n|0,cc=cur%S.n;
    const near=S.path.some(p=>{const pr=p/S.n|0,pc=p%S.n; return Math.abs(pr-r)+Math.abs(pc-c)<=1;});
    if(!near && i!==0 && i!==S.n*S.n-1) d.classList.add('fog');
    d.onclick=()=>tap(i); g.appendChild(d);
  }
}
function tap(i){ if(S.done||S.grid[i]===1)return;
  const cur=S.path[S.path.length-1];
  const r=i/S.n|0,c=i%S.n,cr=cur/S.n|0,cc=cur%S.n;
  if(Math.abs(r-cr)+Math.abs(c-cc)!==1)return;
  if(S.path.includes(i) && i!==0){ // backtrack
    const idx=S.path.indexOf(i); S.path=S.path.slice(0,idx+1);
  } else { S.path.push(i); S.steps++; }
  hud(); render();
  if(i===S.n*S.n-1){ S.done=true; const ideal=S.n*2-2; const pct=Math.max(0,Math.min(1,ideal/Math.max(ideal,S.steps))); const t=tierBy(pct);
    finish('route',{steps:S.steps,ideal,outcome:t.outcome,level:t.level,timeSpent:Math.round((Date.now()-S.start)/1000)},t.outcome,'шагов: '+S.steps);
  }
}
showReady('🗺️ Маршрут','Кратчайший путь по открытым клеткам');

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Twilights — Узел</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/styles.css">
<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#eee);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;user-select:none;-webkit-user-select:none;}
.wrap{width:100%;max-width:380px;text-align:center;}
.ready-title{font-size:1.45rem;font-weight:700;margin-bottom:8px;}
.ready-info{font-size:0.92rem;color:var(--tg-theme-hint-color,#aaa);margin-bottom:16px;line-height:1.45;}
.hud{display:flex;justify-content:space-around;margin-bottom:12px;padding:8px;background:rgba(255,255,255,0.05);border-radius:12px;}
.hud-item{text-align:center;}
.hud-l{font-size:0.65rem;color:var(--tg-theme-hint-color,#aaa);text-transform:uppercase;}
.hud-v{font-size:1.15rem;font-weight:700;}
.hint{font-size:0.8rem;color:var(--tg-theme-hint-color,#aaa);margin-top:10px;min-height:1.2em;}
.result{display:none;margin-top:14px;}
.result-t{font-size:1.35rem;font-weight:700;margin-bottom:6px;}
.result-s{font-size:0.95rem;color:var(--tg-theme-hint-color,#aaa);}
.play{display:none;}
.chip-btn{padding:12px 18px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:inherit;font-size:1rem;font-weight:700;cursor:pointer;min-width:56px;margin:4px;}
.chip-btn:active{transform:scale(0.96);}
.chip-btn.active{border-color:#00b894;background:rgba(0,184,148,0.2);}
canvas{width:100%;border-radius:16px;background:#12121f;border:2px solid rgba(255,255,255,0.08);touch-action:none;display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div id="g-ready">
    <div class="ready-title" id="g-title">🪢 Узел</div>
    <div class="ready-info" id="g-info">Поменяй концы местами, чтобы линии не пересекались.</div>
    <button class="confirm-btn" onclick="gStart()">Начать</button>
  </div>
  <div class="play" id="g-play">
    <div class="hud" id="g-hud"></div>
    <canvas id="cv" width="320" height="320"></canvas><button class="confirm-btn" onclick="check()">Проверить</button>
    <div class="hint" id="g-hint"></div>
    <div class="result" id="g-result"><div class="result-t" id="g-rt"></div><div class="result-s" id="g-rs"></div></div>
  </div>
</div>
<script src="../shared/core.js"></script>
<script>

function tierBy(pct){
  if(pct>=0.9)return {outcome:'Идеально',level:4};
  if(pct>=0.75)return {outcome:'Отлично',level:3};
  if(pct>=0.55)return {outcome:'Хорошо',level:2};
  if(pct>=0.35)return {outcome:'Неплохо',level:1};
  return {outcome:'Слабо',level:0};
}
function showReady(defTitle, defInfo){
  document.getElementById('g-title').textContent=gameData.prompt||defTitle;
  document.getElementById('g-info').textContent=defInfo;
}
function goPlay(){
  document.getElementById('g-ready').style.display='none';
  document.getElementById('g-play').style.display='block';
}
function finish(game, payload, title, sub){
  document.getElementById('g-rt').textContent=title;
  document.getElementById('g-rs').textContent=sub;
  document.getElementById('g-result').style.display='block';
  setTimeout(()=>sendResultToBot(Object.assign({game},payload)),800);
}

let S={},cv,ctx;
function gStart(){
  goPlay(); cv=document.getElementById('cv'); ctx=cv.getContext('2d');
  const n=Math.max(3,Math.min(6,gameData.pairs||4));
  const pts=[];
  for(let i=0;i<n*2;i++){
    const a=i/ (n*2)*Math.PI*2;
    pts.push({x:160+Math.cos(a)*120,y:160+Math.sin(a)*120,id:i});
  }
  // pairs 0-1, 2-3... but shuffle endpoints on right half
  let pairs=[];
  for(let i=0;i<n;i++)pairs.push([i, n+i]);
  // scramble second endpoints
  const rights=pairs.map(p=>p[1]); shuffle(rights);
  pairs=pairs.map((p,i)=>[p[0],rights[i]]);
  S={pts,pairs,n,sel:null,moves:0,start:Date.now(),done:false};
  draw();
  cv.onclick=e=>{
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*320, y=(e.clientY-r.top)/r.height*320;
    let best=null,bd=30;
    S.pts.forEach(p=>{const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;best=p.id;}});
    if(best==null)return;
    if(S.sel==null){S.sel=best;draw();return;}
    if(S.sel===best){S.sel=null;draw();return;}
    // swap ownership in pairs for these two endpoints
    swapEnds(S.sel,best); S.moves++; S.sel=null; draw(); hud();
  };
  hud();
}
function hud(){document.getElementById('g-hud').innerHTML=`<div class="hud-item"><div class="hud-l">Ходы</div><div class="hud-v">${S.moves}</div></div>`;}
function swapEnds(a,b){
  for(const p of S.pairs){
    if(p[0]===a)p[0]=b; else if(p[0]===b)p[0]=a;
    if(p[1]===a)p[1]=b; else if(p[1]===b)p[1]=a;
  }
}
function crosses(a,b,c,d){
  function ccw(p,q,r){return (r.y-p.y)*(q.x-p.x)>(q.y-p.y)*(r.x-p.x);}
  return ccw(a,c,d)!==ccw(b,c,d) && ccw(a,b,c)!==ccw(a,b,d);
}
function crossCount(){
  let c=0; const P=S.pts;
  for(let i=0;i<S.pairs.length;i++)for(let j=i+1;j<S.pairs.length;j++){
    const a=P[S.pairs[i][0]],b=P[S.pairs[i][1]],c2=P[S.pairs[j][0]],d=P[S.pairs[j][1]];
    if(crosses(a,b,c2,d))c++;
  }
  return c;
}
function draw(){
  ctx.clearRect(0,0,320,320);
  const cols=['#e74c3c','#3498db','#2ecc71','#f1c40f','#a29bfe','#fd79a8'];
  S.pairs.forEach((p,i)=>{
    const a=S.pts[p[0]],b=S.pts[p[1]];
    ctx.strokeStyle=cols[i%cols.length]; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  });
  S.pts.forEach(p=>{
    ctx.beginPath(); ctx.fillStyle=S.sel===p.id?'#fff':'#a29bfe';
    ctx.arc(p.x,p.y,10,0,7); ctx.fill();
  });
}
function check(){ if(S.done)return; S.done=true;
  const c=crossCount(); const pct=c===0?1:Math.max(0,1-c/S.n); const t=tierBy(pct);
  finish('knot',{crossings:c,moves:S.moves,outcome:t.outcome,level:t.level,timeSpent:Math.round((Date.now()-S.start)/1000)},t.outcome,'пересечений: '+c);
}
showReady('🪢 Узел','Тапни две точки, чтобы поменять концы · без пересечений');

</script>
</body>
</html>

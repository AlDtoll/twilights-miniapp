<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Twilights — Матч-3</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #1a1a2e);
    color: var(--tg-theme-text-color, #eee);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 8px; text-align: center; }
  .subtitle { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 16px; text-align: center; }

  /* THRESHOLDS */
  .thresholds-panel { width: 100%; max-width: 360px; margin-bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .threshold-chip {
    flex: 1; min-width: 60px; padding: 6px 8px; border-radius: 10px; text-align: center;
    font-size: 0.75rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  }
  .threshold-chip .t-range { font-weight: 700; font-size: 0.85rem; display: block; }
  .threshold-chip .t-label { color: var(--tg-theme-hint-color, #aaa); font-size: 0.7rem; }
  .threshold-chip.active { border-color: #00b894; background: rgba(0,184,148,0.18); }
  .threshold-chip.active .t-label { color: #00b894; }

  /* CHOICE */
  #choice-game { width: 100%; max-width: 360px; }
  .choice-prompt { text-align: center; font-size: 1rem; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; line-height: 1.5; }
  .choice-buttons { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s; }
  .choice-btn:hover { border-color: var(--tg-theme-button-color, #6c5ce7); }
  .choice-btn.selected { border-color: #00b894; background: rgba(0,184,148,0.2); }
  .choice-hint { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(162,155,254,0.12); border: 1px solid rgba(162,155,254,0.3); font-size: 0.9rem; color: #a29bfe; line-height: 1.5; }

  /* BLACKJACK */
  #bj-game { width: 100%; max-width: 360px; }
  .bj-info { display: flex; justify-content: space-between; margin-bottom: 16px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
  .bj-info-item { text-align: center; }
  .bj-info-label { font-size: 0.7rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 2px; }
  .bj-info-val { font-size: 1.3rem; font-weight: bold; }
  .bj-cards { min-height: 60px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card { width: 44px; height: 60px; border-radius: 8px; background: #fff; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.4); line-height: 1.1; }
  .card.red { color: #e74c3c; }
  .bj-section-label { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 6px; }
  .bj-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: var(--tg-theme-button-color, #6c5ce7); color: var(--tg-theme-button-text-color, #fff); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--tg-theme-text-color, #fff); }

  .result-banner { padding: 12px; border-radius: 12px; text-align: center; font-size: 1.1rem; font-weight: bold; margin-top: 12px; display: none; }
  .result-good { background: rgba(0,184,148,0.2); border: 2px solid #00b894; color: #00b894; }
  .result-mid  { background: rgba(255,193,7,0.15); border: 2px solid #ffc107; color: #ffc107; }
  .result-bad  { background: rgba(231,76,60,0.2); border: 2px solid #e74c3c; color: #e74c3c; }

  /* MODIFIERS (toggle/choice) */
  .modifiers-panel { width: 100%; margin-bottom: 14px; }
  .modifiers-label { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 8px; }
  .modifier-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .modifier-name { font-size: 0.85rem; color: var(--tg-theme-text-color, #eee); flex: 1; min-width: 80px; }
  .mod-btn { padding: 6px 14px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); background: transparent; color: var(--tg-theme-hint-color, #aaa); font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.15s; min-width: 48px; text-align: center; }
  .mod-btn:disabled { opacity: 0.35; cursor: default; }
  .mod-btn.active-plus { border-color: #00b894; background: rgba(0,184,148,0.2); color: #00b894; }
  .mod-btn.active-minus { border-color: #e74c3c; background: rgba(231,76,60,0.2); color: #e74c3c; }

  /* FORESIGHT / DISCARD (shared row layout) */
  .foresight-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .foresight-name { font-size: 0.85rem; color: var(--tg-theme-text-color, #eee); flex: 1; min-width: 80px; }
  .foresight-btn {
    padding: 6px 14px; border-radius: 20px; border: 2px solid #a29bfe;
    background: transparent; color: #a29bfe; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .foresight-btn:disabled { opacity: 0.35; cursor: default; }
  .foresight-btn.used { border-color: rgba(255,255,255,0.2); color: var(--tg-theme-hint-color, #aaa); background: transparent; cursor: default; }
  .foresight-hint {
    width: 100%; margin-top: 4px; padding: 8px 12px; border-radius: 10px;
    background: rgba(162,155,254,0.12); border: 1px solid rgba(162,155,254,0.3);
    font-size: 0.9rem; color: #a29bfe; font-weight: 600; text-align: center;
  }
  .discard-btn {
    padding: 6px 14px; border-radius: 20px; border: 2px solid #fd79a8;
    background: transparent; color: #fd79a8; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .discard-btn:disabled { opacity: 0.35; cursor: default; }
  .discard-btn.used { border-color: rgba(255,255,255,0.2); color: var(--tg-theme-hint-color, #aaa); background: transparent; cursor: default; }

  .confirm-btn { width: 100%; margin-top: 20px; padding: 14px; border-radius: 14px; border: none; background: var(--tg-theme-button-color, #6c5ce7); color: var(--tg-theme-button-text-color, #fff); font-size: 1.05rem; font-weight: 700; cursor: pointer; }
  .confirm-btn:disabled { opacity: 0.25; cursor: default; }

  /* TIMING */
  #timing-game { width: 100%; max-width: 360px; text-align: center; }
  .timing-prompt { font-size: 0.95rem; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; line-height: 1.5; }
  .timing-wrap { position: relative; height: 72px; border-radius: 14px; overflow: hidden; margin-bottom: 10px; background: #e74c3c; }
  .timing-zone { position: absolute; top: 0; bottom: 0; }
  .timing-marker { position: absolute; top: 0; bottom: 0; width: 5px; background: #fff; border-radius: 3px; transform: translateX(-50%); box-shadow: 0 0 10px rgba(255,255,255,0.9); pointer-events: none; transition: none; }
  .timing-live-label { font-size: 1rem; font-weight: 700; min-height: 1.4rem; margin-bottom: 6px; text-align: center; transition: color 0.1s; }
  .timing-result-label { font-size: 1.2rem; font-weight: 700; min-height: 1.8rem; margin-bottom: 16px; }
  .timing-stop-btn { padding: 14px; border-radius: 12px; border: none; background: var(--tg-theme-button-color, #6c5ce7); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; }
  .timing-stop-btn:disabled { opacity: 0.4; cursor: default; }

  /* MATCH-3 */
  #match3-game { width: 100%; max-width: 360px; }
  .m3-status { display: flex; justify-content: space-around; margin-bottom: 10px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
  .m3-status-item { text-align: center; }
  .m3-status-label { font-size: 0.7rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 2px; }
  .m3-status-val { font-size: 1.3rem; font-weight: bold; }
  .m3-thresholds { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); text-align: center; margin-bottom: 6px; }
  .m3-combo { font-size: 0.95rem; font-weight: 700; text-align: center; min-height: 1.4rem; color: #f1c40f; margin-bottom: 6px; }
  .m3-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 10px; touch-action: none; }
  .m3-cell { aspect-ratio: 1; border-radius: 50%; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; }
  .m3-cell.selected { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 10px rgba(255,255,255,0.5); }
  .m3-cell.removing { transition: transform 0.22s cubic-bezier(0.4,0,1,1), opacity 0.22s ease-in !important; transform: scale(0) !important; opacity: 0 !important; }
  .m3-cell.dead { background: rgba(255,255,255,0.04) !important; cursor: default; }
  .m3-time-bar-wrap { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 8px; overflow: hidden; display: none; }
  .m3-time-bar { height: 100%; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }

  /* SEQUENCE */
  #sequence-game { width: 100%; max-width: 360px; }
  .seq-ready-title { font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 10px; }
  .seq-ready-info { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); text-align: center; margin-bottom: 24px; }
  .seq-progress-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .seq-progress-bar { height: 100%; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .seq-counter { font-size: 0.8rem; color: var(--tg-theme-hint-color, #aaa); text-align: right; margin-bottom: 8px; }
  .seq-question { font-size: 1.05rem; font-weight: 600; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 14px; line-height: 1.5; text-align: center; }
  #seq-options { display: flex; flex-direction: column; gap: 8px; }
  .seq-opt-btn { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 0.95rem; cursor: pointer; text-align: left; transition: border-color 0.2s, background 0.2s; }
  .seq-opt-btn:disabled { cursor: default; }
  .seq-opt-correct { border-color: #00b894 !important; background: rgba(0,184,148,0.15) !important; }
  .seq-opt-wrong { border-color: #e74c3c !important; background: rgba(231,76,60,0.15) !important; }
  .seq-feedback { margin-top: 10px; font-size: 1rem; font-weight: 700; text-align: center; min-height: 1.4rem; }
  .seq-result-wrap { text-align: center; }
  .seq-result-score { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
  .seq-result-total { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 16px; }
  .seq-result-label { font-size: 1.2rem; font-weight: 700; padding: 12px 20px; border-radius: 12px; display: inline-block; }

  /* COMPARE */
  #compare-game { width: 100%; max-width: 360px; }
  .cmp-timer-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
  .cmp-timer-fill { height: 100%; background: #00b894; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .cmp-prompt { text-align: center; font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
  .cmp-pair { display: flex; gap: 12px; width: 100%; margin-bottom: 10px; }
  .cmp-card { flex: 1; min-height: 110px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; transition: all 0.15s; line-height: 1.3; }
  .cmp-card:active { transform: scale(0.96); }
  .cmp-card.correct { border-color: #00b894; background: rgba(0,184,148,0.25); }
  .cmp-card.wrong { border-color: #e74c3c; background: rgba(231,76,60,0.2); }
  .cmp-card:disabled { cursor: default; }
  .cmp-progress { text-align: center; font-size: 0.82rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 6px; }
  .cmp-feedback { text-align: center; min-height: 1.4rem; font-size: 1.1rem; font-weight: 700; }

  /* MEMORY */
  #memory-game { width: 100%; max-width: 400px; }
  .mem-header { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); margin-bottom: 8px; }
  .mem-grid { display: grid; gap: 5px; margin-bottom: 8px; }
  .mem-card { aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(255,255,255,0.12); background: rgba(108,92,231,0.12); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; user-select: none; -webkit-tap-highlight-color: transparent; transition: background 0.15s, border-color 0.15s; }
  .mem-card.face-down { color: transparent !important; font-size: 0; }
  .mem-card.face-down::after { content: '?'; color: rgba(255,255,255,0.18); font-size: 1rem; }
  .mem-card.matched { border-color: #00b894; background: rgba(0,184,148,0.2); cursor: default; }
  .mem-card.wrong-pair { border-color: #e74c3c; background: rgba(231,76,60,0.18); }
  @keyframes mem-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* ODDONE */
  #oddone-game { width: 100%; max-width: 360px; }
  .oo-grid { display: grid; gap: 8px; margin-bottom: 10px; }
  .oo-cell { aspect-ratio: 1; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; user-select: none; -webkit-tap-highlight-color: transparent; transition: all 0.12s; }
  .oo-cell.correct { border-color: #00b894; background: rgba(0,184,148,0.2); }
  .oo-cell.wrong-tap { border-color: #e74c3c; background: rgba(231,76,60,0.18); animation: mem-shake 0.3s; }

  /* REACTION */
  #reaction-game { width: 100%; max-width: 360px; text-align: center; }
  .rx-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-size: 0.85rem; color: var(--tg-theme-hint-color,#aaa); }
  .rx-display { font-size: 4.5rem; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); margin-bottom: 14px; transition: background 0.1s, border-color 0.1s; }
  .rx-display.rx-target { background: rgba(108,92,231,0.15); border-color: rgba(108,92,231,0.4); }
  .rx-tap-btn { width: 100%; padding: 20px; border-radius: 16px; border: none; background: var(--tg-theme-button-color,#6c5ce7); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  .rx-tap-btn:active { transform: scale(0.96); }
  .rx-tap-btn:disabled { opacity: 0.4; cursor: default; }

  /* SORTING */
  #sorting-game { width: 100%; max-width: 360px; }
  .sort-round-label { font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); text-align: center; margin-bottom: 8px; }
  .sort-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sort-item { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color,#fff); cursor: pointer; text-align: left; font-size: 1rem; display: flex; align-items: center; gap: 10px; user-select: none; -webkit-tap-highlight-color: transparent; transition: all 0.15s; }
  .sort-item.selected { border-color: #00b894; background: rgba(0,184,148,0.15); cursor: default; }
  .sort-badge { width: 24px; height: 24px; border-radius: 50%; background: #00b894; color: #fff; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; visibility: hidden; }

  /* ESTIMATE */
  #estimate-game { width: 100%; max-width: 360px; text-align: center; }
  .est-round-label { font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); margin-bottom: 8px; text-align: center; }
  .est-display { width: 100%; height: 150px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); margin-bottom: 14px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: rgba(255,255,255,0.2); }
  .est-dot-el { position: absolute; font-size: 1.2rem; line-height: 1; color: var(--tg-theme-text-color,#fff); }
  .est-slider-wrap { margin-bottom: 12px; }
  .est-slider { width: 100%; accent-color: var(--tg-theme-button-color,#6c5ce7); }
  .est-slider-val { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }

  /* FINDALL */
  #findall-game { width: 100%; max-width: 400px; }
  .fa-timer-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
  .fa-timer-fill { height: 100%; background: #00b894; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .fa-target-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .fa-target-label { font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }
  .fa-target-val { font-size: 2rem; padding: 6px 14px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); }
  .fa-grid { display: grid; gap: 5px; margin-bottom: 10px; }
  .fa-cell { aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.12s, background 0.12s; -webkit-tap-highlight-color: transparent; user-select: none; }
  .fa-cell:active:not([disabled]) { transform: scale(0.88); }
  .fa-cell.found { border-color: #00b894; background: rgba(0,184,148,0.3); cursor: default; }
  .fa-cell.wrong { border-color: #e74c3c; background: rgba(231,76,60,0.25); cursor: default; animation: fa-shake 0.25s; }
  .fa-cell[disabled] { cursor: default; }
  @keyframes fa-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  .fa-progress { text-align: center; font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }

  /* COMBAT */
  #combat-game { width: 100%; max-width: 400px; }
  .combat-enemies { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .combat-enemy { padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1); }
  .combat-enemy.dead { opacity: 0.35; }
  .combat-enemy-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .combat-enemy-name { font-weight: 700; font-size: 1rem; }
  .combat-enemy-hp-text { font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }
  .combat-hp-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 8px; }
  .combat-hp-fill { height: 100%; border-radius: 4px; background: #e74c3c; transition: width 0.4s; }
  .combat-enemy-vals { display: flex; gap: 16px; margin-bottom: 8px; font-size: 0.95rem; }
  .combat-val-def { color: #74b9ff; font-weight: 700; }
  .combat-val-atk { color: #ff7675; font-weight: 700; }
  .combat-atk-slot { padding: 7px 10px; border-radius: 8px; border: 1.5px dashed rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.83rem; color: var(--tg-theme-hint-color, #aaa); transition: all 0.15s; }
  .combat-atk-slot:hover { border-color: rgba(255,255,255,0.4); }
  .combat-atk-slot.has-die { border-style: solid; border-color: #e74c3c; background: rgba(231,76,60,0.1); color: var(--tg-theme-text-color, #fff); }
  .combat-damage-2 { color: #fdcb6e; font-weight: 700; }
  .combat-damage-1 { color: #a29bfe; font-weight: 700; }
  .combat-damage-0 { color: #636e72; font-weight: 700; text-decoration: line-through; }
  .combat-enemy-slots { display: flex; gap: 6px; margin-top: 4px; }
  .combat-blk-slot { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1.5px dashed rgba(116,185,255,0.35); display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.83rem; color: var(--tg-theme-hint-color, #aaa); transition: all 0.15s; }

  <div class="m3-combo" id="m3-combo"></div>
  <div class="m3-board" id="m3-board"></div>
  <div class="result-banner" id="m3-result" style="display:none"></div>
  <button class="btn btn-secondary" id="m3-finish-btn" onclick="m3End()" style="width:100%;margin-top:12px;padding:12px;border-radius:12px">Завершить досрочно</button>
</div>

<script src="../shared/core.js"></script>
<script>
const M3_SIZE = 6;
let m3Grid = [], m3Sel = null, m3Score = 0, m3Moves = 0, m3MaxMoves = 15;
let m3UseTimer = false, m3TimeLeft = 0, m3MaxTime = 0, m3TimerInt = null;
let m3Done = false, m3Animating = false, m3Combo = 0;

function m3Gem() { return Math.floor(rng() * M3_COLORS.length); }

let m3StartTime = 0;
function initMatch3() {
  m3StartTime = Date.now();
  document.getElementById('match3-game').style.display = '';
  document.getElementById('subtitle').textContent = '3 в ряд';

  m3MaxMoves = parseInt(gameData.moves) || 15;
  m3Moves = m3MaxMoves;
  m3UseTimer = !!gameData.time;
  if (m3UseTimer) {
    m3MaxTime = parseInt(gameData.time) || 60;
    m3TimeLeft = m3MaxTime;
    document.getElementById('m3-time-item').style.display = '';
    document.getElementById('m3-time-bar-wrap').style.display = '';
  }

  m3Score = 0; m3Done = false; m3Animating = false; m3Combo = 0; m3Sel = null;

  m3Grid = Array.from({length: M3_SIZE}, () => new Array(M3_SIZE).fill(0));
  for (let r = 0; r < M3_SIZE; r++) {
    for (let c = 0; c < M3_SIZE; c++) {
      let g;
      do {
        g = m3Gem();
      } while (
        (c >= 2 && m3Grid[r][c-1] === g && m3Grid[r][c-2] === g) ||
        (r >= 2 && m3Grid[r-1][c] === g && m3Grid[r-2][c] === g)
      );
      m3Grid[r][c] = g;
    }
  }

  m3InitThresholds();
  m3Render();
  m3UpdateStatus();

  if (m3UseTimer) {
    m3TimerInt = setInterval(() => {
      if (m3Done) return;
      m3TimeLeft = Math.max(0, m3TimeLeft - 0.1);
      const pct = m3TimeLeft / m3MaxTime * 100;
      const bar = document.getElementById('m3-time-bar');
      bar.style.width = pct + '%';
      bar.style.background = pct > 50 ? '#00b894' : pct > 25 ? '#f1c40f' : '#e74c3c';
      document.getElementById('m3-time-val').textContent = Math.ceil(m3TimeLeft) + 'с';
      if (m3TimeLeft <= 0) { clearInterval(m3TimerInt); if (!m3Animating) m3End(); else m3Done = true; }
    }, 100);
  }
}

function m3InitThresholds() {
  const th = gameData.thresholds;
  if (!th || !th.length) return;
  const panel = document.getElementById('m3-thresholds-panel');
  panel.style.display = 'flex';
  const sorted = [...th].sort((a,b) => b.min - a.min);
  sorted.forEach((t, i) => {
    const chip = document.createElement('div');
    chip.className = 'threshold-chip';
    chip.dataset.min = t.min;
    const rangeStr = i === 0 ? `${t.min}+` : `${t.min}–${sorted[i-1].min - 1}`;
    chip.innerHTML = `<span class="t-range">${rangeStr}</span><span class="t-label">${t.label}</span>`;
    panel.appendChild(chip);
  });
}

function m3HighlightThreshold(score) {
  const sorted = [...document.querySelectorAll('#m3-thresholds-panel .threshold-chip')];
  sorted.forEach((chip, i) => {
    const minVal = +chip.dataset.min;
    const nextMin = i > 0 ? +sorted[i-1].dataset.min : Infinity;
    chip.classList.toggle('active', score >= minVal && score < nextMin);
  });
}

function m3UpdateStatus() {
  document.getElementById('m3-score').textContent = m3Score;
  document.getElementById('m3-moves-val').textContent = m3Moves;
  if (m3UseTimer) document.getElementById('m3-time-val').textContent = Math.ceil(m3TimeLeft) + 'с';
  m3HighlightThreshold(m3Score);
}

function m3Render() {
  const board = document.getElementById('m3-board');
  board.innerHTML = '';
  for (let r = 0; r < M3_SIZE; r++) {
    for (let c = 0; c < M3_SIZE; c++) {
      const cell = document.createElement('div');
      const g = m3Grid[r][c];
      cell.className = 'm3-cell';
      if (g < 0) {
        cell.classList.add('dead');
      } else {
        cell.style.background = M3_COLORS[g];
        if (m3Sel && m3Sel.r === r && m3Sel.c === c) cell.classList.add('selected');
        if (!m3Done && !m3Animating) cell.addEventListener('click', () => m3Click(r, c));
      }
      board.appendChild(cell);
    }
  }
}

function m3Click(r, c) {
  if (m3Done || m3Animating || m3Grid[r][c] < 0) return;
  if (!m3Sel) { m3Sel = {r, c}; m3Render(); return; }
  if (m3Sel.r === r && m3Sel.c === c) { m3Sel = null; m3Render(); return; }
  if (Math.abs(m3Sel.r - r) + Math.abs(m3Sel.c - c) !== 1) { m3Sel = {r, c}; m3Render(); return; }

  const sr = m3Sel.r, sc = m3Sel.c;
  m3Sel = null; m3Animating = true;
  [m3Grid[r][c], m3Grid[sr][sc]] = [m3Grid[sr][sc], m3Grid[r][c]];

  if (!m3FindMatches().length) {
    [m3Grid[r][c], m3Grid[sr][sc]] = [m3Grid[sr][sc], m3Grid[r][c]];
    m3Animating = false; m3Render(); return;
  }

  m3Moves = Math.max(0, m3Moves - 1);
  m3UpdateStatus(); m3Combo = 0; m3Render();
  setTimeout(m3Cascade, 150);
}

function m3FindMatches() {
  const set = new Set();
  for (let r = 0; r < M3_SIZE; r++) {
    for (let c = 0; c <= M3_SIZE - 3; c++) {
      const g = m3Grid[r][c];
      if (g < 0) continue;
      if (m3Grid[r][c+1] === g && m3Grid[r][c+2] === g) {
        let len = 3; while (c+len < M3_SIZE && m3Grid[r][c+len] === g) len++;
        for (let i = 0; i < len; i++) set.add(r+'_'+(c+i));
      }
    }
  }
  for (let c = 0; c < M3_SIZE; c++) {
    for (let r = 0; r <= M3_SIZE - 3; r++) {
      const g = m3Grid[r][c];
      if (g < 0) continue;
      if (m3Grid[r+1][c] === g && m3Grid[r+2][c] === g) {
        let len = 3; while (r+len < M3_SIZE && m3Grid[r+len][c] === g) len++;
        for (let i = 0; i < len; i++) set.add((r+i)+'_'+c);
      }
    }
  }
  return [...set].map(s => { const p = s.split('_'); return {r:+p[0], c:+p[1]}; });
}

function m3FallAnim(cb) {
  // Рассчитываем движение каждого гема: откуда → куда
  const moves = []; // {col, fromRow, toRow}
  const fresh = []; // {col, toRow, aboveCount} — новые гемы сверху

  for (let c = 0; c < M3_SIZE; c++) {
    let w = M3_SIZE - 1, gap = 0;
    for (let r = M3_SIZE - 1; r >= 0; r--) {
      if (m3Grid[r][c] >= 0) {
        if (w !== r) moves.push({col: c, fromRow: r, toRow: w});
        w--;
      } else { gap++; }
    }
    // Заполняем сверху новыми
    let above = gap;
    for (let r = w; r >= 0; r--) {
      fresh.push({col: c, toRow: r, aboveCount: above--});
    }
  }

  // Применяем гравитацию к данным
  for (let c = 0; c < M3_SIZE; c++) {
    let w = M3_SIZE - 1;
    for (let r = M3_SIZE - 1; r >= 0; r--) {
      if (m3Grid[r][c] >= 0) { m3Grid[w][c] = m3Grid[r][c]; if (w !== r) m3Grid[r][c] = -1; w--; }
    }
    for (let r = w; r >= 0; r--) m3Grid[r][c] = -1;
  }
  fresh.forEach(({col, toRow}) => { m3Grid[toRow][col] = m3Gem(); });

  // Рендерим на новых позициях
  m3Render();

  const board = document.getElementById('m3-board');
  const cellH = board.children[0] ? board.children[0].offsetHeight + 4 : 46;

  // Смещаем гемы вверх (на старые позиции) без анимации
  moves.forEach(({col, fromRow, toRow}) => {
    const el = board.children[toRow * M3_SIZE + col];
    if (!el || el.classList.contains('dead')) return;
    el.style.transition = 'none';
    el.style.transform = `translateY(${-(toRow - fromRow) * cellH}px)`;
  });
  fresh.forEach(({col, toRow, aboveCount}) => {
    const el = board.children[toRow * M3_SIZE + col];
    if (!el || el.classList.contains('dead')) return;
    el.style.transition = 'none';
    el.style.transform = `translateY(${-(toRow + aboveCount) * cellH}px)`;
  });

  const dur = 380;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const cells = board.children;
    for (let i = 0; i < cells.length; i++) {
      if (cells[i].style.transform) {
        cells[i].style.transition = `transform ${dur}ms cubic-bezier(0.4, 0.0, 0.2, 1.0)`;
        cells[i].style.transform = '';
      }
    }
    setTimeout(cb, dur + 20);
  }));
}

function m3Cascade() {
  const matches = m3FindMatches();
  if (!matches.length) {
    m3Animating = false; m3Render();
    if (m3Moves <= 0 || m3Done) m3End();
    return;
  }
  m3Combo++;
  const n = matches.length;
  // Базовые очки: каждый гем = 10 очков
  // Комбо: +10 за каждый каскад свыше первого
  const base = n * 10;
  const gained = base + (m3Combo - 1) * 10;
  m3Score += gained;
  m3UpdateStatus();

  const comboEl = document.getElementById('m3-combo');
  comboEl.textContent = m3Combo > 1 ? `✨ Каскад ${m3Combo} (+${(m3Combo-1)*10} бонус)` : `+${gained}`;
  setTimeout(() => { comboEl.textContent = ''; }, 800);

  // Анимация исчезновения: добавляем .removing к совпавшим ячейкам
  const board = document.getElementById('m3-board');
  matches.forEach(({r,c}) => {
    const el = board.children[r * M3_SIZE + c];
    if (el) el.classList.add('removing');
  });

  // После анимации исчезновения — убираем из данных и падаем
  setTimeout(() => {
    matches.forEach(({r,c}) => { m3Grid[r][c] = -1; });
    m3FallAnim(() => setTimeout(m3Cascade, 60));
  }, 250);
}

function m3End() {
  if (m3Done && document.getElementById('m3-result').style.display !== 'none') return;
  m3Done = true;
  if (m3TimerInt) clearInterval(m3TimerInt);
  m3Animating = false; m3Render();

  const score = m3Score;
  const th = gameData.thresholds;
  let label = 'провал', level = 0;
  if (th && th.length) {
    const sorted = [...th].sort((a,b) => b.min - a.min);
    let f = {label: sorted[sorted.length-1].label, level: sorted[sorted.length-1].level ?? 0};
    for (const t of sorted) { if (score >= t.min) { f = {label:t.label, level:t.level??0}; break; } }
    label = f.label; level = f.level;
  } else {
    if (score >= 500) { label='отлично'; level=3; }
    else if (score >= 250) { label='хорошо'; level=2; }
    else if (score >= 100) { label='частичный'; level=1; }
  }

  const finishBtn = document.getElementById('m3-finish-btn');
  if (finishBtn) finishBtn.style.display = 'none';
  const banner = document.getElementById('m3-result');
  banner.style.display = '';
  banner.className = 'result-banner '+(level>=2?'result-good':level===1?'result-mid':'result-bad');
  banner.textContent = `${score} очков — ${label}`;
  setTimeout(() => sendResultToBot({game:'match3', score, outcome:label, level, timeSpent:Math.round((Date.now()-m3StartTime)/1000)}), 700);
}

initMatch3();
</script>
</body>
</html>

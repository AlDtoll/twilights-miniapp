<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twilights — Плетение рун</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
    :root {
      --bg: #0f0e1a;
      --text: #e8e0ff;
      --accent: #a29bfe;
      --hit: #00b894;
      --miss: #e74c3c;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; user-select: none; -webkit-user-select: none;
    }
    .screen { display: none; width: 100%; max-width: 380px; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }

    .game-title {
      font-size: 1.6rem; font-weight: 800; color: var(--accent);
      text-align: center; margin-bottom: 6px; text-shadow: 0 0 20px rgba(162,155,254,0.5);
    }
    .game-subtitle {
      font-size: 0.85rem; color: rgba(232,224,255,0.5); text-align: center;
      letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px;
    }
    .prompt-box {
      width: 100%; background: rgba(162,155,254,0.08); border: 1px solid rgba(162,155,254,0.2);
      border-radius: 14px; padding: 14px 16px; font-size: 0.95rem; line-height: 1.6;
      color: var(--text); margin-bottom: 18px; text-align: center;
    }
    .info-chips { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .chip {
      padding: 6px 14px; background: rgba(162,155,254,0.1); border: 1px solid rgba(162,155,254,0.25);
      border-radius: 20px; font-size: 0.82rem; color: var(--accent);
    }
    .start-btn {
      width: 100%; padding: 15px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff;
      font-size: 1.1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.05em;
      box-shadow: 0 4px 20px rgba(108,92,231,0.4); transition: transform 0.1s, box-shadow 0.1s;
    }
    .start-btn:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(108,92,231,0.3); }

    .status-line {
      font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; min-height: 1.3em;
      text-align: center; letter-spacing: 0.03em; color: var(--accent); transition: color 0.15s;
    }
    .status-line.good { color: var(--hit); }
    .status-line.bad  { color: var(--miss); }

    .canvas-wrap {
      position: relative; border-radius: 16px; overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #17152b, #0f0e1a 75%);
      border: 1px solid rgba(162,155,254,0.18); box-shadow: inset 0 0 40px rgba(162,155,254,0.06);
      touch-action: none;
    }
    #weave { display: block; touch-action: none; }
    .btn-row { display: flex; gap: 10px; width: 100%; margin-top: 14px; }
    .mini-btn {
      flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
      font-size: 0.92rem; font-weight: 600; color: var(--text);
      background: rgba(255,255,255,0.06);
    }
    .mini-btn.primary { background: linear-gradient(135deg,#6c5ce7,#a29bfe); color:#fff; font-weight:700; }

    .result-icon { font-size: 3rem; margin-bottom: 12px; }
    .outcome-badge { font-size: 1.5rem; font-weight: 800; padding: 10px 28px; border-radius: 30px; margin-bottom: 16px; }
    .outcome-6 { background: rgba(255,215,0,0.15);   border: 2px solid #ffd700; color: #ffd700; }
    .outcome-5 { background: rgba(162,155,254,0.18); border: 2px solid var(--accent); color: var(--accent); }
    .outcome-4 { background: rgba(0,184,148,0.18);   border: 2px solid var(--hit); color: var(--hit); }
    .outcome-3 { background: rgba(0,184,148,0.08);   border: 2px solid rgba(0,184,148,0.45); color: rgba(0,184,148,0.85); }
    .outcome-2 { background: rgba(231,150,60,0.12);  border: 2px solid #e7963c; color: #e7963c; }
    .outcome-1 { background: rgba(231,76,60,0.08);   border: 2px solid rgba(231,76,60,0.45); color: rgba(231,76,60,0.85); }
    .outcome-0 { background: rgba(231,76,60,0.15);   border: 2px solid var(--miss); color: var(--miss); }
    .result-stats {
      width: 100%; background: rgba(255,255,255,0.04); border-radius: 14px;
      padding: 14px 16px; display: flex; gap: 12px; justify-content: center;
    }
    .result-stat { text-align: center; flex: 1; }
    .result-stat-label { font-size: 0.72rem; color: rgba(232,224,255,0.4); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .result-stat-val { font-size: 1.5rem; font-weight: 800; }
  </style>
</head>
<body>

<!-- READY -->
<div id="screen-ready" class="screen active">
  <div class="game-title">⧉ Плетение рун</div>
  <div class="game-subtitle">Twilights · Логика</div>
  <div id="prompt-box" class="prompt-box" style="display:none"></div>
  <div class="info-chips">
    <span class="chip" id="chip-pairs"></span>
    <span class="chip" id="chip-diff"></span>
  </div>
  <div class="prompt-box" style="background:rgba(255,255,255,0.03)">
    Соедини парные руны линиями одного цвета. Пути <b>не должны пересекаться</b> — каждая клетка занимается только одной нитью. Свяжи все пары.
  </div>
  <button class="start-btn" onclick="startGame()">Начать плетение</button>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div class="status-line" id="status">Веди от руны к её паре</div>
  <div class="canvas-wrap" id="cwrap"><canvas id="weave"></canvas></div>
  <div class="btn-row">
    <button class="mini-btn" onclick="resetBoard()">Сбросить</button>
    <button class="mini-btn primary" onclick="finishWeave()">Завершить</button>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-icon" id="result-icon">⧉</div>
  <div class="outcome-badge" id="outcome-badge"></div>
  <div class="result-stats">
    <div class="result-stat">
      <div class="result-stat-label">Пары</div>
      <div class="result-stat-val" id="res-pairs" style="color:var(--hit)"></div>
    </div>
    <div class="result-stat">
      <div class="result-stat-label">Заполнено</div>
      <div class="result-stat-val" id="res-fill" style="color:var(--accent)"></div>
    </div>
  </div>
</div>

<script src="../shared/core.js"></script>
<script>
// ─── BOARD LIBRARY (endpoint grids, digit = pair id, '.' = empty) ─────────────
// Каждое поле построено от полного решения (нити разбивают всю доску) → решаемо.
const BOARDS = [
  ["13..2", "...3.", ".....", ".4...", ".142."],   // 0 base
  ["2..31", ".3...", ".....", "...4.", ".241."],   // 1 mirror
  [".241.", "...4.", ".....", ".3...", "2..31"],   // 2 rot180
];

// ─── CONFIG ──────────────────────────────────────────────────────────────────
const DIFF   = Math.min(5, Math.max(3, parseInt(gameData.size) || 3));
const BI     = (gameData.runeIndex != null && gameData.runeIndex >= 0 && gameData.runeIndex < BOARDS.length)
                 ? gameData.runeIndex : Math.floor(rng() * BOARDS.length);
const BOARD  = BOARDS[BI];
const PROMPT = gameData.prompt || '';
const N      = BOARD.length;

// palette + glyph per color id (1..5)
const COLORS = { 1:'#e74c3c', 2:'#00b894', 3:'#a29bfe', 4:'#f1c40f', 5:'#3498db' };
const RGLYPH = { 1:'ᚠ', 2:'ᚨ', 3:'ᚱ', 4:'ᚦ', 5:'ᛉ' };

// ─── STATE ───────────────────────────────────────────────────────────────────
let cvs, ctx, DIM, CELL;
let endpoints = {};                 // color -> [[r,c],[r,c]]
let owner = [];                     // owner[r][c] = color or 0
let paths = {};                     // color -> [[r,c],...]
let COLORLIST = [];
let drawing = 0, lastCell = null, done = false;

// parse board
for (let r = 0; r < N; r++) {
  owner.push(new Array(N).fill(0));
  for (let c = 0; c < N; c++) {
    const ch = BOARD[r][c];
    if (ch !== '.') {
      const col = parseInt(ch);
      owner[r][c] = col;
      (endpoints[col] = endpoints[col] || []).push([r, c]);
    }
  }
}
COLORLIST = Object.keys(endpoints).map(Number).sort((a, b) => a - b);
COLORLIST.forEach(col => { paths[col] = []; });
const NPAIRS = COLORLIST.length;
const TOTAL_CELLS = N * N;

document.getElementById('chip-pairs').textContent = NPAIRS + ' пары';
document.getElementById('chip-diff').textContent  = N + '×' + N + ' узор';
if (PROMPT) { const pb = document.getElementById('prompt-box'); pb.textContent = PROMPT; pb.style.display = 'block'; }

function setStatus(txt, cls) {
  const el = document.getElementById('status');
  el.textContent = txt; el.className = 'status-line ' + (cls || '');
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function isEndpoint(r, c, col) {
  return endpoints[col].some(([er, ec]) => er === r && ec === c);
}
function eq(a, b) { return a && b && a[0] === b[0] && a[1] === b[1]; }

function startGame() {
  showScreen('screen-game');
  DIM = Math.min(340, window.innerWidth - 32);
  CELL = DIM / N;
  cvs = document.getElementById('weave');
  const dpr = window.devicePixelRatio || 1;
  cvs.width = DIM * dpr; cvs.height = DIM * dpr;
  cvs.style.width = DIM + 'px'; cvs.style.height = DIM + 'px';
  ctx = cvs.getContext('2d');
  ctx.scale(dpr, dpr);
  attachPointer();
  draw();
}

// ─── POINTER / GRID ──────────────────────────────────────────────────────────
function cellAt(ev) {
  const rect = cvs.getBoundingClientRect();
  const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const c = Math.floor(x / CELL), r = Math.floor(y / CELL);
  if (r < 0 || r >= N || c < 0 || c >= N) return null;
  return [r, c];
}
function attachPointer() {
  cvs.addEventListener('pointerdown', onDown);
  cvs.addEventListener('pointermove', onMove);
  cvs.addEventListener('pointerup', onUp);
  cvs.addEventListener('pointercancel', onUp);
}

// free all non-endpoint cells of a color's path
function clearPath(col) {
  for (const [r, c] of paths[col]) {
    if (!isEndpoint(r, c, col)) owner[r][c] = 0;
  }
  paths[col] = [];
}

function onDown(ev) {
  if (done) return;
  ev.preventDefault();
  const cell = cellAt(ev); if (!cell) return;
  const [r, c] = cell;
  const o = owner[r][c];
  if (o === 0) { drawing = 0; return; }

  drawing = o;
  try { cvs.setPointerCapture(ev.pointerId); } catch (e) {}
  if (isEndpoint(r, c, o) && (paths[o].length === 0 || !eq(paths[o][0], cell))) {
    // start fresh from this endpoint
    clearPath(o);
    owner[r][c] = o;
    paths[o] = [[r, c]];
    lastCell = [r, c];
  } else {
    // resume: truncate existing path at this cell
    const idx = paths[o].findIndex(p => eq(p, cell));
    if (idx >= 0) {
      for (let i = idx + 1; i < paths[o].length; i++) {
        const [pr, pc] = paths[o][i];
        if (!isEndpoint(pr, pc, o)) owner[pr][pc] = 0;
      }
      paths[o] = paths[o].slice(0, idx + 1);
      lastCell = [r, c];
    } else {
      clearPath(o); owner[r][c] = o; paths[o] = [[r, c]]; lastCell = [r, c];
    }
  }
  setStatus('Веди нить…', '');
  draw();
}

function tryStep(nr, nc) {
  if (!lastCell) return false;
  const [lr, lc] = lastCell;
  if (Math.abs(nr - lr) + Math.abs(nc - lc) !== 1) return false;  // not adjacent
  const col = drawing;
  // backtrack onto previous cell
  if (paths[col].length >= 2) {
    const prev = paths[col][paths[col].length - 2];
    if (eq(prev, [nr, nc])) {
      const [rr, rc] = paths[col].pop();
      if (!isEndpoint(rr, rc, col)) owner[rr][rc] = 0;
      lastCell = [nr, nc];
      return true;
    }
  }
  const o = owner[nr][nc];
  // reaching the matching endpoint completes the pair
  if (isEndpoint(nr, nc, col) && !eq([nr, nc], paths[col][0])) {
    paths[col].push([nr, nc]); lastCell = [nr, nc];
    return true;
  }
  if (o !== 0) return false;            // occupied by another nit → no crossing
  owner[nr][nc] = col;
  paths[col].push([nr, nc]);
  lastCell = [nr, nc];
  return true;
}

function onMove(ev) {
  if (done || !drawing || !lastCell) return;
  ev.preventDefault();
  const cell = cellAt(ev); if (!cell) return;
  let [tr, tc] = cell;
  // step cell-by-cell toward the pointer (handles quick straight drags)
  let guard = 0;
  while (!(lastCell[0] === tr && lastCell[1] === tc) && guard++ < N * N) {
    const [lr, lc] = lastCell;
    let nr = lr, nc = lc;
    if (Math.abs(tr - lr) >= Math.abs(tc - lc)) nr += Math.sign(tr - lr);
    else nc += Math.sign(tc - lc);
    if (!tryStep(nr, nc)) break;
  }
  draw();
  if (allSolved()) { finishWeave(); }
}

function onUp(ev) {
  if (done) return;
  ev.preventDefault();
  drawing = 0; lastCell = null;
  draw();
}

// ─── STATE QUERIES ────────────────────────────────────────────────────────────
function solvedCount() {
  let s = 0;
  for (const col of COLORLIST) {
    const p = paths[col];
    if (p.length >= 2 && isEndpoint(p[0][0], p[0][1], col) &&
        isEndpoint(p[p.length - 1][0], p[p.length - 1][1], col) &&
        !eq(p[0], p[p.length - 1])) s++;
  }
  return s;
}
function allSolved() { return solvedCount() === NPAIRS; }
function occupiedCells() {
  let n = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (owner[r][c] !== 0) n++;
  return n;
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function center(r, c) { return [(c + 0.5) * CELL, (r + 0.5) * CELL]; }
function draw() {
  ctx.clearRect(0, 0, DIM, DIM);
  // grid
  ctx.strokeStyle = 'rgba(162,155,254,0.10)'; ctx.lineWidth = 1;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, DIM); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(DIM, i * CELL); ctx.stroke();
  }
  // paths
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const col of COLORLIST) {
    const p = paths[col]; if (p.length < 2) continue;
    ctx.strokeStyle = COLORS[col]; ctx.lineWidth = CELL * 0.34;
    ctx.beginPath();
    let [x0, y0] = center(p[0][0], p[0][1]); ctx.moveTo(x0, y0);
    for (let i = 1; i < p.length; i++) { const [x, y] = center(p[i][0], p[i][1]); ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // endpoints (rune discs)
  for (const col of COLORLIST) {
    for (const [r, c] of endpoints[col]) {
      const [x, y] = center(r, c);
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.30, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[col];
      ctx.shadowColor = COLORS[col]; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#0f0e1a'; ctx.font = `${Math.round(CELL * 0.34)}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(RGLYPH[col] || '◆', x, y);
    }
  }
}

// ─── CONTROLS ─────────────────────────────────────────────────────────────────
function resetBoard() {
  if (done) return;
  for (const col of COLORLIST) clearPath(col);
  drawing = 0; lastCell = null;
  setStatus('Веди от руны к её паре', '');
  draw();
}

function finishWeave() {
  if (done) return;
  done = true;
  const solved = solvedCount();
  const frac = NPAIRS > 0 ? solved / NPAIRS : 0;
  const fillFrac = occupiedCells() / TOTAL_CELLS;
  const attempted = COLORLIST.some(col => paths[col].length >= 1);

  let outcome, level;
  if (solved === NPAIRS && fillFrac >= 0.999) { outcome = 'Совершенное плетение'; level = 6; }
  else if (solved === NPAIRS)                 { outcome = 'Отлично';   level = 5; }
  else if (frac >= 0.66)                       { outcome = 'Хорошо';    level = 4; }
  else if (frac >= 0.5)                        { outcome = 'Приемлемо'; level = 3; }
  else if (frac > 0)                           { outcome = 'Неудовл.';  level = 2; }
  else if (attempted)                          { outcome = 'Плохо';     level = 1; }
  else                                         { outcome = 'Провал';    level = 0; }

  const icons = { 6:'✦', 5:'⧉', 4:'⬡', 3:'◇', 2:'○', 1:'·', 0:'💀' };
  document.getElementById('result-icon').textContent = icons[level] || '⧉';
  const badge = document.getElementById('outcome-badge');
  badge.textContent = outcome; badge.className = `outcome-badge outcome-${level}`;
  document.getElementById('res-pairs').textContent = solved + '/' + NPAIRS;
  document.getElementById('res-fill').textContent  = Math.round(fillFrac * 100) + '%';

  setStatus(solved === NPAIRS ? 'Все нити сплетены ✦' : 'Плетение завершено', solved === NPAIRS ? 'good' : 'bad');
  draw();
  setTimeout(() => showScreen('screen-result'), 500);

  const result = {
    game: 'rune-weave',
    board: BI,
    pairs: NPAIRS,
    solved,
    fraction: Math.round(frac * 1000) / 1000,
    fill: Math.round(fillFrac * 1000) / 1000,
    outcome, level,
  };
  setTimeout(() => sendResultToBot(result), 1200);
}
</script>
</body>
</html>

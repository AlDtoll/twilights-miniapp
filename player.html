<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд — Сумерки мира</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0e0c;
  --bg2:      #1a1814;
  --bg3:      #232018;
  --border:   #2e2a22;
  --text:     #c8b89a;
  --muted:    #7a6e5a;
  --gold:     #c8a84a;
  --gold-dim: #6a5820;
  --green:    #4a8a5a;
  --red:      #8a3a2a;
  --blue:     #2a5a8a;
  --font:     'Courier New', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  padding: 16px;
  font-size: 14px;
}

/* ── Header ── */
.header {
  text-align: center;
  margin-bottom: 20px;
}
.header-run {
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.header-char {
  font-size: 1.2rem;
  color: var(--gold);
  font-weight: bold;
  letter-spacing: 0.05em;
}
.header-player {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 2px;
}
.header-season {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid;
}
.badge-season { border-color: var(--gold-dim); color: var(--gold); background: #2a2010; }
.badge-phase  { border-color: var(--blue); color: #6a9acc; background: #0a1a2a; }

/* ── Cards grid ── */
.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  max-width: 640px;
  margin: 0 auto;
}

@media (min-width: 540px) {
  .cards { grid-template-columns: 1fr 1fr; }
  .card-wide { grid-column: 1 / -1; }
}

/* ── Card ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}
.card-title .icon { font-size: 1rem; }
.card-title .chevron {
  margin-left: auto;
  transition: transform 0.2s;
  font-style: normal;
  font-size: 0.6rem;
  color: var(--muted);
}
.card.collapsed .chevron { transform: rotate(-90deg); }
.card-body { padding: 12px 14px; }
.card.collapsed .card-body { display: none; }

/* ── Treasury ── */
.treasury-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px solid #1e1c18;
  font-size: 0.8rem;
}
.treasury-row:last-child { border-bottom: none; }
.treasury-row .label { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 8px; }
.treasury-row .amount { white-space: nowrap; }
.treasury-row .amount.pos { color: var(--green); }
.treasury-row .amount.neg { color: var(--red); }
.treasury-section {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-dim);
  padding: 8px 0 4px;
}
.treasury-np-header {
  display: flex;
  justify-content: space-between;
  padding: 6px 0 2px;
  font-size: 0.7rem;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  margin-top: 4px;
  letter-spacing: 0.04em;
}
.treasury-row-indent .label { padding-left: 10px; }
.treasury-total {
  display: flex;
  justify-content: space-between;
  padding: 8px 0 2px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
  font-weight: bold;
}
.treasury-total .label { color: var(--text); }
.treasury-total .amount { color: var(--gold); font-size: 1.05rem; }

.btn-expand {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font: inherit;
  font-size: 0.65rem;
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 8px;
  width: 100%;
}
.btn-expand:hover { border-color: var(--muted); color: var(--text); }

/* ── Buildings ── */
.slots-bar-wrap {
  margin-bottom: 10px;
}
.slots-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 4px;
}
.slots-bar {
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.slots-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 3px;
  transition: width 0.3s;
}
.building-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px solid #1a1814;
  font-size: 0.78rem;
  gap: 8px;
}
.building-row:last-child { border-bottom: none; }
.building-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.building-status { color: var(--green); white-space: nowrap; font-size: 0.7rem; }
.building-maint { color: var(--muted); white-space: nowrap; font-size: 0.7rem; }
.building-hands { color: #6a9acc; white-space: nowrap; font-size: 0.7rem; }

/* ── Events points ── */
.points-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.points-block {
  flex: 1;
  min-width: 90px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  text-align: center;
}
.points-who { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.points-num {
  font-size: 1.4rem;
  color: var(--gold);
  font-weight: bold;
  line-height: 1;
}
.points-of { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

.events-section-title {
  font-size: 0.6rem;
  color: var(--gold-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 8px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.event-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 5px 0;
  border-bottom: 1px solid #1a1814;
  font-size: 0.78rem;
  line-height: 1.35;
}
.event-item:last-child { border-bottom: none; }
.event-check { font-size: 0.85rem; flex-shrink: 0; margin-top: 1px; }
.event-text { flex: 1; }
.event-text.done { opacity: 0.45; text-decoration: line-through; }
.event-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.event-tag {
  font-size: 0.55rem;
  padding: 1px 4px;
  border-radius: 2px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--muted);
}
.event-tag.wait   { border-color: var(--blue); color: #6a9acc; }
.event-tag.harm   { border-color: var(--red); color: #cc7a6a; }
.event-tag.chance { border-color: var(--green); color: #7acc8a; }
.event-tag.noise  { opacity: 0.6; }
.event-mon { font-size: 0.7rem; color: #cc7a6a; white-space: nowrap; margin-left: auto; flex-shrink: 0; }

/* ── Hero ── */
.skill-row {
  padding: 6px 0;
  border-bottom: 1px solid #1a1814;
  font-size: 0.78rem;
}
.skill-row:last-child { border-bottom: none; }
.skill-name { color: var(--text); font-weight: bold; }
.skill-meta { display: flex; gap: 10px; margin-top: 3px; flex-wrap: wrap; }
.skill-bank { color: var(--gold); font-size: 0.7rem; }
.skill-tech { color: #7acc8a; font-size: 0.7rem; font-style: italic; }
.skill-passive { color: #b58ad6; font-size: 0.7rem; font-style: italic; }
.hero-section-title {
  font-size: 0.6rem; color: var(--gold-dim); letter-spacing: 0.15em;
  text-transform: uppercase; padding: 8px 0 4px;
  border-bottom: 1px solid var(--border); margin-bottom: 4px;
}
.hero-item {
  font-size: 0.78rem; padding: 3px 0;
  border-bottom: 1px solid #1a1814; color: var(--text);
}
.hero-item:last-child { border-bottom: none; }
.hero-status-row { display: flex; gap: 16px; font-size: 0.78rem; margin-bottom: 4px; }
.hero-status-row span { color: var(--muted); }
.hero-status-row b { color: var(--text); }

/* ── Settlement breakdown ── */
.sett-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 10px; }
.sett-table th {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold-dim); text-align: left; padding: 0 6px 6px 0;
  border-bottom: 1px solid var(--border);
}
.sett-table td { padding: 4px 6px 4px 0; border-bottom: 1px solid #1a1814; }
.sett-table tr:last-child td { border-bottom: none; }
.sett-name { color: var(--text); }
.loyalty-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 120px; }
.loyalty-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--border); }
.lb-l  { background: var(--green); }
.lb-n  { background: #555; }
.lb-nl { background: var(--red); }
.loyalty-nums { display: flex; gap: 6px; font-size: 0.65rem; }
.ly-supporters { margin-top: 4px; font-size: 0.72rem; color: var(--muted); }
.ly-supporters .ly-supp { display: inline-block; padding: 1px 6px; margin-right: 4px; background: var(--border); border-radius: 3px; color: var(--text); }
.ly-l  { color: var(--green); }
.ly-n  { color: var(--muted); }
.ly-nl { color: var(--red); }
.ly-card { padding: 10px 0 14px; border-bottom: 1px solid var(--border); }
.ly-card:last-child { border-bottom: none; }
.ly-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ly-card-name { font-size: 0.85rem; color: var(--text); flex: 1; }
.ly-card-mod { font-size: 0.78rem; font-weight: bold; }
.ly-card-mod.pos { color: var(--green); }
.ly-card-mod.neg { color: var(--red); }
.ly-card-mod.zero { color: var(--muted); }
.might-badge { font-weight: bold; white-space: nowrap; cursor: help; }
.might-badge.pos { color: var(--gold); }
.might-badge.neg { color: var(--red); }
.might-badge.zero { color: var(--muted); }
.ly-bar-full { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: var(--border); margin-bottom: 4px; }
.ly-nums-full { display: flex; gap: 14px; font-size: 0.72rem; margin-bottom: 6px; }
.ly-reasons { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.ly-reasons li { font-size: 0.7rem; color: var(--muted); }
.ly-reasons li.pos { color: var(--green); }
.ly-reasons li.neg { color: var(--red); }
.ly-conseq { font-size: 0.7rem; line-height: 1.35; margin-top: 6px; padding: 5px 7px; border-radius: 4px; }
.ly-conseq.warn { color: var(--amber, #c08a4a); background: rgba(192,138,74,0.10); }
.ly-conseq.crit { color: var(--red); background: rgba(192,74,106,0.12); }
.ly-legend { font-size: 0.66rem; color: var(--muted); margin-top: 10px; line-height: 1.4; }
.staff-eff-hint { color: var(--red); font-size: 0.68rem; }
.staff-sub-note { font-size: 0.66rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }
.faith-card { padding: 10px 0 14px; border-bottom: 1px solid var(--border); }
.faith-card:last-child { border-bottom: none; }
.faith-bar-full { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: var(--border); margin-bottom: 6px; }
.faith-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.72rem; margin-bottom: 6px; }
.faith-legend .fl-item { display: flex; align-items: center; gap: 5px; }
.faith-legend .fl-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.faith-legend .fl-neutral { color: var(--muted); }
.faith-overview { padding: 4px 0 14px; margin-bottom: 6px; border-bottom: 2px solid var(--border); }
.faith-overview .fo-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.faith-overview .fo-title { font-weight: 600; font-size: 0.82rem; }
.faith-overview .fo-sub { font-size: 0.66rem; color: var(--muted); }
.faith-overview .fo-rows { display: flex; flex-direction: column; gap: 4px; margin-top: 7px; }
.faith-overview .fo-row { display: flex; align-items: center; gap: 7px; font-size: 0.74rem; }
.faith-overview .fo-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.faith-overview .fo-name { flex: 1; }
.faith-overview .fo-pct { color: var(--muted); min-width: 60px; text-align: right; }
.faith-event-badge { display: inline-block; font-size: 0.62rem; padding: 1px 6px; border-radius: 8px;
                     background: rgba(200,138,74,0.18); color: #d89a52; border: 1px solid rgba(200,138,74,0.4);
                     white-space: nowrap; }
.faith-sub-note { font-size: 0.66rem; color: var(--muted); margin-top: 8px; line-height: 1.35; }
.sett-pos  { color: var(--green); text-align: right; white-space: nowrap; }
.sett-neg  { color: var(--red);   text-align: right; white-space: nowrap; }
.sett-bal-pos { color: #7acc8a; text-align: right; white-space: nowrap; font-weight: bold; }
.sett-bal-neg { color: #cc7a6a; text-align: right; white-space: nowrap; font-weight: bold; }
.sett-section { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--gold-dim); padding: 10px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }

/* ── Staff ── */
.staff-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.staff-table th {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold-dim); text-align: left; padding: 0 6px 6px 0; border-bottom: 1px solid var(--border);
}
.staff-table td { padding: 5px 6px 5px 0; border-bottom: 1px solid #1a1814; vertical-align: top; }
.staff-table tr:last-child td { border-bottom: none; }
.staff-cat { color: var(--text); }
.staff-num { color: var(--muted); white-space: nowrap; }
.staff-status-ok   { color: var(--green); white-space: nowrap; }
.staff-status-warn { color: #c8883a; white-space: nowrap; }
.staff-status-note { color: var(--muted); font-size: 0.7rem; }

/* ── Per-НП settlement cards ── */
.np-block { border-bottom: 1px solid var(--border); }
.np-block:last-child { border-bottom: none; }
.np-block-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  cursor: pointer;
  user-select: none;
}
.np-block.collapsed .np-block-body { display: none; }
.np-block.collapsed .np-chevron { transform: rotate(-90deg); }
.np-block-name { font-size: 0.88rem; color: var(--text); font-weight: bold; }
.np-type-badge {
  font-size: 0.58rem; padding: 1px 5px; border-radius: 3px;
  border: 1px solid var(--gold-dim); color: var(--gold); background: #2a2010; white-space: nowrap;
}
.np-type-badge.joined { border-color: #555; color: var(--muted); background: transparent; }
.np-type-badge.annex  { border-color: var(--red); color: #cc7a6a; background: transparent; }
.np-block-pop { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
.np-block-bal { font-size: 0.72rem; white-space: nowrap; font-weight: bold; margin-right: 4px; }
.np-chevron { font-size: 0.6rem; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.np-block-body { padding-bottom: 12px; }
.np-sec {
  font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--gold-dim); padding: 8px 0 4px;
}
.np-row {
  display: flex; justify-content: space-between;
  padding: 2px 0; font-size: 0.75rem; border-bottom: 1px solid #1a1814;
}
.np-row:last-child { border-bottom: none; }
.np-row .np-lbl { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
.np-amt-pos { color: var(--green); white-space: nowrap; }
.np-amt-neg { color: var(--red); white-space: nowrap; }
.np-subtotal {
  display: flex; justify-content: space-between;
  padding: 5px 0 2px; border-top: 1px solid var(--border);
  font-size: 0.76rem; font-weight: bold;
}
.np-bal {
  display: flex; justify-content: space-between;
  padding: 7px 0; font-size: 0.82rem; font-weight: bold;
  border-top: 2px solid var(--border); margin-top: 4px;
}

/* ── Placeholder ── */
.placeholder-body {
  padding: 20px 14px;
  text-align: center;
  color: var(--muted);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
}

/* ── Error / Loading ── */
#loading { text-align: center; padding: 40px; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.1em; }

/* ── Run/player switcher ── */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 640px;
  margin: 0 auto 14px;
  gap: 8px;
}
.select-wrap {
  display: flex;
  gap: 6px;
}
select {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
  font-size: 0.7rem;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
}
select:focus { outline: none; border-color: var(--gold-dim); }
.map-link {
  font-size: 0.65rem;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 4px;
}
.map-link:hover { color: var(--text); border-color: var(--muted); }
</style>
</head>
<body>
<div id="loading">Загрузка…</div>
<div id="app" style="display:none">
  <div class="top-bar">
    <div class="select-wrap">
      <select id="sel-player"></select>
      <select id="sel-np" style="display:none"></select>
    </div>
    <a class="map-link" href="map.html">🗺 Карта</a>
  </div>

  <div class="header">
    <div class="header-run" id="hdr-run"></div>
    <div class="header-char" id="hdr-char"></div>
    <div class="header-player" id="hdr-player"></div>
    <div class="header-season">
      <span class="badge badge-season" id="hdr-season"></span>
      <span class="badge badge-phase"  id="hdr-phase"></span>
    </div>
  </div>

  <div class="cards">

    <!-- Treasury -->
    <div class="card card-wide" id="card-finance">
      <div class="card-title" onclick="toggleCard('card-finance')">
        <span class="icon">💰</span> Казна
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-finance"></div>
    </div>

    <!-- Buildings -->
    <div class="card" id="card-buildings">
      <div class="card-title" onclick="toggleCard('card-buildings')">
        <span class="icon">🏗</span> Постройки
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-buildings"></div>
    </div>

    <!-- Events -->
    <div class="card" id="card-events">
      <div class="card-title" onclick="toggleCard('card-events')">
        <span class="icon">📋</span> События
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-events"></div>
    </div>

    <!-- Hero -->
    <div class="card card-wide" id="card-hero">
      <div class="card-title" onclick="toggleCard('card-hero')">
        <span class="icon">⚔️</span> Герой
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-hero"></div>
    </div>

    <!-- Retinue -->
    <div class="card" id="card-retinue">
      <div class="card-title" onclick="toggleCard('card-retinue')">
        <span class="icon">🗡</span> Свита
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-retinue"></div>
    </div>

    <!-- Staff -->
    <div class="card" id="card-staff">
      <div class="card-title" onclick="toggleCard('card-staff')">
        <span class="icon">👥</span> Персонал
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-staff"></div>
    </div>

    <!-- Territory -->
    <div class="card card-wide" id="card-territory">
      <div class="card-title" onclick="toggleCard('card-territory')">
        <span class="icon">🗾</span> Территория
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-territory"></div>
    </div>

    <!-- Loyalty -->
    <div class="card card-wide" id="card-loyalty">
      <div class="card-title" onclick="toggleCard('card-loyalty')">
        <span class="icon">🏘</span> Лояльность
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-loyalty"></div>
    </div>

    <div class="card card-wide" id="card-faith">
      <div class="card-title" onclick="toggleCard('card-faith')">
        <span class="icon">⛪</span> Религия
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-faith"></div>
    </div>

    <!-- Per-НП view -->
    <div class="card card-wide" id="card-settlements">
      <div class="card-title" onclick="toggleCard('card-settlements')">
        <span class="icon">🏛</span> Поселения
        <em class="chevron">▼</em>
      </div>
      <div class="card-body" id="body-settlements"></div>
    </div>

  </div>
</div>

<script>
// Ростер и подписи строятся из data/index.json по текущему забегу — без хардкода персонажей/забегов.
let INDEX = [];   // [{file, run, player, char_name, player_name}]
function runLabel(run) { const n = (String(run).match(/(\d+)/) || [])[1]; return n ? ("Забег " + n) : run; }
function runEntries(run) { return INDEX.filter(e => e.run === run); }
function entryLabel(e) { return `${e.char_name || e.player} (${e.player_name || ""})`.replace(" ()", ""); }

const PHASE_LABELS = {
  season:    "Начало сезона",
  leader:    "Лидер",
  hearth:    "Очаг",
  adventure: "Приключение",
  defense:   "Оборона",
  defence:   "Оборона",
  attack:    "Нападение",
  building:  "Постройка",
};

let currentData = null;

// ── URL params ────────────────────────────────────────────────────────────────
function getParams() {
  const p = new URLSearchParams(location.search);
  return {
    run:    p.get("run")    || "run_004",
    player: p.get("player") || "valter",
  };
}

function setParams(run, player) {
  const url = new URL(location.href);
  url.searchParams.set("run",    run);
  url.searchParams.set("player", player);
  history.replaceState(null, "", url);
}

// ── Selects ───────────────────────────────────────────────────────────────────
function buildSelects(run, player) {
  const pSel = document.getElementById("sel-player");
  pSel.innerHTML = "";
  runEntries(run).forEach(e => {
    const o = document.createElement("option");
    o.value = e.player; o.textContent = entryLabel(e);
    if (e.player === player) o.selected = true;
    pSel.appendChild(o);
  });
  pSel.onchange = () => loadData(run, pSel.value);
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function loadData(run, player) {
  setParams(run, player);
  document.getElementById("sel-player").value = player;
  document.getElementById("loading").style.display = "block";
  document.getElementById("app").style.display = "none";

  try {
    const res = await fetch(`data/${run}_${player}.json?_=${Date.now()}`);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    currentData = d;
    buildNPSelect(d.settlements || []);
    render(d, null);
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
  } catch (e) {
    document.getElementById("loading").textContent = "Данные не найдены (" + run + "/" + player + ")";
  }
}

// ── Toggle card ───────────────────────────────────────────────────────────────
function toggleCard(id) {
  document.getElementById(id).classList.toggle("collapsed");
}

// ── Render ────────────────────────────────────────────────────────────────────
function fmt(n) {
  return n === undefined || n === null ? "—"
       : n.toLocaleString("ru-RU");
}

// ── NP Select ─────────────────────────────────────────────────────────────────
function buildNPSelect(settlements) {
  const sel = document.getElementById("sel-np");
  sel.innerHTML = "";
  if (!settlements || settlements.length <= 1) {
    sel.style.display = "none";
    return;
  }
  sel.style.display = "";
  const allOpt = document.createElement("option");
  allOpt.value = ""; allOpt.textContent = "Все НП";
  sel.appendChild(allOpt);
  settlements.forEach(s => {
    const o = document.createElement("option");
    o.value = s.name; o.textContent = s.name;
    sel.appendChild(o);
  });
  sel.onchange = () => render(currentData, sel.value || null);
}

function render(d, npFilter) {
  // Header
  const heroName = d.hero?.name?.replace(/—.+/, "").trim() || "—";
  document.title = heroName + " — Дашборд";
  document.getElementById("hdr-run").textContent    = runLabel(d.run) + " · С" + (d.season || "?");
  document.getElementById("hdr-char").textContent   = heroName;
  document.getElementById("hdr-player").textContent = d.player_name || d.player;
  document.getElementById("hdr-season").textContent = "Сезон " + (d.season || "?");
  const phase = d.active_phase;
  document.getElementById("hdr-phase").textContent  = PHASE_LABELS[phase] || phase || "?";

  const setts = npFilter
    ? (d.settlements || []).filter(s => s.name === npFilter)
    : (d.settlements || []);

  renderFinance(d.finance, npFilter);
  renderBuildings(d.buildings, setts);
  renderEvents(d.events);
  renderHero(d.hero);
  renderRetinue(d.hero);
  renderStaff(setts);
  renderTerritory(setts);
  renderLoyalty(setts);
  renderFaith(setts, d.religion);
  renderSettlements(setts);
}

// ── Finance ───────────────────────────────────────────────────────────────────
function renderFinance(f, npFilter) {
  if (!f) { document.getElementById("body-finance").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-finance");

  let html = `
    <div class="treasury-row">
      <span class="label">Начало сезона</span>
      <span class="amount">${fmt(f.start)} мон</span>
    </div>`;

  const incByAll  = f.income_by   || {};
  const expByAll  = f.expenses_by || {};
  const allSetts  = [...new Set([...Object.keys(incByAll), ...Object.keys(expByAll)])];

  // Фильтр по НП
  const incBy = npFilter ? { [npFilter]: incByAll[npFilter] || [] } : incByAll;
  const expBy = npFilter ? { [npFilter]: expByAll[npFilter] || [] } : expByAll;
  const setts = npFilter ? [npFilter] : allSetts;
  const hasNP = setts.length > 1 || (setts.length === 1 && setts[0] !== "");

  // Пересчитать итоги если фильтр
  const filtIncome   = setts.reduce((s, k) => s + (incBy[k] || []).reduce((a, i) => a + i.amount, 0), 0);
  const filtExpenses = setts.reduce((s, k) => s + (expBy[k] || []).reduce((a, i) => a + i.amount, 0), 0);
  const showTotals   = npFilter ? { income: filtIncome, expenses: filtExpenses } : { income: f.total_income, expenses: f.total_expenses };

  // Доходы с отсечками по НП
  html += `<div class="treasury-section">Доходы</div>`;
  if (hasNP) {
    setts.forEach(s => {
      const items = incBy[s] || [];
      if (!items.length) return;
      const npTotal = items.reduce((a, i) => a + i.amount, 0);
      html += `<div class="treasury-np-header">
        <span>${esc(s || "Прочее")}</span>
        <span class="amount pos">+${fmt(npTotal)}</span>
      </div>`;
      items.forEach(i => {
        html += `<div class="treasury-row treasury-row-indent"><span class="label">${esc(i.label)}</span><span class="amount pos">+${fmt(i.amount)}</span></div>`;
      });
    });
  } else {
    (f.income || []).forEach(i => {
      html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount pos">+${fmt(i.amount)}</span></div>`;
    });
  }
  html += `<div class="treasury-row" style="font-weight:bold">
    <span class="label">Итого доходов</span>
    <span class="amount pos">+${fmt(showTotals.income)}</span>
  </div>`;

  // Расходы с отсечками по НП
  html += `<div class="treasury-section">Расходы</div>`;
  if (hasNP) {
    setts.forEach(s => {
      const items = expBy[s] || [];
      if (!items.length) return;
      const npTotal = items.reduce((a, i) => a + i.amount, 0);
      html += `<div class="treasury-np-header">
        <span>${esc(s || "Прочее")}</span>
        <span class="amount neg">−${fmt(npTotal)}</span>
      </div>`;
      items.forEach(i => {
        html += `<div class="treasury-row treasury-row-indent"><span class="label">${esc(i.label)}</span><span class="amount neg">−${fmt(i.amount)}</span></div>`;
      });
    });
  } else {
    (f.expenses || []).forEach(i => {
      html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount neg">−${fmt(i.amount)}</span></div>`;
    });
  }
  html += `<div class="treasury-row" style="font-weight:bold">
    <span class="label">Итого расходов</span>
    <span class="amount neg">−${fmt(showTotals.expenses)}</span>
  </div>`;

  if (!npFilter) {
    // Поступления
    const receipts     = f.receipts  || [];
    const totalReceipts = receipts.reduce((a, i) => a + i.amount, 0);
    html += `<div class="treasury-section">Поступления</div>`;
    if (receipts.length) {
      receipts.forEach(i => { html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount pos">+${fmt(i.amount)}</span></div>`; });
      html += `<div class="treasury-row" style="font-weight:bold"><span class="label">Итого поступлений</span><span class="amount pos">+${fmt(totalReceipts)}</span></div>`;
    } else {
      html += `<div class="treasury-row"><span class="label" style="font-style:italic">—</span><span class="amount pos">+0</span></div>`;
    }

    // Траты
    const spendings     = f.spendings || [];
    const totalSpendings = spendings.reduce((a, i) => a + i.amount, 0);
    html += `<div class="treasury-section">Траты</div>`;
    if (spendings.length) {
      spendings.forEach(i => { html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount neg">−${fmt(i.amount)}</span></div>`; });
      html += `<div class="treasury-row" style="font-weight:bold"><span class="label">Итого трат</span><span class="amount neg">−${fmt(totalSpendings)}</span></div>`;
    } else {
      html += `<div class="treasury-row"><span class="label" style="font-style:italic">—</span><span class="amount neg">−0</span></div>`;
    }

    // Прибыль (крупно)
    const profit   = showTotals.income - showTotals.expenses + totalReceipts - totalSpendings;
    const profCls  = profit >= 0 ? "pos" : "neg";
    const profSign = profit >= 0 ? "+" : "";
    html += `<div class="treasury-total">
      <span class="label">Прибыль</span>
      <span class="amount ${profCls}">${profSign}${fmt(profit)} мон</span>
    </div>`;

    // Казна на конец (крупно)
    const endTreasury = (f.start || 0) + profit;
    const endCls  = endTreasury >= 0 ? "pos" : "neg";
    html += `<div class="treasury-total" style="border-top:2px solid var(--gold-dim);margin-top:6px;padding-top:8px">
      <span class="label" style="color:var(--text)">Казна на конец</span>
      <span class="amount ${endCls}" style="font-size:1.15rem">${fmt(endTreasury)} мон</span>
    </div>`;
  } else {
    const npBal = filtIncome - filtExpenses;
    const balColor = npBal >= 0 ? "pos" : "neg";
    const balSign  = npBal >= 0 ? "+" : "";
    html += `<div class="treasury-total">
      <span class="label">Баланс НП</span>
      <span class="amount ${balColor}">${balSign}${fmt(npBal)} мон</span>
    </div>`;
  }

  el.innerHTML = html;
}

// ── Buildings ─────────────────────────────────────────────────────────────────
function renderBuildings(b, settlements) {
  if (!b) { document.getElementById("body-buildings").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-buildings");

  const { base, extra, used, max_extra, free } = b.slots || {};
  const total = (base || 0) + (extra || 0);
  const pct   = total > 0 ? Math.round((used || 0) / total * 100) : 0;
  let html = `
    <div class="slots-bar-wrap">
      <div class="slots-info">
        <span>Слоты: ${used || 0}/${total}</span>
        <span>${free || 0} своб. · Доп. ${extra || 0}/${max_extra || 0}</span>
      </div>
      <div class="slots-bar"><div class="slots-bar-fill" style="width:${pct}%"></div></div>
    </div>`;

  const settBuildings = (settlements || []).filter(s => (s.buildings || []).length > 0);

  if (settBuildings.length > 0) {
    settBuildings.forEach(s => {
      html += `<div class="sett-section">${esc(s.name)}</div>`;
      s.buildings.forEach(bld => {
        const maint = bld.maint ? `${fmt(bld.maint)}${bld.rate ? " ("+bld.rate+"%)" : ""}` : bld.status === "доходная" ? "дох." : "—";
        const hands = bld.hands ? `<span class="building-hands">${bld.hands}р</span>` : "";
        html += `<div class="building-row">
          <span class="building-name">${esc(bld.name)}</span>
          ${hands}
          <span class="building-maint">${esc(maint)}</span>
        </div>`;
      });
    });
  } else {
    // Fallback: flat list
    (b.buildings || []).forEach(bld => {
      const maint = bld.maint ? `${fmt(bld.maint)}${bld.rate ? " ("+bld.rate+"%)" : ""}` : bld.status === "доходная" ? "дох." : "—";
      const hands = bld.hands ? `<span class="building-hands">${bld.hands}р</span>` : "";
      html += `<div class="building-row">
        <span class="building-name">${esc(bld.name)}</span>
        ${hands}
        <span class="building-maint">${esc(maint)}</span>
      </div>`;
    });
  }

  if (!html) html = `<div style="color:var(--muted);font-size:0.78rem;padding:6px 0">Построек нет</div>`;
  el.innerHTML = html;
}

// ── Events ────────────────────────────────────────────────────────────────────
function renderEvents(ev) {
  if (!ev) { document.getElementById("body-events").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-events");

  // Points
  const pts = ev.points || {};
  let html = `<div class="points-row">`;
  if (pts.player)     html += pointBlock("Игрок",    pts.player.left,    pts.player.total);
  if (pts.chancellor) html += pointBlock(pts.chancellor.name || "Канцлер", pts.chancellor.left, pts.chancellor.total);
  if (pts.captain)    html += pointBlock(pts.captain.name    || "Капитан", pts.captain.left,    pts.captain.total);
  html += `</div>`;

  const sections = [
    { key: "incidents",   label: "Происшествия" },
    { key: "visitors",    label: "Посетители" },
    { key: "po",          label: ev.po_title || "П&О" },
    { key: "assignments", label: "Предложения" },
    { key: "custom",      label: "Свои события" },
  ];

  sections.forEach(sec => {
    const items = ev[sec.key] || [];
    if (!items.length) return;
    html += `<div class="events-section-title">${esc(sec.label)} (${items.length})</div>`;
    items.forEach(item => {
      html += renderEventItem(item);
    });
  });

  el.innerHTML = html;
}

function pointBlock(who, left, total) {
  return `<div class="points-block">
    <div class="points-who">${esc(who)}</div>
    <div class="points-num">${left}</div>
    <div class="points-of">из ${total}</div>
  </div>`;
}

function tagClass(t) {
  if (t === "#ждёт") return "wait";
  if (t.startsWith("#вред")) return "harm";
  if (t === "#возможность") return "chance";
  if (t === "#шум") return "noise";
  return "";
}

function renderEventItem(item) {
  const check = item.done ? "✅" : "◻️";
  return `<div class="event-item">
    <span class="event-check">${check}</span>
    <div class="event-text${item.done ? " done" : ""}">${esc(item.text)}</div>
  </div>`;
}

// ── Hero ──────────────────────────────────────────────────────────────────────
function renderHero(hero) {
  if (!hero) { document.getElementById("body-hero").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-hero");
  let html = "";

  // Status
  const st = hero.status || {};
  if (Object.keys(st).length) {
    html += `<div class="hero-status-row">`;
    for (const [k, v] of Object.entries(st)) {
      html += `<span>${esc(k)}:</span> <b>${esc(v)}</b> &nbsp;`;
    }
    html += `</div>`;
  }

  // Skills
  if ((hero.skills || []).length) {
    html += `<div class="hero-section-title">Навыки</div>`;
    hero.skills.forEach(s => {
      const bankHtml = s.bank !== null && s.bank !== undefined ? `<span class="skill-bank">банк: ${s.bank}</span>` : "";
      const techHtml = (s.techniques || []).map(t => {
        const name = (typeof t === "string") ? t : t.name;
        const kind = (typeof t === "string") ? "приём" : (t.kind || "приём");
        const cls  = kind === "техника" ? "skill-passive" : "skill-tech";
        return `<span class="${cls}">${esc(kind)}: ${esc(name)}</span>`;
      }).join("");
      html += `<div class="skill-row">
        <div class="skill-name">${mdBold(s.name)}</div>
        <div class="skill-meta">${bankHtml}${techHtml}</div>
      </div>`;
    });
  }

  // Features
  if ((hero.features || []).length) {
    html += `<div class="hero-section-title">Особенности</div>`;
    hero.features.forEach(f => { html += `<div class="hero-item">${mdBold(f)}</div>`; });
  }

  // Свита показывается в отдельной карточке «Свита» (renderRetinue) — здесь не дублируем.

  // Items (collapsed by default — show count + expand)
  if ((hero.items || []).length) {
    const count = hero.items.length;
    html += `<div class="hero-section-title">Предметы (${count})</div>`;
    html += `<div id="hero-items" style="display:none">`;
    hero.items.forEach(i => { html += `<div class="hero-item">${esc(i)}</div>`; });
    html += `</div>`;
    html += `<button class="btn-expand" onclick="this.previousElementSibling.style.display=this.previousElementSibling.style.display==='none'?'block':'none';this.textContent=this.textContent.includes('▼')?'Скрыть ▲':'Показать ▼'">Показать ▼</button>`;
  }

  el.innerHTML = html || "<div class='placeholder-body'>Нет данных</div>";
}

// ── Retinue ───────────────────────────────────────────────────────────────────
function renderRetinue(hero) {
  const el = document.getElementById("body-retinue");
  if (!hero) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const slots = hero.retinue_slots;
  const list  = hero.retinue || [];

  let html = "";
  if (slots) {
    const pct = slots.total > 0 ? Math.round(slots.used / slots.total * 100) : 0;
    html += `<div class="slots-bar-wrap">
      <div class="slots-info">
        <span>Слоты: ${slots.used}/${slots.total}</span>
        <span>${slots.total - slots.used} свободных</span>
      </div>
      <div class="slots-bar"><div class="slots-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }
  if (list.length) {
    list.forEach(r => { html += `<div class="hero-item">${mdBold(r)}</div>`; });
  } else {
    html += `<div style="color:var(--muted);font-size:0.78rem;padding:6px 0">Свита пуста</div>`;
  }
  el.innerHTML = html || "<div class='placeholder-body'>Нет данных</div>";
}

// ── Staff ─────────────────────────────────────────────────────────────────────
function renderStaff(settlements) {
  const el = document.getElementById("body-staff");
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }

  const numOf = v => { const n = parseInt(String(v).replace(/[^\d-]/g, ""), 10); return isNaN(n) ? null : n; };
  const isGuard  = c => /страж/i.test(c);
  const isClerk  = c => /клерк/i.test(c);
  const isLabor  = c => /рабоч/i.test(c);

  let html = "";
  let anyShortGuard = false, anyShortClerk = false, anyOverLabor = false;
  settlements.forEach(sett => {
    const rows = sett.staff || [];
    if (!rows.length) return;
    html += `<div class="sett-section">${esc(sett.name)}</div>`;
    html += `<table class="staff-table"><thead><tr>
      <th>Категория</th><th>Факт</th><th>Норма</th><th>Статус</th>
    </tr></thead><tbody>`;
    rows.forEach(r => {
      const isWarn = r.status && r.status.includes("⚠");
      const stClass = isWarn ? "staff-status-warn" : "staff-status-ok";
      let stShort = r.status || "";
      let stNote  = "";
      const noteMatch = stShort.match(/^([✅⚠️]+)\s+(.+)$/u);
      if (noteMatch) { stShort = noteMatch[1]; stNote = noteMatch[2]; }

      const fact = numOf(r.fact), norm = numOf(r.norm);
      let effHint = "";
      if (fact != null && norm != null) {
        if (isGuard(r.category) && fact < norm) {
          effHint = "−1 к лояльности · +1d2 к преступлениям и опасностям (метка #недостаток_стражи)";
          anyShortGuard = true;
        } else if (isClerk(r.category) && fact < norm) {
          effHint = "−1 к лояльности · +1d2 к происшествиям (метка #недостаток_клерков)";
          anyShortClerk = true;
        } else if (isLabor(r.category) && fact > norm) {
          effHint = "−1 к лояльности · +1 к происшествиям (перегруз, метка #нехватка_свободных_рук)";
          anyOverLabor = true;
        }
      }
      html += `<tr>
        <td class="staff-cat">${esc(r.category)}</td>
        <td class="staff-num">${esc(r.fact)}</td>
        <td class="staff-num">${r.norm ? esc(r.norm) : "—"}</td>
        <td class="${stClass}">${esc(stShort)}${stNote ? `<br><span class="staff-status-note">${esc(stNote)}</span>` : ""}${effHint ? `<br><span class="staff-eff-hint">⚠️ ${effHint}</span>` : ""}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });

  if (anyShortGuard || anyShortClerk || anyOverLabor) {
    const parts = [];
    if (anyShortGuard) parts.push("<b>нехватка стражи</b> → −1 лояльность и <b>+1d2 к П&amp;О</b> (преступления и опасности)");
    if (anyShortClerk) parts.push("<b>нехватка клерков</b> → −1 лояльность и <b>+1d2 к происшествиям</b>");
    if (anyOverLabor)  parts.push("<b>перегруз рабочих рук</b> → −1 лояльность и <b>+1 к происшествиям</b>");
    html += `<div class="staff-sub-note">⚠️ Последствия в начале следующего сезона:<br>• ${parts.join("<br>• ")}<br>Каждый недобор не только бьёт по лояльности, но и <b>плодит доп. события</b> в очереди лидера (со спец-метками). Нанимайте персонал (settlement_update.py), чтобы закрыть норму.</div>`;
  }

  el.innerHTML = html || "<div class='placeholder-body'>Нет данных</div>";
}

// ── Territory ─────────────────────────────────────────────────────────────────
function supportersHtml(supporters) {
  if (!supporters) return "";
  const entries = Object.entries(supporters).filter(([_, v]) => v > 0);
  if (!entries.length) return "";
  const items = entries.map(([name, n]) =>
    `<span class="ly-supp"><b>${esc(name)}</b> ${n}</span>`
  ).join(" · ");
  return `<div class="ly-supporters" title="Дворы, играющие на чужих князей — уже вне пула Л/Н/НЛ; порог захвата 40% Домов">Сторонники: ${items}</div>`;
}

function loyaltyBar(ly) {
  if (!ly) return "";
  const l = ly["Л"] || 0, n = ly["Н"] || 0, nl = ly["НЛ"] || 0;
  const total = l + n + nl;
  if (!total) return "";
  const lp = Math.round(l / total * 100);
  const np = Math.round(n / total * 100);
  const nlp = 100 - lp - np;
  const crisis = nlp >= 40 ? ' style="outline:1px solid var(--red)"' : "";
  return `<div class="loyalty-wrap"${crisis}>` +
    `<div class="loyalty-bar">` +
    `<div class="lb-l" style="width:${lp}%" title="Лояльные ${l}"></div>` +
    `<div class="lb-n" style="width:${np}%" title="Нейтральные ${n}"></div>` +
    `<div class="lb-nl" style="width:${nlp}%" title="Нелояльные ${nl}"></div>` +
    `</div>` +
    `<div class="loyalty-nums"><span class="ly-l">${l}</span> <span class="ly-n">${n}</span> <span class="ly-nl">${nl}</span></div>` +
    `</div>`;
}

function renderTerritory(settlements) {
  const el = document.getElementById("body-territory");
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }

  const hasLoyalty = settlements.some(s => s.loyalty);
  const hasMight   = settlements.some(s => s.might);
  let html = `<table class="sett-table"><thead><tr>
    <th>НП</th><th>Население</th><th>Рост</th><th style="text-align:right">Домов</th>
    ${hasMight ? '<th style="text-align:right">⚔ Мощь</th>' : ""}
    ${hasLoyalty ? "<th>Лояльность</th>" : ""}
  </tr></thead><tbody>`;
  settlements.forEach(s => {
    html += `<tr>
      <td class="sett-name">${esc(s.name)}</td>
      <td>${esc(s.population || "—")}</td>
      <td style="color:var(--green)">${esc(s.growth || "—")}</td>
      <td style="text-align:right;color:var(--muted)">${esc(s.houses || "—")}</td>
      ${hasMight ? `<td style="text-align:right">${mightBadge(s.might)}</td>` : ""}
      ${hasLoyalty ? `<td>${loyaltyBar(s.loyalty)}</td>` : ""}
    </tr>`;
  });
  html += `</tbody></table>`;
  if (hasMight) html += `<div class="staff-sub-note">⚔ <b>Боевая мощь</b> = сила обороны НП: ⌊бойцы÷5⌋ + мод лояльности + оборона(+1) + теги #боевая_мощь/#боевая_немощь. Бойцы: у игрока — стража, у нейтрала — ополчение ~1.4% населения. Наведи на число — расшивка.</div>`;
  el.innerHTML = html;
}

// ⚔ Боевая мощь — число с расшивкой в подсказке.
function mightBadge(m) {
  if (!m) return "—";
  const cls = m.total > 0 ? "pos" : m.total < 0 ? "neg" : "zero";
  const t = `Боевая мощь ${m.total}\n= ⌊${m.fighters}÷5⌋ база ${m.base}\n + лояльность ${m.loyalty >= 0 ? "+" : ""}${m.loyalty}\n + оборона +${m.defense}\n + теги ${m.tags >= 0 ? "+" : ""}${m.tags}\n(${m.fighters_src})`;
  return `<span class="might-badge ${cls}" title="${esc(t)}">⚔ ${m.total}</span>`;
}

// ── Loyalty ───────────────────────────────────────────────────────────────────
function renderLoyalty(settlements) {
  const el = document.getElementById("body-loyalty");
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const withLoyalty = settlements.filter(s => s.loyalty && s.loyalty["Л"] != null);
  if (!withLoyalty.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных о лояльности</div>"; return; }

  let html = "";
  withLoyalty.forEach(s => {
    const ly = s.loyalty;
    const l = ly["Л"] || 0, n = ly["Н"] || 0, nl = ly["НЛ"] || 0;
    const total = l + n + nl;
    const lp  = total ? Math.round(l  / total * 100) : 0;
    const np  = total ? Math.round(n  / total * 100) : 0;
    const nlp = 100 - lp - np;
    const mod = ly.mod || 0;
    const modCls = mod > 0 ? "pos" : mod < 0 ? "neg" : "zero";
    const modStr = mod > 0 ? `+${mod}` : String(mod);
    const crisis = nlp >= 40 ? ' style="outline:1px solid var(--red);border-radius:4px"' : "";

    const reasons = ly.reasons || [];
    const reasonsHtml = reasons.map(r => {
      const cls = r.startsWith("+") ? "pos" : (r.startsWith("−") || r.startsWith("-")) ? "neg" : "";
      return `<li class="${cls}">${esc(r)}</li>`;
    }).join("");

    let conseq = "";
    if (nlp > 50) {
      const prob = (nlp - 50) * 5;
      conseq = `<div class="ly-conseq crit">🔥 НЛ &gt; 50% → риск <b>#бунт</b> ≈ ${prob}% (=(НЛ%−50)×5%). Плюс слот события <b>#нелояльность</b>.</div>`;
    } else if (nlp >= 25) {
      conseq = `<div class="ly-conseq warn">⚠️ НЛ ≥ 25% → в следующем сезоне <b>+1 слот события #нелояльность</b>.</div>`;
    }

    html += `<div class="ly-card">
      <div class="ly-card-header">
        <span class="ly-card-name">${esc(s.name)}</span>
        <span class="ly-card-mod ${modCls}">мод ${modStr}</span>
      </div>
      <div class="ly-bar-full"${crisis}>
        <div class="lb-l" style="width:${lp}%" title="Лояльные ${l}"></div>
        <div class="lb-n" style="width:${np}%" title="Нейтральные ${n}"></div>
        <div class="lb-nl" style="width:${nlp}%" title="Нелояльные ${nl}"></div>
      </div>
      <div class="ly-nums-full">
        <span class="ly-l">Л ${l} (${lp}%)</span>
        <span class="ly-n">Н ${n} (${np}%)</span>
        <span class="ly-nl">НЛ ${nl} (${nlp}%)</span>
      </div>
      ${supportersHtml(ly.supporters)}
      ${reasonsHtml ? `<ul class="ly-reasons">${reasonsHtml}</ul>` : ""}
      ${conseq}
    </div>`;
  });

  html += `<div class="ly-legend">Пороги: <b>НЛ ≥ 25%</b> → +1 слот события #нелояльность в следующем сезоне · <b>НЛ &gt; 50%</b> → риск #бунт = (НЛ%−50)×5%. Мод лояльности за сезон складывается из строк-причин (нехватка стражи/клерков, перегруз рабочих рук — по −1 каждая).</div>`;

  el.innerHTML = html;
}

// ── Religion / Вера ─────────────────────────────────────────────────────────
const FAITH_PALETTE = ["#8a6ac0", "#4a8a5a", "#c08a4a", "#4a7ac0", "#c04a6a",
                       "#5ab0a0", "#b0a04a", "#a05ac0", "#c07a4a", "#6a8ac0"];
function faithColor(name, idx) { return FAITH_PALETTE[idx % FAITH_PALETTE.length]; }

function faithBar(f) {
  if (!f || !f.cults || !f.cults.length) return "";
  let segs = f.cults.map((c, i) =>
    `<div style="width:${c.pct}%;background:${faithColor(c.name, i)}" title="${esc(c.name)} ${c.count} (${c.pct}%)"></div>`
  ).join("");
  if (f.neutral_pct > 0) segs += `<div style="width:${f.neutral_pct}%;background:var(--border)" title="Нейтральные ${f.neutral} (${f.neutral_pct}%)"></div>`;
  return `<div class="faith-bar-full">${segs}</div>`;
}

// Общая структура веры по всем НП + пометка культов >15% (генерируют события).
function faithOverview(rel) {
  if (!rel || !rel.cults || !rel.cults.length) return "";
  const thr = rel.threshold_pct != null ? rel.threshold_pct : 15;
  const segs = rel.cults.map((c, i) =>
    `<div style="width:${c.pct}%;background:${faithColor(c.name, i)}" title="${esc(c.name)} ${c.count} (${c.pct}%)"></div>`
  ).join("") + (rel.neutral_pct > 0
    ? `<div style="width:${rel.neutral_pct}%;background:var(--border)" title="Нейтральные ${rel.neutral} (${rel.neutral_pct}%)"></div>`
    : "");
  const rows = rel.cults.map((c, i) =>
    `<div class="fo-row">
       <span class="fo-dot" style="background:${faithColor(c.name, i)}"></span>
       <span class="fo-name">${esc(c.name)}${c.events ? ` <span class="faith-event-badge" title="Доля &gt;${thr}% — раз в сезон добавляется слот события этого культа">⚡ событие</span>` : ""}</span>
       <span class="fo-pct">${c.count} · ${c.pct}%</span>
     </div>`
  ).join("") + (rel.neutral > 0
    ? `<div class="fo-row">
         <span class="fo-dot" style="background:var(--border)"></span>
         <span class="fo-name fl-neutral">нейтральные</span>
         <span class="fo-pct">${rel.neutral} · ${rel.neutral_pct}%</span>
       </div>`
    : "");
  const anyEvent = rel.cults.some(c => c.events);
  return `<div class="faith-overview">
    <div class="fo-head">
      <span class="fo-title">Общая структура веры</span>
      <span class="fo-sub">по всем НП игрока · ${rel.total_houses} домов</span>
    </div>
    <div class="faith-bar-full">${segs}</div>
    <div class="fo-rows">${rows}</div>
    <div class="faith-sub-note">${anyEvent
      ? `⚡ — культ занимает &gt;${thr}% всех домов игрока (по всем подконтрольным НП): раз в сезон добавляет отдельный слот события этого культа.`
      : `Ни один культ не превысил ${thr}% всех домов игрока (по всем подконтрольным НП) — событий культов в этом сезоне нет.`}</div>
  </div>`;
}

function renderFaith(settlements, religion) {
  const el = document.getElementById("body-faith");
  if (!el) return;
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const withFaith = settlements.filter(s => s.faith && s.faith.cults && s.faith.cults.length);
  const overview = faithOverview(religion);
  if (!withFaith.length) {
    el.innerHTML = overview || "<div class='placeholder-body'>Вера не расписана</div>";
    return;
  }

  let html = overview;
  withFaith.forEach(s => {
    const f = s.faith;
    const mod = f.mod || 0;
    const modCls = mod > 0 ? "pos" : mod < 0 ? "neg" : "zero";
    const modStr = mod > 0 ? `+${mod}` : String(mod);
    const legend = f.cults.map((c, i) =>
      `<span class="fl-item"><span class="fl-dot" style="background:${faithColor(c.name, i)}"></span>${esc(c.name)} ${c.count} (${c.pct}%)</span>`
    ).join("") + (f.neutral > 0
      ? `<span class="fl-item fl-neutral"><span class="fl-dot" style="background:var(--border)"></span>нейтральные ${f.neutral} (${f.neutral_pct}%)</span>`
      : "");
    const reasons = (f.reasons || []).map(r => {
      const cls = r.startsWith("+") ? "pos" : (r.startsWith("−") || r.startsWith("-")) ? "neg" : "";
      return `<li class="${cls}">${esc(r)}</li>`;
    }).join("");

    html += `<div class="faith-card">
      <div class="ly-card-header">
        <span class="ly-card-name">${esc(s.name)}</span>
        <span class="ly-card-mod ${modCls}">лоял. ${modStr}</span>
      </div>
      ${faithBar(f)}
      <div class="faith-legend">${legend}</div>
      ${reasons ? `<ul class="ly-reasons">${reasons}</ul>` : ""}
    </div>`;
  });
  el.innerHTML = html;
}

// ── Settlements (per-НП) ──────────────────────────────────────────────────────
function toggleNP(id) {
  document.getElementById(id).classList.toggle("collapsed");
}

function renderSettlements(setts) {
  const el = document.getElementById("body-settlements");
  if (!setts || !setts.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }

  let html = "";
  setts.forEach((s, idx) => {
    const ly = s.loyalty || {};
    const l = ly["Л"] || 0, n = ly["Н"] || 0, nl = ly["НЛ"] || 0;
    const total = l + n + nl;
    const lp  = total ? Math.round(l  / total * 100) : 0;
    const np  = total ? Math.round(n  / total * 100) : 0;
    const nlp = 100 - lp - np;
    const nlPct = total ? Math.round(nl / total * 100) : 0;
    const effBd = s.eff_breakdown || null;
    const eff = effBd ? effBd.total : (90 - Math.floor(nlPct / 10) * 2);

    const income   = s.income      || [];
    const expenses = s.expenses_np || [];
    const totalInc = income.reduce((a, i) => a + i.amount, 0);
    const totalExp = expenses.reduce((a, i) => a + i.amount, 0);
    const bal      = totalInc - totalExp;
    const balCls   = bal >= 0 ? "np-amt-pos" : "np-amt-neg";
    const balSign  = bal >= 0 ? "+" : "";

    // Type badge
    const typ = ly["Тип"] || "";
    let typBadge = "";
    if (typ === "стартовая")       typBadge = `<span class="np-type-badge">${esc(typ)}</span>`;
    else if (typ === "присоединённая") typBadge = `<span class="np-type-badge joined">${esc(typ)}</span>`;
    else if (typ === "аннексия")   typBadge = `<span class="np-type-badge annex">${esc(typ)}</span>`;

    // Mini loyalty bar in header
    const crisis = nlPct >= 40 ? ' style="outline:1px solid var(--red)"' : "";
    const miniBar = total ? `<div class="loyalty-bar" style="height:5px;width:80px;flex-shrink:0"${crisis}>
      <div class="lb-l" style="width:${lp}%"></div>
      <div class="lb-n" style="width:${np}%"></div>
      <div class="lb-nl" style="width:${nlp}%"></div>
    </div>` : "";

    const mod    = ly.mod || 0;
    const modStr = mod > 0 ? `+${mod}` : String(mod);
    const modCls = mod > 0 ? "pos" : mod < 0 ? "neg" : "zero";

    const buildings = s.buildings || [];
    const staff     = s.staff     || [];
    const stash     = s.stash     || [];

    // Start block — first НП expanded, rest collapsed
    html += `<div class="np-block${idx > 0 ? " collapsed" : ""}" id="np-block-${idx}">
      <div class="np-block-header" onclick="toggleNP('np-block-${idx}')">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span class="np-block-name">${esc(s.name)}</span>
            ${typBadge}
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
            <span class="np-block-pop">${esc(s.population || "?")} · ${esc(s.growth || "")}</span>
            ${miniBar}
          </div>
        </div>
        <span class="np-block-bal ${balCls}">${balSign}${fmt(bal)}</span>
        <em class="np-chevron">▼</em>
      </div>
      <div class="np-block-body">`;

    // Loyalty
    if (total) {
      const reasons = ly.reasons || [];
      html += `<div class="np-sec">Лояльность</div>
        <div class="ly-bar-full" style="margin-bottom:5px">
          <div class="lb-l" style="width:${lp}%"></div>
          <div class="lb-n" style="width:${np}%"></div>
          <div class="lb-nl" style="width:${nlp}%"></div>
        </div>
        <div style="display:flex;gap:12px;font-size:0.72rem;margin-bottom:5px">
          <span class="ly-l">Л ${l} (${lp}%)</span>
          <span class="ly-n">Н ${n} (${np}%)</span>
          <span class="ly-nl">НЛ ${nl} (${nlp}%)</span>
          <span style="color:var(--muted);margin-left:auto">${effBd && effBd.loyalty_penalty > 0
            ? `эфф. <b style="color:var(--text)">${effBd.total}%</b> = ${effBd.base}% − ${effBd.loyalty_penalty}% нел.`
            : `эфф. ${eff}%`} · мод <span class="ly-card-mod ${modCls}">${modStr}</span></span>
        </div>
        ${reasons.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px">${
          reasons.map(r => {
            const cls = r.startsWith("+") ? "ly-l" : (r.startsWith("−") || r.startsWith("-")) ? "ly-nl" : "";
            return `<span style="font-size:0.68rem" class="${cls}">${esc(r)}</span>`;
          }).join("")
        }</div>` : ""}`;
    }

    // Вера
    const fth = s.faith;
    if (fth && fth.cults && fth.cults.length) {
      const fmod = fth.mod || 0;
      const fmodStr = fmod > 0 ? `+${fmod}` : String(fmod);
      const fmodCls = fmod > 0 ? "pos" : fmod < 0 ? "neg" : "zero";
      const flegend = fth.cults.map((c, i) =>
        `<span class="fl-item"><span class="fl-dot" style="background:${faithColor(c.name, i)}"></span>${esc(c.name)} ${c.pct}%</span>`
      ).join("") + (fth.neutral > 0
        ? `<span class="fl-item fl-neutral"><span class="fl-dot" style="background:var(--border)"></span>нейтр. ${fth.neutral_pct}%</span>`
        : "");
      html += `<div class="np-sec" style="display:flex;align-items:center">Вера <span style="color:var(--muted);font-weight:normal;margin-left:auto">лоял. <span class="ly-card-mod ${fmodCls}">${fmodStr}</span></span></div>
        ${faithBar(fth)}
        <div class="faith-legend" style="margin-bottom:4px">${flegend}</div>`;
    }

    // Промыслы (что есть в НП — NPC-предприятия; Т-предприятия идут в требования тиров)
    const promysly = s.promysly || [];
    if (promysly.length) {
      html += `<div class="np-sec">Промыслы</div>`;
      promysly.forEach(p => {
        const td = (p.tier && /\d/.test(p.tier)) ? p.tier.match(/\d/)[0] : null;
        const tierBadge = td ? `<span class="np-type-badge">Т${td}</span>` : "";
        const chain = (p.chain && p.chain !== "—") ? `<span style="color:var(--muted);font-size:0.68rem"> ${esc(p.chain)}</span>` : "";
        html += `<div class="np-row"><span class="np-lbl">${esc(p.name)} ${tierBadge}${chain}</span><span style="color:var(--muted);font-size:0.68rem">${esc(p.owner || "")}</span></div>`;
      });
    }

    // Income
    if (income.length) {
      html += `<div class="np-sec">Доходы</div>`;
      income.forEach(i => {
        html += `<div class="np-row"><span class="np-lbl">${esc(i.label)}</span><span class="np-amt-pos">+${fmt(i.amount)}</span></div>`;
      });
      html += `<div class="np-subtotal"><span style="color:var(--muted)">Итого доходов</span><span class="np-amt-pos">+${fmt(totalInc)}</span></div>`;
    }

    // Expenses
    if (expenses.length) {
      const expId = `np-exp-${idx}`;
      html += `<div class="np-sec">Расходы</div>`;
      // Show first 4, rest hidden
      const show = expenses.slice(0, 4);
      const hide = expenses.slice(4);
      show.forEach(i => {
        html += `<div class="np-row"><span class="np-lbl">${esc(i.label)}</span><span class="np-amt-neg">−${fmt(i.amount)}</span></div>`;
      });
      if (hide.length) {
        html += `<div id="${expId}" style="display:none">`;
        hide.forEach(i => {
          html += `<div class="np-row"><span class="np-lbl">${esc(i.label)}</span><span class="np-amt-neg">−${fmt(i.amount)}</span></div>`;
        });
        html += `</div>
        <button class="btn-expand" onclick="
          var el=document.getElementById('${expId}');
          el.style.display=el.style.display==='none'?'block':'none';
          this.textContent=this.textContent.includes('▼')?'Скрыть ▲':'Ещё ${hide.length} ▼'
        ">Ещё ${hide.length} ▼</button>`;
      }
      html += `<div class="np-subtotal"><span style="color:var(--muted)">Итого расходов</span><span class="np-amt-neg">−${fmt(totalExp)}</span></div>`;
    }

    // Balance
    if (income.length || expenses.length) {
      html += `<div class="np-bal">
        <span style="color:var(--muted)">Баланс НП</span>
        <span class="${balCls}">${balSign}${fmt(bal)} мон</span>
      </div>`;
    }

    // Buildings
    if (buildings.length) {
      html += `<div class="np-sec">Постройки (${buildings.length})</div>`;
      buildings.forEach(b => {
        const maint = b.maint ? `${fmt(b.maint)}/сез${b.hands ? " · " + b.hands + "р" : ""}` : "—";
        html += `<div class="np-row">
          <span class="np-lbl">${esc(b.name)}</span>
          <span style="color:var(--muted);white-space:nowrap;font-size:0.7rem">${esc(maint)}</span>
        </div>`;
      });
    }

    // Staff
    if (staff.length) {
      html += `<div class="np-sec">Персонал</div>`;
      staff.forEach(r => {
        const isWarn = r.status && r.status.includes("⚠");
        const stCls = isWarn ? "staff-status-warn" : "staff-status-ok";
        html += `<div class="np-row">
          <span class="np-lbl">${esc(r.category)}</span>
          <span class="${stCls}" style="white-space:nowrap;font-size:0.74rem">${esc(r.fact)}/${esc(r.norm || "?")} ${esc(r.status || "")}</span>
        </div>`;
      });
    }

    // Stash (Кладовая)
    if (stash.length) {
      html += `<div class="np-sec">🗃 Кладовая (${stash.length})</div>`;
      stash.forEach(item => {
        html += `<div class="np-row">
          <span class="np-lbl" style="white-space:normal">${esc(item)}</span>
        </div>`;
      });
    }

    html += `</div></div>`; // close np-block-body + np-block
  });

  el.innerHTML = html;
}

// ── Escape HTML ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// esc + рендер markdown-жирного (**текст**) — исходники hero_status.md пишут с **, иначе звёздочки видны буквально.
function mdBold(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(`data/index.json?_=${Date.now()}`);
    const idx = await res.json();
    INDEX = idx.entries || (idx.files || []).map(f => {
      const m = f.replace(/\.json$/, "").match(/^(run_\w+)_(\w+)$/);
      return m ? { file: f, run: m[1], player: m[2] } : null;
    }).filter(Boolean);
  } catch (e) { INDEX = []; }

  const q = new URLSearchParams(location.search);
  let run = q.get("run"), player = q.get("player");
  const runs = [...new Set(INDEX.map(e => e.run))].sort().reverse();
  if (!run) run = runs[0] || "run_005";                 // дефолт — последний забег
  const ents = runEntries(run);
  if (!player) player = ents.length ? ents[0].player : "danil";  // первый игрок забега

  buildSelects(run, player);
  loadData(run, player);
}
init();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд — Сумерки мира</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0e0c;
  --bg2:      #1a1814;
  --bg3:      #232018;
  --border:   #2e2a22;
  --text:     #c8b89a;
  --muted:    #7a6e5a;
  --gold:     #c8a84a;
  --gold-dim: #6a5820;
  --green:    #4a8a5a;
  --red:      #8a3a2a;
  --blue:     #2a5a8a;
  --font:     'Courier New', monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  padding: 16px;
  font-size: 14px;
}

/* ── Header ── */
.header {
  text-align: center;
  margin-bottom: 20px;
}
.header-run {
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.header-char {
  font-size: 1.2rem;
  color: var(--gold);
  font-weight: bold;
  letter-spacing: 0.05em;
}
.header-player {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 2px;
}
.header-season {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid;
}
.am-wrap { display:flex; justify-content:center; padding:6px 4px 2px; max-height:70vh; overflow:auto; }
.am-svg { width:100%; max-width:340px; height:auto; max-height:70vh; }
.am-block { fill:none; stroke:var(--gold-dim); stroke-width:1.5; opacity:.55; }
.am-block-hole { fill:#0d0b07; stroke:#241f16; stroke-width:1; opacity:.5; }
.am-grid { stroke:#241f16; stroke-width:1; }
.am-road { stroke:var(--gold-dim); stroke-width:2.4; stroke-linecap:round; }
.am-road-edge { stroke-dasharray:5 4; opacity:.8; }
.am-cart { opacity:.9; pointer-events:none; }
@keyframes am-house-breathe { 0%,100%{opacity:.82; transform:scale(1)} 50%{opacity:1; transform:scale(1.09)} }
.am-node { fill:var(--gold); stroke:#000; stroke-width:1; cursor:pointer; transform-box:fill-box; transform-origin:center; animation:am-house-breathe 3.4s ease-in-out infinite; }
.am-node-sel { stroke:#fff; stroke-width:2; }
.am-road-hi { stroke:#f0dc8e !important; stroke-width:3.6 !important; opacity:1 !important; }
.am-arrow { fill:var(--gold-dim); opacity:.9; }
.am-label { fill:var(--text); font-family:var(--font); font-size:11px; }
.am-pop { fill:var(--muted); font-family:var(--font); font-size:8.5px; }
.am-edge-label { fill:var(--muted); font-family:var(--font); font-size:10px; }
.am-note { color:var(--muted); font-size:11px; text-align:center; padding:2px 8px 8px; }

/* ── Атмосферные анимации (amb-*) — только для карты области ── */
@keyframes amb-smoke {
  0%   { opacity: 0;    transform: translateY(0)     scale(.5); }
  30%  { opacity: .16; }
  100% { opacity: 0;    transform: translateY(-15px) scale(1.3); }
}
.amb-smoke circle { transform-box: fill-box; transform-origin: center; }
@keyframes amb-water-pulse {
  0%,100% { opacity: .85; }
  50%     { opacity: .5;  }
}
.amb-water { animation: amb-water-pulse 6s ease-in-out infinite; }

/* Флажок на постройках admin/military в панораме */
@keyframes pano-flag-wave { 0%,100% { transform: skewX(-3deg); } 50% { transform: skewX(3deg); } }
@keyframes pano-particle-fall {
  0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.6; }
  100% { transform: translateY(110vh) translateX(var(--drift, 0)) rotate(360deg); opacity: 0; }
}

.badge-season { border-color: var(--gold-dim); color: var(--gold); background: #2a2010; }
.badge-season.s-winter { border-color:#6fa8d6; color:#bfe0f5; background:#12202e; }
.badge-season.s-spring { border-color:#7bbf5a; color:#cdeeb4; background:#14220e; }
.badge-season.s-summer { border-color:#d6b24a; color:#f3e6b0; background:#2a2410; }
.badge-season.s-autumn { border-color:#cc8a3a; color:#f0c98a; background:#2a1c0e; }
.badge-phase  { border-color: var(--blue); color: #6a9acc; background: #0a1a2a; }

/* ── Cards grid ── */
.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  max-width: 640px;
  margin: 0 auto;
}

@media (min-width: 540px) {
  .cards { grid-template-columns: 1fr 1fr; }
  .card-wide { grid-column: 1 / -1; }
}

/* ── Card ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}
.card-title .icon { font-size: 1rem; }
.card-title .chevron {
  margin-left: auto;
  transition: transform 0.2s;
  font-style: normal;
  font-size: 0.6rem;
  color: var(--muted);
}
.card.collapsed .chevron { transform: rotate(-90deg); }
.card-body { padding: 12px 14px; }
.card.collapsed .card-body { display: none; }

/* ── Treasury ── */
.treasury-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  border-bottom: 1px solid #1e1c18;
  font-size: 0.8rem;
}
.treasury-row:last-child { border-bottom: none; }
.treasury-row .label { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 8px; }
.treasury-row .amount { white-space: nowrap; }
.treasury-row .amount.pos { color: var(--green); }
.treasury-row .amount.neg { color: var(--red); }
.treasury-section {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-dim);
  padding: 8px 0 4px;
}
.treasury-np-header {
  display: flex;
  justify-content: space-between;
  padding: 6px 0 2px;
  font-size: 0.7rem;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  margin-top: 4px;
  letter-spacing: 0.04em;
}
.treasury-row-indent .label { padding-left: 10px; }
.treasury-total {
  display: flex;
  justify-content: space-between;
  padding: 8px 0 2px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
  font-weight: bold;
}
.treasury-total .label { color: var(--text); }
.treasury-total .amount { color: var(--gold); font-size: 1.05rem; }

.btn-expand {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font: inherit;
  font-size: 0.65rem;
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 8px;
  width: 100%;
}
.btn-expand:hover { border-color: var(--muted); color: var(--text); }

/* ── Buildings ── */
.slots-bar-wrap {
  margin-bottom: 10px;
}
.slots-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 4px;
}
.slots-bar {
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.slots-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 3px;
  transition: width 0.3s;
}
.building-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px solid #1a1814;
  font-size: 0.78rem;
  gap: 8px;
}
.building-row:last-child { border-bottom: none; }
.building-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.building-status { color: var(--green); white-space: nowrap; font-size: 0.7rem; }
.building-maint { color: var(--muted); white-space: nowrap; font-size: 0.7rem; }
.building-hands { color: #6a9acc; white-space: nowrap; font-size: 0.7rem; }

/* ── Events points ── */
.points-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.points-block {
  flex: 1;
  min-width: 90px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  text-align: center;
}
.points-who { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.points-num {
  font-size: 1.4rem;
  color: var(--gold);
  font-weight: bold;
  line-height: 1;
}
.points-of { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

.events-section-title {
  font-size: 0.6rem;
  color: var(--gold-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 8px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.event-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 5px 0;
  border-bottom: 1px solid #1a1814;
  font-size: 0.78rem;
  line-height: 1.35;
}
.event-item:last-child { border-bottom: none; }
.event-check { font-size: 0.85rem; flex-shrink: 0; margin-top: 1px; }
.event-text { flex: 1; }
.event-text.done { opacity: 0.45; text-decoration: line-through; }
.event-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.event-tag {
  font-size: 0.55rem;
  padding: 1px 4px;
  border-radius: 2px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--muted);
}
.event-tag.wait   { border-color: var(--blue); color: #6a9acc; }
.event-tag.harm   { border-color: var(--red); color: #cc7a6a; }
.event-tag.chance { border-color: var(--green); color: #7acc8a; }
.event-tag.noise  { opacity: 0.6; }
.event-mon { font-size: 0.7rem; color: #cc7a6a; white-space: nowrap; margin-left: auto; flex-shrink: 0; }

/* ── Rolls (разбор броска сезона) ── */
.rolls-note { font-size: 0.75rem; opacity: 0.6; margin-bottom: 10px; line-height: 1.4; }
.rolls-group-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.55; margin: 10px 0 4px; }
.rolls-group-title:first-of-type { margin-top: 0; }
.rolls-item { font-size: 0.85rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.rolls-item:last-child { border-bottom: none; }

/* ── Hero ── */
.skill-row {
  padding: 6px 0;
  border-bottom: 1px solid #1a1814;
  font-size: 0.78rem;
}
.skill-row:last-child { border-bottom: none; }
.skill-name { color: var(--text); font-weight: bold; }
.skill-meta { display: flex; gap: 10px; margin-top: 3px; flex-wrap: wrap; }
.skill-bank { color: var(--gold); font-size: 0.7rem; }
.skill-ups { color: var(--muted); font-size: 0.7rem; }
.skill-thr { color: #8a9ab5; font-size: 0.7rem; }
.skill-tech { color: #7acc8a; font-size: 0.7rem; font-style: italic; }
.skill-passive { color: #b58ad6; font-size: 0.7rem; font-style: italic; }
.hero-section-title {
  font-size: 0.6rem; color: var(--gold-dim); letter-spacing: 0.15em;
  text-transform: uppercase; padding: 8px 0 4px;
  border-bottom: 1px solid var(--border); margin-bottom: 4px;
}
.hero-item {
  font-size: 0.78rem; padding: 3px 0;
  border-bottom: 1px solid #1a1814; color: var(--text);
}
.hero-item:last-child { border-bottom: none; }
.hero-status-row { display: flex; gap: 16px; font-size: 0.78rem; margin-bottom: 4px; }
.hero-status-row span { color: var(--muted); }
.hero-status-row b { color: var(--text); }

/* ── Settlement breakdown ── */
.sett-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 10px; }
.sett-table th {
  font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold-dim); text-align: left; padding: 0 6px 6px 0;
  border-bottom: 1px solid var(--border);
}
.sett-table td { padding: 4px 6px 4px 0; border-bottom: 1px solid #1a1814; }
.sett-table tr:last-child td { border-bottom: none; }
.sett-name { color: var(--text); }
.loyalty-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 120px; }
.loyalty-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--border); }
.lb-l  { background: var(--green); }
.lb-n  { background: #555; }
.lb-nl { background: var(--red); }
.loyalty-nums { display: flex; gap: 6px; font-size: 0.65rem; }
.ly-supporters { margin-top: 4px; font-size: 0.72rem; color: var(--muted); }
.ly-supporters .ly-supp { display: inline-block; padding: 1px 6px; margin-right: 4px; background: var(--border); border-radius: 3px; color: var(--text); }
.ly-supporters .ly-opp { display: inline-block; padding: 1px 6px; margin-right: 4px; background: rgba(181,83,63,0.22); border-radius: 3px; color: var(--text); }
.ly-supporters .ly-net { display: inline-block; padding: 1px 6px; margin-right: 4px; border-radius: 3px; color: var(--text); }
.ly-supporters .ly-net.pos { color: var(--green); }
.ly-supporters .ly-net.neg { color: var(--red); }
.ly-l  { color: var(--green); }
.ly-n  { color: var(--muted); }
.ly-nl { color: var(--red); }
.hearth-stats { display: flex; gap: 8px; margin-bottom: 12px; }
.hearth-stat { flex: 1; text-align: center; padding: 8px 4px; background: #1a1814; border-radius: 8px; }
.hearth-num { font-size: 1.5rem; font-weight: bold; color: var(--text); }
.hearth-num.pos { color: var(--green); }
.hearth-num.neg { color: var(--red); }
.hearth-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
.hearth-note { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
.hearth-hint-title { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
.hearth-hint { list-style: none; padding: 0; margin: 0; }
.hearth-hint li { font-size: 0.78rem; color: var(--text); padding: 3px 0; border-bottom: 1px solid #1a1814; line-height: 1.35; }
.hearth-hint li:last-child { border-bottom: none; }
.hearth-cost { color: var(--muted); font-size: 0.74rem; }
.ly-card { padding: 10px 0 14px; border-bottom: 1px solid var(--border); }
.ly-card:last-child { border-bottom: none; }
.ly-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ly-card-name { font-size: 0.85rem; color: var(--text); flex: 1; }
.ly-card-mod { font-size: 0.78rem; font-weight: bold; }
.ly-card-mod.pos { color: var(--green); }
.ly-card-mod.neg { color: var(--red); }
.ly-card-mod.zero { color: var(--muted); }
.might-badge { font-weight: bold; white-space: nowrap; }
.might-badge.pos { color: var(--gold); }
.might-badge.neg { color: var(--red); }
.might-badge.zero { color: var(--muted); }
.might-row { padding: 8px 0; border-bottom: 1px solid #1a1814; }
.might-row:last-of-type { border-bottom: none; }
.might-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.might-np { color: var(--text); font-weight: bold; font-size: 0.85rem; }
.might-head .might-badge { font-size: 0.95rem; }
.might-breakdown { margin-top: 4px; font-size: 0.72rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: baseline; }
.might-part b { color: var(--text); font-weight: bold; }
.might-part-src { color: #5a5040; font-size: 0.66rem; }
.might-sep { color: #3a3520; }
.ly-bar-full { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: var(--border); margin-bottom: 4px; }
.ly-nums-full { display: flex; gap: 14px; font-size: 0.72rem; margin-bottom: 6px; }
.ly-reasons { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.ly-reasons li { font-size: 0.7rem; color: var(--muted); }
.ly-reasons li.pos { color: var(--green); }
.ly-reasons li.neg { color: var(--red); }
.ly-conseq { font-size: 0.7rem; line-height: 1.35; margin-top: 6px; padding: 5px 7px; border-radius: 4px; }
.ly-conseq.warn { color: var(--amber, #c08a4a); background: rgba(192,138,74,0.10); }
.ly-conseq.crit { color: var(--red); background: rgba(192,74,106,0.12); }
.ly-legend { font-size: 0.66rem; color: var(--muted); margin-top: 10px; line-height: 1.4; }
.roll-delta { font-size: 0.68rem; color: var(--muted); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.roll-delta .rd-label { color: var(--muted); }
.roll-delta .rd-pos { color: var(--green); font-weight: 600; }
.roll-delta .rd-neg { color: var(--red); font-weight: 600; }
.roll-delta .rd-none { color: var(--muted); font-style: italic; }
.staff-eff-hint { color: var(--red); font-size: 0.68rem; }
.staff-sub-note { font-size: 0.66rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }

/* ── Threat (Уровень угрозы) ── */
.threat-total { font-size: 2rem; font-weight: bold; text-align: center; padding: 8px 0 4px; }
.threat-total.low  { color: var(--green); }
.threat-total.mid  { color: var(--gold); }
.threat-total.high { color: var(--red); }
.threat-bar-wrap { height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); margin: 4px 0 10px; }
.threat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.threat-bar-fill.low  { background: var(--green); }
.threat-bar-fill.mid  { background: var(--gold); }
.threat-bar-fill.high { background: var(--red); }
.threat-factors { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.threat-factors li { font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #1a1814; }
.threat-factors li:last-child { border-bottom: none; }
.threat-factors .tf-val { color: var(--text); font-weight: bold; white-space: nowrap; padding-left: 8px; }
.threat-note { font-size: 0.7rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }
.faith-card { padding: 10px 0 14px; border-bottom: 1px solid var(--border); }
.faith-card:last-child { border-bottom: none; }
.faith-bar-full { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: var(--border); margin-bottom: 6px; }
.faith-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.72rem; margin-bottom: 6px; }
.faith-legend .fl-item { display: flex; align-items: center; gap: 5px; }
.faith-legend .fl-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.faith-legend .fl-neutral { color: var(--muted); }
.faith-overview { padding: 4px 0 14px; margin-bottom: 6px; border-bottom: 2px solid var(--border); }
.faith-overview .fo-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.faith-overview .fo-title { font-weight: 600; font-size: 0.82rem; }
.faith-overview .fo-sub { font-size: 0.66rem; color: var(--muted); }
.faith-overview .fo-rows { display: flex; flex-direction: column; gap: 4px; margin-top: 7px; }
.faith-overview .fo-row { display: flex; align-items: center; gap: 7px; font-size: 0.74rem; }
.faith-overview .fo-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.faith-overview .fo-name { flex: 1; }
.faith-overview .fo-pct { color: var(--muted); min-width: 60px; text-align: right; }
.faith-event-badge { display: inline-block; font-size: 0.62rem; padding: 1px 6px; border-radius: 8px;
                     background: rgba(200,138,74,0.18); color: #d89a52; border: 1px solid rgba(200,138,74,0.4);
                     white-space: nowrap; }
.faith-sub-note { font-size: 0.66rem; color: var(--muted); margin-top: 8px; line-height: 1.35; }
.sett-pos  { color: var(--green); text-align: right; white-space: nowrap; }
.sett-neg  { color: var(--red);   text-align: right; white-space: nowrap; }
.sett-bal-pos { color: #7acc8a; text-align: right; white-space: nowrap; font-weight: bold; }
.sett-bal-neg { color: #cc7a6a; text-align: right; white-space: nowrap; font-weight: bold; }
.sett-section { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;

/* ===== Seasonal theme (время года) — субтильно ===== */
body.season-winter { --season-a:#6fa8d6; --season-b:#bfe0f5; --season-bg:#0d1620; }
body.season-spring { --season-a:#7bbf5a; --season-b:#cdeeb4; --season-bg:#0e1609; }
body.season-summer { --season-a:#d6b24a; --season-b:#f3e6b0; --season-bg:#181206; }
body.season-autumn { --season-a:#cc8a3a; --season-b:#f0c98a; --season-bg:#180f06; }
body::before {
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background: radial-gradient(120% 60% at 50% -10%, var(--season-bg, transparent) 0%, transparent 60%);
  opacity:.55; transition:background .6s ease;
}
.season-strip {
  height:4px; width:100%; border-radius:3px; margin:0 0 10px 0;
  background: linear-gradient(90deg, transparent 0%, var(--season-a,#c8a84a) 25%, var(--season-b,#e8dfc6) 50%, var(--season-a,#c8a84a) 75%, transparent 100%);
  box-shadow: 0 0 8px -2px var(--season-a,#c8a84a); opacity:.85;
}
body:not(.season-winter):not(.season-spring):not(.season-summer):not(.season-autumn) .season-strip { display:none; }
#season-ambient { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:40; }
#season-ambient .sp {
  position:absolute; top:-24px; pointer-events:none; user-select:none;
  opacity:0; will-change:transform,opacity; animation: season-fall linear infinite;
}
@keyframes season-fall {
  0%   { transform: translate(0,-24px) rotate(0deg); opacity:0; }
  10%  { opacity:var(--peak,.5); }
  90%  { opacity:var(--peak,.5); }
  100% { transform: translate(var(--drift,0px), 104vh) rotate(var(--rot,180deg)); opacity:0; }
}
</style>

<script>
// Ростер и подписи строятся из data/index.json по текущему забегу — без хардкода персонажей/забегов.
let INDEX = [];   // [{file, run, player, char_name, player_name}]
function runLabel(run) { const n = (String(run).match(/(\d+)/) || [])[1]; return n ? ("Забег " + n) : run; }
function runEntries(run) { return INDEX.filter(e => e.run === run); }
function entryLabel(e) { return `${e.char_name || e.player} (${e.player_name || ""})`.replace(" ()", ""); }

const PHASE_LABELS = {
  season:    "Начало сезона",
  leader:    "Лидер",
  hearth:    "Очаг",
  adventure: "Приключение",
  defense:   "Оборона",
  defence:   "Оборона",
  attack:    "Нападение",
  building:  "Постройка",
};

let currentData = null;

// ── URL params ────────────────────────────────────────────────────────────────
function getParams() {
  const p = new URLSearchParams(location.search);
  return {
    run:    p.get("run")    || "run_004",
    player: p.get("player") || "valter",
  };
}

function setParams(run, player) {
  const url = new URL(location.href);
  url.searchParams.set("run",    run);
  url.searchParams.set("player", player);
  history.replaceState(null, "", url);
}

// ── Selects ───────────────────────────────────────────────────────────────────
function buildSelects(run, player) {
  const pSel = document.getElementById("sel-player");
  pSel.innerHTML = "";
  runEntries(run).forEach(e => {
    const o = document.createElement("option");
    o.value = e.player; o.textContent = entryLabel(e);
    if (e.player === player) o.selected = true;
    pSel.appendChild(o);
  });
  pSel.onchange = () => loadData(run, pSel.value);
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function loadData(run, player) {
  setParams(run, player);
  document.getElementById("sel-player").value = player;
  document.getElementById("loading").style.display = "block";
  document.getElementById("app").style.display = "none";

  try {
    const res = await fetch(`data/${run}_${player}.json?_=${Date.now()}`);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    currentData = d;
    buildNPSelect(d.settlements || []);
    render(d, null);
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "block";
  } catch (e) {
    document.getElementById("loading").textContent = "Данные не найдены (" + run + "/" + player + ")";
  }
}

// ── Toggle card ───────────────────────────────────────────────────────────────
function toggleCard(id) {
  document.getElementById(id).classList.toggle("collapsed");
}

// ── Render ────────────────────────────────────────────────────────────────────
function fmt(n) {
  return n === undefined || n === null ? "—"
       : n.toLocaleString("ru-RU");
}

// ── NP Select ─────────────────────────────────────────────────────────────────
function buildNPSelect(settlements) {
  const sel = document.getElementById("sel-np");
  sel.innerHTML = "";
  if (!settlements || settlements.length <= 1) {
    sel.style.display = "none";
    return;
  }
  sel.style.display = "";
  const allOpt = document.createElement("option");
  allOpt.value = ""; allOpt.textContent = "Все НП";
  sel.appendChild(allOpt);
  settlements.forEach(s => {
    const o = document.createElement("option");
    o.value = s.name; o.textContent = s.name;
    sel.appendChild(o);
  });
  sel.onchange = () => render(currentData, sel.value || null);
}

const SEASON_OF_YEAR = {
  'зима':  { label:'Зима',  emoji:'❄', cls:'s-winter' },
  'весна': { label:'Весна', emoji:'🌸', cls:'s-spring' },
  'лето':  { label:'Лето',  emoji:'☀', cls:'s-summer' },
  'осень': { label:'Осень', emoji:'🍂', cls:'s-autumn' },
};

const SEASON_PARTICLE = {
  's-winter': { chars:['❄','❅','❆'], n:12, size:[10,17], dur:[9,17],  drift:[-40,40], rot:[120,240], peak:.5  },
  's-spring': { chars:['🌸','🌸','·'], n:10, size:[11,17], dur:[10,18], drift:[-70,70], rot:[180,540], peak:.5  },
  's-summer': { chars:['✦','·','•'],  n:14, size:[4,8],   dur:[12,22], drift:[-30,30], rot:[0,60],    peak:.35, color:'#f3e6b0' },
  's-autumn': { chars:['🍂','🍁','·'], n:10, size:[12,18], dur:[9,16],  drift:[-80,80], rot:[180,540], peak:.5  },
};
function _seasRand(a, b) { return a + Math.random() * (b - a); }
function applySeasonAmbient(cls) {
  const box = document.getElementById('season-ambient');
  if (!box) return;
  box.innerHTML = '';
  const cfg = SEASON_PARTICLE[cls];
  if (!cfg) return;
  for (let i = 0; i < cfg.n; i++) {
    const s = document.createElement('span');
    s.className = 'sp';
    s.textContent = cfg.chars[Math.floor(Math.random() * cfg.chars.length)];
    s.style.left = _seasRand(0, 100).toFixed(2) + '%';
    s.style.fontSize = _seasRand(cfg.size[0], cfg.size[1]).toFixed(1) + 'px';
    s.style.setProperty('--drift', _seasRand(cfg.drift[0], cfg.drift[1]).toFixed(0) + 'px');
    s.style.setProperty('--rot', _seasRand(cfg.rot[0], cfg.rot[1]).toFixed(0) + 'deg');
    s.style.setProperty('--peak', cfg.peak);
    s.style.animationDuration = _seasRand(cfg.dur[0], cfg.dur[1]).toFixed(1) + 's';
    s.style.animationDelay = (-_seasRand(0, cfg.dur[1])).toFixed(1) + 's';
    if (cfg.color) s.style.color = cfg.color;
    box.appendChild(s);
  }
}

function render(d, npFilter) {
  // Header
  const heroName = d.hero?.name?.replace(/—.+/, "").trim() || "—";
  document.title = heroName + " — Дашборд";
  document.getElementById("hdr-run").textContent    = runLabel(d.run) + " · С" + (d.season || "?");
  document.getElementById("hdr-char").textContent   = heroName;
  document.getElementById("hdr-player").textContent = d.player_name || d.player;
  const _seasonBadge = document.getElementById("hdr-season");
  const _sn = (d.season_name || "").toLowerCase();
  const _si = SEASON_OF_YEAR[_sn];
  _seasonBadge.classList.remove("s-winter","s-spring","s-summer","s-autumn");
  document.body.classList.remove("season-winter","season-spring","season-summer","season-autumn");
  if (_si) {
    _seasonBadge.textContent = "Сезон " + (d.season || "?") + " · " + _si.label + " " + _si.emoji;
    _seasonBadge.classList.add(_si.cls);
    document.body.classList.add(_si.cls.replace("s-", "season-"));
    applySeasonAmbient(_si.cls);
  } else {
    _seasonBadge.textContent = "Сезон " + (d.season || "?");
    applySeasonAmbient(null);
  }
  const phase = d.active_phase;
  document.getElementById("hdr-phase").textContent  = PHASE_LABELS[phase] || phase || "?";

  const setts = npFilter
    ? (d.settlements || []).filter(s => s.name === npFilter)
    : (d.settlements || []);

  renderAreaMap(d.area_map);
  renderFinance(d.finance, npFilter);
  renderLoot(d.loot);
  renderBuildings(d.buildings, setts);
  renderEvents(d.events);
  renderRolls(d.rolls);
  renderHearth(d.hearth);
  renderHero(d.hero);
  renderRetinue(d.hero);
  renderStaff(setts);
  renderTerritory(setts);
  renderMight(setts);
  renderLoyalty(setts);
  renderFaith(setts, d.religion);
  renderThreat(d.threat);

// Словарь имя НП → объект settlement для панорамы (заполняется в render)

// Дороги на НП: из area_map.roads строим name → [соседи]. internal — в обе
// стороны, edge — только у якоря (from = НП владения, to = внешний сосед).
let NP_ROADS = {};
function buildRoadsByNp(roads) {
  const m = {};
  const add = (a, b) => { (m[a] = m[a] || []); if (!m[a].includes(b)) m[a].push(b); };
  (roads || []).forEach(rd => {
    if (rd.type === 'internal') { add(rd.from, rd.to); add(rd.to, rd.from); }
    else { add(rd.from, rd.to); }
  });
  return m;
}

// Тап по домику НП: подсветить дороги + открыть панораму поселения.
function amHi(ev, idx) {
  ev.stopPropagation();
  const svg = ev.target.ownerSVGElement;
  if (!svg) return;
  const already = ev.target.classList.contains("am-node-sel");
  svg.querySelectorAll(".am-node-sel").forEach(el => el.classList.remove("am-node-sel"));
  svg.querySelectorAll(".am-road-hi").forEach(el => el.classList.remove("am-road-hi"));
  if (already) return;
  ev.target.classList.add("am-node-sel");
  svg.querySelectorAll(".am-road").forEach(r => {
    if ((r.getAttribute("data-i") || "").split(" ").includes(String(idx))) r.classList.add("am-road-hi");
  });
  const labels = svg.querySelectorAll(".am-label");
  const nm = labels[idx] ? labels[idx].textContent.trim() : null;
  if (nm) {
    const s = panoSetts[nm] || null;
    const terrainHint = panoTerrainFor(nm, (_panoNodes[idx] && _panoNodes[idx].terrain) || '');
    openPano(nm, s, terrainHint);
  }
}

// Детерминированный тип местности НП: реальный terrain клетки, иначе стабильно-случайный по имени.
function panoTerrainFor(name, real){
  const r=(real||'').toLowerCase();
  if(r.match(/t-mountain|гор|▲|предгор/)) return 't-mountain';
  if(r.match(/t-swamp|болот|🌿/)) return 't-swamp';
  if(r.match(/t-forest|лес|🌲/)) return 't-forest';
  if(r.match(/t-ocean|t-skerry|мор|〰|шхер/)) return 't-ocean';
  if(r.match(/t-evil|опас|☠/)) return 't-evil';
  return 't-meadow';
}

// Категория постройки по ключевым словам имени
function buildingArchetype(name) {
  const n = (name || '').toLowerCase();

  if (n.match(/казарм|цитадел|форт|крепост|карауль|стража|вышк|башн|тренир|плац/)) return 'military';

  function drawBuilding(b,i,cx,baseY,bw,bh,isBuilding){ const arch=buildingArchetype(b.name||''); const name=(b.name||'').toLowerCase(); const L=cx-bw/2,R=cx+bw/2; let inner='',flag='',smoke=''; if(arch==='military'){ const wall='#c3bdad', wtop=baseY-bh*0.82; inner+=`<rect x="${L}" y="${wtop}" width="${bw}" height="${baseY-wtop}" fill="${wall}"/>`; inner+=`<rect x="${cx}" y="${wtop}" width="${bw/2}" height="${baseY-wtop}" fill="${shade(wall,0.86)}"/>`; const cH=bh*0.1, cW=bw/7; for(let k=0;k<4;k++){ inner+=`<rect x="${L+cW*(k*1.7)}" y="${wtop-cH}" width="${cW}" height="${cH}" fill="${wall}"/>`; } for(let k=1;k<=3;k++){ const yy=wtop+(baseY-wtop)*k/4; inner+=`<line x1="${L}" y1="${yy}" x2="${R}" y2="${yy}" stroke="${shade(wall,0.75)}" stroke-width="0.6"/>`; } inner+=`<rect x="${cx-bw*0.28}" y="${wtop+bh*0.14}" width="${bw*0.05}" height="${bh*0.2}" fill="#2a2018"/>`; inner+=`<rect x="${cx+bw*0.23}" y="${wtop+bh*0.14}" width="${bw*0.05}" height="${bh*0.2}" fill="#2a2018"/>`; inner+=`<path d="M ${cx-bw*0.14} ${baseY} L ${cx-bw*0.14} ${baseY-bh*0.3} Q ${cx} ${baseY-bh*0.42} ${cx+bw*0.14} ${baseY-bh*0.3} L ${cx+bw*0.14} ${baseY} Z" fill="#3a2414" stroke="${shade(wall,0.7)}" stroke-width="1"/>`; if(!isBuilding) flag=drawFlag(cx, wtop-cH, bw*0.34, bh*0.16, true); } else if(arch==='admin'){ const sc=1.3, iw=bw*sc, ih=bw*1.205*sc; inner=`<image href="assets/uprava.svg" x="${cx-iw/2}" y="${baseY-ih*0.9285}" width="${iw}" height="${ih}" preserveAspectRatio="xMidYMax meet" pointer-events="all"/>`; flag=''; } else if(arch==='religious'){ const wall='#efe7d2', roof='#8a5a38', wtop=baseY-bh*0.56, peak=baseY-bh*0.76; inner+=`<rect x="${L}" y="${wtop}" width="${bw}" height="${baseY-wtop}" fill="${wall}"/>`; inner+=`<rect x="${cx}" y="${wtop}" width="${bw/2}" height="${baseY-wtop}" fill="${shade(wall,0.9)}"/>`; inner+=gableRoof(L,R,wtop,peak,roof); const spBase=wtop, spPeak=baseY-bh*1.3, spW=bw*0.16; inner+=`<polygon points="${cx-spW/2},${spBase} ${cx},${spPeak} ${cx+spW/2},${spBase}" lse { const timber=(arch==='production'); const wall=timber?'#e3d3ac':'#e8d6b0'; const roof=timber?'#9c6a3c':'#b5532e'; const r=bodyResidential(cx,baseY,bw,bh,wall,roof,timber,true); inner+=r.svg; if(!isBuilding){ const cxh=r.chimneyX, cyh=r.chimneyY; inner+=`<rect x="${cxh-bw*0.04}" y="${cyh-bh*0.14}" width="${bw*0.08}" height="${bh*0.2}" fill="${shade(wall,0.7)}"/>`; const sd1=((i*1.7)%4).toFixed(1), sd2=((i*1.7+2.3)%4).toFixed(1); smoke=`<g pointer-events="none"><circle cx="${cxh-1}" cy="${cyh-bh*0.18}" r="2.4" fill="#e8e4dc" style="animation:amb-smoke 4s ease-out ${sd1}s infinite" opacity="0"/><circle cx="${cxh+1.5}" cy="${cyh-bh*0.24}" r="3" fill="#e8e4dc" style="animation:amb-smoke 4s ease-out ${sd2}s infinite" opacity="0"/></g>`; } if(name.includes('мельниц')){ const wr=bh*0.17, wx=R-wr*0.2, wy=baseY-wr*0.7; inner+=`<circle cx="${wx}" cy="${wy}" r="${wr}" fill="#6b4a2c" stroke="#3f2a18" stroke-width="1.5"/><circle cx="${wx}" cy="${wy}" r="${wr*0.62}" fill="none" stroke="#3f2a18" stroke-width="1"/>`; for(let k=0;k<8;k++){ const a=k*Math.PI/4; inner+=`<line x1="${wx}" y1="${wy}" x2="${wx+Math.cos(a)*wr}" y2="${wy+Math.sin(a)*wr}" stroke="#3f2a18" stroke-width="1"/>`; } inner+=`<circle cx="${wx}" cy="${wy}" r="${wr*0.14}" fill="#3f2a18"/>`; } } return {inner, flag, smoke}; }

  function bldGroup(item, cx, baseY, bw, bh){ const {b,i}=item; const st=(b.status||'').toLowerCase(); const isBuilding=st.includes('🔨')||st.includes('строит')||st.includes('в работе'); const d=drawBuilding(b,i,cx,baseY,bw,bh,isBuilding); const shadow=`<ellipse cx="${cx}" cy="${baseY+2}" rx="${bw*0.66}" ry="${bw*0.12}" fill="#000000" opacity="0.18" pointer-events="none"/>`; let scaffold=''; if(isBuilding){ const L=cx-bw/2,R=cx+bw/2,T=baseY-bh*0.7; scaffold=`<g pointer-events="none" stroke="#caa24a" stroke-width="1" opacity="0.8"><line x1="${L}" y1="${T}" x2="${R}" y2="${baseY}" stroke-dasharray="3 2"/><line x1="${R}" y1="${T}" x2="${L}" y2="${baseY}" stroke-dasharray="3 2"/><line x1="${L}" y1="${baseY-bh*0.4}" x2="${R}" y2="${baseY-bh*0.4}" stroke-dasharray="3 2"/></g>`; } const op=isBuilding?0.6:1; return `${shadow}<g class="pano-bld" opacity="${op}" onclick="openBldCard(${i});event.stopPropagation()" cursor="pointer">${d.inner}${scaffold}${d.flag}${d.smoke}</g>`; }
  function bldLabel(item,cx,baseY){ const nm=(item.b.name||''); const short=nm.length>14?nm.slice(0,13)+'…':nm; const w=short.length*5.6+10; return `<g pointer-events="none"><rect x="${cx-w/2}" y="${baseY+5}" width="${w}" height="13" rx="6" fill="#1a1206" opacity="0.55"/><text x="${cx}" y="${baseY+14}" font-size="9" fill="#f0e4c8" text-anchor="middle">${E(short)}</text></g>`; }

  const monumental = n => ['admin','military','religious'].includes(buildingArchetype(n));
  const back=[], front=[];

  front.forEach((it,k)=>{ const p=frontPos[k]; frontSvg+=bldGroup(it,p.cx,p.baseY,frontBW,frontBW*1.12); labelSvg+=bldLabel(it,p.cx,p.baseY); });
  const emptyMsg = '';

  const sun = evil? '' : `<circle cx="640" cy="90" r="80" fill="#fff6d8" opacity="0.35" pointer-events="none"/><circle cx="640" cy="90" r="34" fill="#fff2c4" opacity="0.9" pointer-events="none"/>`;
  const cloud=(cx,cy,s,o)=>`<g pointer-events="none" opacity="${o}" fill="#ffffff"><ellipse cx="${cx}" cy="${cy}" rx="${46*s}" ry="${16*s}"/><ellipse cx="${cx-30*s}" cy="${cy+6*s}" rx="${30*s}" ry="${12*s}"/><ellipse cx="${cx+34*s}" cy="${cy+5*s}" rx="${28*s}" ry="${11*s}"/></g>`;
  const clouds = cloud(180,80,1,0.85)+cloud(430,54,0.7,0.7)+cloud(700,120,0.9,0.8);
  const peaks=`<path d="M 0 ${groundY-20} L 120 ${VH*0.34} L 210 ${groundY-30} L 330 ${VH*0.28} L 430 ${groundY-24} L 560 ${VH*0.32} L 680 ${groundY-34} L 800 ${VH*0.36} L 800 ${groundY} L 0 ${groundY} Z" fill="${mtn}" opacity="0.5" pointer-events="none"/>`;
  const softHills=`<path d="M 0 ${groundY-10} Q 130 ${groundY-46} 260 ${groundY-16} Q 400 ${groundY-50} 540 ${groundY-14} Q 680 ${groundY-44} 800 ${groundY-18} L 800 ${groundY} L 0 ${groundY} Z" fill="${mtn}" opacity="0.4" pointer-events="none"/>`;
  let treeline=''; { let tl=''; for(let k=0;k<15;k++){ const bx=k*57+(k%2?16:0); const by=groundY-4; const tw=30+(k%3)*10; const th=48+(k%4)*16; tl+=`<polygon points="${bx-tw/2},${by} ${bx},${by-th} ${bx+tw/2},${by}" fill="${shade(hillBack,0.85)}" opacity="${(0.55+(k%3)*0.12).toFixed(2)}" pointer-events="none"/>`; } treeline=`<g pointer-events="none">${tl}</g>`; }
  const seaBand=`<rect x="0" y="${groundY-40}" width="${VW}" height="40" fill="${mtn}" opacity="0.3" pointer-events="none"/><path d="M 0 ${groundY-40} q 60 8 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 80 0" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25" pointer-events="none"/>`;
  let bog=''; { const humps=`<path d="M 0 ${groundY-6} Q 160 ${groundY-30} 320 ${groundY-8} Q 480 ${groundY-28} 640 ${groundY-8} Q 720 ${groundY-20} 800 ${groundY-10} L 800 ${groundY} L 0 ${groundY} Z" fill="${mtn}" opacity="0.4" pointer-events="none"/>`; let dead=''; for(const dx of [120,300,470,650]){ const dy=groundY-8; dead+=`<g pointer-events="none" opacity="0.5" stroke="${shade(mtn,0.6)}" stroke-width="1.4" fill="none"><line x1="${dx}" y1="${dy}" x2="${dx}" y2="${dy-26}"/><line x1="${dx}" y1="${dy-18}" x2="${dx-8}" y2="${dy-24}"/><line x1="${dx}" y1="${dy-14}" x2="${dx+9}" y2="${dy-22}"/></g>`; } bog=humps+dead; }
  const horizon = (terrain.match(/t-mountain|гор|▲|предгор/)||evil) ? peaks
    : terrain.match(/t-forest|лес|🌲/) ? treeline
    : terrain.match(/t-ocean|t-skerry|мор|〰|шхер/) ? seaBand

  const hills=`<path d="M 0 ${groundY-8} Q 160 ${groundY-64} 320 ${groundY-20} Q 470 ${groundY-58} 620 ${groundY-16} Q 720 ${groundY-40} 800 ${groundY-22} L 800 ${groundY} L 0 ${groundY} Z" fill="${hillBack}" pointer-events="none"/><path d="M 0 ${groundY+8} Q 140 ${groundY-30} 300 ${groundY+6} Q 460 ${groundY-24} 640 ${groundY+8} Q 730 ${groundY-14} 800 ${groundY+2} L 800 ${VH} L 0 ${VH} Z" fill="${hillFront}" pointer-events="none"/>`;
  const midHill=`<path d="M 0 ${frontBaseY-40} Q 200 ${frontBaseY-64} 400 ${frontBaseY-44} Q 600 ${frontBaseY-24} 800 ${frontBaseY-46} L 800 ${VH} L 0 ${VH} Z" fill="${shade(hillFront,0.94)}" opacity="0.6" pointer-events="none"/>`;
  const foreground=`<path d="M 0 ${VH*0.94} Q 60 ${VH*0.9} 140 ${VH*0.94} Q 220 ${VH*0.98} 320 ${VH*0.93} Q 440 ${VH*0.9} 560 ${VH*0.94} Q 680 ${VH*0.98} 800 ${VH*0.93} L 800 ${VH} L 0 ${VH} Z" fill="${grassBot}" opacity="0.85" pointer-events="none"/>`;
  const tree=(x,y,s)=>`<g pointer-events="none"><rect x="${x-2*s}" y="${y-9*s}" width="${4*s}" height="${11*s}" fill="#6a4a2c"/><circle cx="${x}" cy="${y-14*s}" r="${10*s}" fill="#4a7a3a"/><circle cx="${x-7*s}" cy="${y-9*s}" r="${7*s}" fill="#3f6f32"/><circle cx="${x+7*s}" cy="${y-9*s}" r="${7*s}" fill="#568a44"/></g>`;

  let tufts=''; for(let k=0;k<26;k++){ const tx=6+k*31+(k%3)*6; const ty=VH-5-(k%4)*3; tufts+=`<path d="M ${tx} ${ty} l -2 -7 M ${tx} ${ty} l 2 -8 M ${tx} ${ty} l 5 -6" stroke="${shade(grassBot,0.75)}" stroke-width="1" fill="none" pointer-events="none"/>`; }

  const SEASON_VIS = {

function makePanoParticles(type) {
  const COUNT = { snow: 40, leaves: 28, blossom: 32 }[type] || 0;
  if (!COUNT) return '';
  const palette = { snow: ['❄','·','·'], leaves: ['🍂','🍁','🍃'], blossom: ['🌸','·','·'] }[type];
  let html = '';
  for (let k = 0; k < COUNT; k++) {
    const left  = (Math.random() * 100).toFixed(1);
    const delay = (Math.random() * 8).toFixed(2);
    const dur   = (5 + Math.random() * 7).toFixed(1);
    const size  = type === 'snow' ? (8 + Math.random()*6).toFixed(0) : (12 + Math.random()*10).toFixed(0);
    const char  = palette[Math.floor(Math.random() * palette.length)];
    const drift = type === 'leaves' ? ((Math.random() > 0.5 ? 1 : -1) * (20 + Math.random()*30)).toFixed(0) : 0;
    html += `<span style="position:absolute;left:${left}%;top:-2em;font-size:${size}px;opacity:0.7;animation:pano-particle-fall ${dur}s linear ${delay}s infinite;--drift:${drift}px">${char}</span>`;
  }
  return html;
}

// SVG-градиенты водных краёв: синий у границы блока → прозрачный внутрь.
function amWaterDefs() {
  const C = '#1f56a0';
  const stops = '<stop offset="0" stop-color="' + C + '" stop-opacity="0.92"/>'
    + '<stop offset="0.55" stop-color="' + C + '" stop-opacity="0.4"/>'
    + '<stop offset="1" stop-color="' + C + '" stop-opacity="0"/>';
  return '<defs>'
    + `<linearGradient id="wg-n" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>`
    + `<linearGradient id="wg-s" x1="0" y1="1" x2="0" y2="0">${stops}</linearGradient>`
    + `<linearGradient id="wg-w" x1="0" y1="0" x2="1" y2="0">${stops}</linearGradient>`
    + `<linearGradient id="wg-e" x1="1" y1="0" x2="0" y2="0">${stops}</linearGradient>`
    + '</defs>';
}

function renderAreaMap(am) {
  const card = document.getElementById("card-areamap");
  const nameEl = document.getElementById("areamap-name");
  const body = document.getElementById("body-areamap");
  if (!am || !am.nodes || !am.nodes.length) { card.style.display = "none"; return; }
  card.style.display = "";
  nameEl.textContent = am.area ? " · " + am.area : "";
  // Сохраняем ноды глобально — для terrain-хинта при открытии панорамы
  _panoNodes = am.nodes;

  // Холст сшит из блоков клеток мира 4×4: cols мини-колонок × rows мини-рядов.
  const cols = am.cols || 4, rows = am.rows || 4;
  const P = 26, S = 62;                 // отступ и сторона мини-клетки
  const W = P * 2 + S * cols;           // ПРЯМОУГОЛЬНЫЙ холст
  const H = P * 2 + S * rows;
  const cx = (c) => P + (c - 0.5) * S;   // центр глоб. колонки/ряда
  const cy = (r) => P + (r - 0.5) * S;
  const pos = {};
  am.nodes.forEach(n => { pos[n.name] = [cx(n.col), cy(n.row)]; });
  const idxOf = {}; am.nodes.forEach((n, i) => { idxOf[n.name] = i; });

  const esc = (s) => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  let g = "";

  // Водные края: полоса-градиент вдоль стороны блока, у которой сосед-клетка — море.
  const WBAND = S * 0.42;
  const hasWater = (am.blocks || []).some(b => (b.water || []).length);
  if (hasWater) g += amWaterDefs();

  // блоки клеток мира: рамка 4S×4S; owned — обычная, «дыра» — приглушённая
  (am.blocks || []).forEach(bl => {
    const bx = P + (bl.col0 - 1) * S, by = P + (bl.row0 - 1) * S;
    const cls = bl.owned ? "am-block" : "am-block am-block-hole";
    g += `<rect x="${bx}" y="${by}" width="${4 * S}" height="${4 * S}" class="${cls}"/>`;
  });
  (am.blocks || []).forEach(bl => {
    (bl.water || []).forEach(side => {
      const bx = P + (bl.col0 - 1) * S, by = P + (bl.row0 - 1) * S, sz = 4 * S;
      let x = bx, y = by, w = sz, h = sz;
      if (side === 'n') { h = WBAND; }
      else if (side === 's') { y = by + sz - WBAND; h = WBAND; }
      else if (side === 'w') { w = WBAND; }
      else if (side === 'e') { x = bx + sz - WBAND; w = WBAND; }
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#wg-${side})" class="amb-water" style="animation-delay:${(side === 'n' ? 0 : side === 's' ? 1.5 : side === 'e' ? 3 : 4.5)}s"/>`;
    });
  });

  // сетка-ориентир (по всему холсту)
  for (let i = 0; i <= cols; i++) {
    const o = P + i * S;
    g += `<line x1="${o}" y1="${P}" x2="${o}" y2="${P + S * rows}" class="am-grid"/>`;
  }
  for (let j = 0; j <= rows; j++) {
    const o = P + j * S;
    g += `<line x1="${P}" y1="${o}" x2="${P + S * cols}" y2="${o}" class="am-grid"/>`;
  }

  // дороги (под маркерами)
  (am.roads || []).forEach(rd => {
    const a = pos[rd.from]; if (!a) return;
    if (rd.type === "internal") {
      const b = pos[rd.to]; if (!b) return;
      g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="am-road" data-i="${idxOf[rd.from]} ${idxOf[rd.to]}"/>`;
    } else {                              // edge → луч до края холста + стрелка
      const dx = rd.dir?.dx || 0, dy = rd.dir?.dy || 0;
      if (!dx && !dy) return;
      // Луч ОТ ноды в сторону соседней клетки ДО края холста — дорога «уходит» за
      // границу области. На экране x вправо=+dx, y вниз=−dy (dy>0=север=верх). Каждая
      // дорога выходит в СВОЕЙ точке границы (не в общий угол) → подписи не слипаются.
      const vx = dx, vy = -dy;
      let t = Infinity;
      if (vx > 0) t = Math.min(t, (W - a[0]) / vx);
      else if (vx < 0) t = Math.min(t, (0 - a[0]) / vx);
      if (vy > 0) t = Math.min(t, (H - a[1]) / vy);
      else if (vy < 0) t = Math.min(t, (0 - a[1]) / vy);
      if (!isFinite(t) || t <= 0) return;
      const ex = a[0] + vx * t, ey = a[1] + vy * t;
      g += `<line x1="${a[0]}" y1="${a[1]}" x2="${ex}" y2="${ey}" class="am-road am-road-edge" data-i="${idxOf[rd.from]}"/>`;
      const al = Math.hypot(vx, vy) || 1, ux = vx / al, uy = vy / al;   // стрелка-наконечник у выхода
      const tx = ex - ux * 2, ty = ey - uy * 2, bkx = tx - ux * 8, bky = ty - uy * 8;
      g += `<polygon points="${tx},${ty} ${bkx - uy * 4.2},${bky + ux * 4.2} ${bkx + uy * 4.2},${bky - ux * 4.2}" class="am-arrow"/>`;
      const anchor = vx > 0 ? "end" : vx < 0 ? "start" : "middle";  // подпись внутрь холста
      const lx = Math.max(4, Math.min(W - 4, ex + (vx > 0 ? -4 : vx < 0 ? 4 : 0)));
      const ly = Math.max(12, Math.min(H - 5, ey + (vy > 0 ? -6 : 14)));
      g += `<text x="${lx}" y="${ly}" class="am-edge-label" text-anchor="${anchor}">→ ${esc(rd.to)}</text>`;
    }
  });

  // маркеры НП — домики, цвет по владельцу, подпись населения
  const OWN_COLORS = { danil: "#6ba9e6", misha: "#e0894a", valter: "#7bc96f" };
  am.nodes.forEach((n, i) => {
    const [x, y] = pos[n.name];
    const _tt = panoTerrainFor(n.name, n.terrain||''); const _tc = terrainTileColor(_tt);
    g += `<rect x="${x-17}" y="${y-14}" width="34" height="30" rx="6" fill="${_tc}" opacity="0.72" pointer-events="none"/>`;
    if(_tt==='t-forest'){ g += `<circle cx="${x-9}" cy="${y+6}" r="3" fill="#2f5f28" pointer-events="none"/><circle cx="${x+9}" cy="${y+7}" r="2.6" fill="#356a2e" pointer-events="none"/>`; }
    else if(_tt==='t-mountain'){ g += `<path d="M ${x-11} ${y+12} L ${x-5} ${y+2} L ${x+1} ${y+12} Z" fill="#b7ad98" pointer-events="none"/><path d="M ${x+2} ${y+12} L ${x+9} ${y+1} L ${x+14} ${y+12} Z" fill="#c7bda8" pointer-events="none"/>`; }
    else if(_tt==='t-ocean'){ g += `<path d="M ${x-15} ${y+9} q 4 -3 8 0 t 8 0 t 8 0 t 8 0" fill="none" stroke="#cfe6f2" stroke-width="1.2" pointer-events="none"/>`; }
    else if(_tt==='t-swamp'){ g += `<circle cx="${x-8}" cy="${y+9}" r="3" fill="#3f5a2e" opacity="0.8" pointer-events="none"/><circle cx="${x+7}" cy="${y+10}" r="2.4" fill="#47623a" opacity="0.8" pointer-events="none"/>`; }
    const fill = OWN_COLORS[n.owner] || "#c8a84a";
    const w = 6.5, bh = 6, rh = 5;   // домик = пятиугольник (крыша+корпус)
    const house = `M ${x - w} ${y - 1} L ${x} ${y - 1 - rh} L ${x + w} ${y - 1} L ${x + w} ${y + bh} L ${x - w} ${y + bh} Z`;
    g += `<path d="${house}" class="am-node" data-i="${i}" style="fill:${fill};animation-delay:${((i * 0.41) % 3.4).toFixed(2)}s" onclick="amHi(event,${i})"/>`;
    // Дымок над крышей домика: 2 кружка с разным delay, идут вверх
    const smokeDelay1 = ((i * 1.3) % 4).toFixed(1);
    const smokeDelay2 = ((i * 1.3 + 2.1) % 4).toFixed(1);
    g += `<g class="amb-smoke" pointer-events="none">`
      + `<circle cx="${x - 1.2}" cy="${y - 1 - rh - 3}" r="1.3" fill="#cfc8bd" style="animation:amb-smoke 4s ease-out ${smokeDelay1}s infinite"/>`
      + `<circle cx="${x + 1.5}" cy="${y - 1 - rh - 5}" r="1.8" fill="#cfc8bd" style="animation:amb-smoke 4s ease-out ${smokeDelay2}s infinite"/>`
      + `</g>`;
    g += `<text x="${x}" y="${y - rh - 5}" class="am-label" text-anchor="middle">${esc(n.name)}</text>`;
    if (n.pop) g += `<text x="${x}" y="${y + bh + 11}" class="am-pop" text-anchor="middle">~${n.pop}</text>`;
  });
  body.innerHTML =
    `<div class="am-wrap"><svg viewBox="0 0 ${W} ${H}" class="am-svg" preserveAspectRatio="xMidYMid meet">${g}</svg></div>` +
    `<div class="am-note">Иллюстративная карта — клетки лишь ориентир. Пунктир — дорога к соседней области.</div>`;
  animateAreaCarts(body);
}

// Строим телегу через createElementNS (НЕ g.innerHTML): innerHTML на SVG-элементе
// в WKWebView (Telegram iOS) создаёт детей в HTML-namespace — <rect>/<circle> не
// рендерятся. createElementNS гарантирует SVG-namespace.
const _CART_SHAPES_AREA = [
  ['rect', { x: -7, y: -5, width: 14, height: 7, rx: 1.6, fill: '#7a5a34', stroke: '#4a3820', 'stroke-width': 0.9 }],
  ['rect', { x: -7, y: -8, width: 10, height: 3.4, rx: 1.1, fill: '#9a7648', opacity: 0.9 }],
  ['circle', { cx: -3.6, cy: 2.6, r: 2.1, fill: '#2e2214', stroke: '#5a4428', 'stroke-width': 0.8 }],
  ['circle', { cx: 3.6, cy: 2.6, r: 2.1, fill: '#2e2214', stroke: '#5a4428', 'stroke-width': 0.8 }],
];
function _buildCartG(SVGNS, cls, shapes) {
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', cls);
  for (const [tag, attrs] of shapes) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    g.appendChild(e);
  }
  return g;
}
// Телеги на карте области: едут по ВСЕМ дорогам (am-road — внутренним между НП
// и пунктирным выходящим к соседям). Координаты берём в единицах viewBox из уже
// отрисованных <line>. rAF один на все телеги; при перерисовке отменяем цикл.
let _amCartRAF = null;
function animateAreaCarts(root) {
  if (_amCartRAF) { cancelAnimationFrame(_amCartRAF); _amCartRAF = null; }
  if (!root) return;
  const svg = root.querySelector('.am-svg');
  if (!svg) return;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const segs = Array.from(svg.querySelectorAll('.am-road'))
    .map(l => {
      const ax = +l.getAttribute('x1'), ay = +l.getAttribute('y1');
      const bx = +l.getAttribute('x2'), by = +l.getAttribute('y2');
      return { ax, ay, bx, by, len: Math.hypot(bx - ax, by - ay) };
    })
    .filter(s => s.len > 4);
  if (!segs.length) return;
  const MAX_CARTS = 6, SPEED = 20; // единицы viewBox/сек
  const chosen = segs.slice().sort((p, q) => q.len - p.len).slice(0, MAX_CARTS);
  const carts = chosen.map((s, i) => {
    const gEl = _buildCartG(SVGNS, 'am-cart', _CART_SHAPES_AREA);
    svg.appendChild(gEl);
    return { g: gEl, s, phase: i / chosen.length };
  });
  let t0 = null;
  const frame = ts => {
    if (t0 === null) t0 = ts;
    const el = (ts - t0) / 1000;
    for (const c of carts) {
      const s = c.s, period = Math.max(3, s.len / SPEED);
      const u = ((el / period) + c.phase) % 1;
      const x = s.ax + (s.bx - s.ax) * u, y = s.ay + (s.by - s.ay) * u;
      c.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    }
    _amCartRAF = requestAnimationFrame(frame);
  };
  _amCartRAF = requestAnimationFrame(frame);
}

// ── Finance ───────────────────────────────────────────────────────────────────
function renderFinance(f, npFilter) {
  if (!f) { document.getElementById("body-finance").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-finance");

  let html = `
    <div class="treasury-row">
      <span class="label">Начало сезона</span>
      <span class="amount">${fmt(f.start)} мон</span>
    </div>`;

  const incByAll  = f.income_by   || {};
  const expByAll  = f.expenses_by || {};
  const allSetts  = [...new Set([...Object.keys(incByAll), ...Object.keys(expByAll)])];

  // Фильтр по НП
  const incBy = npFilter ? { [npFilter]: incByAll[npFilter] || [] } : incByAll;
  const expBy = npFilter ? { [npFilter]: expByAll[npFilter] || [] } : expByAll;
  const setts = npFilter ? [npFilter] : allSetts;
  const hasNP = setts.length > 1 || (setts.length === 1 && setts[0] !== "");

  // Пересчитать итоги если фильтр
  const filtIncome   = setts.reduce((s, k) => s + (incBy[k] || []).reduce((a, i) => a + i.amount, 0), 0);
  const filtExpenses = setts.reduce((s, k) => s + (expBy[k] || []).reduce((a, i) => a + i.amount, 0), 0);
  const showTotals   = npFilter ? { income: filtIncome, expenses: filtExpenses } : { income: f.total_income, expenses: f.total_expenses };

  // Доходы с отсечками по НП
  html += `<div class="treasury-section">Доходы</div>`;
  if (hasNP) {
    setts.forEach(s => {
      const items = incBy[s] || [];
      if (!items.length) return;
      const npTotal = items.reduce((a, i) => a + i.amount, 0);
      html += `<div class="treasury-np-header">
        <span>${esc(s || "Прочее")}</span>
        <span class="amount pos">+${fmt(npTotal)}</span>
      </div>`;
      items.forEach(i => {
        html += `<div class="treasury-row treasury-row-indent"><span class="label">${esc(i.label)}</span><span class="amount pos">+${fmt(i.amount)}</span></div>`;
      });
    });
  } else {
    (f.income || []).forEach(i => {
      html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount pos">+${fmt(i.amount)}</span></div>`;
    });
  }
  html += `<div class="treasury-row" style="font-weight:bold">
    <span class="label">Итого доходов</span>
    <span class="amount pos">+${fmt(showTotals.income)}</span>
  </div>`;

  // Расходы с отсечками по НП
  html += `<div class="treasury-section">Расходы</div>`;
  if (hasNP) {
    setts.forEach(s => {
      const items = expBy[s] || [];
      if (!items.length) return;
      const npTotal = items.reduce((a, i) => a + i.amount, 0);
      html += `<div class="treasury-np-header">
        <span>${esc(s || "Прочее")}</span>
        <span class="amount neg">−${fmt(npTotal)}</span>
      </div>`;
      items.forEach(i => {
        html += `<div class="treasury-row treasury-row-indent"><span class="label">${esc(i.label)}</span><span class="amount neg">−${fmt(i.amount)}</span></div>`;
      });
    });
  } else {
    (f.expenses || []).forEach(i => {
      html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount neg">−${fmt(i.amount)}</span></div>`;
    });
  }
  html += `<div class="treasury-row" style="font-weight:bold">
    <span class="label">Итого расходов</span>
    <span class="amount neg">−${fmt(showTotals.expenses)}</span>
  </div>`;

  if (!npFilter) {
    // Прибыль = доходы − расходы (постоянный операционный баланс, сразу после расходов)
    const profit   = showTotals.income - showTotals.expenses;
    const profCls  = profit >= 0 ? "pos" : "neg";
    const profSign = profit >= 0 ? "+" : "";
    html += `<div class="treasury-total">
      <span class="label">Прибыль</span>
      <span class="amount ${profCls}">${profSign}${fmt(profit)} мон</span>
    </div>`;

    // Поступления
    const receipts     = f.receipts  || [];
    const totalReceipts = receipts.reduce((a, i) => a + i.amount, 0);
    html += `<div class="treasury-section">Поступления</div>`;
    if (receipts.length) {
      receipts.forEach(i => { html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount pos">+${fmt(i.amount)}</span></div>`; });
      html += `<div class="treasury-row" style="font-weight:bold"><span class="label">Итого поступлений</span><span class="amount pos">+${fmt(totalReceipts)}</span></div>`;
    } else {
      html += `<div class="treasury-row"><span class="label" style="font-style:italic">—</span><span class="amount pos">+0</span></div>`;
    }

    // Траты
    const spendings     = f.spendings || [];
    const totalSpendings = spendings.reduce((a, i) => a + i.amount, 0);
    html += `<div class="treasury-section">Траты</div>`;
    if (spendings.length) {
      spendings.forEach(i => { html += `<div class="treasury-row"><span class="label">${esc(i.label)}</span><span class="amount neg">−${fmt(i.amount)}</span></div>`; });
      html += `<div class="treasury-row" style="font-weight:bold"><span class="label">Итого трат</span><span class="amount neg">−${fmt(totalSpendings)}</span></div>`;
    } else {
      html += `<div class="treasury-row"><span class="label" style="font-style:italic">—</span><span class="amount neg">−0</span></div>`;
    }

    // Итог за сезон (крупно) = прибыль + поступления − траты
    const seasonTotal = profit + totalReceipts - totalSpendings;
    const stCls  = seasonTotal >= 0 ? "pos" : "neg";
    const stSign = seasonTotal >= 0 ? "+" : "";
    html += `<div class="treasury-total">
      <span class="label">Итог за сезон</span>
      <span class="amount ${stCls}">${stSign}${fmt(seasonTotal)} мон</span>
    </div>`;

    // Казна на конец (крупно)
    const endTreasury = (f.start || 0) + seasonTotal;
    const endCls  = endTreasury >= 0 ? "pos" : "neg";
    html += `<div class="treasury-total" style="border-top:2px solid var(--gold-dim);margin-top:6px;padding-top:8px">
      <span class="label" style="color:var(--text)">Казна на конец</span>
      <span class="amount ${endCls}" style="font-size:1.15rem">${fmt(endTreasury)} мон</span>
    </div>`;
  } else {
    const npBal = filtIncome - filtExpenses;
    const balColor = npBal >= 0 ? "pos" : "neg";
    const balSign  = npBal >= 0 ? "+" : "";
    html += `<div class="treasury-total">
      <span class="label">Баланс НП</span>
      <span class="amount ${balColor}">${balSign}${fmt(npBal)} мон</span>
    </div>`;
  }

  el.innerHTML = html;
}

// ── Buildings ─────────────────────────────────────────────────────────────────
function renderBuildings(b, settlements) {
  if (!b) { document.getElementById("body-buildings").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-buildings");

  const { base, extra, used, max_extra, free } = b.slots || {};
  const total = (base || 0) + (extra || 0);
  const pct   = total > 0 ? Math.round((used || 0) / total * 100) : 0;
  let html = `
    <div class="slots-bar-wrap">
      <div class="slots-info">
        <span>Слоты: ${used || 0}/${total}</span>
        <span>${free || 0} своб. · Доп. ${extra || 0}/${max_extra || 0}</span>
      </div>
      <div class="slots-bar"><div class="slots-bar-fill" style="width:${pct}%"></div></div>
    </div>`;

  const settBuildings = (settlements || []).filter(s => (s.buildings || []).length > 0);

  if (settBuildings.length > 0) {
    settBuildings.forEach(s => {
      html += `<div class="sett-section">${esc(s.name)}</div>`;
      s.buildings.forEach(bld => {
        const building = (bld.status || "").includes("🔨");
        const maint = bld.maint ? `${fmt(bld.maint)}${bld.rate ? " ("+bld.rate+"%)" : ""}` : bld.status === "доходная" ? "дох." : "—";
        const hands = bld.hands ? `<span class="building-hands">${bld.hands}р</span>` : "";
        const _m = (bld.status || "").match(/\((\d+)\/(\d+)\s*сл\)/);
        const _prog = _m ? ` ${_m[1]}/${_m[2]} сл` : "";
        const right = building
          ? `<span class="building-status" style="color:#c8883a">🔨 строится${_prog}</span>`
          : `<span class="building-maint">${esc(maint)}</span>`;
        html += `<div class="building-row">
          <span class="building-name">${esc(bld.name)}</span>
          ${hands}
          ${right}
        </div>`;
      });
    });
  } else {
    // Fallback: flat list
    (b.buildings || []).forEach(bld => {
      const building = (bld.status || "").includes("🔨");
      const maint = bld.maint ? `${fmt(bld.maint)}${bld.rate ? " ("+bld.rate+"%)" : ""}` : bld.status === "доходная" ? "дох." : "—";
      const hands = bld.hands ? `<span class="building-hands">${bld.hands}р</span>` : "";
      const _m = (bld.status || "").match(/\((\d+)\/(\d+)\s*сл\)/);
      const _prog = _m ? ` ${_m[1]}/${_m[2]} сл` : "";
      const right = building
        ? `<span class="building-status" style="color:#c8883a">🔨 строится${_prog}</span>`
        : `<span class="building-maint">${esc(maint)}</span>`;
      html += `<div class="building-row">
        <span class="building-name">${esc(bld.name)}</span>
        ${hands}
        ${right}
      </div>`;
    });
  }

  if (!html) html = `<div style="color:var(--muted);font-size:0.78rem;padding:6px 0">Построек нет</div>`;
  el.innerHTML = html;
}

// ── Events ────────────────────────────────────────────────────────────────────
function renderEvents(ev) {
  if (!ev) { document.getElementById("body-events").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-events");

  // Points
  const pts = ev.points || {};
  let html = `<div class="points-row">`;
  if (pts.player)     html += pointBlock("Игрок",    pts.player.left,    pts.player.total);
  if (pts.chancellor) html += pointBlock(pts.chancellor.name || "Канцлер", pts.chancellor.left, pts.chancellor.total);
  if (pts.captain)    html += pointBlock(pts.captain.name    || "Капитан", pts.captain.left,    pts.captain.total);
  if (pts.willpower)  html += pointBlock("⚡ Воля", pts.willpower.left, pts.willpower.total);
  html += `</div>`;

  const sections = [
    { key: "incidents",   label: "Происшествия" },
    { key: "visitors",    label: "Посетители" },
    { key: "po",          label: ev.po_title || "П&О" },
    { key: "assignments", label: "Предложения" },
    { key: "custom",      label: "Свои события" },
  ];

  sections.forEach(sec => {
    const items = ev[sec.key] || [];
    if (!items.length) return;
    html += `<div class="events-section-title">${esc(sec.label)} (${items.length})</div>`;
    items.forEach(item => {
      html += renderEventItem(item);
    });
  });

  el.innerHTML = html;
}

function pointBlock(who, left, total) {
  return `<div class="points-block">
    <div class="points-who">${esc(who)}</div>
    <div class="points-num">${left}</div>
    <div class="points-of">из ${total}</div>
  </div>`;
}

// ── Rolls: разбор броска очереди сезона ────────────────────────────────────────
function renderRolls(rolls) {
  const el = document.getElementById("body-rolls");
  if (!el) return;
  if (!rolls || !(rolls.groups || []).length) {
    el.innerHTML = "<div class='placeholder-body'>Броски появятся после старта сезона мастером.</div>";
    return;
  }
  let html = "<div class='rolls-note'>Из чего сложилась твоя очередь событий в этом сезоне — сверься, что ничего с прошлого сезона не потеряно.</div>";
  rolls.groups.forEach(g => {
    html += `<div class="rolls-group-title">${esc(g.title)}</div>`;
    (g.items || []).forEach(it => {
      html += `<div class="rolls-item">${esc(it)}</div>`;
    });
  });
  el.innerHTML = html;
}

function tagClass(t) {
  if (t === "#ждёт") return "wait";
  if (t.startsWith("#вред")) return "harm";
  if (t === "#возможность") return "chance";
  if (t === "#шум") return "noise";
  return "";
}

function renderEventItem(item) {
  const check = item.done ? "✅" : "◻️";
  return `<div class="event-item">
    <span class="event-check">${check}</span>
    <div class="event-text${item.done ? " done" : ""}">${esc(item.text)}</div>
  </div>`;
}

// ── Hearth ────────────────────────────────────────────────────────────────────
const HEARTH_ACTIONS = [
  ["Тренировка навыка", "1 очко (0.5 с оборудованием); первый раз навыком за фазу — +2 в банк"],
  ["Переосмысление", "1 очко — открыть новый уровень навыка"],
  ["Изучение рецепта / текста", "1 очко"],
  ["Крафт снаряжения / расходников", "1 очко (0.5 в оборудованной мастерской профиля)"],
  ["Закупка снаряжения", "1 очко (0.5 в своей оборудованной лавке)"],
  ["Отношения с NPC", "1 очко — наладить связь"],
  ["Админ-действие", "вместо тренировки = 1 очко разрешения лидера"],
];

function renderHearth(h) {
  const el = document.getElementById("body-hearth");
  if (!h || h.total == null) {
    el.innerHTML = `<div class="hearth-note">Фаза очага в этом сезоне ещё не начиналась — пул действий появится, когда мастер её откроет.</div>`

      <div class="hearth-stat"><div class="hearth-num ${remCls}">${remaining}</div><div class="hearth-lbl">осталось</div></div>
    </div>` + hearthHint();
}

// ── Сбыт трофеев ────────────────────────────────────────────────────────────
function renderLoot(l) {
  const card = document.getElementById("card-loot");
  if (!l) { card.style.display = "none"; return; }
  card.style.display = "";
  const eff = l.eff_pct != null ? l.eff_pct + "%" : "—";
  let note = `Полоса рынка: <b>${fmt(l.band)}</b> мон/ступень.`;

    note += ` Текущая ступень: <b>${l.cur_rate}%</b>`;

  if (l.stock) note += ` Остаток трофеев на продажу: <b>${fmt(l.stock)}</b> мон.`;
  document.getElementById("body-loot").innerHTML = `
    <div class="hearth-stats">
      <div class="hearth-stat"><div class="hearth-num">${fmt(l.sold)}</div><div class="hearth-lbl">продано, мон</div></div>
      <div class="hearth-stat"><div class="hearth-num pos">${fmt(l.revenue)}</div><div class="hearth-lbl">выручка, мон</div></div>
      <div class="hearth-stat"><div class="hearth-num">${eff}</div><div class="hearth-lbl">эфф. цена</div></div>
    </div>

}

function hearthHint() {
  const rows = HEARTH_ACTIONS.map(([a, c]) =>
    `<li><b>${esc(a)}</b> — <span class="hearth-cost">${esc(c)}</span></li>`).join("");
  return `<div class="hearth-hint-title">Что можно делать</div><ul class="hearth-hint">${rows}</ul>`;
}

// ── Hero ──────────────────────────────────────────────────────────────────────
function renderHero(hero) {
  if (!hero) { document.getElementById("body-hero").innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const el = document.getElementById("body-hero");
  let html = "";

  // Status
  const st = hero.status || {};
  if (Object.keys(st).length) {
    html += `<div class="hero-status-row">`;
    for (const [k, v] of Object.entries(st)) {
      html += `<span>${esc(k)}:</span> <b>${esc(v)}</b> &nbsp;`;
    }
    html += `</div>`;
  }

  // Покровительство
  if (hero.patronage) {
    html += `<div class="hero-section-title">Покровительство</div>`;
    html += `<div class="hero-item">${mdBold(hero.patronage)}</div>`;
  }

  // Skills
  if ((hero.skills || []).length) {
    html += `<div class="hero-section-title">Навыки</div>`;
    hero.skills.forEach(s => {
      const bankHtml = s.bank !== null && s.bank !== undefined ? `<span class="skill-bank">банк: ${s.bank}</span>` : "";
      const upsHtml = (s.ups !== null && s.ups !== undefined)
        ? `<span class="skill-ups">апов: ${s.ups}</span>` : "";
      const thrHtml = (s.next_threshold != null)
        ? `<span class="skill-thr">след. порог: ${s.next_threshold}${(s.bank != null && s.bank >= s.next_threshold) ? " ✓" : ""}</span>` : "";
      const techHtml = (s.techniques || []).map(t => {
        const name = (typeof t === "string") ? t : t.name;
        const kind = (typeof t === "string") ? "приём" : (t.kind || "приём");
        const cls  = kind === "техника" ? "skill-passive" : "skill-tech";
        return `<span class="${cls}">${esc(kind)}: ${esc(name)}</span>`;
      }).join("");
      html += `<div class="skill-row">
        <div class="skill-name">${mdBold(s.name)}</div>
        <div class="skill-meta">${bankHtml}${upsHtml}${thrHtml}${techHtml}</div>
      </div>`;
    });
  }

  // Features
  if ((hero.features || []).length) {
    html += `<div class="hero-section-title">Особенности</div>`;
    hero.features.forEach(f => { html += `<div class="hero-item">${mdBold(f)}</div>`; });
  }

  // Свита показывается в отдельной карточке «Свита» (renderRetinue) — здесь не дублируем.

  // Items (collapsed by default — show count + expand)
  if ((hero.items || []).length) {
    const count = hero.items.length;
    html += `<div class="hero-section-title">Предметы (${count})</div>`;
    html += `<div id="hero-items" style="display:none">`;
    hero.items.forEach(i => { html += `<div class="hero-item">${esc(i)}</div>`; });
    html += `</div>`;
    html += `<button class="btn-expand" onclick="this.previousElementSibling.style.display=this.previousElementSibling.style.display==='none'?'block':'none';this.textContent=this.textContent.includes('▼')?'Скрыть ▲':'Показать ▼'">Показать ▼</button>`;
  }

  el.innerHTML = html || "<div class='placeholder-body'>Нет данных</div>";
}

// ── Retinue ───────────────────────────────────────────────────────────────────
function renderRetinue(hero) {
  const el = document.getElementById("body-retinue");
  if (!hero) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }

  const list  = hero.retinue || [];

  let html = "";
  if (slots) {
    const pct = slots.total > 0 ? Math.round(slots.used / slots.total * 100) : 0;
    html += `<div class="slots-bar-wrap">
      <div class="slots-info">
        <span>Слоты: ${slots.used}/${slots.total}</span>
        <span>${slots.total - slots.used} свободных</span>
      </div>
      <div class="slots-bar"><div class="slots-bar-fill" style="width:${pct}%"></div></div>

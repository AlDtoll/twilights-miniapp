}

// ── Staff ─────────────────────────────────────────────────────────────────────
function renderStaff(settlements) {
  const el = document.getElementById("body-staff");
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }

  const numOf = v => { const n = parseInt(String(v).replace(/[^\d-]/g, ""), 10); return isNaN(n) ? null : n; };
  const isGuard  = c => /страж/i.test(c);
  const isClerk  = c => /клерк/i.test(c);
  const isLabor  = c => /рабоч/i.test(c);

  let html = "";
  let anyShortGuard = false, anyShortClerk = false, anyOverLabor = false;
  settlements.forEach(sett => {
    const rows = sett.staff || [];
    if (!rows.length) return;
    html += `<div class="sett-section">${esc(sett.name)}</div>`;
    html += `<table class="staff-table"><thead><tr>
      <th>Категория</th><th>Факт</th><th>Норма</th><th>Статус</th>
    </tr></thead><tbody>`;
    rows.forEach(r => {
      // Статус и последствия ВЫЧИСЛЯЮТСЯ из недобора (факт vs норма), а не из текста в settlements.md.
      const fact = numOf(r.fact), norm = numOf(r.norm);
      let effHint = "";
      if (fact != null && norm != null) {
        if (isGuard(r.category) && fact < norm) {
          effHint = "−1 к лояльности · +1d2 к преступлениям и опасностям";
          anyShortGuard = true;
        } else if (isClerk(r.category) && fact < norm) {
          effHint = "−1 к лояльности · +1d2 к происшествиям";
          anyShortClerk = true;
        } else if (isLabor(r.category) && fact > norm) {
          effHint = "−1 к лояльности · +1 к происшествиям (перегруз)";
          anyOverLabor = true;
        }
      }
      const filled = norm != null && norm > 0 && fact != null && fact >= norm
                     && (isGuard(r.category) || isClerk(r.category));
      const stClass = effHint ? "staff-status-warn" : "staff-status-ok";
      const stCell = effHint
        ? `<span class="staff-eff-hint">⚠️ ${effHint}</span>`
        : (filled ? "✅" : "—");
      html += `<tr>
        <td class="staff-cat">${esc(r.category)}</td>
        <td class="staff-num">${esc(r.fact)}</td>
        <td class="staff-num">${r.norm ? esc(r.norm) : "—"}</td>
        <td class="${stClass}">${stCell}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });

  if (anyShortGuard || anyShortClerk || anyOverLabor) {
    const parts = [];
    if (anyShortGuard) parts.push("<b>нехватка стражи</b> → −1 лояльность и <b>+1d2 к П&amp;О</b> (преступления и опасности)");
    if (anyShortClerk) parts.push("<b>нехватка клерков</b> → −1 лояльность и <b>+1d2 к происшествиям</b>");
    if (anyOverLabor)  parts.push("<b>перегруз рабочих рук</b> → −1 лояльность и <b>+1 к происшествиям</b>");
    html += `<div class="staff-sub-note">⚠️ Последствия в начале следующего сезона:<br>• ${parts.join("<br>• ")}<br>Каждый недобор не только бьёт по лояльности, но и <b>плодит доп. события</b> в очереди лидера. Нанимайте персонал, чтобы закрыть норму.</div>`;
  }

  el.innerHTML = html || "<div class='placeholder-body'>Нет данных</div>";
}

// ── Territory ─────────────────────────────────────────────────────────────────
function supportersHtml(supporters, opponents, houses) {
  const sup = supporters || {}, opp = opponents || {};
  const sEntries = Object.entries(sup).filter(([_, v]) => v > 0);
  const oEntries = Object.entries(opp).filter(([_, v]) => v > 0);
  if (!sEntries.length && !oEntries.length) return "";
  let out = "";
  if (sEntries.length) {
    const items = sEntries.map(([name, n]) =>
      `<span class="ly-supp"><b>${esc(name)}</b> ${n}</span>`).join(" · ");
    out += `<div class="ly-supporters" title="Дворы за игрока — уже вне пула Л/Н/НЛ">Сторонники: ${items}</div>`;
  }
  if (oEntries.length) {
    const items = oEntries.map(([name, n]) =>
      `<span class="ly-opp"><b>${esc(name)}</b> ${n}</span>`).join(" · ");
    out += `<div class="ly-supporters" title="Дворы против игрока — вне пула Л/Н/НЛ">Противники: ${items}</div>`;
  }
  // Нетто по каждому игроку: (сторонники − противники); порог присяги 40% Домов от РАЗНИЦЫ.
  const names = new Set([...Object.keys(sup), ...Object.keys(opp)]);
  const thr = houses ? Math.round(houses * 0.4) : null;
  const nets = [...names].map(name => {
    const net = (sup[name] || 0) - (opp[name] || 0);
    const hit = thr != null && net >= thr ? " ✔" : "";
    const cls = net > 0 ? "pos" : net < 0 ? "neg" : "";
    return `<span class="ly-net ${cls}"><b>${esc(name)}</b> ${net >= 0 ? "+" : ""}${net}${hit}</span>`;
  }).join(" · ");
  if (nets) {
    const thrTxt = thr != null ? ` порог присяги: ${thr} (40% Домов)` : "";
    out += `<div class="ly-supporters" title="Нетто = сторонники − противники;${thrTxt}">Нетто: ${nets}</div>`;
  }
  return out;
}

function loyaltyBar(ly) {
  if (!ly) return "";
  const l = ly["Л"] || 0, n = ly["Н"] || 0, nl = ly["НЛ"] || 0;
  const total = l + n + nl;
  if (!total) return "";
  const lp = Math.round(l / total * 100);
  const np = Math.round(n / total * 100);
  const nlp = 100 - lp - np;
  const crisis = nlp >= 40 ? ' style="outline:1px solid var(--red)"' : "";
  return `<div class="loyalty-wrap"${crisis}>` +
    `<div class="loyalty-bar">` +
    `<div class="lb-l" style="width:${lp}%" title="Лояльные ${l}"></div>` +
    `<div class="lb-n" style="width:${np}%" title="Нейтральные ${n}"></div>` +
    `<div class="lb-nl" style="width:${nlp}%" title="Нелояльные ${nl}"></div>` +
    `</div>` +
    `<div class="loyalty-nums"><span class="ly-l">${l}</span> <span class="ly-n">${n}</span> <span class="ly-nl">${nl}</span></div>` +
    `</div>`;
}

function renderTerritory(settlements) {
  const el = document.getElementById("body-territory");
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }

  const hasLoyalty = settlements.some(s => s.loyalty);
  let html = `<table class="sett-table"><thead><tr>
    <th>НП</th><th>Население</th><th>Рост</th><th style="text-align:right">Домов</th>
    ${hasLoyalty ? "<th>Лояльность</th>" : ""}
  </tr></thead><tbody>`;
  settlements.forEach(s => {
    html += `<tr>
      <td class="sett-name">${esc(s.name)}</td>
      <td>${esc(s.population || "—")}</td>
      <td style="color:var(--green)">${esc(s.growth || "—")}</td>
      <td style="text-align:right;color:var(--muted)">${esc(s.houses || "—")}</td>
      ${hasLoyalty ? `<td>${loyaltyBar(s.loyalty)}</td>` : ""}
    </tr>`;
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
}

// ── Боевая мощь (отдельный блок) ────────────────────────────────────────────
// Форматирование числа: целое без «.0», дробное с 1 знаком.
function fmtNum(x) { return Number.isInteger(x) ? x : x.toFixed(1); }

function renderMight(settlements) {
  const el = document.getElementById("body-might");
  const list = (settlements || []).filter(s => s.might);
  if (!list.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  let html = "";
  list.forEach(s => {
    const m = s.might;
    const cls = m.total > 0 ? "pos" : m.total < 0 ? "neg" : "zero";
    const sgn = v => (v >= 0 ? "+" : "") + v;
    const pct = v => (v >= 0 ? "+" : "") + v + "%";

    // Строка базы бойцов
    let baseLine;
    const units = m.units || [];
    if (units.length) {
      const breakdown = units.map(u => `${esc(u.cls)} ${u.count}×${fmtNum(u.str)}`).join(", ");
      baseLine = `<span class="might-part"><b>${fmtNum(m.fighters_sum)}</b> бойц. (сила) <span class="might-part-src">${breakdown}</span></span>`;
    } else {
      baseLine = `<span class="might-part"><b>${fmtNum(m.fighters_sum)}</b> бойц. (сила) <span class="might-part-src">${esc(m.fighters_src)} × 1.0</span></span>`;
    }

    const parts = [baseLine];
    // Компоненты множителя
    parts.push(`<span class="might-part">Лояльность: <b>${pct(m.loyalty_pct)}</b></span>`);
    parts.push(`<span class="might-part">База обороны: <b>+${m.defense_pct}%</b></span>`);
    if (m.cult_war_pct > 0) {
      parts.push(`<span class="might-part">Культ войны: <b>+${m.cult_war_pct}%</b></span>`);
    }
    const tl = m.tag_list || [];
    if (tl.length) {
      const tagStr = tl.map(t => {
        const sign = t.value >= 0 ? "+" : "";
        const reason = t.reason ? ` (${esc(t.reason)})` : "";
        return `${sign}${t.value}${reason}`;
      }).join(", ");
      parts.push(`<span class="might-part">Теги: <b>${pct(m.tags_pct)}</b> <span class="might-part-src">${tagStr}</span></span>`);
    }
    // Итог: fighters_sum × mult = total
    parts.push(`<span class="might-part">= ${fmtNum(m.fighters_sum)} × ${fmtNum(m.mult)} = <b>${m.total}</b></span>`);

    html += `<div class="might-row">
      <div class="might-head">
        <span class="might-np">${esc(s.name)}</span>
        <span class="might-badge ${cls}">⚔️ Оборона: ${m.total}</span>
      </div>
      <div class="might-breakdown">${parts.join('<span class="might-sep">·</span>')}</div>
    </div>`;
  });
  html += `<div class="staff-sub-note">⚔️ <b>Боевая мощь (оборона)</b> — сколько НП выстоит при нападении. Мультипликативная: <b>fighters_sum × (1 + Σ%)</b>. Σ% = лояльность×10% + база обороны +10% + культ войны +10% (если Культ войны топ ≥50% дворов) + теги <b>#боевая_мощь</b>/<b>#боевая_немощь</b> ×10%. <b>При АТАКЕ</b> лояльность и база обороны НЕ считаются (войско формируется отдельно от стражи): наступ. мощь = бойцы × (1 + культ войны% + теги%). Опциональный блок <b>### Гарнизон</b> — разные классы с разной силой.</div>`;
  el.innerHTML = html;
}

// Подпись изменения по дворам. delta: {ключ: ±N}.
//   label     — текст перед значениями.
//   showEmpty  — если true и ненулевых изменений нет, пишем «изменений нет»
//                (для сезонного ролла: ролл был, но без сдвигов — строка не должна
//                пропадать). Если false — при пустом/undefined ничего не рисуем
//                (для движений от действий игрока: нет действий → нет строки).
function rollDeltaCaption(delta, label = "за ролл сезона (двор.):", showEmpty = true) {
  if (!delta) return "";
  const parts = Object.entries(delta)
    .filter(([, v]) => v !== 0)
    .map(([k, v]) => {
      const pos = v > 0;
      const cls = pos ? "rd-pos" : "rd-neg";
      const arr = pos ? "▲" : "▼";
      const sign = pos ? `+${v}` : String(v);
      return `<span class="${cls}">${esc(k)} ${sign} ${arr}</span>`;
    });
  if (!parts.length && !showEmpty) return "";
  const body = parts.length
    ? parts.join(" · ")
    : `<span class="rd-none">изменений нет</span>`;
  return `<div class="roll-delta"><span class="rd-label">${esc(label)}</span> ${body}</div>`;
}

// ── Loyalty ───────────────────────────────────────────────────────────────────
function renderLoyalty(settlements) {
  const el = document.getElementById("body-loyalty");
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const withLoyalty = settlements.filter(s => s.loyalty && s.loyalty["Л"] != null);
  if (!withLoyalty.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных о лояльности</div>"; return; }

  let html = "";
  withLoyalty.forEach(s => {
    const ly = s.loyalty;
    const l = ly["Л"] || 0, n = ly["Н"] || 0, nl = ly["НЛ"] || 0;
    const total = l + n + nl;
    const lp  = total ? Math.round(l  / total * 100) : 0;
    const np  = total ? Math.round(n  / total * 100) : 0;
    const nlp = 100 - lp - np;
    const mod = ly.mod || 0;
    const modCls = mod > 0 ? "pos" : mod < 0 ? "neg" : "zero";
    const modStr = mod > 0 ? `+${mod}` : String(mod);
    const crisis = nlp >= 40 ? ' style="outline:1px solid var(--red);border-radius:4px"' : "";

    const reasons = ly.reasons || [];
    const reasonsHtml = reasons.map(r => {
      const cls = r.startsWith("+") ? "pos" : (r.startsWith("−") || r.startsWith("-")) ? "neg" : "";
      return `<li class="${cls}">${esc(r)}</li>`;
    }).join("");

    let conseq = "";
    if (nlp > 50) {
      const prob = (nlp - 50) * 5;
      conseq = `<div class="ly-conseq crit">🔥 НЛ &gt; 50% → риск <b>#бунт</b> ≈ ${prob}% (=(НЛ%−50)×5%). Плюс слот события <b>#нелояльность</b>.</div>`;
    } else if (nlp >= 25) {
      conseq = `<div class="ly-conseq warn">⚠️ НЛ ≥ 25% → в следующем сезоне <b>+1 слот события #нелояльность</b>.</div>`;
    }

    html += `<div class="ly-card">
      <div class="ly-card-header">
        <span class="ly-card-name">${esc(s.name)}</span>
        <span class="ly-card-mod ${modCls}">мод ${modStr}</span>
      </div>
      <div class="ly-bar-full"${crisis}>
        <div class="lb-l" style="width:${lp}%" title="Лояльные ${l}"></div>
        <div class="lb-n" style="width:${np}%" title="Нейтральные ${n}"></div>
        <div class="lb-nl" style="width:${nlp}%" title="Нелояльные ${nl}"></div>
      </div>
      <div class="ly-nums-full">
        <span class="ly-l">Л ${l} (${lp}%)</span>
        <span class="ly-n">Н ${n} (${np}%)</span>
        <span class="ly-nl">НЛ ${nl} (${nlp}%)</span>
      </div>
      ${rollDeltaCaption(ly.delta)}
      ${rollDeltaCaption(ly.action_delta, "за твои действия (двор.):", false)}
      ${supportersHtml(ly.supporters, ly.opponents, s.houses)}
      ${reasonsHtml ? `<ul class="ly-reasons">${reasonsHtml}</ul>` : ""}
      ${conseq}
    </div>`;
  });

  html += `<div class="ly-legend">Пороги: <b>НЛ ≥ 25%</b> → +1 слот события #нелояльность в следующем сезоне · <b>НЛ &gt; 50%</b> → риск #бунт = (НЛ%−50)×5%. Мод лояльности за сезон складывается из строк-причин (нехватка стражи/клерков, перегруз рабочих рук — по −1 каждая).</div>`;

  el.innerHTML = html;
}

// ── Religion / Вера ─────────────────────────────────────────────────────────
// Детерминированный цвет культа по ИМЕНИ: одинаковый в дашборде и на карте.
// FAITH_KNOWN/FAITH_PALETTE продублированы в map.html — держать синхронными.
const FAITH_PALETTE = ['#c8a84a', '#6a8ab0', '#a06ab0', '#4a8a5a', '#b07a4a', '#5ab0a8',
  '#b0526a', '#7a8a3a', '#8a6ac0', '#c07a9a', '#4a7ac0', '#9a9a4a', '#c05a4a', '#5a9ac0'];
const FAITH_KNOWN = ['Мизеракль', 'Кипона', 'Тенета', 'Лето', 'Айдан «Кот»', 'Омнус', 'Бурий',
  'Природный культ (друидизм)', 'Тёмный культ', 'Светлый культ', 'Культ войны', 'Культ разума', 'Местный культ'];
function faithColor(name) {
  const i = FAITH_KNOWN.indexOf(name);
  if (i >= 0) return FAITH_PALETTE[i % FAITH_PALETTE.length];
  let h = 0; for (let k = 0; k < name.length; k++) h = (h * 31 + name.charCodeAt(k)) >>> 0;
  return FAITH_PALETTE[h % FAITH_PALETTE.length];
}

function faithBar(f) {
  if (!f || !f.cults || !f.cults.length) return "";
  let segs = f.cults.map((c, i) =>
    `<div style="width:${c.pct}%;background:${faithColor(c.name, i)}" title="${esc(c.name)} ${c.count} (${c.pct}%)"></div>`
  ).join("");
  if (f.neutral_pct > 0) segs += `<div style="width:${f.neutral_pct}%;background:var(--border)" title="Нейтральные ${f.neutral} (${f.neutral_pct}%)"></div>`;
  return `<div class="faith-bar-full">${segs}</div>`;
}

// Общая структура веры по всем НП + пометка культов >15% (генерируют события).
function faithOverview(rel) {
  if (!rel || !rel.cults || !rel.cults.length) return "";
  const thr = rel.threshold_pct != null ? rel.threshold_pct : 15;
  const segs = rel.cults.map((c, i) =>
    `<div style="width:${c.pct}%;background:${faithColor(c.name, i)}" title="${esc(c.name)} ${c.count} (${c.pct}%)"></div>`
  ).join("") + (rel.neutral_pct > 0
    ? `<div style="width:${rel.neutral_pct}%;background:var(--border)" title="Нейтральные ${rel.neutral} (${rel.neutral_pct}%)"></div>`
    : "");
  const rows = rel.cults.map((c, i) =>
    `<div class="fo-row">
       <span class="fo-dot" style="background:${faithColor(c.name, i)}"></span>
       <span class="fo-name">${esc(c.name)}${c.events ? ` <span class="faith-event-badge" title="Доля &gt;${thr}% — раз в сезон добавляется слот события этого культа">⚡ событие</span>` : ""}</span>
       <span class="fo-pct">${c.count} · ${c.pct}%</span>
     </div>`
  ).join("") + (rel.neutral > 0
    ? `<div class="fo-row">
         <span class="fo-dot" style="background:var(--border)"></span>
         <span class="fo-name fl-neutral">нейтральные</span>
         <span class="fo-pct">${rel.neutral} · ${rel.neutral_pct}%</span>
       </div>`
    : "");
  const anyEvent = rel.cults.some(c => c.events);
  return `<div class="faith-overview">
    <div class="fo-head">
      <span class="fo-title">Общая структура веры</span>
      <span class="fo-sub">по всем НП игрока · ${rel.total_houses} домов</span>
    </div>
    <div class="faith-bar-full">${segs}</div>
    <div class="fo-rows">${rows}</div>
    <div class="faith-sub-note">${anyEvent
      ? `⚡ — культ занимает &gt;${thr}% всех домов игрока (по всем подконтрольным НП): раз в сезон добавляет отдельный слот события этого культа.`
      : `Ни один культ не превысил ${thr}% всех домов игрока (по всем подконтрольным НП) — событий культов в этом сезоне нет.`}</div>
  </div>`;
}

// Модификаторы РЕЛИГИИ по культам (к броску веры) — отличны от вклада веры в лояльность.
function faithRelMods(f) {
  if (!f || !f.cults) return "";
  const rows = f.cults.filter(c => (c.rel_mod || 0) !== 0).map(c => {
    const rm = c.rel_mod || 0;
    const cls = rm > 0 ? "pos" : "neg";
    const sign = rm > 0 ? `+${rm}` : String(rm);
    const rs = (c.rel_reasons || []).map(r => {
      const rcls = r.startsWith("+") ? "pos" : (r.startsWith("−") || r.startsWith("-")) ? "neg" : "";
      return `<li class="${rcls}">${esc(r)}</li>`;
    }).join("");
    return `<li><span class="${cls}">${esc(c.name)}: религ. ${sign}</span>${rs ? `<ul class="ly-reasons" style="margin:2px 0 4px 12px">${rs}</ul>` : ""}</li>`;
  }).join("");
  if (!rows) return "";
  return `<div style="margin-top:4px"><div style="color:var(--muted);font-size:0.68rem;margin-bottom:2px">Модификаторы религии (к броску веры)</div><ul class="ly-reasons">${rows}</ul></div>`;
}

function renderFaith(settlements, religion) {
  const el = document.getElementById("body-faith");
  if (!el) return;
  if (!settlements || !settlements.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }
  const withFaith = settlements.filter(s => s.faith && s.faith.cults && s.faith.cults.length);
  const overview = faithOverview(religion);
  if (!withFaith.length) {
    el.innerHTML = overview || "<div class='placeholder-body'>Вера не расписана</div>";
    return;
  }

  let html = overview;
  withFaith.forEach(s => {
    const f = s.faith;
    const mod = f.mod || 0;
    const modCls = mod > 0 ? "pos" : mod < 0 ? "neg" : "zero";
    const modStr = mod > 0 ? `+${mod}` : String(mod);
    const legend = f.cults.map((c, i) =>
      `<span class="fl-item"><span class="fl-dot" style="background:${faithColor(c.name, i)}"></span>${esc(c.name)} ${c.count} (${c.pct}%)</span>`
    ).join("") + (f.neutral > 0
      ? `<span class="fl-item fl-neutral"><span class="fl-dot" style="background:var(--border)"></span>нейтральные ${f.neutral} (${f.neutral_pct}%)</span>`
      : "");
    const reasons = (f.reasons || []).map(r => {
      const cls = r.startsWith("+") ? "pos" : (r.startsWith("−") || r.startsWith("-")) ? "neg" : "";
      return `<li class="${cls}">${esc(r)}</li>`;
    }).join("");

    html += `<div class="faith-card">
      <div class="ly-card-header">
        <span class="ly-card-name">${esc(s.name)}</span>
        <span class="ly-card-mod ${modCls}">лоял. ${modStr}</span>
      </div>
      ${faithBar(f)}
      <div class="faith-legend">${legend}</div>
      ${rollDeltaCaption(f.delta)}
      ${reasons ? `<ul class="ly-reasons">${reasons}</ul>` : ""}
      ${faithRelMods(f)}
    </div>`;
  });
  el.innerHTML = html;
}

// ── Threat (Уровень угрозы) ───────────────────────────────────────────────────
function renderThreat(threat) {
  const el = document.getElementById("body-threat");
  if (!el) return;
  if (!threat || threat.total == null) {
    el.innerHTML = "<div class='placeholder-body'>Данные об угрозе недоступны</div>";
    return;
  }
  const total = threat.total;
  const f = threat.factors || {};
  const barPct = Math.min(100, total);
  const lvl = total < 20 ? "low" : total < 50 ? "mid" : "high";
  const rows = [];
  if ((f.base || 0) !== 0) rows.push({ label: "База (стабильная угроза)", val: f.base });
  const neighbors = f.neighbors || [];
  const perimCount = neighbors.length;
  const perimLabel = perimCount
    ? `Периметр (${perimCount} сос.: ${neighbors.slice(0, 3).map(n => esc(n)).join(", ")}${perimCount > 3 ? "…" : ""})`
    : "Периметр";
  if ((f.perimeter || 0) !== 0) rows.push({ label: perimLabel, val: f.perimeter });
  if ((f.razed || 0) !== 0) rows.push({ label: "Разорённые НП (регион)", val: f.razed });
  if ((f.danger || 0) !== 0) rows.push({ label: `Опасные места (${f.danger} × 2)`, val: f.danger * 2 });
  if ((f.year || 0) !== 0) rows.push({ label: "Год кампании", val: f.year });
  if ((f.hero_exit || 0) !== 0) rows.push({ label: "Герой за пределами владений", val: f.hero_exit });
  (f.manual_mods || []).filter(m => !m.hidden).forEach(m => {
    const turns = m.turns > 0 ? ` (ещё ${m.turns} сез.)` : "";
    rows.push({ label: esc(m.reason || "Ручной мод") + turns, val: m.val });
  });
  const rowsHtml = rows.map(r => {
    const sign = r.val >= 0 ? `+${r.val}` : String(r.val);
    return `<li><span>${r.label}</span><span class="tf-val">${sign}%</span></li>`;
  }).join("");
  el.innerHTML = `
    <div class="threat-total ${lvl}">${total}%</div>
    <div class="threat-bar-wrap"><div class="threat-bar-fill ${lvl}" style="width:${barPct}%"></div></div>
    ${rowsHtml ? `<ul class="threat-factors">${rowsHtml}</ul>` : ""}
    <div class="threat-note">⚠ <b>Уровень угрозы</b> — вероятность нападения на ваши владения в этом сезоне.</div>
  `;
}

// ── Settlements (per-НП) ──────────────────────────────────────────────────────
function toggleNP(id) {
  document.getElementById(id).classList.toggle("collapsed");
}

function renderSettlements(setts) {
  const el = document.getElementById("body-settlements");
  if (!setts || !setts.length) { el.innerHTML = "<div class='placeholder-body'>Нет данных</div>"; return; }

  let html = "";
  setts.forEach((s, idx) => {
    const ly = s.loyalty || {};
    const l = ly["Л"] || 0, n = ly["Н"] || 0, nl = ly["НЛ"] || 0;
    const total = l + n + nl;
    const lp  = total ? Math.round(l  / total * 100) : 0;
    const np  = total ? Math.round(n  / total * 100) : 0;
    const nlp = 100 - lp - np;
    const nlPct = total ? Math.round(nl / total * 100) : 0;
    const effBd = s.eff_breakdown || null;
    const eff = effBd ? effBd.total : (90 - Math.floor(nlPct / 10) * 2);

    const income   = s.income      || [];
    const expenses = s.expenses_np || [];
    const totalInc = income.reduce((a, i) => a + i.amount, 0);
    const totalExp = expenses.reduce((a, i) => a + i.amount, 0);
    const bal      = totalInc - totalExp;
    const balCls   = bal >= 0 ? "np-amt-pos" : "np-amt-neg";
    const balSign  = bal >= 0 ? "+" : "";

    // Type badge
    const typ = ly["Тип"] || "";
    let typBadge = "";
    if (typ === "стартовая")       typBadge = `<span class="np-type-badge">${esc(typ)}</span>`;
    else if (typ === "присоединённая") typBadge = `<span class="np-type-badge joined">${esc(typ)}</span>`;
    else if (typ === "аннексия")   typBadge = `<span class="np-type-badge annex">${esc(typ)}</span>`;

    // Mini loyalty bar in header
    const crisis = nlPct >= 40 ? ' style="outline:1px solid var(--red)"' : "";
    const miniBar = total ? `<div class="loyalty-bar" style="height:5px;width:80px;flex-shrink:0"${crisis}>
      <div class="lb-l" style="width:${lp}%"></div>
      <div class="lb-n" style="width:${np}%"></div>
      <div class="lb-nl" style="width:${nlp}%"></div>
    </div>` : "";

    const mod    = ly.mod || 0;
    const modStr = mod > 0 ? `+${mod}` : String(mod);
    const modCls = mod > 0 ? "pos" : mod < 0 ? "neg" : "zero";

    const buildings = s.buildings || [];
    const staff     = s.staff     || [];
    const stash     = s.stash     || [];

    // Start block — first НП expanded, rest collapsed
    html += `<div class="np-block${idx > 0 ? " collapsed" : ""}" id="np-block-${idx}">
      <div class="np-block-header" onclick="toggleNP('np-block-${idx}')">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span class="np-block-name">${esc(s.name)}</span>
            ${typBadge}
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
            <span class="np-block-pop">${esc(s.population || "?")} · ${esc(s.growth || "")}</span>
            ${miniBar}
          </div>
          ${s.med_growth ? `<div class="np-med-growth">🏥 +${s.med_growth.bonus}% к росту — ${esc((s.med_growth.sources || []).join(", "))}</div>` : ""}
        </div>
        <span class="np-block-bal ${balCls}">${balSign}${fmt(bal)}</span>
        <em class="np-chevron">▼</em>
      </div>
      <div class="np-block-body">`;

    // Loyalty
    if (total) {
      const reasons = ly.reasons || [];
      html += `<div class="np-sec">Лояльность</div>
        <div class="ly-bar-full" style="margin-bottom:5px">
          <div class="lb-l" style="width:${lp}%"></div>
          <div class="lb-n" style="width:${np}%"></div>
          <div class="lb-nl" style="width:${nlp}%"></div>
        </div>
        <div style="display:flex;gap:12px;font-size:0.72rem;margin-bottom:5px">
          <span class="ly-l">Л ${l} (${lp}%)</span>
          <span class="ly-n">Н ${n} (${np}%)</span>
          <span class="ly-nl">НЛ ${nl} (${nlp}%)</span>
          <span style="color:var(--muted);margin-left:auto">${effBd && (effBd.loyalty_penalty > 0 || (effBd.loyalty_bonus || 0) > 0)
            ? `эфф. <b style="color:var(--text)">${effBd.total}%</b> = ${effBd.base}%${effBd.loyalty_penalty > 0 ? ` − ${effBd.loyalty_penalty}% нел.` : ''}${(effBd.loyalty_bonus || 0) > 0 ? ` + ${effBd.loyalty_bonus}% лоял.` : ''}`
            : `эфф. ${eff}%`} · мод <span class="ly-card-mod ${modCls}">${modStr}</span></span>
        </div>
        ${reasons.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px">${
          reasons.map(r => {
            const cls = r.startsWith("+") ? "ly-l" : (r.startsWith("−") || r.startsWith("-")) ? "ly-nl" : "";
            return `<span style="font-size:0.68rem" class="${cls}">${esc(r)}</span>`;
          }).join("")
        }</div>` : ""}`;
    }

    // Боевая мощь — мультипликативная модель (fighters_sum × mult)
    const mgt = s.might;
    if (mgt) {
      const mcls = mgt.total > 0 ? "pos" : mgt.total < 0 ? "neg" : "zero";
      const pct = v => (v >= 0 ? "+" : "") + v + "%";
      const munits = mgt.units || [];
      let mbaseLine;
      if (munits.length) {
        const mbd = munits.map(u => `${esc(u.cls)} ${u.count}×${fmtNum(u.str)}`).join(", ");
        mbaseLine = `<span class="might-part"><b>${fmtNum(mgt.fighters_sum)}</b> бойц. <span class="might-part-src">${mbd}</span></span>`;
      } else {
        mbaseLine = `<span class="might-part"><b>${fmtNum(mgt.fighters_sum)}</b> бойц. <span class="might-part-src">${esc(mgt.fighters_src)} × 1.0</span></span>`;
      }
      const mparts = [mbaseLine];
      mparts.push(`<span class="might-part">Лоял.: <b>${pct(mgt.loyalty_pct)}</b></span>`);
      mparts.push(`<span class="might-part">Оборона: <b>+${mgt.defense_pct}%</b></span>`);
      if (mgt.cult_war_pct > 0) mparts.push(`<span class="might-part">Культ войны: <b>+${mgt.cult_war_pct}%</b></span>`);
      const mtl = mgt.tag_list || [];
      if (mtl.length) mparts.push(`<span class="might-part">Теги: <b>${pct(mgt.tags_pct)}</b></span>`);
      mparts.push(`<span class="might-part">= ${fmtNum(mgt.fighters_sum)} × ${fmtNum(mgt.mult)} = <b>${mgt.total}</b></span>`);
      html += `<div class="np-sec" style="display:flex;align-items:center">⚔️ Боевая мощь (оборона): ${mgt.total} <span class="might-badge ${mcls}" style="margin-left:auto">⚔️ ${mgt.total}</span></div>
        <div class="might-breakdown" style="margin-bottom:4px">${mparts.join('<span class="might-sep">·</span>')}</div>`;
    }

    // Вера
    const fth = s.faith;
    if (fth && fth.cults && fth.cults.length) {
      const fmod = fth.mod || 0;
      const fmodStr = fmod > 0 ? `+${fmod}` : String(fmod);
      const fmodCls = fmod > 0 ? "pos" : fmod < 0 ? "neg" : "zero";
      const flegend = fth.cults.map((c, i) =>
        `<span class="fl-item"><span class="fl-dot" style="background:${faithColor(c.name, i)}"></span>${esc(c.name)} ${c.pct}%</span>`
      ).join("") + (fth.neutral > 0
        ? `<span class="fl-item fl-neutral"><span class="fl-dot" style="background:var(--border)"></span>нейтр. ${fth.neutral_pct}%</span>`
        : "");
      const freasons = (fth.reasons || []).map(r => {
        const cls = r.startsWith("+") ? "pos" : (r.startsWith("−") || r.startsWith("-")) ? "neg" : "";
        return `<li class="${cls}">${esc(r)}</li>`;
      }).join("");
      html += `<div class="np-sec" style="display:flex;align-items:center">Вера <span style="color:var(--muted);font-weight:normal;margin-left:auto">лоял. <span class="ly-card-mod ${fmodCls}">${fmodStr}</span></span></div>
        ${faithBar(fth)}
        <div class="faith-legend" style="margin-bottom:4px">${flegend}</div>
        ${freasons ? `<ul class="ly-reasons">${freasons}</ul>` : ""}
        ${faithRelMods(fth)}`;
    }

    // Промыслы (что есть в НП — NPC-предприятия; Т-предприятия идут в требования тиров)
    const promysly = s.promysly || [];
    if (promysly.length) {
      html += `<div class="np-sec">Промыслы</div>`;
      promysly.forEach(p => {
        const td = (p.tier && /\d/.test(p.tier)) ? p.tier.match(/\d/)[0] : null;
        const tierBadge = td ? `<span class="np-type-badge">Т${td}</span>` : "";
        const chain = (p.chain && p.chain !== "—") ? `<span style="color:var(--muted);font-size:0.68rem"> ${esc(p.chain)}</span>` : "";
        html += `<div class="np-row"><span class="np-lbl">${esc(p.name)} ${tierBadge}${chain}</span><span style="color:var(--muted);font-size:0.68rem">${esc(p.owner || "")}</span></div>`;
      });
    }

    // Income
    if (income.length) {
      html += `<div class="np-sec">Доходы</div>`;
      income.forEach(i => {
        html += `<div class="np-row"><span class="np-lbl">${esc(i.label)}</span><span class="np-amt-pos">+${fmt(i.amount)}</span></div>`;
      });
      html += `<div class="np-subtotal"><span style="color:var(--muted)">Итого доходов</span><span class="np-amt-pos">+${fmt(totalInc)}</span></div>`;
    }

    // Expenses
    if (expenses.length) {
      const expId = `np-exp-${idx}`;
      html += `<div class="np-sec">Расходы</div>`;
      // Show first 4, rest hidden
      const show = expenses.slice(0, 4);
      const hide = expenses.slice(4);
      show.forEach(i => {
        html += `<div class="np-row"><span class="np-lbl">${esc(i.label)}</span><span class="np-amt-neg">−${fmt(i.amount)}</span></div>`;
      });
      if (hide.length) {
        html += `<div id="${expId}" style="display:none">`;
        hide.forEach(i => {
          html += `<div class="np-row"><span class="np-lbl">${esc(i.label)}</span><span class="np-amt-neg">−${fmt(i.amount)}</span></div>`;
        });
        html += `</div>
        <button class="btn-expand" onclick="
          var el=document.getElementById('${expId}');
          el.style.display=el.style.display==='none'?'block':'none';
          this.textContent=this.textContent.includes('▼')?'Скрыть ▲':'Ещё ${hide.length} ▼'
        ">Ещё ${hide.length} ▼</button>`;
      }
      html += `<div class="np-subtotal"><span style="color:var(--muted)">Итого расходов</span><span class="np-amt-neg">−${fmt(totalExp)}</span></div>`;
    }

    // Balance
    if (income.length || expenses.length) {
      html += `<div class="np-bal">
        <span style="color:var(--muted)">Баланс НП</span>
        <span class="${balCls}">${balSign}${fmt(bal)} мон</span>
      </div>`;
    }

    // Buildings
    if (buildings.length) {
      html += `<div class="np-sec">Постройки (${buildings.length})</div>`;
      buildings.forEach(b => {
        const building = (b.status || "").includes("🔨");
        const maint = b.maint ? `${fmt(b.maint)}/сез${b.hands ? " · " + b.hands + "р" : ""}` : "—";
        const right = building
          ? `<span style="color:#c8883a;white-space:nowrap;font-size:0.7rem">🔨 строится</span>`
          : `<span style="color:var(--muted);white-space:nowrap;font-size:0.7rem">${esc(maint)}</span>`;
        html += `<div class="np-row">
          <span class="np-lbl">${esc(b.name)}</span>
          ${right}
        </div>`;
      });
    }

    // Roads
    const nbRoads = NP_ROADS[s.name] || [];
    if (nbRoads.length) {
      html += `<div class="np-sec">Дороги (${nbRoads.length})</div>`;
      html += `<div class="np-roads">${nbRoads.map(esc).join(', ')}</div>`;
    }

    // Staff
    if (staff.length) {
      html += `<div class="np-sec">Персонал</div>`;
      staff.forEach(r => {
        const isWarn = r.status && r.status.includes("⚠");
        const stCls = isWarn ? "staff-status-warn" : "staff-status-ok";
        html += `<div class="np-row">
          <span class="np-lbl">${esc(r.category)}</span>
          <span class="${stCls}" style="white-space:nowrap;font-size:0.74rem">${esc(r.fact)}/${esc(r.norm || "?")} ${esc((r.status || "").replace(/пусто/ig, "").trim())}</span>
        </div>`;
      });
    }

    // Stash (Кладовая)
    if (stash.length) {
      html += `<div class="np-sec">🗃 Кладовая (${stash.length})</div>`;
      stash.forEach(item => {
        html += `<div class="np-row">
          <span class="np-lbl" style="white-space:normal">${esc(item)}</span>
        </div>`;
      });
    }

    html += `</div></div>`; // close np-block-body + np-block
  });

  el.innerHTML = html;
}

// ── Escape HTML ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// esc + рендер markdown-жирного (**текст**) — исходники hero_status.md пишут с **, иначе звёздочки видны буквально.
function mdBold(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(`data/index.json?_=${Date.now()}`);
    const idx = await res.json();
    INDEX = idx.entries || (idx.files || []).map(f => {
      const m = f.replace(/\.json$/, "").match(/^(run_\w+)_(\w+)$/);
      return m ? { file: f, run: m[1], player: m[2] } : null;
    }).filter(Boolean);
  } catch (e) { INDEX = []; }

  const q = new URLSearchParams(location.search);
  let run = q.get("run"), player = q.get("player");
  const runs = [...new Set(INDEX.map(e => e.run))].sort().reverse();
  if (!run) run = runs[0] || "run_005";                 // дефолт — последний забег
  const ents = runEntries(run);
  if (!player) player = ents.length ? ents[0].player : "danil";  // первый игрок забега

  buildSelects(run, player);
  loadData(run, player);
}
init();
</script>

</html>

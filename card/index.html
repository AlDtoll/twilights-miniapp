<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twilights — Карточный бой</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #1a1a2e);
    color: var(--tg-theme-text-color, #eee);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 8px; text-align: center; }
  .subtitle { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 16px; text-align: center; }

  /* THRESHOLDS */
  .thresholds-panel { width: 100%; max-width: 360px; margin-bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .threshold-chip {
    flex: 1; min-width: 60px; padding: 6px 8px; border-radius: 10px; text-align: center;
    font-size: 0.75rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  }
  .threshold-chip .t-range { font-weight: 700; font-size: 0.85rem; display: block; }
  .threshold-chip .t-label { color: var(--tg-theme-hint-color, #aaa); font-size: 0.7rem; }
  .threshold-chip.active { border-color: #00b894; background: rgba(0,184,148,0.18); }
  .threshold-chip.active .t-label { color: #00b894; }

  /* CHOICE */
  #choice-game { width: 100%; max-width: 360px; }
  .choice-prompt { text-align: center; font-size: 1rem; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; line-height: 1.5; }
  .choice-buttons { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s; }
  .choice-btn:hover { border-color: var(--tg-theme-button-color, #6c5ce7); }
  .choice-btn.selected { border-color: #00b894; background: rgba(0,184,148,0.2); }
  .choice-hint { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(162,155,254,0.12); border: 1px solid rgba(162,155,254,0.3); font-size: 0.9rem; color: #a29bfe; line-height: 1.5; }

  /* BLACKJACK */
  #bj-game { width: 100%; max-width: 360px; }
  .bj-info { display: flex; justify-content: space-between; margin-bottom: 16px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
  .bj-info-item { text-align: center; }
  .bj-info-label { font-size: 0.7rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 2px; }
  .bj-info-val { font-size: 1.3rem; font-weight: bold; }
  .bj-cards { min-height: 60px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card { width: 44px; height: 60px; border-radius: 8px; background: #fff; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.4); line-height: 1.1; }
  .card.red { color: #e74c3c; }
  .bj-section-label { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 6px; }
  .bj-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: var(--tg-theme-button-color, #6c5ce7); color: var(--tg-theme-button-text-color, #fff); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--tg-theme-text-color, #fff); }

  .result-banner { padding: 12px; border-radius: 12px; text-align: center; font-size: 1.1rem; font-weight: bold; margin-top: 12px; display: none; }
  .result-good { background: rgba(0,184,148,0.2); border: 2px solid #00b894; color: #00b894; }
  .result-mid  { background: rgba(255,193,7,0.15); border: 2px solid #ffc107; color: #ffc107; }
  .result-bad  { background: rgba(231,76,60,0.2); border: 2px solid #e74c3c; color: #e74c3c; }

  /* MODIFIERS (toggle/choice) */
  .modifiers-panel { width: 100%; margin-bottom: 14px; }
  .modifiers-label { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 8px; }
  .modifier-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .modifier-name { font-size: 0.85rem; color: var(--tg-theme-text-color, #eee); flex: 1; min-width: 80px; }
  .mod-btn { padding: 6px 14px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); background: transparent; color: var(--tg-theme-hint-color, #aaa); font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.15s; min-width: 48px; text-align: center; }
  .mod-btn:disabled { opacity: 0.35; cursor: default; }
  .mod-btn.active-plus { border-color: #00b894; background: rgba(0,184,148,0.2); color: #00b894; }
  .mod-btn.active-minus { border-color: #e74c3c; background: rgba(231,76,60,0.2); color: #e74c3c; }

  /* FORESIGHT / DISCARD (shared row layout) */
  .foresight-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .foresight-name { font-size: 0.85rem; color: var(--tg-theme-text-color, #eee); flex: 1; min-width: 80px; }
  .foresight-btn {
    padding: 6px 14px; border-radius: 20px; border: 2px solid #a29bfe;
    background: transparent; color: #a29bfe; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .foresight-btn:disabled { opacity: 0.35; cursor: default; }
  .foresight-btn.used { border-color: rgba(255,255,255,0.2); color: var(--tg-theme-hint-color, #aaa); background: transparent; cursor: default; }
  .foresight-hint {
    width: 100%; margin-top: 4px; padding: 8px 12px; border-radius: 10px;
    background: rgba(162,155,254,0.12); border: 1px solid rgba(162,155,254,0.3);
    font-size: 0.9rem; color: #a29bfe; font-weight: 600; text-align: center;
  }
  .discard-btn {
    padding: 6px 14px; border-radius: 20px; border: 2px solid #fd79a8;
    background: transparent; color: #fd79a8; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .discard-btn:disabled { opacity: 0.35; cursor: default; }
  .discard-btn.used { border-color: rgba(255,255,255,0.2); color: var(--tg-theme-hint-color, #aaa); background: transparent; cursor: default; }

  .confirm-btn { width: 100%; margin-top: 20px; padding: 14px; border-radius: 14px; border: none; background: var(--tg-theme-button-color, #6c5ce7); color: var(--tg-theme-button-text-color, #fff); font-size: 1.05rem; font-weight: 700; cursor: pointer; }
  .confirm-btn:disabled { opacity: 0.25; cursor: default; }

  /* TIMING */
  #timing-game { width: 100%; max-width: 360px; text-align: center; }
  .timing-prompt { font-size: 0.95rem; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; line-height: 1.5; }
  .timing-wrap { position: relative; height: 72px; border-radius: 14px; overflow: hidden; margin-bottom: 10px; background: #e74c3c; }
  .timing-zone { position: absolute; top: 0; bottom: 0; }
  .timing-marker { position: absolute; top: 0; bottom: 0; width: 5px; background: #fff; border-radius: 3px; transform: translateX(-50%); box-shadow: 0 0 10px rgba(255,255,255,0.9); pointer-events: none; transition: none; }
  .timing-live-label { font-size: 1rem; font-weight: 700; min-height: 1.4rem; margin-bottom: 6px; text-align: center; transition: color 0.1s; }
  .timing-result-label { font-size: 1.2rem; font-weight: 700; min-height: 1.8rem; margin-bottom: 16px; }
  .timing-stop-btn { padding: 14px; border-radius: 12px; border: none; background: var(--tg-theme-button-color, #6c5ce7); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; }
  .timing-stop-btn:disabled { opacity: 0.4; cursor: default; }

  /* MATCH-3 */
  #match3-game { width: 100%; max-width: 360px; }
  .m3-status { display: flex; justify-content: space-around; margin-bottom: 10px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
  .m3-status-item { text-align: center; }
  .m3-status-label { font-size: 0.7rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 2px; }
  .m3-status-val { font-size: 1.3rem; font-weight: bold; }
  .m3-thresholds { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); text-align: center; margin-bottom: 6px; }
  .m3-combo { font-size: 0.95rem; font-weight: 700; text-align: center; min-height: 1.4rem; color: #f1c40f; margin-bottom: 6px; }
  .m3-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 10px; touch-action: none; }
  .m3-cell { aspect-ratio: 1; border-radius: 50%; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; }
  .m3-cell.selected { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 10px rgba(255,255,255,0.5); }
  .m3-cell.removing { transition: transform 0.22s cubic-bezier(0.4,0,1,1), opacity 0.22s ease-in !important; transform: scale(0) !important; opacity: 0 !important; }
  .m3-cell.dead { background: rgba(255,255,255,0.04) !important; cursor: default; }
  .m3-time-bar-wrap { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 8px; overflow: hidden; display: none; }
  .m3-time-bar { height: 100%; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }

  /* SEQUENCE */
  #sequence-game { width: 100%; max-width: 360px; }
  .seq-ready-title { font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 10px; }
  .seq-ready-info { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); text-align: center; margin-bottom: 24px; }
  .seq-progress-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .seq-progress-bar { height: 100%; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .seq-counter { font-size: 0.8rem; color: var(--tg-theme-hint-color, #aaa); text-align: right; margin-bottom: 8px; }
  .seq-question { font-size: 1.05rem; font-weight: 600; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 14px; line-height: 1.5; text-align: center; }
  #seq-options { display: flex; flex-direction: column; gap: 8px; }
  .seq-opt-btn { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 0.95rem; cursor: pointer; text-align: left; transition: border-color 0.2s, background 0.2s; }
  .seq-opt-btn:disabled { cursor: default; }
  .seq-opt-correct { border-color: #00b894 !important; background: rgba(0,184,148,0.15) !important; }
  .seq-opt-wrong { border-color: #e74c3c !important; background: rgba(231,76,60,0.15) !important; }
  .seq-feedback { margin-top: 10px; font-size: 1rem; font-weight: 700; text-align: center; min-height: 1.4rem; }
  .seq-result-wrap { text-align: center; }
  .seq-result-score { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
  .seq-result-total { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 16px; }
  .seq-result-label { font-size: 1.2rem; font-weight: 700; padding: 12px 20px; border-radius: 12px; display: inline-block; }

  /* COMPARE */
  #compare-game { width: 100%; max-width: 360px; }
  .cmp-timer-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
  .cmp-timer-fill { height: 100%; background: #00b894; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .cmp-prompt { text-align: center; font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
  .cmp-pair { display: flex; gap: 12px; width: 100%; margin-bottom: 10px; }
  .cmp-card { flex: 1; min-height: 110px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; transition: all 0.15s; line-height: 1.3; }
  .cmp-card:active { transform: scale(0.96); }
  .cmp-card.correct { border-color: #00b894; background: rgba(0,184,148,0.25); }
  .cmp-card.wrong { border-color: #e74c3c; background: rgba(231,76,60,0.2); }
  .cmp-card:disabled { cursor: default; }
  .cmp-progress { text-align: center; font-size: 0.82rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 6px; }
  .cmp-feedback { text-align: center; min-height: 1.4rem; font-size: 1.1rem; font-weight: 700; }

  /* MEMORY */
  #memory-game { width: 100%; max-width: 400px; }
  .mem-header { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); margin-bottom: 8px; }
  .mem-grid { display: grid; gap: 5px; margin-bottom: 8px; }
  .mem-card { aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(255,255,255,0.12); background: rgba(108,92,231,0.12); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; user-select: none; -webkit-tap-highlight-color: transparent; transition: background 0.15s, border-color 0.15s; }
  .mem-card.face-down { color: transparent !important; font-size: 0; }
  .mem-card.face-down::after { content: '?'; color: rgba(255,255,255,0.18); font-size: 1rem; }
  .mem-card.matched { border-color: #00b894; background: rgba(0,184,148,0.2); cursor: default; }
  .mem-card.wrong-pair { border-color: #e74c3c; background: rgba(231,76,60,0.18); }
  @keyframes mem-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* ODDONE */
  #oddone-game { width: 100%; max-width: 360px; }
  .oo-grid { display: grid; gap: 8px; margin-bottom: 10px; }
  .oo-cell { aspect-ratio: 1; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; user-select: none; -webkit-tap-highlight-color: transparent; transition: all 0.12s; }
  .oo-cell.correct { border-color: #00b894; background: rgba(0,184,148,0.2); }
  .oo-cell.wrong-tap { border-color: #e74c3c; background: rgba(231,76,60,0.18); animation: mem-shake 0.3s; }

  /* REACTION */
  #reaction-game { width: 100%; max-width: 360px; text-align: center; }
  .rx-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-size: 0.85rem; color: var(--tg-theme-hint-color,#aaa); }
  .rx-display { font-size: 4.5rem; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); margin-bottom: 14px; transition: background 0.1s, border-color 0.1s; }
  .rx-display.rx-target { background: rgba(108,92,231,0.15); border-color: rgba(108,92,231,0.4); }
  .rx-tap-btn { width: 100%; padding: 20px; border-radius: 16px; border: none; background: var(--tg-theme-button-color,#6c5ce7); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  .rx-tap-btn:active { transform: scale(0.96); }
  .rx-tap-btn:disabled { opacity: 0.4; cursor: default; }

  /* SORTING */
  #sorting-game { width: 100%; max-width: 360px; }
  .sort-round-label { font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); text-align: center; margin-bottom: 8px; }
  .sort-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sort-item { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color,#fff); cursor: pointer; text-align: left; font-size: 1rem; display: flex; align-items: center; gap: 10px; user-select: none; -webkit-tap-highlight-color: transparent; transition: all 0.15s; }
  .sort-item.selected { border-color: #00b894; background: rgba(0,184,148,0.15); cursor: default; }
  .sort-badge { width: 24px; height: 24px; border-radius: 50%; background: #00b894; color: #fff; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; visibility: hidden; }

  /* ESTIMATE */
  #estimate-game { width: 100%; max-width: 360px; text-align: center; }
  .est-round-label { font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); margin-bottom: 8px; text-align: center; }
  .est-display { width: 100%; height: 150px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); margin-bottom: 14px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: rgba(255,255,255,0.2); }
  .est-dot-el { position: absolute; font-size: 1.2rem; line-height: 1; color: var(--tg-theme-text-color,#fff); }
  .est-slider-wrap { margin-bottom: 12px; }
  .est-slider { width: 100%; accent-color: var(--tg-theme-button-color,#6c5ce7); }
  .est-slider-val { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }

  /* FINDALL */
  #findall-game { width: 100%; max-width: 400px; }
  .fa-timer-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
  .fa-timer-fill { height: 100%; background: #00b894; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .fa-target-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .fa-target-label { font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }
  .fa-target-val { font-size: 2rem; padding: 6px 14px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); }
  .fa-grid { display: grid; gap: 5px; margin-bottom: 10px; }
  .fa-cell { aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.12s, background 0.12s; -webkit-tap-highlight-color: transparent; user-select: none; }
  .fa-cell:active:not([disabled]) { transform: scale(0.88); }
  .fa-cell.found { border-color: #00b894; background: rgba(0,184,148,0.3); cursor: default; }
  .fa-cell.wrong { border-color: #e74c3c; background: rgba(231,76,60,0.25); cursor: default; animation: fa-shake 0.25s; }
  .fa-cell[disabled] { cursor: default; }
  @keyframes fa-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  .fa-progress { text-align: center; font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }

  /* COMBAT */
  #combat-game { width: 100%; max-width: 400px; }
  .combat-enemies { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .combat-enemy { padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1); }
  .combat-enemy.dead { opacity: 0.35; }
  .combat-enemy-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .combat-enemy-name { font-weight: 700; font-size: 1rem; }
  .combat-enemy-hp-text { font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }
  .combat-hp-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 8px; }
  .combat-hp-fill { height: 100%; border-radius: 4px; background: #e74c3c; transition: width 0.4s; }
  .combat-enemy-vals { display: flex; gap: 16px; margin-bottom: 8px; font-size: 0.95rem; }
  .combat-val-def { color: #74b9ff; font-weight: 700; }
  .combat-val-atk { color: #ff7675; font-weight: 700; }
  .combat-atk-slot { padding: 7px 10px; border-radius: 8px; border: 1.5px dashed rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.83rem; color: var(--tg-theme-hint-color, #aaa); transition: all 0.15s; }
  .combat-atk-slot:hover { border-color: rgba(255,255,255,0.4); }
  .combat-atk-slot.has-die { border-style: solid; border-color: #e74c3c; background: rgba(231,76,60,0.1); color: var(--tg-theme-text-color, #fff); }
  .combat-damage-2 { color: #fdcb6e; font-weight: 700; }
  .combat-damage-1 { color: #a29bfe; font-weight: 700; }
  .combat-damage-0 { color: #636e72; font-weight: 700; text-decoration: line-through; }
  .combat-enemy-slots { display: flex; gap: 6px; margin-top: 4px; }
  .combat-blk-slot { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1.5px dashed rgba(116,185,255,0.35); display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.83rem; color: var(--tg-theme-hint-color, #aaa); transition: all 0.15s; }

<script src="../shared/core.js"></script>
<script>
// ---- CARD GAME ----
let CG_LIB = {};

// flat lookup by id
let CG_BY_ID = {};
function cgRebuildIndex(){
  CG_BY_ID = {};
  Object.values(CG_LIB).forEach(arr => arr.forEach(c => { CG_BY_ID[c.id] = c; }));
}

// Минимальный фолбэк — только стартовая колода в hex-шкале (если пресет не загрузился).
const CG_FALLBACK_BASE = [
  {id:'b_strike',name:'Удар',skill:'base',type:'attack',cost:1,effect:{damage:25},description:'25 урона',rarity:'common'},
  {id:'b_strike2',name:'Удар',skill:'base',type:'attack',cost:1,effect:{damage:25},description:'25 урона',rarity:'common'},
  {id:'b_strike3',name:'Удар',skill:'base',type:'attack',cost:1,effect:{damage:25},description:'25 урона',rarity:'common'},
  {id:'b_strike4',name:'Удар',skill:'base',type:'attack',cost:1,effect:{damage:25},description:'25 урона',rarity:'common'},
  {id:'b_heavy',name:'Мощный удар',skill:'base',type:'attack',cost:2,effect:{damage:28},description:'28 урона',rarity:'common'},
  {id:'b_block',name:'Блок',skill:'base',type:'defense',cost:1,effect:{block:14},description:'14 брони',rarity:'common'},
  {id:'b_block2',name:'Блок',skill:'base',type:'defense',cost:1,effect:{block:14},description:'14 брони',rarity:'common'},
  {id:'b_block3',name:'Блок',skill:'base',type:'defense',cost:1,effect:{block:14},description:'14 брони',rarity:'common'},
  {id:'b_block4',name:'Блок',skill:'base',type:'defense',cost:1,effect:{block:14},description:'14 брони',rarity:'common'},
  {id:'b_skill',name:'Собраться',skill:'base',type:'skill',cost:0,effect:{draw:2},description:'Взять 2 карты',rarity:'common'},
];
let CG_BASE = [];

// Карты грузятся из пресета сеттинга (движок — общий, карты — сеттинг-side).
// Порядок: gameData.card_lib/base_deck (инлайн) → fetch presets/<card_preset>.json → фолбэк.
// Поверх библиотеки накладываются приватные карты персонажа (gameData.card_custom).
async function cgLoadCards(){
  let lib = null, base = null;
  if(gameData.card_lib && typeof gameData.card_lib === 'object'){
    lib = gameData.card_lib;
    base = gameData.base_deck;
  } else if(gameData.card_preset){
    try{
      const resp = await fetch('presets/' + encodeURIComponent(gameData.card_preset) + '.json', {cache:'no-store'});
      if(resp.ok){
        const data = await resp.json();
        lib = data.card_lib || {};
        base = data.base_deck;
      }
    }catch(e){ /* фолбэк ниже */ }
  }
  CG_LIB = lib || {};
  CG_BASE = Array.isArray(base) && base.length ? base : CG_FALLBACK_BASE;
  // Приватные карты персонажа поверх общей библиотеки (сочинённые под него уникальные карты).
  if(Array.isArray(gameData.card_custom)){
    gameData.card_custom.forEach(c=>{
      if(c && c.id){
        const sk = c.skill || 'custom';
        (CG_LIB[sk] = CG_LIB[sk] || []).push(c);
      }
    });
  }
  cgRebuildIndex();
}

let cgs = {};

function cgShuffle(a) {
  const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r;
}

// Эффективное значение бафа = постоянная часть + временные (ещё не истёкшие).
function cgEff(stat){
  let v=cgs[stat]||0;
  (cgs.buffTimers||[]).forEach(b=>{ if(b.stat===stat) v+=b.amount; });
  return v;
}
// Начислить баф: с turns → временный (истекает в начале хода игрока), без — постоянный на бой.
function cgGrantBuff(stat,amount,turns){
  if(!amount) return;
  if(turns&&turns>0) cgs.buffTimers.push({stat,amount,turns});
  else cgs[stat]=(cgs[stat]||0)+amount;
}

function initCard() {
  document.getElementById('card-game').style.display='';
  const ph = gameData.player_hp||100;
  const rawEnemies = Array.isArray(gameData.enemies) ? gameData.enemies
    : [gameData.enemy||{name:'Страж',hp:100,attack:40}];
  const enemiesState = rawEnemies.map((e,i)=>({
    id:i, name:e.name||'Враг', hp:e.hp||100, maxHp:e.hp||100,
    block:0, vulnerable:0, weak:0,
    pattern:e.pattern||[{type:'attack',value:e.attack||40}],
    patIdx:0, flavor:e.flavor||[], flavorShown:{}
  }));
  const minionState = (gameData.player_minions||[]).map((m,i)=>({
    id:i, name:m.name||'Спутник', hp:m.hp||50, maxHp:m.hp||50, block:0
  }));
  let deck=[...CG_BASE.map((c,i)=>({...c,uid:'b'+i}))];
  if(gameData.weapon_card&&CG_BY_ID[gameData.weapon_card]) deck.push({...CG_BY_ID[gameData.weapon_card],uid:'w0'});
  if(gameData.magic_card&&CG_BY_ID[gameData.magic_card]) deck.push({...CG_BY_ID[gameData.magic_card],uid:'m0'});
  if(gameData.cards) gameData.cards.forEach((id,i)=>{ if(CG_BY_ID[id]) deck.push({...CG_BY_ID[id],uid:'x'+i}); });
  deck=cgShuffle(deck);
  const _ps=gameData.player_status||{};
  cgs={deck,hand:[],discard:[],exhaust:[],lastDrawn:0,
    enemies:enemiesState,minions:minionState,
    playerHp:ph,playerMaxHp:ph,playerBlock:_ps.block||0,
    strength:_ps.strength||0,dexterity:_ps.dexterity||0,armor:_ps.armor||0,buffTimers:[],
    playerVulnerable:_ps.vulnerable||0,playerWeak:_ps.weak||0,
    energy:3,maxEnergy:3,sel:null,targeting:false,
    turn:1,played:0,lowestHp:ph,damageTaken:0,
    maxRounds:parseInt(gameData.card_max_rounds)||0,
    totalTime:parseInt(gameData.card_total_time)||0,
    roundTime:parseInt(gameData.card_round_time)||0,
    totalLeft:parseInt(gameData.card_total_time)||0,
    roundLeft:parseInt(gameData.card_round_time)||0};
  document.getElementById('cg-ready-title').textContent=gameData.prompt||'Карточный бой';
  const eSummary=enemiesState.map(e=>e.name+' HP '+e.maxHp).join(', ');
  const mSummary=minionState.length?' · Спутники: '+minionState.map(m=>m.name).join(', '):'';
  document.getElementById('cg-ready-sub').textContent='Враги: '+eSummary+mSummary+'\nКолода: '+deck.length+' карт · 5 в руке · 3 энергии/ход';
  const prev=document.getElementById('cg-deck-preview'); prev.innerHTML='';
  deck.forEach(c=>{const ch=document.createElement('div');ch.className='cg-deck-chip '+c.type+(c.rarity==='rare'?' rare':'');ch.textContent=c.name;prev.appendChild(ch);});
}

let cgTimer=null;
function cgFmtTime(s){ s=Math.max(0,s|0); const m=(s/60)|0; const r=s%60; return m+':'+(r<10?'0':'')+r; }
function cgClearTimers(){ if(cgTimer){clearInterval(cgTimer);cgTimer=null;} }
function cgTick(){
  if(!cgs||cgs.ended) { cgClearTimers(); return; }
  if(cgs.totalTime){
    cgs.totalLeft--;
    if(cgs.totalLeft<=0){ cgs.totalLeft=0; cgUpdateUI(); cgEndScene('время боя вышло'); return; }
  }
  if(cgs.roundTime){
    cgs.roundLeft--;
    if(cgs.roundLeft<=0){ cgLog('⏳ Время хода вышло — ход завершается.'); cgs.roundLeft=cgs.roundTime; cgEndTurn(); return; }
  }
  cgUpdateUI();
}
function cgStart(){
  document.getElementById('cg-ready').style.display='none';
  document.getElementById('cg-battle').style.display='';
  cgs.roundLeft=cgs.roundTime;
  if(cgs.totalTime||cgs.roundTime){ cgClearTimers(); cgTimer=setInterval(cgTick,1000); }
  const _sp=[];
  if(cgs.strength) _sp.push('💪 Сила '+cgs.strength);
  if(cgs.dexterity) _sp.push('🤸 Ловкость '+cgs.dexterity);
  if(cgs.armor) _sp.push('🔩 Броня '+cgs.armor);
  if(cgs.playerBlock) _sp.push('🛡 Блок '+cgs.playerBlock);
  if(cgs.playerVulnerable) _sp.push('🩸 Уязвимость '+cgs.playerVulnerable);
  if(cgs.playerWeak) _sp.push('😵 Слабость '+cgs.playerWeak);
  if(_sp.length) cgLog('Стартовые статусы: '+_sp.join(', '));
  cgUpdateUI(); cgDraw(5);
}

function cgDraw(n){
  let drawn=0;
  for(let i=0;i<n;i++){
    if(cgs.deck.length===0){
      if(cgs.discard.length===0) break;
      cgs.deck=cgShuffle(cgs.discard); cgs.discard=[]; cgLog('Колода перемешана.');
    }
    if(cgs.hand.length>=10) break;
    cgs.hand.push(cgs.deck.shift()); drawn++;
  }
  cgs.lastDrawn=drawn;
  cgRenderHand(); cgUpdateUI();
}

function cgRenderEnemies(){
  const c=document.getElementById('cg-enemies'); c.innerHTML='';
  cgs.enemies.forEach(enemy=>{
    const p=document.createElement('div');
    p.className='cg-enemy-panel'+(enemy.hp<=0?' dead':'')+(cgs.targeting&&enemy.hp>0?' targetable':'');
    p.dataset.enemyId=enemy.id;
    if(cgs.targeting&&enemy.hp>0) p.onclick=()=>cgTargetEnemy(enemy);
    const vT=enemy.vulnerable>0?' <span class="cg-status-tag cg-vuln">Уязв.</span>':'';
    const wT=enemy.weak>0?' <span class="cg-status-tag cg-weak">Слаб.</span>':'';
    p.innerHTML='<div class="cg-enemy-name">'+enemy.name+vT+wT
      +'<span style="font-size:0.73rem;font-weight:400"> HP '+enemy.hp+'/'+enemy.maxHp+(enemy.block>0?' 🛡'+enemy.block:'')+'</span></div>'
      +(()=>{const _ep=Math.max(0,enemy.hp/enemy.maxHp);const _ec=_ep>0.6?'#2ecc71':_ep>0.3?'#f39c12':'#e74c3c';return '<div class="cg-hp-bar"><div class="cg-hp-fill" style="width:'+(_ep*100)+'%;background:'+_ec+'"></div></div>';})()
      +(enemy.hp>0?(()=>{const _ii=cgGetEnemyIntentInfo(enemy);return '<div class="cg-enemy-intent '+_ii.cls+'">'+_ii.text+'</div>';})():'<div class="cg-enemy-intent" style="color:#555">Повержен</div>');
    c.appendChild(p);
  });
}

function cgRenderMinions(){
  const c=document.getElementById('cg-minions'); c.innerHTML='';
  cgs.minions.forEach(m=>{
    const ch=document.createElement('div');
    ch.className='cg-minion-chip'+(m.hp<=0?' dead':'');
    ch.textContent=m.name+' '+m.hp+'/'+m.maxHp+(m.block>0?' 🛡'+m.block:'');
    c.appendChild(ch);
  });
}

function cgRenderHand(){
  const h=document.getElementById('cg-hand'); h.innerHTML='';
  const newStart=cgs.hand.length-(cgs.lastDrawn||0);
  cgs.hand.forEach((card,idx)=>{
    const el=document.createElement('div');
    const isNew=idx>=newStart;
    el.className='cg-card'+(isNew?' dealing':'')+(cgs.sel===idx?' selected':'')+(card.cost>cgs.energy?' unaffordable':'');
    if(isNew) el.style.animationDelay=((idx-newStart)*80)+'ms';
    el.dataset.type=card.type;
    let lpTimer=null,_tx=0,_ty=0,_moved=false;
    el.addEventListener('touchstart',(ev)=>{
      _tx=ev.touches[0].clientX; _ty=ev.touches[0].clientY; _moved=false;
      lpTimer=setTimeout(()=>{lpTimer=null;cgShowCardDetail(card);},500);
    },{passive:true});
    el.addEventListener('touchmove',(ev)=>{
      const dx=ev.touches[0].clientX-_tx, dy=ev.touches[0].clientY-_ty;
      if(Math.sqrt(dx*dx+dy*dy)>8) _moved=true;
      if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
    },{passive:true});
    el.addEventListener('touchend',(ev)=>{
      ev.preventDefault();
      if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
      if(_moved) return;
      if(card.cost>cgs.energy) return;
      cgTapCard(idx,card);
    });
    el.addEventListener('touchcancel',()=>{if(lpTimer){clearTimeout(lpTimer);lpTimer=null;} _moved=true;});
    el.onclick=()=>{if(card.cost>cgs.energy)return; cgTapCard(idx,card);};
    const icon=card.type==='attack'?'⚔️':card.type==='defense'?'🛡':'✨';
    const typeName=card.type==='attack'?'Атака':card.type==='defense'?'Защита':'Умение';
    el.innerHTML='<div class="cg-cost'+(card.cost===0?' free':'')+'">'+card.cost+'</div>'
      +'<div class="cg-card-name">'+card.name+'</div>'
      +'<div class="cg-card-type">'+icon+' '+typeName+'</div>'
      +'<div class="cg-card-desc">'+card.description+'</div>'
      +(card.flavor?'<div class="cg-card-flavor">'+card.flavor+'</div>':'')
      +(card.rarity==='rare'?'<div class="cg-card-rarity">★</div>':'');
    h.appendChild(el);
  });
  document.getElementById('cg-hand-label').textContent='Рука ('+cgs.hand.length+')';
  cgs.lastDrawn=0;
}


function cgTapCard(idx,card){
  const hint=document.getElementById('cg-target-hint');
  const pb=document.getElementById('cg-play-btn');
  if(cgs.sel===idx){
    cgs.sel=null; cgs.targeting=false;
    hint.style.visibility='hidden'; pb.disabled=true; pb.textContent='Сыграть';
    cgRenderEnemies(); cgRenderHand(); return;
  }
  cgs.sel=idx;
  const living=cgs.enemies.filter(e=>e.hp>0);
  const needsTarget=card.type==='attack'&&!card.effect?.all_enemies&&living.length>1;
  if(needsTarget){
    cgs.targeting=true;
    hint.style.visibility='visible'; pb.disabled=true; pb.textContent='Сыграть';
  } else {
    cgs.targeting=false;
    hint.style.visibility='hidden'; pb.disabled=false; pb.textContent='Сыграть';
  }
  cgRenderEnemies(); cgRenderHand();
}

function cgPlayButton(){
  if(cgs.sel===null) return;
  const card=cgs.hand[cgs.sel];
  if(card.cost>cgs.energy) return;
  const living=cgs.enemies.filter(e=>e.hp>0);
  cgPlayCard(cgs.sel, card.effect?.all_enemies?null:(living[0]||null));
}

function cgTargetEnemy(enemy){
  if(cgs.sel===null||!cgs.targeting) return;
  cgs.targeting=false; document.getElementById('cg-target-hint').style.visibility='hidden';
  cgPlayCard(cgs.sel,enemy);
}

function cgApplyDamageToEnemy(enemy,dmg){
  if(enemy.vulnerable>0) dmg=Math.floor(dmg*1.5);
  const ebl=Math.min(dmg,enemy.block); dmg-=ebl; enemy.block=Math.max(0,enemy.block-ebl);
  enemy.hp=Math.max(0,enemy.hp-dmg);
  return {dmg,blocked:ebl};
}

function cgApplyEnemyAttack(atk,sourceName){
  const liveMin=cgs.minions.filter(m=>m.hp>0);
  if(liveMin.length>0){
    const m=liveMin[0];
    const bl=Math.min(atk,m.block); m.block=Math.max(0,m.block-bl); atk-=bl;
    m.hp=Math.max(0,m.hp-atk);
    cgLog('👤 '+sourceName+' бьёт '+m.name+' → HP '+m.hp+'/'+m.maxHp);
    return;
  }
  if((cgs.playerVulnerable||0)>0) atk=Math.floor(atk*1.5);
  const bl=Math.min(atk,cgs.playerBlock); let tk=atk-bl;
  cgs.playerBlock=Math.max(0,cgs.playerBlock-bl);
  const arm=Math.min(tk,Math.max(0,cgEff('armor'))); tk-=arm;
  cgs.playerHp=Math.max(0,cgs.playerHp-tk);
  cgs.damageTaken+=tk; cgs.lowestHp=Math.min(cgs.lowestHp,cgs.playerHp);
  let msg='👹'+sourceName+' атакует '+atk+((cgs.playerVulnerable||0)>0?' (×1.5)':'');
  if(bl>0) msg+=' (блок −'+bl+')'; if(arm>0) msg+=' (броня −'+arm+')'; msg+=' → −'+tk+' HP';
  cgLog(msg);
}

// Эффект «создать карты»: добавляет копии карт (по id из библиотеки, вкл. custom)
// в колоду (по умолч. — вмешиваются в draw-pile), руку или сброс. spec — объект или массив.
function cgAddCards(spec){
  if(!spec) return null;
  const list=Array.isArray(spec)?spec:[spec];
  const summary=[];
  list.forEach(sp=>{
    const src=CG_BY_ID[sp.id]; if(!src) return;
    const n=Math.max(1,parseInt(sp.count)||1);
    const to=sp.to||'deck';
    for(let i=0;i<n;i++){
      cgs.genSeq=(cgs.genSeq||0)+1;
      const nc={...src,uid:'g'+cgs.genSeq};
      if(to==='hand') cgs.hand.push(nc);
      else if(to==='discard') cgs.discard.push(nc);
      else { const pos=Math.floor(Math.random()*(cgs.deck.length+1)); cgs.deck.splice(pos,0,nc); }
    }
    const toName=to==='hand'?'руку':to==='discard'?'сброс':'колоду';
    summary.push('➕'+n+'× '+src.name+'→'+toName);
  });
  return summary.length?summary.join(' '):null;
}
function cgPlayCard(cardIdx,targetEnemy){
  const card=cgs.hand[cardIdx];
  if(card.cost>cgs.energy) return;
  cgs.energy-=card.cost; cgs.hand.splice(cardIdx,1); cgs.sel=null; cgs.targeting=false; cgs.played++;
  const pb=document.getElementById('cg-play-btn'); if(pb){pb.disabled=true; pb.textContent='Сыграть'; document.getElementById('cg-target-hint').style.visibility='hidden';}
  const e=card.effect; const parts=['▶ '+card.name+':'];
  const _weakMul=(cgs.playerWeak||0)>0?0.7:1.0;
  if(e.damage){
    const _rawDmg=Math.max(0,Math.floor((e.damage+cgEff('strength'))*_weakMul));
    if(e.all_enemies){
      let tot=0; cgs.enemies.forEach(en=>{if(en.hp<=0)return; const {dmg}=cgApplyDamageToEnemy(en,_rawDmg); tot+=dmg;});
      parts.push('💥'+_rawDmg+' всем ('+tot+' итого)'+(cgs.playerWeak>0?' 😵−30%':''));
    } else if(targetEnemy){
      const {dmg,blocked}=cgApplyDamageToEnemy(targetEnemy,_rawDmg);
      parts.push('💥'+dmg+(targetEnemy.vulnerable>0?'(×1.5)':'')+(blocked>0?' блок−'+blocked:'')+(cgs.playerWeak>0?' 😵':''));
      if(e.lifesteal){const hl=Math.min(dmg,cgs.playerMaxHp-cgs.playerHp);cgs.playerHp+=hl;parts.push('❤️+'+hl);}
      cgCheckFlavor(targetEnemy);
    }
  }
  if(e.block){const _bl=Math.max(0,e.block+cgEff('dexterity'));cgs.playerBlock+=_bl;parts.push('🛡+'+_bl);}
  if(e.strength){cgGrantBuff('strength',e.strength,e.turns);parts.push('💪+'+e.strength+(e.turns?' ('+e.turns+'х)':''));}
  if(e.dexterity){cgGrantBuff('dexterity',e.dexterity,e.turns);parts.push('🤸+'+e.dexterity+(e.turns?' ('+e.turns+'х)':''));}
  if(e.armor){cgGrantBuff('armor',e.armor,e.turns);parts.push('🛡🔩+'+e.armor);}
  if(e.draw){cgDraw(e.draw);parts.push('🃏+'+e.draw);}
  if(e.energy){cgs.energy+=e.energy;parts.push('⚡+'+e.energy);}
  if(e.vulnerable){const ts=e.all_enemies?cgs.enemies.filter(en=>en.hp>0):(targetEnemy?[targetEnemy]:[]);ts.forEach(en=>en.vulnerable=2);if(ts.length)parts.push('🔴Уязв.');}
  if(e.weak){const ts=e.all_enemies?cgs.enemies.filter(en=>en.hp>0):(targetEnemy?[targetEnemy]:[]);ts.forEach(en=>en.weak=2);if(ts.length)parts.push('🟡Слаб.');}
  if(e.heal){const hl=Math.min(e.heal,cgs.playerMaxHp-cgs.playerHp);cgs.playerHp+=hl;parts.push('❤️+'+hl);}
  if(e.add_cards){const s=cgAddCards(e.add_cards);if(s)parts.push(s);}
  cgLog(parts.join(' '));
  if(e.exhaust) cgs.exhaust.push(card); else cgs.discard.push(card);
  if(cgs.enemies.every(en=>en.hp<=0)){cgEnd(true);return;}
  cgRenderHand(); cgUpdateUI();
}

function cgEndTurn(){
  if(cgs.ended||cgs.enemies.every(e=>e.hp<=0)||cgs.playerHp<=0) return;
  cgs.discard.push(...cgs.hand); cgs.hand=[]; cgs.sel=null; cgs.targeting=false;
  const _pb=document.getElementById('cg-play-btn'); if(_pb){_pb.disabled=true;_pb.textContent='Сыграть';}
  document.getElementById('cg-target-hint').style.visibility='hidden';
  cgLog('— Конец хода '+cgs.turn+' —');
  cgs.enemies.forEach(enemy=>{
    if(enemy.hp<=0) return;
    const step=enemy.pattern[enemy.patIdx%enemy.pattern.length]; enemy.patIdx++;
    if(step.type==='attack'){
      let atk=step.value; if(enemy.weak>0){atk=Math.floor(atk*0.7);enemy.weak--;}
      cgApplyEnemyAttack(atk,enemy.name);
    } else if(step.type==='block'){
      enemy.block+=step.value; cgLog('🛡 '+enemy.name+' блокируется (+'+step.value+')');
    } else if(step.type==='heal'){
      const gained=Math.min(step.value,enemy.maxHp-enemy.hp); enemy.hp+=gained;
      cgLog('💚 '+enemy.name+' восстанавливает '+gained+' HP. HP: '+enemy.hp+'/'+enemy.maxHp);
    } else if(step.type==='weak'){
      cgs.playerBlock=cgs.playerBlock; // marker
      // Apply weak to player — track as playerWeak turns
      cgs.playerWeak=(cgs.playerWeak||0)+2;
      cgLog('🟡 '+enemy.name+' накладывает слабость на героя (−30% атк на 2 хода)');
    } else if(step.type==='vulnerable'){
      cgs.playerVulnerable=(cgs.playerVulnerable||0)+2;
      cgLog('🔴 '+enemy.name+' делает героя уязвимым (+50% урон на 2 хода)');
    } else if(step.type==='buff'){
      cgLog('✨ '+enemy.name+': '+(step.text||'усиливается'));
    }
    if(enemy.vulnerable>0) enemy.vulnerable--;
  });
  cgs.minions.forEach(m=>{m.block=0;});
  if(cgs.playerHp<=0){cgEnd(false);return;}
  cgs.turn++; cgs.energy=cgs.maxEnergy; cgs.playerBlock=0; cgs.roundLeft=cgs.roundTime;
  if(cgs.maxRounds&&cgs.turn>cgs.maxRounds){ cgEndScene('лимит раундов ('+cgs.maxRounds+')'); return; }
  if(cgs.buffTimers&&cgs.buffTimers.length){cgs.buffTimers.forEach(b=>b.turns--);const exp=cgs.buffTimers.filter(b=>b.turns<=0);cgs.buffTimers=cgs.buffTimers.filter(b=>b.turns>0);if(exp.length){const names={strength:'Сила',dexterity:'Ловкость',armor:'Броня'};cgLog('⌛ Развеялось: '+exp.map(b=>names[b.stat]+' '+b.amount).join(', '));}}
  if((cgs.playerWeak||0)>0){cgs.playerWeak--;if(cgs.playerWeak===0)cgLog('😵 Слабость развеялась.');}
  if((cgs.playerVulnerable||0)>0){cgs.playerVulnerable--;if(cgs.playerVulnerable===0)cgLog('🩸 Уязвимость развеялась.');}
  cgDraw(5); cgUpdateUI();
}

function cgGetEnemyIntentInfo(enemy){
  const step=enemy.pattern[enemy.patIdx%enemy.pattern.length];
  if(step.type==='attack'){let v=step.value;if(enemy.weak>0) v=Math.floor(v*0.7);return {cls:'attack',text:'⚔️ будет атаковать '+v+(enemy.weak>0?' (−30%)':'')};}
  else if(step.type==='block') return {cls:'block',text:'🛡 поставит '+step.value+' брони'};
  else if(step.type==='heal') return {cls:'heal',text:'💚 исцелится на '+step.value};
  else if(step.type==='weak') return {cls:'debuff',text:'😵 применит Слабость'};
  else if(step.type==='vulnerable') return {cls:'debuff',text:'🩸 применит Уязвимость'};
  else if(step.type==='buff') return {cls:'debuff',text:'✨ '+(step.text||'Усиление')};
  return {cls:'attack',text:'⚔️ ?'};
}
function cgGetEnemyIntent(enemy){
  return cgGetEnemyIntentInfo(enemy).text;
}

function cgUpdateUI(){
  cgRenderEnemies(); cgRenderMinions();
  const s=cgs;
  const _lim=document.getElementById('cg-limits');
  if(_lim){
    if(s.maxRounds||s.totalTime||s.roundTime){
      let h='';
      if(s.maxRounds) h+='<span'+(s.turn>=s.maxRounds?' class="cg-limit-low"':'')+'>🔁 Раунд '+Math.min(s.turn,s.maxRounds)+'/'+s.maxRounds+'</span>';
      if(s.totalTime) h+='<span'+(s.totalLeft<=10?' class="cg-limit-low"':'')+'>⏱ '+cgFmtTime(s.totalLeft)+'</span>';
      if(s.roundTime) h+='<span'+(s.roundLeft<=5?' class="cg-limit-low"':'')+'>⏳ ход '+cgFmtTime(s.roundLeft)+'</span>';
      _lim.innerHTML=h; _lim.style.display='';
    } else _lim.style.display='none';
  }
  let pLabel='Герой HP '+s.playerHp+'/'+s.playerMaxHp+(s.playerBlock>0?' <span class="cg-status-tag cg-block-tag">🛡'+s.playerBlock+'</span>':'');
  const _str=cgEff('strength'),_dex=cgEff('dexterity'),_arm=cgEff('armor');
  if(_str!==0) pLabel+=' <span class="cg-status-tag '+(_str<0?'cg-debuff-tag':'cg-str-tag')+'">💪'+(_str>0?'+':'')+_str+'</span>';
  if(_dex!==0) pLabel+=' <span class="cg-status-tag '+(_dex<0?'cg-debuff-tag':'cg-dex-tag')+'">🤸'+(_dex>0?'+':'')+_dex+'</span>';
  if(_arm>0) pLabel+=' <span class="cg-status-tag cg-armor-tag">🔩'+_arm+'</span>';
  document.getElementById('cg-player-label').innerHTML=pLabel;
  const _pPct=s.playerHp/s.playerMaxHp;
  const _pFill=document.getElementById('cg-player-hp-fill');
  _pFill.style.width=Math.max(0,_pPct*100)+'%';
  _pFill.style.background=_pPct>0.6?'#2ecc71':_pPct>0.3?'#f39c12':'#e74c3c';
  document.getElementById('cg-energy-counter').textContent='⚡ '+s.energy+'/'+s.maxEnergy;
  const _statuses=[];
  if((s.playerWeak||0)>0) _statuses.push('😵 Слабость ('+s.playerWeak+')');
  if((s.playerVulnerable||0)>0) _statuses.push('🩸 Уязвимость ('+s.playerVulnerable+')');
  if(s.playerBlock>0) _statuses.push('🛡 '+s.playerBlock);
  const _stEl=document.getElementById('cg-player-status');
  if(_stEl) _stEl.textContent=_statuses.join('  ')||'';
  cgUpdatePiles();
}

function cgUpdatePiles(){
  document.getElementById('cg-pile-deck').textContent=cgs.deck.length;
  document.getElementById('cg-pile-discard').textContent=cgs.discard.length;
  document.getElementById('cg-pile-exhaust').textContent=cgs.exhaust.length;
}

function cgShowPile(type){
  const titles={deck:'Колода',discard:'Сброс',exhaust:'Выбыло'};
  const cards=type==='deck'?[...cgs.deck]:type==='discard'?[...cgs.discard]:[...cgs.exhaust];
  document.getElementById('cg-overlay-title').textContent=titles[type]+' ('+cards.length+')';
  const list=document.getElementById('cg-overlay-list'); list.innerHTML='';
  if(!cards.length){list.innerHTML='<div class="cg-ov-empty">Пусто</div>';} else {
    cards.forEach(card=>{
      const el=document.createElement('div'); el.className='cg-ov-card'; el.dataset.type=card.type;
      const icon=card.type==='attack'?'⚔️':card.type==='defense'?'🛡':'✨';
      const typeName=card.type==='attack'?'Атака':card.type==='defense'?'Защита':'Умение';
      el.innerHTML='<div class="cg-ov-name">'+icon+' '+card.name+' <span class="cg-ov-meta">'+typeName+(card.rarity==='rare'?' ★':'')+' · '+card.cost+'⚡</span></div><div class="cg-ov-desc">'+card.description+'</div>'+(card.flavor?'<div class="cg-card-flavor" style="margin-top:3px">'+card.flavor+'</div>':'')+'<div class="cg-ov-meta" style="margin-top:4px;font-size:0.62rem">Тап — подробнее</div>';
      el.onclick=()=>{ document.getElementById('cg-overlay').style.display='none'; cgShowCardDetail(card); };
      list.appendChild(el);
    });
  }
  document.getElementById('cg-overlay').style.display='';
}

function cgCheckFlavor(enemy){
  if(!enemy||!enemy.flavor) return;
  const pct=enemy.hp/enemy.maxHp;
  enemy.flavor.forEach((f,i)=>{
    if(!enemy.flavorShown[i]&&pct<=f.at){enemy.flavorShown[i]=true;cgShowBanner(f.text||'');}
  });
}

function cgEnd(won){
  if(cgs.ended) return; cgs.ended=true; cgClearTimers();
  document.getElementById('cg-battle').style.display='none';
  document.getElementById('cg-result').style.display='';
  document.getElementById('cg-result-title').textContent=won?'⚔️ Победа!':'💀 Поражение';
  const defeated=cgs.enemies.filter(e=>e.hp<=0).length;
  document.getElementById('cg-result-sub').textContent=
    'Ходов: '+cgs.turn+' · Карт сыграно: '+cgs.played+
    ' · HP: '+cgs.playerHp+'/'+cgs.playerMaxHp+
    ' · Врагов: '+defeated+'/'+cgs.enemies.length;
  const level=won?(cgs.playerHp>cgs.playerMaxHp*0.7?4:cgs.playerHp>cgs.playerMaxHp*0.3?3:2):1;
  setTimeout(()=>sendResultToBot({game:'card',win:won,outcome:won?'Победа':'Поражение',level,
    turns:cgs.turn,cards_played:cgs.played,
    player_hp_remaining:cgs.playerHp,player_max_hp:cgs.playerMaxHp,
    enemies_total:cgs.enemies.length,enemies_defeated:defeated,
    enemies_hp_remaining:cgs.enemies.reduce((a,e)=>a+Math.max(0,e.hp),0),
    lowest_hp:cgs.lowestHp,damage_taken:cgs.damageTaken}),800);
}
// Лимит раундов/времени исчерпан, а бой не решён — НЕ поражение, а конец сцены.
// Итоги уходят мастеру: он решает (напр. увести игрока на новый раунд).
function cgEndScene(reason){
  if(cgs.ended) return; cgs.ended=true; cgClearTimers();
  document.getElementById('cg-battle').style.display='none';
  document.getElementById('cg-result').style.display='';
  document.getElementById('cg-result-title').textContent='⏳ Конец сцены';
  const defeated=cgs.enemies.filter(e=>e.hp<=0).length;
  const enemyHp=cgs.enemies.reduce((a,e)=>a+Math.max(0,e.hp),0);
  const enemyMax=cgs.enemies.reduce((a,e)=>a+e.maxHp,0);
  document.getElementById('cg-result-sub').textContent=
    (reason?reason.charAt(0).toUpperCase()+reason.slice(1)+'. ':'')+
    'Ходов: '+cgs.turn+' · Герой HP: '+cgs.playerHp+'/'+cgs.playerMaxHp+
    ' · Враги HP: '+enemyHp+'/'+enemyMax+' ('+defeated+'/'+cgs.enemies.length+' повержено)';
  setTimeout(()=>sendResultToBot({game:'card',win:false,scene_end:true,outcome:'Конец сцены',
    reason:reason||'лимит',level:0,
    turns:cgs.turn,cards_played:cgs.played,
    player_hp_remaining:cgs.playerHp,player_max_hp:cgs.playerMaxHp,
    enemies_total:cgs.enemies.length,enemies_defeated:defeated,
    enemies_hp_remaining:enemyHp,enemies_max_hp:enemyMax,
    lowest_hp:cgs.lowestHp,damage_taken:cgs.damageTaken}),800);
}

const CG_GLOSSARY=[
  {key:'vulnerable',term:'Уязвимость',def:'Цель получает +50% урона в течение 2 ходов'},
  {key:'weak',term:'Слабость',def:'Цель атакует на −30% слабее в течение 2 ходов'},
  {key:'exhaust',term:'Истощение',def:'Карта удаляется из игры после использования (не в сброс)'},
  {key:'lifesteal',term:'Вампиризм',def:'Часть нанесённого урона восстанавливает HP героя'},
  {key:'heal',term:'Исцеление',def:'Восстанавливает HP напрямую, вне зависимости от урона'},
  {key:'energy',term:'Восстановление маны',def:'Немедленно возвращает ⚡ в этот же ход'},
  {key:'draw',term:'Добор карт',def:'Немедленно тянешь дополнительные карты из колоды'},
  {key:'block',term:'Блок',def:'Поглощает входящий урон до конца хода, потом сбрасывается'},
];

// Twilights lore glossary — shown in keyword popup for all cards
const CG_LORE_GLOSSARY = [
  {term:'Мерцание',def:'Единая природа всей боевой и магической силы — искажение пространства и материи.'},
  {term:'Слабое мерцание',def:'Повторяемое базовое действие. Каждый маг описывает его по-своему: волшебник — телекинез, друид — токи жизни.'},
  {term:'Сильное мерцание',def:'Мощный приём с перезарядкой — один раз за бой. Требует концентрации.'},
  {term:'Истощить',def:'Карта уходит из игры и не возвращается в колоду после этого боя.'},
  {term:'Уязвимость',def:'Цель берёт на 50% больше урона от атак.'},
  {term:'Слабость',def:'Отряд наносит на 30% меньше урона атаками.'},
  {term:'Броня',def:'Поглощает урон перед тем как HP снижается. Снимается в начале каждого хода.'},
];

function cgShowCardDetail(card){
  const icon=card.type==='attack'?'⚔️':card.type==='defense'?'🛡':'✨';
  const typeName=card.type==='attack'?'Атака':card.type==='defense'?'Защита':'Умение';
  document.getElementById('cg-detail-name').textContent=card.name+(card.rarity==='rare'?' ★':'');
  document.getElementById('cg-detail-meta').textContent=icon+' '+typeName+' · ⚡'+card.cost+(card.rarity==='rare'?' · Редкая':'');
  document.getElementById('cg-detail-desc').textContent=card.description;
  const gl=document.getElementById('cg-detail-glossary'); gl.innerHTML='';
  if(card.effect){
    CG_GLOSSARY.forEach(g=>{
      if(card.effect[g.key]){
        const d=document.createElement('div'); d.className='cg-detail-term';
        d.innerHTML='<div class="cg-detail-term-name">'+g.term+'</div><div class="cg-detail-term-def">'+g.def+'</div>';
        gl.appendChild(d);
      }
    });
  }
  // Show Twilights lore terms if card flavor references them
  if(card.flavor) {
    const flavorLow = card.flavor.toLowerCase();
    CG_LORE_GLOSSARY.forEach(g=>{
      if(flavorLow.includes(g.term.toLowerCase())){
        const d=document.createElement('div'); d.className='cg-detail-term';
        d.innerHTML='<div class="cg-detail-term-name" style="color:#a29bfe">'+g.term+'</div><div class="cg-detail-term-def">'+g.def+'</div>';
        gl.appendChild(d);
      }
    });
  }
  document.getElementById('cg-detail-overlay').style.display='';
}

function cgShowBanner(text){
  const b=document.createElement('div');
  b.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#eee;padding:14px 20px;border-radius:12px;font-size:0.9rem;font-style:italic;text-align:center;max-width:280px;z-index:999;line-height:1.5;';
  b.textContent=text; document.body.appendChild(b);
  b.onclick=()=>b.remove();
  setTimeout(()=>{ if(b.parentNode) b.remove(); },2500);
}

function cgLog(msg){ document.getElementById('cg-log').textContent=msg; }

setTimeout(()=>{ cgLoadCards().then(initCard); }, 0);
</script>

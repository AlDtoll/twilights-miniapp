// ──────────────────────────────────────────────
// Unit animation
// ──────────────────────────────────────────────
let activeAnimation = null;

function moveUnitAnimation(unit, path, onDone) {
  if (!path || path.length === 0) { onDone(); return; }
  let stepIdx = 0;
  const MS_PER_HEX = 120;

  function animStep() {
    if (stepIdx >= path.length) { onDone(); return; }
    const target = path[stepIdx];
    const { x: tx, z: tz } = hexToWorld(target.col, target.row);
    const ty = tileTopY(target.col, target.row);
    const startPos = { x: unit.mesh3d.position.x, y: unit.mesh3d.position.y, z: unit.mesh3d.position.z };
    const startTime = performance.now();

    activeAnimation = {
      update(now) {
        const t = Math.min(1, (now - startTime) / MS_PER_HEX);
        const ease = 1 - Math.pow(1 - t, 3);
        unit.mesh3d.position.x = startPos.x + (tx - startPos.x) * ease;
        unit.mesh3d.position.z = startPos.z + (tz - startPos.z) * ease;
        // Плавная интерполяция y по elevation
        unit.mesh3d.position.y = startPos.y + (ty - startPos.y) * ease;
        if (t >= 1) {
          unit.col = target.col;
          unit.row = target.row;
          stepIdx++;
          activeAnimation = null;
          animStep();
        }
      }
    };
  }
  animStep();
}

// ──────────────────────────────────────────────
// Fall damage
// ──────────────────────────────────────────────
function calcFallDamage(fromH, toH) {
  const delta = fromH - toH;
  return Math.max(0, (delta - 1) * 5);
}

function applyFallDamage(unit, fromH, toH) {
  const dmg = calcFallDamage(fromH, toH);
  if (dmg <= 0) return;
  const wp = unitWorldPos(unit);
  spawnDamageFloat(wp, `-${dmg} падение`, '#ff8800');
  fftLog(`${unit.name} получает урон от падения: −${dmg} HP.`, 'info');
  unit.hp = Math.max(0, unit.hp - dmg);
  if (unit.hp <= 0) {
    unit.alive = false;
    if (unit.mesh3d) {
      scene.remove(unit.mesh3d);
      unit.mesh3d.traverse(c => { if (c.geometry) c.geometry.dispose(); });
      unit.mesh3d = null;
    }
    fftLog(`${unit.name} погиб от падения!`, 'attack');
  }
}

function applyDeepWaterDamage(unit) {
  // При приземлении в deep_water — утонул
  const wp = unitWorldPos(unit);
  spawnDamageFloat(wp, '-20 утонул', '#1a5276');
  fftLog(`${unit.name} тонет в воде! −20 HP.`, 'info');
  unit.hp = Math.max(0, unit.hp - 20);
  if (unit.hp <= 0) {
    unit.alive = false;
    if (unit.mesh3d) {
      scene.remove(unit.mesh3d);
      unit.mesh3d.traverse(c => { if (c.geometry) c.geometry.dispose(); });
      unit.mesh3d = null;
    }
    fftLog(`${unit.name} утонул!`, 'attack');
  }
}

// ──────────────────────────────────────────────
// Jump animation (параболическая дуга)
// ──────────────────────────────────────────────
function jumpUnitAnimation(unit, destCol, destRow, fromH, onDone) {
  if (!unit.mesh3d) { onDone(); return; }
  const { x: tx, z: tz } = hexToWorld(destCol, destRow);
  const ty = tileTopY(destCol, destRow);
  const startPos = { x: unit.mesh3d.position.x, y: unit.mesh3d.position.y, z: unit.mesh3d.position.z };
  const startTime = performance.now();
  const DURATION = 400;
  const ARC_HEIGHT = 2.0; // юниты вверх в пике прыжка

  activeAnimation = {
    update(now) {
      const t = Math.min(1, (now - startTime) / DURATION);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      unit.mesh3d.position.x = startPos.x + (tx - startPos.x) * ease;
      unit.mesh3d.position.z = startPos.z + (tz - startPos.z) * ease;
      // параболическая Y: sin(t*π) создаёт дугу
      const arcY = Math.sin(t * Math.PI) * ARC_HEIGHT;
      unit.mesh3d.position.y = startPos.y + (ty - startPos.y) * ease + arcY;
      if (t >= 1) {
        unit.mesh3d.position.set(tx, ty, tz);
        unit.col = destCol;
        unit.row = destRow;
        activeAnimation = null;
        onDone();
      }
    }
  };
}

// ──────────────────────────────────────────────
// Push: вычислить hex назначения отброски
// ──────────────────────────────────────────────
function calcPushDestination(attacker, target) {
  // Направление: от attacker к target
  const ac = toCube(attacker.col, attacker.row);
  const tc = toCube(target.col, target.row);
  const dq = tc.q - ac.q;
  const dr = tc.r - ac.r;
  const ds = tc.s - ac.s;
  // Шаг нормализации — ищем сосед target в направлении dc/dr
  const isOdd = target.row % 2 === 1;
  const oddDirs  = [[0,-1],[+1,-1],[+1,0],[0,+1],[-1,0],[-1,-1]];
  const evenDirs = [[0,-1],[+1, 0],[+1,1],[0,+1],[-1,1],[-1, 0]];
  const dirs = isOdd ? oddDirs : evenDirs;

  // Находим neighbor target в наиболее подходящем направлении
  let bestNeighbor = null;
  let bestDot = -Infinity;
  for (const [dc, dr2] of dirs) {
    const nc = target.col + dc;
    const nr = target.row + dr2;
    if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) continue;
    const nc_cube = toCube(nc, nr);
    const ndq = nc_cube.q - tc.q;
    const ndr = nc_cube.r - tc.r;
    // dot product с направлением отброски (dq,dr)
    const dot = ndq * dq + ndr * dr;
    if (dot > bestDot) { bestDot = dot; bestNeighbor = { col: nc, row: nr }; }
  }
  return bestNeighbor;
}

// Push animation: лёгкая дуга 300ms
function pushUnitAnimation(unit, destCol, destRow, onDone) {
  if (!unit.mesh3d) { onDone(); return; }
  const { x: tx, z: tz } = hexToWorld(destCol, destRow);
  const ty = tileTopY(destCol, destRow);
  const startPos = { x: unit.mesh3d.position.x, y: unit.mesh3d.position.y, z: unit.mesh3d.position.z };
  const startTime = performance.now();
  const DURATION = 300;
  const ARC_HEIGHT = 0.8;

  activeAnimation = {
    update(now) {
      const t = Math.min(1, (now - startTime) / DURATION);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      unit.mesh3d.position.x = startPos.x + (tx - startPos.x) * ease;
      unit.mesh3d.position.z = startPos.z + (tz - startPos.z) * ease;
      const arcY = Math.sin(t * Math.PI) * ARC_HEIGHT;
      unit.mesh3d.position.y = startPos.y + (ty - startPos.y) * ease + arcY;
      if (t >= 1) {
        unit.mesh3d.position.set(tx, ty, tz);
        unit.col = destCol;
        unit.row = destRow;
        activeAnimation = null;
        onDone();
      }
    }
  };
}

// ──────────────────────────────────────────────
// UI: skill selection screen
// ──────────────────────────────────────────────
const PLAYER_HEROES = ['knight', 'ranger', 'mage'];
// В MP guest играет за enemy team
const GUEST_HEROES = ['grunt', 'archer', 'brute'];

function fftShowSkillScreen() {
  state.skillSelections = { 0: [], 1: [], 2: [] };
  const screen = document.getElementById('fft-skill-screen');
  screen.classList.add('show');
  const cols = document.getElementById('fft-skill-cols');
  cols.innerHTML = '';

  // В MP mode guest видит свои юниты (grunt/archer/brute)
  const myHeroes = mp.enabled && mp.myTeam === 'B' ? GUEST_HEROES : PLAYER_HEROES;

  // MP badge в заголовке
  if (mp.enabled) {
    const titleEl = document.getElementById('fft-skill-title');
    const teamLabel = mp.myTeam === 'A' ? 'Команда A (Герои)' : 'Команда B (Враги)';
    titleEl.textContent = `⚔ Выбор умений — ${teamLabel}`;
    updateMpReadyStatus();
  }

  myHeroes.forEach((cls, heroIdx) => {
    const def = UNIT_DEFS[cls];
    const cs = CLASS_SKILLS[cls];
    const col = document.createElement('div');
    col.className = 'fft-skill-col';
    col.innerHTML = `<div class="fft-skill-col-header">
      <span class="fft-skill-col-icon">${def.emoji}</span>
      <div class="fft-skill-col-name">${def.name}</div>
      <div class="fft-skill-col-class">Атк ${def.atk} | Ход ${def.moveRange}</div>
    </div>`;

    const basicSk = SKILL_DEFS[cs.basic];
    const basicCard = document.createElement('div');
    basicCard.className = 'fft-skill-card basic';
    basicCard.setAttribute('data-hero-idx', heroIdx);
    basicCard.setAttribute('data-skill-idx', 0);
    basicCard.innerHTML = `
      <span class="fft-skill-card-icon">${basicSk.icon}</span>
      <div class="fft-skill-card-name">${basicSk.name}</div>
      <div class="fft-skill-card-meta">Д:${basicSk.range} | Базовое</div>
    `;
    col.appendChild(basicCard);

    cs.specials.forEach((skId, skIdx) => {
      const sk = SKILL_DEFS[skId];
      const card = document.createElement('div');
      card.className = 'fft-skill-card';
      card.setAttribute('data-hero-idx', heroIdx);
      card.setAttribute('data-skill-idx', skIdx + 1);
      card.setAttribute('data-skill-id', skId);
      const metaParts = [];
      if (sk.range > 0) metaParts.push(`Д:${sk.range}`);
      if (sk.aoe > 0) metaParts.push('АоЕ');
      if (sk.cd > 0) metaParts.push(`КД:${sk.cd}`);
      if (sk.effect) metaParts.push(
        sk.effect === 'stun' ? 'Оглуш' :
        sk.effect === 'immobilize' ? 'Стоп' :
        sk.effect === 'slow' ? 'Замедл' :
        sk.effect === 'barrier' ? 'Барьер' : ''
      );
      card.innerHTML = `
        <div class="fft-skill-sel-badge">✓</div>
        <span class="fft-skill-card-icon">${sk.icon}</span>
        <div class="fft-skill-card-name">${sk.name}</div>
        <div class="fft-skill-card-meta">${metaParts.join(' | ')}</div>
      `;
      card.addEventListener('click', () => fftToggleSkill(heroIdx, skId, card));
      col.appendChild(card);
    });
    cols.appendChild(col);
  });
  fftUpdateSkillStartBtn();
}

function fftToggleSkill(heroIdx, skId, card) {
  const sel = state.skillSelections[heroIdx];
  if (sel.includes(skId)) {
    state.skillSelections[heroIdx] = sel.filter(s => s !== skId);
    card.classList.remove('selected');
  } else {
    if (sel.length >= 2) {
      const removedId = sel.shift();
      const cols = document.getElementById('fft-skill-cols');
      const removedCard = cols.querySelector(`[data-skill-id="${removedId}"]`);
      if (removedCard) removedCard.classList.remove('selected');
    }
    sel.push(skId);
    card.classList.add('selected');
  }
  fftUpdateSkillStartBtn();
}

function fftUpdateSkillStartBtn() {
  const btn = document.getElementById('fft-start-battle');
  const hint = document.getElementById('fft-skill-hint');
  const allSelected = [0, 1, 2].every(i => state.skillSelections[i].length === 2);
  btn.disabled = !allSelected;
  if (allSelected) {
    hint.textContent = 'Все умения выбраны!';
  } else {
    const missing = [0, 1, 2].filter(i => state.skillSelections[i].length < 2);
    const names = missing.map(i => UNIT_DEFS[PLAYER_HEROES[i]].name);
    hint.textContent = `Выбери 2 умения: ${names.join(', ')}`;
  }
}

// Глобально доступна для onclick из HTML
window.fftStartBattle = async function() {
  // Определяем какие герои наши в зависимости от режима
  const myHeroes = mp.enabled && mp.myTeam === 'B'
    ? ['grunt', 'archer', 'brute']
    : PLAYER_HEROES;

  // Применяем выбранные скилы к своим юнитам
  myHeroes.forEach((cls, heroIdx) => {
    const unit = state.units.find(u => u.defKey === cls);
    if (!unit) return;
    const cs = CLASS_SKILLS[cls];
    const selected = state.skillSelections[heroIdx] || [];
    unit.abilities = [cs.basic, ...selected];
    unit.cooldowns = {};
    for (const abId of unit.abilities) unit.cooldowns[abId] = 0;
  });

  if (mp.enabled) {
    // MP: отправляем skills на сервер, затем ready
    const btn = document.getElementById('fft-start-battle');
    btn.disabled = true;
    btn.textContent = '⏳ Отправка…';

    // Формируем skills payload: {unitId: [skillId, ...]}
    const skillsPayload = {};
    myHeroes.forEach((cls, heroIdx) => {
      const unit = state.units.find(u => u.defKey === cls);
      if (!unit) return;
      skillsPayload[unit.id] = unit.abilities;
    });

    await apiPostAction(mp.roomId, mp.token, {
      type: 'set-skills',
      skills: skillsPayload
    });
    await apiPostAction(mp.roomId, mp.token, { type: 'ready' });

    mp.iReady = true;
    updateMpReadyStatus();
    btn.textContent = '✅ Готов! Ждём…';
    // Дальше ждём SSE — сервер перейдёт в battle phase
    return;
  }

  // Solo mode
  document.getElementById('fft-skill-screen').classList.remove('show');
  state.phase = 'player-turn';
  // Инициализация FoW: все гексы hidden, затем раскрываем initial vision
  initFoW();
  recomputeFoW();
  fftLog('Бой начался! Ход игрока.', 'info');
  fftUpdateUI();
};

// ──────────────────────────────────────────────
// Forecast
// ──────────────────────────────────────────────
function fftShowForecast(attacker, target, skill) {
  state.forecastTarget = target;
  state.uiMode = 'forecast';
  const sk = skill || SKILL_DEFS[attacker.abilities[0]];
  const isHeal = sk && sk.type === 'heal';
  const isBarrier = sk && sk.effect === 'barrier';

  let title = '', dmgText = '', hitText = '', armorText = '';
  if (isBarrier) {
    title = `🔰 ${attacker.name}: Заслон`;
    dmgText = '+1 барьер (следующий удар поглощён)';
    hitText = 'Успех: 100%';
  } else if (isHeal && target) {
    const healAmt = Math.min(target.maxHp - target.hp, -sk.dmgMod);
    title = `💚 ${attacker.name} → ${target.name}: Лечение`;
    dmgText = `Восстановит: ${healAmt} HP`;
    hitText = 'Успех: 100%';
  } else if (sk && sk.aoe > 0 && target) {
    const dmg = fftCalcDamage(attacker, target, sk);
    title = `${sk.icon} ${attacker.name}: ${sk.name} (АоЕ ${sk.aoe})`;
    dmgText = `Урон: ~${dmg} HP (базовый, по всем в радиусе ${sk.aoe})`;
    hitText = `Попадание: ${fftCalcHitChance(attacker, target, sk)}%${fftForestPenaltyLabel(attacker, target, sk)}`;
    armorText = target ? `Броня цели: ${target.armor || 0}% (шанс блок -3)` : '';
  } else if (target) {
    const dmg = fftCalcDamage(attacker, target, sk);
    const hit = fftCalcHitChance(attacker, target, sk);
    title = `${sk ? sk.icon : '⚔'} ${attacker.name} [${sk ? sk.name : ''}] → ${target.name}`;
    dmgText = `Урон: ${dmg} (базовый)`;
    if (target.barrier) dmgText += ' [барьер!]';
    hitText = `Попадание: ${hit}%${fftForestPenaltyLabel(attacker, target, sk)}`;
    armorText = `Броня цели: ${target.armor || 0}% (шанс блок -3)`;
  }

  document.getElementById('fft-forecast-title').textContent = title;
  document.getElementById('fft-forecast-dmg').textContent   = dmgText;
  document.getElementById('fft-forecast-hit').textContent   = hitText;
  document.getElementById('fft-forecast-armor').textContent = armorText;
  document.getElementById('fft-forecast-bar').style.display = 'block';
}

window.fftCancelForecast = function() {
  state.forecastTarget = null;
  state.aoePreviewTarget = null;
  state.uiMode = 'ability';
  document.getElementById('fft-forecast-bar').style.display = 'none';
  // Восстанавливаем подсветку range
  if (state.selectedUnit && state.selectedAbility) {
    showAbilityRange(state.selectedUnit, state.selectedAbility);
  }
  fftUpdateUI();
};

window.fftConfirmAttack = function() {
  const attacker = state.selectedUnit;
  const target   = state.forecastTarget;
  const skill    = state.selectedAbility;
  if (!attacker) return;

  document.getElementById('fft-forecast-bar').style.display = 'none';
  state.forecastTarget = null;
  state.aoePreviewTarget = null;
  state.uiMode = 'idle';

  const sk = skill || SKILL_DEFS[attacker.abilities[0]];
  const isBarrier = sk && sk.effect === 'barrier';
  const isHeal = sk && sk.type === 'heal';

  // MP: отправляем действие на сервер, не применяем локально (server authoritative)
  if (mp.enabled) {
    let actionType = 'attack';
    if (isBarrier) actionType = 'attack'; // guard/barrier — тоже как attack
    if (sk && sk.isJump) actionType = 'jump';
    if (sk && sk.effect && sk.effect.startsWith('push:')) actionType = 'push';
    const action = {
      type: actionType,
      unitId: attacker.id,
      skillId: sk ? sk.id : null,
      targetUnitId: target ? target.id : null,
      targetCol: target ? target.col : null,
      targetRow: target ? target.row : null,
    };
    submitAction(action);
    attacker.acted = true;
    state.selectedAbility = null;
    clearGlowHighlights();
    if (attacker.alive) showSelectedRing(attacker);
    fftUpdateUI();
    return;
  }

  // Solo mode — сохраняем оригинальную логику ниже

  if (isBarrier) {
    attacker.barrier = true;
    attacker.acted = true;
    fftLog(`${attacker.name} использует Заслон — барьер активен!`, 'special');
    if (sk && sk.cd > 0 && attacker.cooldowns) attacker.cooldowns[sk.id] = sk.cd;
    state.selectedAbility = null;
    updateUnitMeshes();
    checkWinLose();
    clearGlowHighlights();
    if (attacker.alive && state.selectedUnit && state.selectedUnit.id === attacker.id) showSelectedRing(attacker);
    fftUpdateUI();
    return;
  }

  if (isHeal && target) {
    const healAmt = -sk.dmgMod;
    fftDealDamage(target, healAmt, attacker, sk);
    fftLog(`${attacker.name} лечит ${target.name}: +${healAmt} HP.`, 'heal');
    attacker.acted = true;
    if (sk && sk.cd > 0 && attacker.cooldowns) attacker.cooldowns[sk.id] = sk.cd;
    state.selectedAbility = null;
    updateUnitMeshes();
    checkWinLose();
    clearGlowHighlights();
    if (attacker.alive && state.selectedUnit && state.selectedUnit.id === attacker.id) showSelectedRing(attacker);
    fftUpdateUI();
    return;
  }

  // Толчок (push:1)
  if (sk && sk.effect && sk.effect.startsWith('push:') && target) {
    const dmg = fftCalcDamage(attacker, target, sk);
    const fromH = getCell(target.col, target.row).height;
    fftDealDamage(target, dmg, attacker, sk);
    fftLog(`${attacker.name} [${sk.name}] → ${target.name}: −${dmg} HP.`, attacker.team === 'player' ? 'attack' : 'info');
    attacker.acted = true;
    if (sk.cd > 0 && attacker.cooldowns) attacker.cooldowns[sk.id] = sk.cd;
    state.selectedAbility = null;
    // Поворот к цели
    if (attacker.mesh3d && target) {
      const { x: tx, z: tz } = hexToWorld(target.col, target.row);
      attacker.mesh3d.lookAt(new THREE.Vector3(tx, attacker.mesh3d.position.y, tz));
    }
    // Push logic
    if (target.alive) {
      const dest = calcPushDestination(attacker, target);
      if (dest) {
        const destCell = getCell(dest.col, dest.row);
        const destOccupied = state.units.find(u => u.alive && u.col === dest.col && u.row === dest.row);
        const isBlocking = destCell.type === 'rock' || destOccupied;
        if (!isBlocking) {
          // Анимируем отброску
          pushUnitAnimation(target, dest.col, dest.row, () => {
            const toH = getCell(target.col, target.row).height;
            if (toH < fromH) applyFallDamage(target, fromH, toH);
            if (destCell.type === 'deep_water' || destCell.type === 'water') applyDeepWaterDamage(target);
            updateUnitMeshes();
            checkWinLose();
            clearGlowHighlights();
            if (attacker.alive && state.selectedUnit && state.selectedUnit.id === attacker.id) showSelectedRing(attacker);
            fftUpdateUI();
          });
          return;
        } else {
          fftLog(`${target.name} не может быть отброшен — путь заблокирован.`, 'info');
        }
      }
    }
    updateUnitMeshes();
    checkWinLose();
    clearGlowHighlights();
    if (attacker.alive && state.selectedUnit && state.selectedUnit.id === attacker.id) showSelectedRing(attacker);
    fftUpdateUI();
    return;
  }

  if (sk && sk.aoe > 0 && target) {
    fftApplyAoe(target.col, target.row, attacker, sk);
    attacker.acted = true;
  } else if (target) {
    const hit  = fftCalcHitChance(attacker, target, sk);
    const dmg  = fftCalcDamage(attacker, target, sk);
    const roll = Math.random() * 100;
    if (roll < hit) {
      fftDealDamage(target, dmg, attacker, sk);
      fftLog(`${attacker.name} [${sk ? sk.name : 'Атака'}] → ${target.name}: −${dmg} HP.`, attacker.team === 'player' ? 'attack' : 'info');
    } else {
      fftLog(`${attacker.name} → ${target.name}: МИМО (уклонение ${target.evasion || 0}).`, 'info');
    }
    attacker.acted = true;
  }

  if (sk && sk.cd > 0 && attacker.cooldowns) {
    attacker.cooldowns[sk.id] = sk.cd;
  }
  state.selectedAbility = null;

  // После атаки — поворачиваем юнита к цели
  if (target && attacker.mesh3d) {
    const { x: tx, z: tz } = hexToWorld(target.col, target.row);
    attacker.mesh3d.lookAt(new THREE.Vector3(tx, attacker.mesh3d.position.y, tz));
  }

  updateUnitMeshes();
  checkWinLose();
  clearGlowHighlights();
  if (attacker.alive && state.selectedUnit && state.selectedUnit.id === attacker.id) {
    showSelectedRing(attacker);
  }
  fftUpdateUI();
};

// ──────────────────────────────────────────────
// Game logic — select/deselect
// ──────────────────────────────────────────────
function selectUnit(unit) {
  state.selectedUnit = unit;
  state.uiMode = 'idle';
  state.reachableCache = null;
  state.selectedAbility = null;
  state.forecastTarget = null;
  clearGlowHighlights();
  showSelectedRing(unit);

  if (!unit.moved && !unit.stunned && !unit.immobilized) {
    state.reachableCache = fftReachable(unit);
    showCombinedHighlight(unit, state.reachableCache);
    state.uiMode = 'move';
  } else if (!unit.acted) {
    showAttackRange(unit);
    state.uiMode = 'attack';
  }
  fftUpdateUI();
}

function deselectUnit() {
  state.selectedUnit = null;
  state.uiMode = 'idle';
  state.reachableCache = null;
  state.selectedAbility = null;
  state.forecastTarget = null;
  clearGlowHighlights();
  clearSelectedRing();
  document.getElementById('fft-forecast-bar').style.display = 'none';
  fftUpdateUI();
}

window.fftDeselectUnitUI = function() { deselectUnit(); };

// ──────────────────────────────────────────────
// Ability selection
// ──────────────────────────────────────────────
function fftSelectAbility(skillId) {
  if (!state.selectedUnit) return;
  const sk = SKILL_DEFS[skillId];
  if (!sk) return;
  if (state.selectedUnit.acted) { fftLog('Юнит уже атаковал.', 'info'); return; }
  const cd = state.selectedUnit.cooldowns[skillId] || 0;
  if (cd > 0) { fftLog(`${sk.name} на перезарядке (${cd} ход).`, 'info'); return; }

  const isCurrentSkill = (state.uiMode === 'ability' || state.uiMode === 'jump') &&
    state.selectedAbility && state.selectedAbility.id === skillId;

  if (isCurrentSkill) {
    // Повторный клик — отмена
    state.uiMode = 'idle';
    state.selectedAbility = null;
    state.forecastTarget = null;
    state.aoePreviewTarget = null;
    document.getElementById('fft-forecast-bar').style.display = 'none';
    clearGlowHighlights();
    fftUpdateUI();
    return;
  }

  state.selectedAbility = sk;
  // Прыжок получает специальный режим 'jump'
  state.uiMode = sk.isJump ? 'jump' : 'ability';
  state.reachableCache = null;
  state.forecastTarget = null;
  document.getElementById('fft-forecast-bar').style.display = 'none';

  showAbilityRange(state.selectedUnit, sk);

  // Self-buff сразу показываем forecast
  if (sk.targetSelf) {
    fftShowForecast(state.selectedUnit, null, sk);
  }
  fftUpdateUI();
}

window.fftSkipUnit = function() {
  if (!state.selectedUnit) return;
  const unit = state.selectedUnit;
  if (mp.enabled) {
    submitAction({ type: 'skip-unit', unitId: unit.id });
    unit.moved = true;
    unit.acted = true;
    fftLog(`${unit.name} пропускает ход.`, 'info');
    deselectUnit();
    return;
  }
  unit.moved = true;
  unit.acted = true;
  fftLog(`${unit.name} пропускает ход.`, 'info');
  deselectUnit();
};

window.fftCancel = function() {
  if (state.uiMode === 'idle') return;
  state.uiMode = 'idle';
  state.selectedAbility = null;
  state.forecastTarget = null;
  state.aoePreviewTarget = null;
  document.getElementById('fft-forecast-bar').style.display = 'none';
  clearGlowHighlights();
  if (state.selectedUnit && !state.selectedUnit.moved && !state.selectedUnit.stunned && !state.selectedUnit.immobilized) {
    state.reachableCache = fftReachable(state.selectedUnit);
    showCombinedHighlight(state.selectedUnit, state.reachableCache);
    state.uiMode = 'move';
  }
  fftUpdateUI();
};

window.fftEndTurn = function() {
  if (state.phase === 'won' || state.phase === 'lost' || state.phase === 'skill-select') return;
  if (state.phase === 'player-turn') {
    if (mp.enabled) {
      // MP: отправляем end-turn на сервер, UI блокируем до SSE ответа
      deselectUnit();
      submitAction({ type: 'end-turn' }).then(() => {
        state.phase = 'enemy-turn';
        document.getElementById('fft-enemy-banner').classList.add('show');
        document.getElementById('fft-enemy-banner').textContent = '⚔ Ход противника…';
        fftLog('Конец хода. Ждём противника…', 'info');
        stopTurnTimer();
        updateMpStatusBar('enemy-turn');
        fftUpdateUI();
      });
      return;
    }
    // Solo mode
    state.units.filter(u => u.alive && u.team === 'player').forEach(u => applyStartOfTurnEffects(u));
    state.units.filter(u => u.alive && u.team === 'enemy').forEach(u => { u.moved = false; u.acted = false; });
    state.phase = 'enemy-turn';
    state.selectedUnit = null;
    state.selectedAbility = null;
    state.uiMode = 'idle';
    state.reachableCache = null;
    clearGlowHighlights();
    clearSelectedRing();
    document.getElementById('fft-forecast-bar').style.display = 'none';
    document.getElementById('fft-enemy-banner').classList.add('show');
    fftLog('Ход врага!', 'attack');
    fftUpdateUI();
    setTimeout(() => fftEnemyTurnStep(), 500);
  }
};

// ──────────────────────────────────────────────
// Enemy AI
// ──────────────────────────────────────────────
function fftAIPickTarget(enemy) {
  const players = state.units.filter(u => u.alive && u.team === 'player');
  if (players.length === 0) return null;
  players.sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp));
  return players[0];
}

function fftAIPickAbility(enemy) {
  const available = enemy.abilities.filter(abId => (enemy.cooldowns[abId] || 0) === 0);
  const specials = available.filter(abId => !SKILL_DEFS[abId].isBasic);
  if (specials.length > 0) return SKILL_DEFS[specials[0]];
  return SKILL_DEFS[available[0]] || null;
}

function fftEnemyTurnStep() {
  if (state.phase !== 'enemy-turn') return;

  const enemies = state.units.filter(u => u.alive && u.team === 'enemy' && !u.acted);
  if (enemies.length === 0) {
    // Конец хода врага
    state.units.filter(u => u.alive && u.team === 'enemy').forEach(u => {
      decrementCooldowns(u);
      applyStartOfTurnEffects(u);
      u.stunned = false;
      u.immobilized = false;
      u.slowed = false;
    });
    if (checkWinLose()) return;

    // Начало хода игрока
    document.getElementById('fft-enemy-banner').classList.remove('show');
    state.units.filter(u => u.alive && u.team === 'player').forEach(u => {
      decrementCooldowns(u);
      applyStartOfTurnEffects(u);
      u.stunned = false;
      u.immobilized = false;
      u.slowed = false;
      u.moved = false;
      u.acted = false;
    });
    state.phase = 'player-turn';
    // Пересчитываем FoW в начале хода игрока
    recomputeFoW();
    fftLog('Ход игрока!', 'info');
    fftUpdateUI();
    return;
  }

  const enemy = enemies[0];

  if (enemy.stunned) {
    fftLog(`${enemy.name} оглушён — пропускает ход.`, 'info');
    enemy.acted = true;
    enemy.moved = true;
    updateUnitMeshes();
    setTimeout(() => fftEnemyTurnStep(), 400);
    return;
  }

  const target = fftAIPickTarget(enemy);
  if (!target) { checkWinLose(); return; }

  const ability = fftAIPickAbility(enemy);
  const effectiveRange = ability ? ability.range : enemy.atkRange;
  const dist = hexDist(enemy.col, enemy.row, target.col, target.row);
  const desiredDist = enemy.isRanged ? effectiveRange : 1;

  // Проверка LoS для ranged/magic. Melee (atkRange=1) — LoS всегда true.
  const needsLoS = ability
    ? (ability.type === 'ranged' || ability.type === 'magic')
    : enemy.atkRange > 1;
  const hasLoS = !needsLoS || fftHasLoS(enemy.col, enemy.row, target.col, target.row);

  if (dist <= effectiveRange && !enemy.acted) {
    if (!hasLoS) {
      // LoS заблокирован — пропустить атаку
      fftLog(`${enemy.name}: нет линии взора до цели, атака пропущена.`, 'info');
      enemy.acted = true;
      updateUnitMeshes();
      if (!checkWinLose()) setTimeout(() => fftEnemyTurnStep(), 400);
      return;
    }
    fftAIDoAttack(enemy, target, ability, () => {
      updateUnitMeshes();
      if (!checkWinLose()) setTimeout(() => fftEnemyTurnStep(), 500);
    });
    return;
  }

  if (!enemy.moved && !enemy.immobilized) {
    fftAIMove(enemy, target, desiredDist, () => {
      const newDist = hexDist(enemy.col, enemy.row, target.col, target.row);
      const newHasLoS = !needsLoS || fftHasLoS(enemy.col, enemy.row, target.col, target.row);
      if (newDist <= effectiveRange && !enemy.acted && newHasLoS) {
        fftAIDoAttack(enemy, target, ability, () => {
          updateUnitMeshes();
          if (!checkWinLose()) setTimeout(() => fftEnemyTurnStep(), 500);
        });
      } else {
        if (!newHasLoS && newDist <= effectiveRange) {
          fftLog(`${enemy.name}: нет линии взора после хода, атака пропущена.`, 'info');
        }
        enemy.acted = true;
        updateUnitMeshes();
        if (!checkWinLose()) setTimeout(() => fftEnemyTurnStep(), 500);
      }
    });
    return;
  }

  enemy.acted = true;
  updateUnitMeshes();
  if (!checkWinLose()) setTimeout(() => fftEnemyTurnStep(), 400);
}

function fftAIDoAttack(enemy, target, ability, done) {
  const sk = ability || SKILL_DEFS[enemy.abilities[0]] || null;
  const hit  = fftCalcHitChance(enemy, target, sk);
  const roll = Math.random() * 100;

  if (sk && sk.aoe > 0) {
    fftApplyAoe(target.col, target.row, enemy, sk);
  } else if (roll < hit) {
    const dmg = fftCalcDamage(enemy, target, sk);
    fftDealDamage(target, dmg, enemy, sk);
    fftLog(`${enemy.name} [${sk ? sk.name : 'Атака'}] → ${target.name}: −${dmg} HP.`, 'attack');
  } else {
    fftLog(`${enemy.name} → ${target.name}: МИМО (уклонение ${target.evasion || 0}).`, 'info');
  }

  if (sk && sk.cd > 0) enemy.cooldowns[sk.id] = sk.cd;
  enemy.acted = true;
  enemy.moved = true;

  // Поворачиваем к цели
  if (enemy.mesh3d && target.alive) {
    const { x: tx, z: tz } = hexToWorld(target.col, target.row);
    enemy.mesh3d.lookAt(new THREE.Vector3(tx, enemy.mesh3d.position.y, tz));
  }
  done();
}

function fftAIMove(enemy, target, desiredDist, done) {
  if (enemy.immobilized) {
    enemy.moved = true;
    fftLog(`${enemy.name} обездвижен.`, 'info');
    done();
    return;
  }
  const moveRange = enemy.slowed ? Math.max(1, Math.floor(enemy.moveRange / 2)) : enemy.moveRange;
  const blocked = new Set(
    state.units.filter(u => u.alive && u.id !== enemy.id && u.id !== target.id).map(u => `${u.col},${u.row}`)
  );
  const fullPath = fftFindPath(enemy.col, enemy.row, target.col, target.row, blocked);
  if (!fullPath || fullPath.length === 0) { enemy.moved = true; done(); return; }

  let maxSteps = desiredDist > 1 ? Math.max(0, fullPath.length - desiredDist) : Math.min(moveRange, fullPath.length - 1);
  maxSteps = Math.min(maxSteps, moveRange);
  if (maxSteps <= 0) { enemy.moved = true; done(); return; }

  let path = fullPath.slice(0, maxSteps);
  while (path.length > 0) {
    const last = path[path.length - 1];
    const blocker = state.units.find(u => u.alive && u.id !== enemy.id && u.col === last.col && u.row === last.row);
    if (!blocker) break;
    path = path.slice(0, -1);
  }
  if (path.length === 0) { enemy.moved = true; done(); return; }

  moveUnitAnimation(enemy, path, () => {
    enemy.moved = true;
    done();
  });
}

// ──────────────────────────────────────────────
// Raycasting tap
// ──────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();
let pointerDownPos = null;
let pointerDragged = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
  pointerDragged = false;
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (pointerDownPos) {
    const dx = e.clientX - pointerDownPos.x;
    const dy = e.clientY - pointerDownPos.y;
    if (Math.sqrt(dx * dx + dy * dy) > 6) pointerDragged = true;
  }
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (pointerDragged || !pointerDownPos) { pointerDownPos = null; return; }
  pointerDownPos = null;
  if (activeAnimation) return;
  if (state.phase !== 'player-turn') return;
  if (state.uiMode === 'forecast') return;
  // В MP режиме: если это ход противника (по SSE) — блокируем ввод
  if (mp.enabled && state.phase !== 'player-turn') return;

  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
  pointer.y = ((e.clientY - rect.top)  / rect.height) * -2 + 1;
  raycaster.setFromCamera(pointer, camera);

  // Попытка 1: unit meshes
  const unitObjects = [];
  for (const u of state.units) {
    if (u.alive && u.mesh3d) u.mesh3d.traverse(child => { if (child.isMesh) unitObjects.push(child); });
  }
  const unitHits = raycaster.intersectObjects(unitObjects, false);
  if (unitHits.length > 0) {
    const hitMesh = unitHits[0].object;
    let hitUnit = null;
    for (const u of state.units) {
      if (!u.alive || !u.mesh3d) continue;
      let found = false;
      u.mesh3d.traverse(child => { if (child === hitMesh) found = true; });
      if (found) { hitUnit = u; break; }
    }
    if (hitUnit) { handleUnitTap(hitUnit); return; }
  }

  // Попытка 2: tile meshes
  const tileObjects = [];
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      if (tileMeshes[r][c]) tileObjects.push(tileMeshes[r][c]);
    }
  }
  const tileHits = raycaster.intersectObjects(tileObjects, false);
  if (tileHits.length > 0) {
    const hitTile = tileHits[0].object;
    handleTileTap(hitTile.userData.col, hitTile.userData.row);
    return;
  }

  // Попытка 3: glow overlays
  if (state.uiMode === 'move' && glowMeshes.length > 0) {
    const glowHits = raycaster.intersectObjects(glowMeshes, false);
    if (glowHits.length > 0) {
      const hitPos = glowHits[0].object.position;
      let bestKey = null, bestDist = Infinity;
      if (state.reachableCache) {
        for (const [key] of state.reachableCache) {
          const [c, rr] = key.split(',').map(Number);
          const { x, z } = hexToWorld(c, rr);
          const d = Math.hypot(hitPos.x - x, hitPos.z - z);
          if (d < bestDist) { bestDist = d; bestKey = key; }
        }
      }
      if (bestKey) {
        const [c, rr] = bestKey.split(',').map(Number);
        handleTileTap(c, rr);
      }
    }
  }
});

function handleUnitTap(unit) {
  const sel = state.selectedUnit;

  // В режиме jump — клик по юниту = занятый hex, нельзя прыгнуть
  if (state.uiMode === 'jump') {
    if (unit.id !== sel.id) fftLog('Hex занят, нельзя прыгнуть.', 'info');
    return;
  }

  // В режиме ability — клик по валидной цели
  if (state.uiMode === 'ability' && sel && state.selectedAbility) {
    const sk = state.selectedAbility;
    if (sk.targetSelf && unit.id === sel.id) {
      fftShowForecast(sel, null, sk);
      return;
    }
    if (sk.targetAlly && unit.team === sel.team && unit.id !== sel.id) {
      const d = hexDist(sel.col, sel.row, unit.col, unit.row);
      if (d <= sk.range) { fftShowForecast(sel, unit, sk); return; }
      fftLog(`Цель слишком далеко (дальность: ${sk.range}).`, 'info'); return;
    }
    if (!sk.targetSelf && !sk.targetAlly && unit.team !== sel.team) {
      const d = hexDist(sel.col, sel.row, unit.col, unit.row);
      if (d > sk.range) { fftLog(`Цель вне дальности (${sk.range}).`, 'info'); return; }
      // LoS check для ranged/magic
      const needsLoS = sk.type === 'ranged' || sk.type === 'magic';
      if (needsLoS && !fftHasLoS(sel.col, sel.row, unit.col, unit.row)) {
        fftLog(`Нет линии взора до ${unit.name} (заблокировано).`, 'info');
        return;
      }
      if (sk.aoe > 0) {
        // AoE: первый тап — preview, второй тап на ту же цель — confirm
        const prev = state.aoePreviewTarget;
        if (prev && prev.col === unit.col && prev.row === unit.row) {
          state.aoePreviewTarget = null;
          fftShowForecast(sel, unit, sk);
        } else {
          state.aoePreviewTarget = unit;
          showAoEPreview(unit.col, unit.row, sk);
        }
        return;
      }
      fftShowForecast(sel, unit, sk);
      return;
    }
    return;
  }

  // Враг в режиме move/attack/idle
  if (unit.team === 'enemy' && sel && sel.team === 'player') {
    if (!sel.acted) {
      const d = hexDist(sel.col, sel.row, unit.col, unit.row);
      if (d <= sel.atkRange) {
        // Используем базовую атаку через forecast
        state.selectedAbility = SKILL_DEFS[sel.abilities[0]];
        fftShowForecast(sel, unit, state.selectedAbility);
        return;
      }
    }
    return;
  }

  if (unit.team !== 'player') return;

  if (sel && sel.id === unit.id) {
    deselectUnit();
    return;
  }
  if (unit.moved && unit.acted) { fftLog(`${unit.name} уже отыграл.`, 'info'); return; }
  selectUnit(unit);
}

function handleTileTap(col, row) {
  // Прыжок: клик на пустой hex в радиусе
  if (state.uiMode === 'jump' && state.selectedUnit && state.selectedAbility) {
    const sk = state.selectedAbility;
    const unit = state.selectedUnit;
    const d = hexDist(unit.col, unit.row, col, row);
    if (d <= 0 || d > sk.range) { fftLog('Цель вне дальности прыжка.', 'info'); return; }
    const destCell = getCell(col, row);
    if (destCell.type === 'rock' || destCell.type === 'deep_water' || destCell.type === 'water') {
      fftLog('Сюда прыгнуть нельзя.', 'info'); return;
    }
    const occupied = state.units.find(u => u.alive && u.col === col && u.row === row);
    if (occupied) { fftLog('Hex занят.', 'info'); return; }

    const fromH = getCell(unit.col, unit.row).height;
    clearGlowHighlights();
    clearSelectedRing();
    state.uiMode = 'idle';
    state.selectedAbility = null;
    jumpUnitAnimation(unit, col, row, fromH, () => {
      const toH = getCell(unit.col, unit.row).height;
      // Применяем fall damage (прыжок вниз на Δh>1)
      if (toH < fromH) applyFallDamage(unit, fromH, toH);
      // Deep water landing
      if (destCell.type === 'deep_water' || destCell.type === 'water') applyDeepWaterDamage(unit);
      if (sk.cd > 0) unit.cooldowns[sk.id] = sk.cd;
      unit.moved = true;
      unit.acted = true;
      fftLog(`${unit.name} прыгнул на [${col},${row}].`, 'special');
      // Пересчитываем FoW после прыжка player-юнита
      if (unit.team === 'player') recomputeFoW();
      updateUnitMeshes();
      checkWinLose();
      if (unit.alive) showSelectedRing(unit);
      fftUpdateUI();
    });
    return;
  }

  if (state.uiMode === 'ability' && state.selectedUnit && state.selectedAbility) {
    const sk = state.selectedAbility;
    const unit = state.units.find(u => u.alive && u.col === col && u.row === row);
    if (sk.targetSelf) {
      if (col === state.selectedUnit.col && row === state.selectedUnit.row) {
        fftShowForecast(state.selectedUnit, null, sk);
      } else {
        fftLog('Умение применяется к себе — нажми на своего героя.', 'info');
      }
      return;
    }
    if (sk.targetAlly && unit && unit.team === state.selectedUnit.team && unit.id !== state.selectedUnit.id) {
      const d = hexDist(state.selectedUnit.col, state.selectedUnit.row, unit.col, unit.row);
      if (d <= sk.range) { fftShowForecast(state.selectedUnit, unit, sk); return; }
    }
    if (!sk.targetSelf && !sk.targetAlly) {
      if (sk.aoe > 0) {
        // AoE: можно тапнуть как по юниту, так и по пустому гексу
        const d = hexDist(state.selectedUnit.col, state.selectedUnit.row, col, row);
        if (d > 0 && d <= sk.range) {
          const prev = state.aoePreviewTarget;
          if (prev && prev.col === col && prev.row === row) {
            // Второй тап — confirm (используем юнита на гексе или null как центр)
            state.aoePreviewTarget = null;
            // Ищем реального врага на тайле или в AoE-зоне для forecast
            const centerUnit = state.units.find(u => u.alive && u.col === col && u.row === row && u.team !== state.selectedUnit.team)
              || state.units.find(u => u.alive && u.team !== state.selectedUnit.team && hexDist(col, row, u.col, u.row) <= sk.aoe)
              || { col, row, name: 'область', hp: 0, maxHp: 1, barrier: false, team: 'enemy', def: 0 };
            fftShowForecast(state.selectedUnit, centerUnit, sk);
          } else {
            // Первый тап — preview
            state.aoePreviewTarget = { col, row };
            showAoEPreview(col, row, sk);
          }
          return;
        }
      } else if (unit && unit.team !== state.selectedUnit.team) {
        const d = hexDist(state.selectedUnit.col, state.selectedUnit.row, unit.col, unit.row);
        if (d <= sk.range) { fftShowForecast(state.selectedUnit, unit, sk); return; }
      }
    }
    // Клик в пустоту в режиме ability — ничего не делаем
    return;
  }

  if (state.uiMode === 'move' && state.selectedUnit) {
    const key = `${col},${row}`;
    if (state.reachableCache && state.reachableCache.has(key)) {
      const { path } = state.reachableCache.get(key);
      const movingUnit = state.selectedUnit;
      clearGlowHighlights();
      clearSelectedRing();
      state.forecastTarget = null;

      if (mp.enabled) {
        // MP: отправляем move на сервер, анимируем локально оптимистично
        submitAction({ type: 'move', unitId: movingUnit.id, col, row });
        moveUnitAnimation(movingUnit, path, () => {
          movingUnit.moved = true;
          state.reachableCache = null;
          state.uiMode = 'idle';
          fftLog(`${movingUnit.name} переместился.`, 'info');
          if (movingUnit.team === 'player') recomputeFoW();
          showSelectedRing(movingUnit);
          if (!movingUnit.acted) {
            showAttackRange(movingUnit);
            state.uiMode = 'attack';
          }
          fftUpdateUI();
        });
        return;
      }

      moveUnitAnimation(movingUnit, path, () => {
        movingUnit.moved = true;
        state.reachableCache = null;
        state.uiMode = 'idle';
        fftLog(`${movingUnit.name} переместился.`, 'info');
        // Пересчитываем FoW после перемещения player-юнита
        if (movingUnit.team === 'player') recomputeFoW();
        showSelectedRing(movingUnit);
        if (!movingUnit.acted) {
          showAttackRange(movingUnit);
          state.uiMode = 'attack';
        }
        fftUpdateUI();
      });
    }
    return;
  }

  // idle — клик на пустой тайл = deselect
  const unitOnTile = state.units.find(u => u.alive && u.col === col && u.row === row);
  if (!unitOnTile) deselectUnit();
}

// ──────────────────────────────────────────────
// UI update
// ──────────────────────────────────────────────
function fftUpdateUI() {
  // Phase label
  const lbl = document.getElementById('fft-phase-label');
  if (state.phase === 'player-turn')  { lbl.textContent = 'Ход игрока'; lbl.className = 'player-turn'; }
  else if (state.phase === 'enemy-turn') { lbl.textContent = 'Ход врага'; lbl.className = 'enemy-turn'; }
  else if (state.phase === 'won')  { lbl.textContent = '🎉 Победа!'; lbl.className = 'won'; }
  else if (state.phase === 'lost') { lbl.textContent = '💀 Поражение'; lbl.className = 'lost'; }
  else { lbl.textContent = 'Выбор умений'; lbl.className = 'player-turn'; }

  // Queue icons
  const queueEl = document.getElementById('fft-queue-icons');
  queueEl.innerHTML = '';
  for (const u of state.units.filter(u => u.alive)) {
    const el = document.createElement('div');
    el.className = `fft-queue-unit ${u.team}`;
    if (state.selectedUnit && state.selectedUnit.id === u.id) el.classList.add('current');
    if (u.acted) el.classList.add('done');
    el.textContent = u.emoji;
    el.title = u.name;
    queueEl.appendChild(el);
  }

  const u = state.selectedUnit;
  const nameEl  = document.getElementById('fft-info-name');
  const hpBar   = document.getElementById('fft-hp-bar-fg');
  const hpText  = document.getElementById('fft-hp-text');
  const badges  = document.getElementById('fft-info-badges');
  const desel   = document.getElementById('fft-info-desel');

  if (u) {
    const unitH = getHeight(u.col, u.row);
    const heightLabel = unitH < 0 ? ' [дно]' : unitH > 0 ? ` [ур.${unitH}]` : '';
    nameEl.textContent = `${u.emoji} ${u.name}${heightLabel}`;
    const hpPct = u.hp / u.maxHp;
    hpBar.style.width = `${hpPct * 100}%`;
    hpBar.style.background = hpPct > 0.5 ? '#2ecc71' : hpPct > 0.25 ? '#f39c12' : '#e74c3c';
    hpText.textContent = `${u.hp}/${u.maxHp}`;
    badges.innerHTML = '';
    const addBadge = (text, cls) => {
      const b = document.createElement('span');
      b.className = `fft-badge ${cls}`;
      b.textContent = text;
      badges.appendChild(b);
    };
    if (u.moved)      addBadge('ходил', 'moved');
    if (u.acted)      addBadge('действовал', 'acted');
    if (u.stunned)    addBadge('💫 оглушён', 'stunned');
    if (u.immobilized) addBadge('🕸 стоп', 'stunned');
    if (u.barrier)    addBadge('🔰 барьер', 'barrier');
    desel.classList.add('show');
  } else {
    nameEl.textContent = state.phase === 'player-turn' ? 'Выбери союзника' : state.phase === 'enemy-turn' ? 'Враги ходят...' : '';
    hpBar.style.width = '0%';
    hpText.textContent = '';
    badges.innerHTML = '';
    desel.classList.remove('show');
  }

  // Action buttons
  const isPlayer = state.phase === 'player-turn';
  const hasUnit  = !!u;
  const inGame   = state.phase !== 'won' && state.phase !== 'lost' && state.phase !== 'skill-select';
  const btnSkip  = document.getElementById('fft-btn-skip');
  const btnEnd   = document.getElementById('fft-btn-end');
  const btnCancel = document.getElementById('fft-btn-cancel');
  btnSkip.disabled = !(inGame && isPlayer && hasUnit);
  btnEnd.disabled  = !inGame;
  btnEnd.textContent = state.phase === 'enemy-turn' ? 'Ход врага...' : 'Конец хода';
  btnCancel.style.display = (state.uiMode !== 'idle' && state.uiMode !== 'attack' && hasUnit && inGame && isPlayer) ? 'inline-flex' : 'none';

  // Ability row
  const abRow = document.getElementById('fft-ability-row');
  if (u && u.team === 'player' && u.abilities && u.abilities.length > 0 && inGame && isPlayer) {
    abRow.style.display = 'flex';
    abRow.innerHTML = '';
    for (const abId of u.abilities) {
      const sk = SKILL_DEFS[abId];
      if (!sk) continue;
      const cd = u.cooldowns[abId] || 0;
      const disabled = u.acted || cd > 0;
      const isActive = (state.uiMode === 'ability' || state.uiMode === 'jump') && state.selectedAbility && state.selectedAbility.id === abId;
      const btn = document.createElement('button');
      btn.className = 'fft-ab-btn' + (isActive ? ' active' : '');
      btn.disabled = disabled;
      let metaRange, metaDmg;
      if (sk.isJump) {
        metaRange = `Пр:${sk.range}`;
        metaDmg = '';
      } else if (sk.effect && sk.effect.startsWith('push:')) {
        metaRange = `Д:${sk.range}`;
        metaDmg = `${sk.dmgMod}+толчок`;
      } else if (sk.type === 'heal') {
        metaRange = `Д:${sk.range}`;
        metaDmg = `+${-sk.dmgMod}HP`;
      } else if (sk.type === 'buff') {
        metaRange = 'Self';
        metaDmg = '';
      } else {
        metaRange = sk.range > 0 ? `Д:${sk.range}` : 'Self';
        metaDmg = sk.dmgMod >= 0 ? `+${sk.dmgMod}` : `${sk.dmgMod}`;
      }
      btn.innerHTML = `
        <span class="fft-ab-icon">${sk.icon}</span>
        <span class="fft-ab-name">${sk.name}</span>
        <span class="fft-ab-meta">${metaRange}${metaDmg ? ' ' + metaDmg : ''}</span>
      `;
      if (cd > 0) {
        const badge = document.createElement('div');
        badge.className = 'fft-cd-badge';
        badge.textContent = cd;
        btn.appendChild(badge);
      }
      btn.addEventListener('click', () => fftSelectAbility(abId));
      abRow.appendChild(btn);
    }
  } else {
    abRow.style.display = 'none';
    abRow.innerHTML = '';
  }
}

function updateUnitMeshes() {
  for (const u of state.units) {
    if (!u.mesh3d || !u.alive) continue;
    const hpPct = u.hp / u.maxHp;
    u.mesh3d.traverse(child => {
      if (child.userData.isHpFg) {
        child.scale.x = hpPct;
        child.position.x = (hpPct - 1) * 0.4;
        const mat = child.material;
        if (hpPct > 0.5) mat.color.setHex(0x2ecc71);
        else if (hpPct > 0.25) mat.color.setHex(0xf39c12);
        else mat.color.setHex(0xe74c3c);
      }
    });
  }
}

// ──────────────────────────────────────────────
// Log
// ──────────────────────────────────────────────
function fftLog(msg, cls) {
  const log = document.getElementById('fft-log');
  const line = document.createElement('div');
  line.className = `log-${cls || 'info'}`;
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 60) log.removeChild(log.firstChild);
}

// ──────────────────────────────────────────────
// Reset camera
// ──────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.copy(DEFAULT_CAM);
  controls.target.copy(DEFAULT_TARGET);
  camera.zoom = 0.85;
  camera.updateProjectionMatrix();
  controls.update();
});

document.getElementById('btn-fow-toggle').addEventListener('click', () => {
  state.fowEnabled = !state.fowEnabled;
  const btn = document.getElementById('btn-fow-toggle');
  btn.style.color = state.fowEnabled ? '#aaa' : '#f39c12';
  recomputeFoW();
});

// ──────────────────────────────────────────────
// Render loop
// ──────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (activeAnimation) {
    activeAnimation.update(performance.now());
  }

  // Glow pulse animation
  glowPulseT += 0.02;
  const pulseOpacity = 0.4 + 0.35 * Math.sin(glowPulseT * Math.PI);
  for (const m of glowMeshes) {
    if (m.material) m.material.opacity = pulseOpacity;
  }

  // Face & HP bars смотрят на камеру
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  scene.traverse(obj => {
    if (obj.userData.isFace || obj.userData.isHpBg || obj.userData.isHpFg) {
      obj.lookAt(obj.getWorldPosition(new THREE.Vector3()).sub(camDir));
    }
  });

  updateUnitMeshes();
  renderer.render(scene, camera);
}
animate();

// ──────────────────────────────────────────────
// Resize
// ──────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const asp = w / h;
  camera.left   = frustumSize * asp / -2;
  camera.right  = frustumSize * asp / 2;
  camera.top    = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ──────────────────────────────────────────────
// Landing screen button handlers
// ──────────────────────────────────────────────
document.getElementById('btn-play-solo').addEventListener('click', () => {
  document.getElementById('fft-landing').classList.remove('show');
  fftShowSkillScreen();
  fftUpdateUI();
  fftLog('Выбери умения перед боем.', 'info');
});

document.getElementById('btn-play-mp-host').addEventListener('click', async () => {
  const landingBtn = document.getElementById('btn-play-mp-host');
  landingBtn.disabled = true;
  landingBtn.textContent = '⏳ Создание…';
  try {
    const data = await apiCreateRoom();
    const roomId = data.roomId || data.room_id;
    const hostToken = data.hostToken || data.token;
    const storageKey = `fft-token-${roomId}`;
    localStorage.setItem(storageKey, hostToken);
    localStorage.setItem(`fft-team-${roomId}`, 'A');
    mp.enabled = true;
    mp.roomId = roomId;
    mp.token = hostToken;
    mp.myTeam = 'A';
    mp.lastVersion = -1;
    setRoomInURL(roomId);

    document.getElementById('fft-landing').classList.remove('show');
    const shareURL = location.href;
    document.getElementById('fft-share-url').value = shareURL;
    document.getElementById('fft-waiting').classList.add('show');

    startSSE(roomId, hostToken);
    setupMpTeams();
  } catch (e) {
    console.error('[MP] Create room failed:', e);
    fftLog('Ошибка создания комнаты: ' + e.message, 'info');
    landingBtn.disabled = false;
    landingBtn.textContent = '👥 Создать игру с другом';
  }
});

document.getElementById('fft-copy').addEventListener('click', () => {
  const url = document.getElementById('fft-share-url').value;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('fft-copy');
    const orig = btn.textContent;
    btn.textContent = '✅ Скопировано!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
});

// ──────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────
// Проверяем URL: если есть #room= — MP join flow, иначе landing
const _initRoomId = parseRoomFromURL();
if (_initRoomId) {
  // Показываем пустой экран пока идёт join
  fftUpdateUI();
  fftLog('Подключение к игре…', 'info');
  initMpMode();
} else {
  showLandingScreen();
  fftUpdateUI();
}

// Экспорт для тестов
window.__fft3d_state = state;
window.__fft3d_mp = mp;
window.__fft3d_fns = {
  selectUnit, deselectUnit, fftReachable,
  handleUnitTap, handleTileTap,
  moveUnitAnimation, checkWinLose,
  spawnDamageFloat, fftUpdateUI,
  fftStartBattle: window.fftStartBattle,
  fftSelectAbility,
  showAbilityRange,
  showAoEPreview,
  // H2 additions
  calcFallDamage, applyFallDamage, applyDeepWaterDamage,
  jumpUnitAnimation, pushUnitAnimation, calcPushDestination,
  // A2: LoS
  fftHasLoS, fftLoSHasForest,
  // A3: FoW
  initFoW, recomputeFoW,
  // MP3
  parseRoomFromURL, apiCreateRoom, apiJoinRoom, startSSE,
  applyServerState, applyServerUnits,
};

</script>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Twilights — Арканоид</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../shared/styles.css">
  <style>
  #arkanoid-game { width: 100%; max-width: 380px; margin: 0 auto; text-align: center; }
  .ark-ready-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
  .ark-ready-info { font-size: 0.95rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 18px; line-height: 1.4; }
  .ark-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; font-size: 0.9rem; }
  .ark-stat { text-align: center; }
  .ark-stat-label { font-size: 0.7rem; color: var(--tg-theme-hint-color, #aaa); text-transform: uppercase; letter-spacing: 0.5px; }
  .ark-stat-val { font-size: 1.15rem; font-weight: 700; }
  .ark-lives { font-size: 1.1rem; letter-spacing: 2px; }
  #ark-canvas { width: 100%; display: block; border-radius: 16px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); touch-action: none; cursor: pointer; }
  .ark-hint { font-size: 0.8rem; color: var(--tg-theme-hint-color, #aaa); margin-top: 10px; min-height: 1.1em; }
  #ark-result { display: none; margin-top: 14px; }
  #ark-result .ark-result-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
  #ark-result .ark-result-sub { font-size: 1rem; color: var(--tg-theme-hint-color, #aaa); }
  </style>
</head>
<body>
<div id="arkanoid-game">
  <div id="ark-ready">
    <div class="ark-ready-title" id="ark-ready-title">🧱 Арканоид</div>
    <div class="ark-ready-info" id="ark-ready-info">Разбей все блоки мячом. Двигай платформу пальцем.</div>
    <button class="confirm-btn" onclick="arkStart()">Начать</button>
  </div>
  <div id="ark-play" style="display:none">
    <div class="ark-stats">
      <div class="ark-stat">
        <div class="ark-stat-label">Очки</div>
        <div class="ark-stat-val" id="ark-score">0</div>
      </div>
      <div class="ark-stat">
        <div class="ark-stat-label">Уровень</div>
        <div class="ark-stat-val" id="ark-level">1</div>
      </div>
      <div class="ark-stat">
        <div class="ark-stat-label">Жизни</div>
        <div class="ark-lives" id="ark-lives">❤️❤️❤️</div>
      </div>
    </div>
    <canvas id="ark-canvas" width="320" height="420" onclick="arkLaunch()"></canvas>
    <div class="ark-hint" id="ark-hint">Тапни, чтобы запустить мяч</div>
    <div id="ark-result">
      <div class="ark-result-title" id="ark-result-title"></div>
      <div class="ark-result-sub" id="ark-result-sub"></div>
    </div>
  </div>
</div>

<script src="../shared/core.js"></script>
<script>
// ---- ARKANOID (standalone, ported from monolith; uses shared/core.js: gameData, sendResultToBot) ----
let arkCanvas, arkCtx, arkRAF=null, arkDPR=1;
const ARK_W=320, ARK_H=420;
let arks={};

function initArkanoid(){
  arkCanvas=document.getElementById('ark-canvas');
  document.getElementById('ark-ready-title').textContent=gameData.prompt||'🧱 Арканоид';
  const rows=Math.max(1,Math.min(8,gameData.rows||5));
  document.getElementById('ark-ready-info').textContent='Разбей все блоки мячом · двигай платформу пальцем · '+rows+' рядов';
}

function arkStart(){
  document.getElementById('ark-ready').style.display='none';
  document.getElementById('ark-play').style.display='';
  arkDPR=window.devicePixelRatio||1;
  arkCanvas.width=ARK_W*arkDPR; arkCanvas.height=ARK_H*arkDPR;
  arkCtx=arkCanvas.getContext('2d');
  arkCtx.setTransform(arkDPR,0,0,arkDPR,0,0);

  arks={
    score:0, lives:3, level:1, maxLevel:Math.max(1,Math.min(5,gameData.levels||1)),
    rows:Math.max(1,Math.min(8,gameData.rows||5)),
    cols:Math.max(3,Math.min(9,gameData.cols||7)),
    paddleW:64, paddleX:(ARK_W-64)/2,
    ballR:6, ball:{x:0,y:0,vx:0,vy:0}, launched:false,
    bricks:[], over:false, _bound:false, startTime:Date.now()
  };
  arkBuildLevel();
  arkResetBall();
  arkBindInput();
  arkUpdateHud();
  arkDraw();   // гарантированный первый кадр (блоки/мяч/платформа сразу видны)
  arkLoop();
}

function arkBuildLevel(){
  const cols=arks.cols, rows=arks.rows;
  const pad=6, top=42, side=12, bh=16;
  const bw=(ARK_W - side*2 - pad*(cols-1))/cols;
  const palette=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c','#e84393'];
  arks.bricks=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const hits=r<2?2:1; // верхние ряды крепче
      arks.bricks.push({x:side+c*(bw+pad), y:top+r*(bh+pad), w:bw, h:bh, hits, color:palette[r%palette.length], alive:true});
    }
  }
}

function arkResetBall(){
  arks.launched=false;
  arks.ball.x=arks.paddleX+arks.paddleW/2;
  arks.ball.y=ARK_H-30-arks.ballR;
  arks.ball.vx=0; arks.ball.vy=0;
  const h=document.getElementById('ark-hint'); if(h)h.textContent='Тапни, чтобы запустить мяч';
}

function arkLaunch(){
  if(arks.over||arks.launched||!arks.ball)return;
  const speed=3.2+(arks.level-1)*0.4;
  arks.ball.vx=(Math.random()<0.5?-1:1)*speed*0.6;
  arks.ball.vy=-speed;
  arks.launched=true;
  const h=document.getElementById('ark-hint'); if(h)h.textContent='';
}

function arkBindInput(){
  if(arks._bound)return; arks._bound=true;
  const move=(clientX)=>{
    const rect=arkCanvas.getBoundingClientRect();
    let x=(clientX-rect.left)/rect.width*ARK_W - arks.paddleW/2;
    x=Math.max(0,Math.min(ARK_W-arks.paddleW,x));
    arks.paddleX=x;
    if(!arks.launched&&arks.ball){ arks.ball.x=arks.paddleX+arks.paddleW/2; }
  };
  arkCanvas.addEventListener('touchmove',e=>{e.preventDefault(); if(e.touches[0])move(e.touches[0].clientX);},{passive:false});
  arkCanvas.addEventListener('touchstart',e=>{ if(e.touches[0])move(e.touches[0].clientX);},{passive:true});
  arkCanvas.addEventListener('mousemove',e=>{ if(e.buttons)move(e.clientX); });
}

function arkLoop(){
  arkRAF=requestAnimationFrame(arkLoop);
  arkStep();
  arkDraw();
}

function arkStep(){
  if(arks.over)return;
  const b=arks.ball;
  if(!arks.launched){ b.x=arks.paddleX+arks.paddleW/2; return; }
  b.x+=b.vx; b.y+=b.vy;
  if(b.x-arks.ballR<0){b.x=arks.ballR;b.vx=Math.abs(b.vx);}
  if(b.x+arks.ballR>ARK_W){b.x=ARK_W-arks.ballR;b.vx=-Math.abs(b.vx);}
  if(b.y-arks.ballR<0){b.y=arks.ballR;b.vy=Math.abs(b.vy);}
  // платформа
  const py=ARK_H-22;
  if(b.vy>0 && b.y+arks.ballR>=py && b.y+arks.ballR<=py+14 && b.x>=arks.paddleX && b.x<=arks.paddleX+arks.paddleW){
    b.y=py-arks.ballR;
    const hit=(b.x-(arks.paddleX+arks.paddleW/2))/(arks.paddleW/2);
    const speed=Math.max(3,Math.hypot(b.vx,b.vy));
    const ang=Math.max(-1,Math.min(1,hit))*Math.PI/3;
    b.vx=speed*Math.sin(ang);
    b.vy=-Math.abs(speed*Math.cos(ang));
  }
  // мяч упал
  if(b.y-arks.ballR>ARK_H){
    arks.lives--; arkUpdateHud();
    if(arks.lives<=0){ arkEnd(false); return; }
    arkResetBall();
    return;
  }
  // блоки
  for(const br of arks.bricks){
    if(!br.alive)continue;
    if(b.x+arks.ballR>br.x && b.x-arks.ballR<br.x+br.w && b.y+arks.ballR>br.y && b.y-arks.ballR<br.y+br.h){
      const overlapX=Math.min(b.x+arks.ballR-br.x, br.x+br.w-(b.x-arks.ballR));
      const overlapY=Math.min(b.y+arks.ballR-br.y, br.y+br.h-(b.y-arks.ballR));
      if(overlapX<overlapY){ b.vx=-b.vx; } else { b.vy=-b.vy; }
      br.hits--;
      if(br.hits<=0){ br.alive=false; arks.score+=10*arks.level; }
      else { arks.score+=5; }
      arkUpdateHud();
      break;
    }
  }
  // победа на уровне
  if(arks.bricks.every(br=>!br.alive)){
    if(arks.level<arks.maxLevel){
      arks.level++; arks.score+=50; arkUpdateHud();
      arks.rows=Math.min(8,arks.rows+1);
      arkBuildLevel(); arkResetBall();
    } else {
      arkEnd(true);
    }
  }
}

function arkRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function arkDraw(){
  const ctx=arkCtx; if(!ctx)return;
  ctx.clearRect(0,0,ARK_W,ARK_H);
  for(const br of arks.bricks){
    if(!br.alive)continue;
    ctx.globalAlpha=br.hits>1?1:0.82;
    ctx.fillStyle=br.color;
    arkRoundRect(ctx,br.x,br.y,br.w,br.h,4); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#6c5ce7';
  arkRoundRect(ctx,arks.paddleX,ARK_H-22,arks.paddleW,10,5); ctx.fill();
  ctx.beginPath();
  ctx.fillStyle='#fff';
  ctx.arc(arks.ball.x,arks.ball.y,arks.ballR,0,Math.PI*2); ctx.fill();
}

function arkUpdateHud(){
  document.getElementById('ark-score').textContent=arks.score;
  document.getElementById('ark-level').textContent=arks.level;
  const lv=Math.max(0,arks.lives);
  document.getElementById('ark-lives').textContent=lv>0?'❤️'.repeat(lv):'—';
}

function arkEnd(win){
  if(arks.over)return;
  arks.over=true;
  cancelAnimationFrame(arkRAF);
  const timeSpent=Math.round((Date.now()-arks.startTime)/1000);
  let outcome,tier;
  if(win){ outcome='Победа!'; tier=arks.lives>=3?4:arks.lives===2?3:2; }
  else { outcome='Игра окончена'; tier=arks.score>=200?2:arks.score>=80?1:0; }
  document.getElementById('ark-result-title').textContent=(win?'🏆 ':'💥 ')+outcome;
  document.getElementById('ark-result-sub').textContent='Очки: '+arks.score+' · уровень '+arks.level;
  document.getElementById('ark-result').style.display='';
  const h=document.getElementById('ark-hint'); if(h)h.textContent='';
  setTimeout(function(){ sendResultToBot({game:'arkanoid', score:arks.score, stage:arks.level, win, lives:Math.max(0,arks.lives), outcome, level:tier, timeSpent}); },900);
}

// ---- Entry ----
initArkanoid();
</script>
</body>
</html>

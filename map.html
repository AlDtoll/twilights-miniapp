<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта — run_004</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0e0c;
    color: #c8b89a;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #8a7a5a;
    margin-bottom: 24px;
  }

  .map-wrap {
    width: 100%;
    overflow: hidden;
    position: relative;
    touch-action: none;
    cursor: grab;
  }
  .map-wrap:active { cursor: grabbing; }

  .map-zoom {
    display: inline-block;
    transform-origin: 0 0;
    will-change: transform;
  }

  .map {
    display: grid;
    grid-template-columns: 36px repeat(7, 64px);
    grid-template-rows: 24px repeat(5, 64px);
    gap: 3px;
    user-select: none;
  }

  .axis-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    color: #5a5040;
  }

  .cell {
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: default;
    position: relative;
    transition: filter 0.15s;
    border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
  }

  .cell-bg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    opacity: 0.13;
    pointer-events: none;
    z-index: 0;
    user-select: none;
  }

  .cell-code, .cell-coord { position: relative; z-index: 1; }

  .cell:hover { filter: brightness(1.25); }
  .cell[data-tip] { cursor: pointer; }
  .cell.selected { filter: brightness(1.4); outline: 2px solid rgba(255,255,255,0.3); outline-offset: -1px; }

  .cell-code {
    font-size: 0.75rem;
    font-weight: bold;
    letter-spacing: 0.05em;
  }

  .cell-coord {
    font-size: 0.5rem;
    opacity: 0.5;
    margin-top: 2px;
  }

  /* info panel at bottom for mobile tap */
  .info-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1a1814;
    border-top: 1px solid #4a4030;
    padding: 14px 18px 20px;
    font-size: 0.82rem;
    line-height: 1.5;
    color: #c8b89a;
    display: none;
    z-index: 50;
  }
  .info-panel strong { color: #e0d090; display: block; margin-bottom: 4px; }
  .info-panel .tip-coord { color: #5a5040; font-size: 0.68rem; }

  /* types */
  .t-unknown  { background: #1a1814; border-color: #2a2520; }
  .t-unknown .cell-code { color: #3a3530; }

  .t-player-lak { background: linear-gradient(135deg, #1a2a3a, #0f1f30); border-color: #2a5a8a; }
  .t-player-lak .cell-code { color: #5aade0; }

  .t-player-klo { background: linear-gradient(135deg, #2a1a0f, #1f1008); border-color: #8a5a2a; }
  .t-player-klo .cell-code { color: #e0a05a; }

  .t-player-dun { background: linear-gradient(135deg, #1a2a1a, #0f1f0f); border-color: #3a7a3a; }
  .t-player-dun .cell-code { color: #6acf6a; }

  .t-mountain { background: linear-gradient(135deg, #252320, #1a1816); border-color: #4a4540; }
  .t-mountain .cell-code { color: #7a7060; }

  .t-ocean { background: linear-gradient(135deg, #0a1828, #071020); border-color: #1a3a5a; }
  .t-ocean .cell-code { color: #3a7aaa; }

  .t-evil { background: linear-gradient(135deg, #2a0f0f, #1f0808); border-color: #6a1a1a; }
  .t-evil .cell-code { color: #cc4444; }

  .t-neutral { background: linear-gradient(135deg, #1e1c16, #161410); border-color: #3a3520; }
  .t-neutral .cell-code { color: #9a8a5a; }

  /* tooltip (desktop hover) */
  .tooltip {
    position: fixed;
    background: #1e1c16;
    border: 1px solid #4a4030;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: #c8b89a;
    pointer-events: none;
    z-index: 100;
    max-width: 220px;
    line-height: 1.5;
    display: none;
  }
  .tooltip strong { color: #e0d090; display: block; margin-bottom: 4px; }
  .tooltip .tip-coord { color: #5a5040; font-size: 0.68rem; }
  @media (hover: none) { .tooltip { display: none !important; } }

  /* legend */
  .legend {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    justify-content: center;
    max-width: 480px;
  }

  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    color: #7a6a4a;
  }

  .leg-dot {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>Карта — run_004</h1>

<div class="map-wrap" id="map-wrap">
  <div class="map-zoom" id="map-zoom">
    <div class="map" id="map"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="info-panel" id="info-panel"></div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#1a5a8a"></div>Область игрока</div>
  <div class="leg-item"><div class="leg-dot" style="background:#3a3520;border:1px solid #5a5030"></div>Нейтральная зона</div>
  <div class="leg-item"><div class="leg-dot" style="background:#252320"></div>Горный хребет</div>
  <div class="leg-item"><div class="leg-dot" style="background:#071020"></div>Море</div>
  <div class="leg-item"><div class="leg-dot" style="background:#2a0f0f"></div>Злое место</div>
  <div class="leg-item"><div class="leg-dot" style="background:#1a1814;border:1px solid #2a2520"></div>Неизвестно</div>
</div>

<script>
const CELLS = {
  "-3,-1":  { code:"МРЕ", type:"t-ocean", icon:"〰", name:"Море", note:"Юго-западнее Лаки" },
  "-3,0":  { code:"МРЕ", type:"t-ocean", icon:"〰", name:"Море", note:"Западнее Лаки" },
  "-3,1":  { code:"МРЕ", type:"t-ocean", icon:"〰", name:"Море", note:"Северо-западнее Лаки" },
  "-3,2":  { code:"МРЕ", type:"t-ocean", icon:"〰", name:"Море", note:"Северо-западнее Горна" },
  "-2,-1":  { code:"УСТ", type:"t-neutral", icon:"⚓", name:"Устье", note:"~800 чел. к югу от Лаки; портовый посёлок; причал, рыбак Лой, перевозчик Варо («Ключ»)" },
  "-2,0":  { code:"ЛАК", type:"t-player-lak", icon:"⛰", name:"Бутылочное горлышко", note:"~1000 чел. Лаки «Фартовый». Западный конец хребта; контролирует единственный наземный проход; море на западе, юго-западе, северо-западе." },
  "-2,1":  { code:"ГРН", type:"t-neutral", icon:"🏘", name:"Горн", note:"~1200 чел. к северу от Лаки; постоялый двор «Серая лошадь», купец Йовец" },
  "-2,2":  { code:"МРЕ", type:"t-ocean", icon:"〰", name:"Море", note:"Севернее Горна; прибрежная зона" },
  "-1,0":  { code:"~~~", type:"t-mountain", icon:"▲", name:"Горный хребет", note:"Непроходим напрямую." },
  "-1,2":  { code:"ДТВ", type:"t-neutral", icon:"🌾", name:"Дол Тавер", note:"~2000 чел. поставщик зерна для Дунара; прибрежный город" },
  "0,0":  { code:"~~~", type:"t-mountain", icon:"▲", name:"Горный хребет", note:"Непроходим напрямую." },
  "0,1":  { code:"ДУН", type:"t-player-dun", icon:"🏔", name:"Железный Утёс", note:"~1500 чел. Сир Дунар «Костолом». Равнина к северу от центра хребта." },
  "1,0":  { code:"~~~", type:"t-mountain", icon:"▲", name:"Горный хребет", note:"Непроходим напрямую." },
  "1,2":  { code:"ВРК", type:"t-neutral", icon:"🏘", name:"Ворка", note:"~1000 чел. у Дунара в контактах" },
  "2,-1":  { code:"ЗЛО", type:"t-evil", icon:"💀", name:"Злое место", note:"Безлюдный пересечённый край к югу от Стоево; источник нежити и монстров" },
  "2,0":  { code:"КЛО", type:"t-player-klo", icon:"⛰", name:"Стоево", note:"~1000 чел. Клод «Бич». Восточный край хребта; горы на западе." },
  "2,1":  { code:"ВРШ", type:"t-neutral", icon:"🌲", name:"Вершнее", note:"~1000 чел. ~3 дня от Стоево на север" },
  "3,1":  { code:"ГРЛ", type:"t-neutral", icon:"🪵", name:"Горлицы", note:"~600 чел. ~2 дня от Стоево на северо-восток; лесозаготовка" },
};

const X_MIN = -3, X_MAX = 3, Y_MIN = -2, Y_MAX = 2;

const mapEl   = document.getElementById('map');
const zoomEl  = document.getElementById('map-zoom');
const wrapEl  = document.getElementById('map-wrap');
const tip     = document.getElementById('tooltip');
const panel   = document.getElementById('info-panel');

// ── Build grid ──────────────────────────────────────────────────────────────
const corner = document.createElement('div');
corner.className = 'axis-label';
mapEl.appendChild(corner);
for (let x = X_MIN; x <= X_MAX; x++) {
  const lbl = document.createElement('div');
  lbl.className = 'axis-label';
  lbl.textContent = (x > 0 ? '+' : '') + x;
  mapEl.appendChild(lbl);
}

let selectedCell = null;

function infoHtml(data, x, y) {
  return '<strong>' + data.name + '</strong>' +
    data.note +
    '<br><span class="tip-coord">(' + (x>0?'+':'') + x + ', ' + (y>0?'+':'') + y + ')</span>';
}

for (let y = Y_MAX; y >= Y_MIN; y--) {
  const ylbl = document.createElement('div');
  ylbl.className = 'axis-label';
  ylbl.textContent = (y > 0 ? '+' : '') + y;
  mapEl.appendChild(ylbl);

  for (let x = X_MIN; x <= X_MAX; x++) {
    const key = x + ',' + y;
    const data = CELLS[key];
    const cell = document.createElement('div');
    cell.className = 'cell ' + (data ? data.type : 't-unknown');

    if (data && data.icon) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg';
      bg.textContent = data.icon;
      cell.appendChild(bg);
    }

    const code = document.createElement('div');
    code.className = 'cell-code';
    code.textContent = data ? data.code : '---';
    cell.appendChild(code);

    const coord = document.createElement('div');
    coord.className = 'cell-coord';
    coord.textContent = (x > 0 ? '+' : '') + x + ' ' + (y > 0 ? '+' : '') + y;
    cell.appendChild(coord);

    if (data) {
      cell.setAttribute('data-tip', '1');

      // Desktop: hover tooltip
      cell.addEventListener('mouseenter', e => {
        tip.style.display = 'block';
        tip.innerHTML = infoHtml(data, x, y);
      });
      cell.addEventListener('mousemove', e => {
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        const vw = window.innerWidth, vh = window.innerHeight;
        let lft = e.clientX + 14, top = e.clientY - 10;
        if (lft + tw > vw - 8) lft = e.clientX - tw - 14;
        if (top + th > vh - 8) top = e.clientY - th - 10;
        tip.style.left = Math.max(8, lft) + 'px';
        tip.style.top  = Math.max(8, top) + 'px';
      });
      cell.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

      // Mobile: tap to select, info panel at bottom
      cell.addEventListener('click', e => {
        if (isPinching) return;
        if (selectedCell === cell) {
          cell.classList.remove('selected');
          selectedCell = null;
          panel.style.display = 'none';
        } else {
          if (selectedCell) selectedCell.classList.remove('selected');
          selectedCell = cell;
          cell.classList.add('selected');
          panel.innerHTML = infoHtml(data, x, y);
          panel.style.display = 'block';
        }
        e.stopPropagation();
      });
    }

    mapEl.appendChild(cell);
  }
}

// Click outside → deselect
document.addEventListener('click', () => {
  if (selectedCell) { selectedCell.classList.remove('selected'); selectedCell = null; }
  panel.style.display = 'none';
});

// ── Pinch-to-zoom + pan ─────────────────────────────────────────────────────
let scale = 1, tx = 0, ty = 0;
let isPinching = false;

// Center the map initially
function centerMap() {
  const mw = mapEl.offsetWidth, mh = mapEl.offsetHeight;
  const ww = wrapEl.offsetWidth, wh = wrapEl.offsetHeight;
  tx = Math.max(0, (ww - mw) / 2);
  ty = Math.max(0, (wh - mh) / 2);
  applyT();
}

function applyT() {
  zoomEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

// clamp translation so map doesn't fly off
function clampT() {
  const mw = mapEl.offsetWidth * scale;
  const mh = mapEl.offsetHeight * scale;
  const ww = wrapEl.offsetWidth;
  const wh = wrapEl.offsetHeight;
  const margin = 60;
  tx = Math.min(margin, Math.max(ww - mw - margin, tx));
  ty = Math.min(margin, Math.max(wh - mh - margin, ty));
}

// wrap height = map height (initial scale)
wrapEl.style.height = (mapEl.offsetHeight || 360) + 'px';

let ptrs = {};
let lastPinchDist = 0, pinchOriginX = 0, pinchOriginY = 0;
let startTx = 0, startTy = 0, startScale = 1;
let panStartX = 0, panStartY = 0;

wrapEl.addEventListener('pointerdown', e => {
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  wrapEl.setPointerCapture(e.pointerId);
  const ids = Object.keys(ptrs);
  if (ids.length === 1) {
    panStartX = e.clientX - tx;
    panStartY = e.clientY - ty;
  } else if (ids.length === 2) {
    isPinching = true;
    const p0 = ptrs[ids[0]], p1 = ptrs[ids[1]];
    lastPinchDist = Math.hypot(p0.x - p1.x, p0.y - p1.y);
    pinchOriginX = (p0.x + p1.x) / 2;
    pinchOriginY = (p0.y + p1.y) / 2;
    startScale = scale;
    startTx = tx; startTy = ty;
  }
});

wrapEl.addEventListener('pointermove', e => {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  const ids = Object.keys(ptrs);
  if (ids.length === 2) {
    const p0 = ptrs[ids[0]], p1 = ptrs[ids[1]];
    const dist = Math.hypot(p0.x - p1.x, p0.y - p1.y);
    const newScale = Math.min(4, Math.max(0.4, startScale * dist / lastPinchDist));
    // zoom around pinch origin
    const ratio = newScale / startScale;
    tx = pinchOriginX - ratio * (pinchOriginX - startTx);
    ty = pinchOriginY - ratio * (pinchOriginY - startTy);
    scale = newScale;
    clampT();
    applyT();
  } else if (ids.length === 1 && !isPinching) {
    tx = e.clientX - panStartX;
    ty = e.clientY - panStartY;
    clampT();
    applyT();
  }
});

const endPtr = e => {
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length < 2) {
    setTimeout(() => { isPinching = false; }, 100);
  }
};
wrapEl.addEventListener('pointerup', endPtr);
wrapEl.addEventListener('pointercancel', endPtr);

// Mouse wheel zoom
wrapEl.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(4, Math.max(0.4, scale * delta));
  const rect = wrapEl.getBoundingClientRect();
  const ox = e.clientX - rect.left, oy = e.clientY - rect.top;
  tx = ox - (newScale / scale) * (ox - tx);
  ty = oy - (newScale / scale) * (oy - ty);
  scale = newScale;
  clampT();
  applyT();
}, { passive: false });

window.addEventListener('load', centerMap);
window.addEventListener('resize', centerMap);
</script>
</body>
</html>

function makePanoParticles(type) {
  const COUNT = { snow: 40, leaves: 28, blossom: 32 }[type] || 0;
  if (!COUNT) return '';
  const palette = { snow: ['❄','·','·'], leaves: ['🍂','🍁','🍃'], blossom: ['🌸','·','·'] }[type];
  let html = '';
  for (let k = 0; k < COUNT; k++) {
    const left  = (Math.random() * 100).toFixed(1);
    const delay = (Math.random() * 8).toFixed(2);
    const dur   = (5 + Math.random() * 7).toFixed(1);
    const size  = type === 'snow' ? (8 + Math.random()*6).toFixed(0) : (12 + Math.random()*10).toFixed(0);
    const char  = palette[Math.floor(Math.random() * palette.length)];
    const drift = type === 'leaves' ? ((Math.random() > 0.5 ? 1 : -1) * (20 + Math.random()*30)).toFixed(0) : 0;
    html += `<span style="position:absolute;left:${left}%;top:-2em;font-size:${size}px;opacity:0.7;animation:pano-particle-fall ${dur}s linear ${delay}s infinite;--drift:${drift}px">${char}</span>`;
  }
  return html;
}

// SVG-градиенты водных краёв: синий у самой границы блока → прозрачный внутрь.
// Ставятся один раз на карту (id общие); рисуются как полосы WBAND у нужной стороны.
function amWaterDefs() {
  const C = '#1f56a0';
  const stops = '<stop offset="0" stop-color="' + C + '" stop-opacity="0.92"/>'
    + '<stop offset="0.55" stop-color="' + C + '" stop-opacity="0.4"/>'
    + '<stop offset="1" stop-color="' + C + '" stop-opacity="0"/>';
  return '<defs>'
    + `<linearGradient id="wg-n" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>`
    + `<linearGradient id="wg-s" x1="0" y1="1" x2="0" y2="0">${stops}</linearGradient>`
    + `<linearGradient id="wg-w" x1="0" y1="0" x2="1" y2="0">${stops}</linearGradient>`
    + `<linearGradient id="wg-e" x1="1" y1="0" x2="0" y2="0">${stops}</linearGradient>`
    + '</defs>';
}

function renderAreaMap(am) {
  if (!am || !am.nodes || !am.nodes.length) return '';
  // Сохраняем ноды глобально — для terrain-хинта при открытии панорамы
  _panoNodes = am.nodes;
  const cols = am.cols || 4, rows = am.rows || 4;
  const P = 44, S = 62;  // больший отступ — длинные подписи НП/краёв не режутся viewBox
  const W = P * 2 + S * cols, H = P * 2 + S * rows;
  const cx = (c) => P + (c - 0.5) * S;
  const cy = (r) => P + (r - 0.5) * S;
  const pos = {};
  am.nodes.forEach(n => { pos[n.name] = [cx(n.col), cy(n.row)]; });
  const idxOf = {}; am.nodes.forEach((n, i) => { idxOf[n.name] = i; });
  const amSplitName = (name) => {
    const s = String(name || '');
    if (s.length <= 14) return [s];
    const dash = s.indexOf('-');
    if (dash > 0 && dash < s.length - 1) return [s.slice(0, dash), s.slice(dash + 1)];
    const sp = s.lastIndexOf(' ', Math.min(14, s.length - 1));
    if (sp > 3) return [s.slice(0, sp), s.slice(sp + 1)];
    return [s.slice(0, 12) + '…', s.slice(12)];
  };
  let g = "";
  // Водные края: полоса-градиент вдоль стороны блока, у которой сосед-клетка — море.
  // Не заливаем квадраты целиком — только «плещет» у края (bl.water: n/e/s/w).
  const WBAND = S * 0.42;
  const hasWater = (am.blocks || []).some(b => (b.water || []).length);
  if (hasWater) g += amWaterDefs();
  (am.blocks || []).forEach(bl => {
    const bx = P + (bl.col0 - 1) * S, by = P + (bl.row0 - 1) * S;
    const cls = bl.owned ? "am-block" : "am-block am-block-hole";
    g += `<rect x="${bx}" y="${by}" width="${4 * S}" height="${4 * S}" class="${cls}"/>`;
  });
  (am.blocks || []).forEach(bl => {
    (bl.water || []).forEach(side => {
      const bx = P + (bl.col0 - 1) * S, by = P + (bl.row0 - 1) * S, sz = 4 * S;
      let x = bx, y = by, w = sz, h = sz;
      if (side === 'n') { h = WBAND; }
      else if (side === 's') { y = by + sz - WBAND; h = WBAND; }
      else if (side === 'w') { w = WBAND; }
      else if (side === 'e') { x = bx + sz - WBAND; w = WBAND; }
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#wg-${side})" class="amb-water" style="animation-delay:${(side === 'n' ? 0 : side === 's' ? 1.5 : side === 'e' ? 3 : 4.5)}s"/>`;
    });
  });
  // Метки местности: компактный значок в центре мини-клетки (не заливка всей клетки)
  (am.tiles || []).forEach(tile => {
    const col = tile.col != null ? tile.col : (1 + (tile.x || 0));
    const row = tile.row != null ? tile.row : ((am.rows || 4) - (tile.y || 0));
    const bx = P + (col - 1) * S, by = P + (row - 1) * S;
    const tt = (tile.terrain || '').toLowerCase();
    const mx = bx + S / 2, my = by + S / 2;
    if (tt === 't-forest-thicket' || tt === 't-forest') {
      // #лес_чаща — плотная чаща; #лес — реже. Раскладка стабильно-рандомная по (x,y).
      const thick = (tt === 't-forest-thicket');
      let seed = (((tile.x | 0) + 1) * 73856093) ^ (((tile.y | 0) + 1) * 19349663) ^ (thick ? 0xC4A5 : 0x7E55);
      seed >>>= 0;
      const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      const n = thick ? (11 + (rnd() * 4) | 0) : (3 + (rnd() * 3) | 0);
      const trees = [];
      for (let i = 0; i < n; i++) {
        const ang = rnd() * Math.PI * 2;
        const dist = (thick ? 6 : 3) + rnd() * (thick ? 18 : 10);
        trees.push([
          mx + Math.cos(ang) * dist * 0.85,
          my + Math.sin(ang) * dist * 0.7,
          (thick ? 3.8 : 3.4) + rnd() * 2.4,
        ]);
      }
      trees.sort((a, b) => a[1] - b[1]);
      trees.forEach(([tx, ty, r]) => {
        const tw = Math.max(3.2, r * 0.55);
        const th = Math.max(9, r * 1.35);
        g += `<rect x="${tx - tw / 2}" y="${ty + r * 0.25}" width="${tw}" height="${th}" rx="0.8" fill="#5a3a22" pointer-events="none"/>`;
        g += `<circle cx="${tx - r * 0.55}" cy="${ty + r * 0.2}" r="${r * 0.78}" fill="#2a5524" opacity="0.95" pointer-events="none"/>`;
        g += `<circle cx="${tx + r * 0.55}" cy="${ty + r * 0.15}" r="${r * 0.75}" fill="#356a2e" opacity="0.95" pointer-events="none"/>`;
        g += `<circle cx="${tx}" cy="${ty - r * 0.55}" r="${r * 0.85}" fill="#3f7a34" opacity="0.95" pointer-events="none"/>`;
      });
    } else if (tt === 't-mountain') {
      // Горы: 3–5 пиков, раскладка стабильно-рандомная по клетке.
      let seed = (((tile.x | 0) + 1) * 83492791) ^ (((tile.y | 0) + 1) * 2971215073) ^ 0xA11E;
      seed >>>= 0;
      const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      const peaks = [];
      const n = 3 + (rnd() * 3) | 0;
      for (let i = 0; i < n; i++) {
        const ang = -0.2 + rnd() * (Math.PI + 0.4);
        const dist = 3 + rnd() * 12;
        peaks.push({
          x: mx + Math.cos(ang) * dist * 0.7,
          y: my + Math.sin(ang) * dist * 0.35 + 2,
          h: 8 + rnd() * 10,
          w: 5 + rnd() * 5,
          col: ['#9a9080', '#b0a690', '#a89e8c', '#8e8680'][(rnd() * 4) | 0],
        });
      }
      peaks.sort((a, b) => a.y - b.y);
      g += `<ellipse cx="${mx + (rnd() - 0.5) * 4}" cy="${my + 11}" rx="${12 + rnd() * 4}" ry="3.8" fill="#8a8070" opacity="0.4" pointer-events="none"/>`;
      peaks.forEach(p => {
        g += `<path d="M ${p.x - p.w} ${p.y + 4} L ${p.x} ${p.y - p.h} L ${p.x + p.w} ${p.y + 4} Z" fill="${p.col}" opacity="0.95" pointer-events="none"/>`;
        if (rnd() > 0.45) {
          g += `<path d="M ${p.x - 1.2} ${p.y - p.h} L ${p.x} ${p.y - p.h + 4} L ${p.x + 1.8} ${p.y - p.h}" fill="#e8e4dc" opacity="0.85" pointer-events="none"/>`;
        }
      });
    } else if (tt === 't-swamp') {
      // Болото: лужи + кочки + камыши, раскладка по клетке.
      let seed = (((tile.x | 0) + 1) * 50331653) ^ (((tile.y | 0) + 1) * 196613) ^ 0xB007;
      seed >>>= 0;
      const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      const pools = 1 + (rnd() * 2) | 0;
      for (let i = 0; i < pools; i++) {
        const px = mx + (rnd() - 0.5) * 14;
        const py = my + 2 + rnd() * 6;
        g += `<ellipse cx="${px}" cy="${py}" rx="${7 + rnd() * 6}" ry="${3 + rnd() * 2.5}" fill="#4a6a78" opacity="${0.4 + rnd() * 0.2}" pointer-events="none"/>`;
      }
      const humps = 2 + (rnd() * 3) | 0;
      for (let i = 0; i < humps; i++) {
        const hx = mx + (rnd() - 0.5) * 16;
        const hy = my + (rnd() - 0.5) * 8;
        g += `<ellipse cx="${hx}" cy="${hy}" rx="${2.5 + rnd() * 2.5}" ry="${1.4 + rnd()}" fill="#4a5e35" opacity="0.85" pointer-events="none"/>`;
      }
      const reeds = 4 + (rnd() * 4) | 0;
      for (let i = 0; i < reeds; i++) {
        const rx = mx + (rnd() - 0.5) * 20;
        const ry = my - 2 - rnd() * 5;
        const h = 6 + rnd() * 5;
        g += `<line x1="${rx}" y1="${ry + h}" x2="${rx + (rnd() - 0.5)}" y2="${ry}" stroke="#3a5230" stroke-width="1.3" stroke-linecap="round" opacity="0.85" pointer-events="none"/>`;
        g += `<path d="M ${rx} ${ry} q -2.2 -2.5 -3.5 -0.2" fill="none" stroke="#4a6238" stroke-width="1.1" opacity="0.8" pointer-events="none"/>`;
        g += `<path d="M ${rx} ${ry} q 2.2 -2.5 3.5 -0.2" fill="none" stroke="#4a6238" stroke-width="1.1" opacity="0.8" pointer-events="none"/>`;
      }
    } else if (tt === 't-ocean' || tt === 't-skerry') {
      // Волны; у шхер — маленький камень.
      g += `<path d="M ${mx - 13} ${my + 1} q 4.5 -3.2 9 0 t 9 0 t 9 0" fill="none" stroke="#5a9cc8" stroke-width="2" stroke-linecap="round" opacity="0.9" pointer-events="none"/>`;
      g += `<path d="M ${mx - 11} ${my + 6} q 4 -2.6 8 0 t 8 0 t 6 0" fill="none" stroke="#7ab8dc" stroke-width="1.6" stroke-linecap="round" opacity="0.8" pointer-events="none"/>`;
      g += `<path d="M ${mx - 9} ${my + 10} q 3.5 -2.2 7 0 t 7 0" fill="none" stroke="#9ad0ec" stroke-width="1.3" stroke-linecap="round" opacity="0.7" pointer-events="none"/>`;
      if (tt === 't-skerry') {
        g += `<path d="M ${mx - 3} ${my + 2} L ${mx - 5} ${my - 3} L ${mx - 1} ${my - 7} L ${mx + 3} ${my - 4} L ${mx + 4} ${my + 2} Z" fill="#7a7870" opacity="0.95" pointer-events="none"/>`;
        g += `<path d="M ${mx - 2} ${my - 1} L ${mx - 1} ${my - 7} L ${mx + 1.5} ${my - 3}" fill="#9a9890" opacity="0.85" pointer-events="none"/>`;
      }
    } else if (tt === 't-meadow') {
      // Луг: пятна + трава + цветы, раскладка по клетке.
      let seed = (((tile.x | 0) + 1) * 2654435761) ^ (((tile.y | 0) + 1) * 2246822519) ^ 0x1EAD;
      seed >>>= 0;
      const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      const patches = 2 + (rnd() * 2) | 0;
      for (let i = 0; i < patches; i++) {
        g += `<ellipse cx="${mx + (rnd() - 0.5) * 12}" cy="${my + 3 + rnd() * 5}" rx="${5 + rnd() * 8}" ry="${2.5 + rnd() * 2.5}" fill="${rnd() > 0.5 ? '#c6d86a' : '#d4e878'}" opacity="${0.3 + rnd() * 0.15}" pointer-events="none"/>`;
      }
      const blades = 6 + (rnd() * 5) | 0;
      for (let i = 0; i < blades; i++) {
        const gx = mx + (rnd() - 0.5) * 22;
        const gy = my + 3 + rnd() * 5;
        const h = 3 + rnd() * 3.5;
        g += `<line x1="${gx}" y1="${gy}" x2="${gx + (rnd() - 0.5) * 1.5}" y2="${gy - h}" stroke="#8aaa3a" stroke-width="1.2" stroke-linecap="round" opacity="0.9" pointer-events="none"/>`;
      }
      const flowerCols = ['#e8c84a', '#e8a0b8', '#d0e8a0', '#e8c84a', '#c8e090'];
      const flowers = 3 + (rnd() * 4) | 0;
      for (let i = 0; i < flowers; i++) {
        const fx = mx + (rnd() - 0.5) * 18;
        const fy = my + (rnd() - 0.5) * 10;
        g += `<circle cx="${fx}" cy="${fy}" r="${1.3 + rnd() * 0.6}" fill="${flowerCols[(rnd() * flowerCols.length) | 0]}" opacity="0.9" pointer-events="none"/>`;
      }
    }
  });
  for (let i = 0; i <= cols; i++) {
    const o = P + i * S;
    g += `<line x1="${o}" y1="${P}" x2="${o}" y2="${P + S * rows}" class="am-grid"/>`;
  }
  for (let j = 0; j <= rows; j++) {
    const o = P + j * S;
    g += `<line x1="${P}" y1="${o}" x2="${P + S * cols}" y2="${o}" class="am-grid"/>`;
  }
  const OWN_COLORS = { danil: "#6ba9e6", misha: "#e0894a", valter: "#7bc96f" };
  const nodeOwner = {};
  (am.nodes || []).forEach(n => { if (n.name) nodeOwner[n.name] = n.owner || ''; });
  (am.roads || []).forEach(rd => {
    const a = pos[rd.from]; if (!a) return;
    if (rd.type === "internal") {
      const b = pos[rd.to]; if (!b) return;
      if (rd.sea) {
        g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="am-road am-road-sea" style="stroke:#3a8ec8;stroke-opacity:0.9;stroke-width:2.8" data-i="${idxOf[rd.from]} ${idxOf[rd.to]}"/>`;
        return;
      }
      // #своя / оба конца одного игрока → цвет владельца (как домики)
      const pl = rd.player || (rd.own && (nodeOwner[rd.from] || nodeOwner[rd.to]))
        || ((nodeOwner[rd.from] && nodeOwner[rd.from] === nodeOwner[rd.to]) ? nodeOwner[rd.from] : '');
      const oc = pl && OWN_COLORS[pl];
      const st = oc ? ` style="stroke:${oc};stroke-opacity:0.95;stroke-width:3.2"` : '';
      g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="am-road am-road-own" data-i="${idxOf[rd.from]} ${idxOf[rd.to]}"${st}/>`;
    } else {
      const dx = rd.dir?.dx || 0, dy = rd.dir?.dy || 0;
      if (!dx && !dy) return;
      // Луч ОТ ноды в сторону соседней клетки ДО края холста — дорога «уходит» за
      // границу области. На экране x вправо=+dx, y вниз=−dy (dy>0=север=верх). Каждая
      // дорога выходит в СВОЕЙ точке границы (не в общий угол) → подписи не слипаются.
      const vx = dx, vy = -dy;
      const margin = 10;  // не упираться в край viewBox — место под подпись
      const len = Math.hypot(vx, vy) || 1;
      const ux0 = vx / len, uy0 = vy / len;  // единичный вектор для пересечения с краем
      let t = Infinity;
      if (ux0 > 0) t = Math.min(t, (W - margin - a[0]) / ux0);
      else if (ux0 < 0) t = Math.min(t, (margin - a[0]) / ux0);
      if (uy0 > 0) t = Math.min(t, (H - margin - a[1]) / uy0);
      else if (uy0 < 0) t = Math.min(t, (margin - a[1]) / uy0);
      if (!isFinite(t) || t <= 0) return;
      const ex = a[0] + ux0 * t, ey = a[1] + uy0 * t;
      const pl = rd.player || (rd.own && (nodeOwner[rd.from] || '')) || '';
      const oc = (!rd.sea && pl && OWN_COLORS[pl]) || null;
      const seaCls = rd.sea ? ' am-road-sea' : (oc ? ' am-road-own' : '');
      let lineStyle = '';
      if (rd.sea) lineStyle = ' style="stroke:#3a8ec8;stroke-opacity:0.9;stroke-width:2.8"';
      else if (oc) lineStyle = ` style="stroke:${oc};stroke-opacity:0.95;stroke-width:3.0"`;
      g += `<line x1="${a[0]}" y1="${a[1]}" x2="${ex}" y2="${ey}" class="am-road am-road-edge${seaCls}" data-i="${idxOf[rd.from]}"${lineStyle}/>`;
      const al = Math.hypot(vx, vy) || 1, ux = vx / al, uy = vy / al;   // стрелка-наконечник у выхода
      const tx = ex - ux * 2, ty = ey - uy * 2, bkx = tx - ux * 8, bky = ty - uy * 8;
      const arrCls = rd.sea ? 'am-arrow am-arrow-sea' : 'am-arrow';
      const arrStyle = oc ? ` style="fill:${oc}"` : '';
      g += `<polygon points="${tx},${ty} ${bkx - uy * 4.2},${bky + ux * 4.2} ${bkx + uy * 4.2},${bky - ux * 4.2}" class="${arrCls}"${arrStyle}/>`;
      const anchor = vx > 0 ? "end" : vx < 0 ? "start" : "middle";  // подпись внутрь холста
      const inset = 16;
      const lx = Math.max(inset, Math.min(W - inset, ex + (vx > 0 ? -6 : vx < 0 ? 6 : 0)));
      const ly = Math.max(14, Math.min(H - 8, ey + (vy > 0 ? -8 : 16)));
      const lblCls = rd.sea ? 'am-edge-label am-edge-label-sea' : 'am-edge-label';
      const seaMark = rd.sea ? '〰 ' : '';
      const tc = rd.to_coord;
      const goAttr = (tc && tc.length === 2)
        ? ` onclick="amGo(${+tc[0]},${+tc[1]});event.stopPropagation()" class="${lblCls} am-edge-label-go"`
        : ` class="${lblCls}"`;
      g += `<text x="${lx}" y="${ly}" text-anchor="${anchor}"${goAttr}>→ ${seaMark}${esc(rd.to)}</text>`;
    }
  });
  am.nodes.forEach((n, i) => {
    const [x, y] = pos[n.name];
    const _tt = panoTerrainFor(n.name, n.terrain||''); const _tc = terrainTileColor(_tt);
    g += `<rect x="${x-17}" y="${y-14}" width="34" height="30" rx="6" fill="${_tc}" opacity="0.72" pointer-events="none"/>`;
    if(_tt==='t-forest'){ g += `<circle cx="${x-9}" cy="${y+6}" r="3" fill="#2f5f28" pointer-events="none"/><circle cx="${x+9}" cy="${y+7}" r="2.6" fill="#356a2e" pointer-events="none"/>`; }
    else if(_tt==='t-mountain'){ g += `<path d="M ${x-11} ${y+12} L ${x-5} ${y+2} L ${x+1} ${y+12} Z" fill="#b7ad98" pointer-events="none"/><path d="M ${x+2} ${y+12} L ${x+9} ${y+1} L ${x+14} ${y+12} Z" fill="#c7bda8" pointer-events="none"/>`; }
    else if(_tt==='t-ocean'){ g += `<path d="M ${x-15} ${y+9} q 4 -3 8 0 t 8 0 t 8 0 t 8 0" fill="none" stroke="#cfe6f2" stroke-width="1.2" pointer-events="none"/>`; }
    else if(_tt==='t-swamp'){ g += `<circle cx="${x-8}" cy="${y+9}" r="3" fill="#3f5a2e" opacity="0.8" pointer-events="none"/><circle cx="${x+7}" cy="${y+10}" r="2.4" fill="#47623a" opacity="0.8" pointer-events="none"/>`; }
    const fill = OWN_COLORS[n.owner] || "#c8a84a";
    const w = 6.5, bh = 6, rh = 5;   // домик = пятиугольник (крыша+корпус)
    const house = `M ${x - w} ${y - 1} L ${x} ${y - 1 - rh} L ${x + w} ${y - 1} L ${x + w} ${y + bh} L ${x - w} ${y + bh} Z`;
    g += `<path d="${house}" class="am-node" data-i="${i}" style="fill:${fill};animation-delay:${((i * 0.41) % 3.4).toFixed(2)}s" onclick="amHi(event,${i})"/>`;
    // Дымок над крышей домика: 2 кружка с разным delay, идут вверх
    const smokeDelay1 = ((i * 1.3) % 4).toFixed(1);
    const smokeDelay2 = ((i * 1.3 + 2.1) % 4).toFixed(1);
    g += `<g class="amb-smoke" pointer-events="none">`
      + `<circle cx="${x - 1.2}" cy="${y - 1 - rh - 3}" r="1.3" fill="#cfc8bd" style="animation:amb-smoke 4s ease-out ${smokeDelay1}s infinite"/>`
      + `<circle cx="${x + 1.5}" cy="${y - 1 - rh - 5}" r="1.8" fill="#cfc8bd" style="animation:amb-smoke 4s ease-out ${smokeDelay2}s infinite"/>`
      + `</g>`;
    const nameParts = amSplitName(n.name);
    const labelY0 = y - rh - 5 - (nameParts.length - 1) * 10;
    nameParts.forEach((part, pi) => {
      g += `<text x="${x}" y="${labelY0 + pi * 10}" class="am-label" text-anchor="middle">${esc(part)}</text>`;
    });
    if (n.pop) g += `<text x="${x}" y="${y + bh + 11}" class="am-pop" text-anchor="middle">~${n.pop}</text>`;
  });
  return `<div class="am-wrap"><svg viewBox="0 0 ${W} ${H}" class="am-svg" preserveAspectRatio="xMidYMid meet" overflow="visible">${g}</svg></div>` +
    `<div class="am-note">Иллюстративная карта — клетки ориентир; заливка — метки местности. Пунктир — дорога к соседней области.</div>`;
}

// Пустая мини-карта-плейсхолдер для морских клеток (t-ocean) без НП.
// Повторяет каркас renderAreaMap (те же классы, размеры, viewBox), но без узлов и дорог.
// Параметр label — подпись по центру (напр. «Море»).
function renderEmptyAreaMap(label) {
  const cols = 4, rows = 4;
  const P = 26, S = 62;
  const W = P * 2 + S * cols, H = P * 2 + S * rows;
  let g = '';
  // Сетка 4×4 — те же классы, что в renderAreaMap
  for (let i = 0; i <= cols; i++) {
    const o = P + i * S;
    g += `<line x1="${o}" y1="${P}" x2="${o}" y2="${P + S * rows}" class="am-grid"/>`;
  }
  for (let j = 0; j <= rows; j++) {
    const o = P + j * S;
    g += `<line x1="${P}" y1="${o}" x2="${P + S * cols}" y2="${o}" class="am-grid"/>`;
  }
  // Центральная подпись
  const cx = P + (S * cols) / 2, cy = H / 2 - 6;
  g += `<text x="${cx}" y="${cy}" text-anchor="middle" style="fill:#7a6e5a;font-size:18px;font-weight:600">${esc(label)}</text>`;
  g += `<text x="${cx}" y="${cy + 18}" text-anchor="middle" style="fill:#5a5040;font-size:11px">пока пусто</text>`;
  return `<div class="am-wrap"><svg viewBox="0 0 ${W} ${H}" class="am-svg" preserveAspectRatio="xMidYMid meet">${g}</svg></div>` +
    `<div class="am-note">Морская клетка — данных нет. Карта появится, когда здесь что-то появится.</div>`;
}

// Телеги на карте области: random-walk по графу дорог (как на мировой карте) —
// в узле НП выбирают следующую дорогу, не телепортятся и не «пропадают» в НП.
// Координаты — viewBox из уже отрисованных <line> (internal + edge).
let _amCartRAF = null;
function _areaRoadAdj(segs) {
  const adj = {};
  for (const s of segs) {
    if (!s.ak || !s.bk || s.len < 2) continue;
    (adj[s.ak] = adj[s.ak] || []).push({ to: s.bk, seg: s, flip: false });
    (adj[s.bk] = adj[s.bk] || []).push({ to: s.ak, seg: s, flip: true });
  }
  return adj;
}
function _areaWalkerPickLeg(c) {
  let opts = (c.adj[c.at] || []).filter(e => e.to !== c.from);
  if (!opts.length) opts = c.adj[c.at] || [];
  if (!opts.length) { c.leg = null; return; }
  const pick = opts[(Math.random() * opts.length) | 0];
  const s = pick.seg;
  c.leg = pick.flip
    ? { ax: s.bx, ay: s.by, bx: s.ax, by: s.ay, len: s.len, from: s.bk, to: s.ak }
    : { ax: s.ax, ay: s.ay, bx: s.bx, by: s.by, len: s.len, from: s.ak, to: s.bk };
}
function animateAreaCarts(root) {
  if (_amCartRAF) { cancelAnimationFrame(_amCartRAF); _amCartRAF = null; }
  if (!root) return;
  const svg = root.querySelector('.am-svg');
  if (!svg) return;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const landSegs = [], seaSegs = [];
  svg.querySelectorAll('.am-road').forEach(l => {
    const ax = +l.getAttribute('x1'), ay = +l.getAttribute('y1');
    const bx = +l.getAttribute('x2'), by = +l.getAttribute('y2');
    const len = Math.hypot(bx - ax, by - ay);
    if (len <= 4) return;
    const ak = Math.round(ax) + ',' + Math.round(ay);
    const bk = Math.round(bx) + ',' + Math.round(by);
    const seg = { ax, ay, bx, by, len, ak, bk };
    (l.classList.contains('am-road-sea') ? seaSegs : landSegs).push(seg);
  });
  if (!landSegs.length && !seaSegs.length) return;
  const MAX_CARTS = 6, CART_SPEED = 20;
  const MAX_SHIPS = 3, SHIP_SPEED = 16;
  const landAdj = _areaRoadAdj(landSegs);
  const seaAdj = _areaRoadAdj(seaSegs);
  const landKeys = Object.keys(landAdj);
  const seaKeys = Object.keys(seaAdj);
  const movers = [];
  for (let i = 0; i < Math.min(MAX_CARTS, Math.max(landKeys.length, landSegs.length)); i++) {
    if (!landKeys.length) break;
    const g = _buildCartG(SVGNS, 'am-cart', _CART_SHAPES_AREA);
    svg.appendChild(g);
    const at = landKeys[(Math.random() * landKeys.length) | 0];
    movers.push({ g, adj: landAdj, at, from: null, leg: null, progress: 0, speed: CART_SPEED, ship: false });
  }
  for (let i = 0; i < Math.min(MAX_SHIPS, Math.max(seaKeys.length, seaSegs.length)); i++) {
    if (!seaKeys.length && !seaSegs.length) break;
    const g = _buildCartG(SVGNS, 'am-cart am-ship', _SHIP_SHAPES_WORLD);
    svg.appendChild(g);
    if (seaKeys.length) {
      const at = seaKeys[(Math.random() * seaKeys.length) | 0];
      movers.push({ g, adj: seaAdj, at, from: null, leg: null, progress: 0, speed: SHIP_SPEED, ship: true });
    } else {
      const s = seaSegs[i % seaSegs.length];
      movers.push({ g, adj: _areaRoadAdj([s]), at: s.ak, from: null, leg: null, progress: 0, speed: SHIP_SPEED, ship: true });
    }
  }
  if (!movers.length) return;
  movers.forEach(c => _areaWalkerPickLeg(c));
  let lastTs = null;
  const frame = ts => {
    if (lastTs === null) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    for (const c of movers) {
      if (!c.leg) _areaWalkerPickLeg(c);
      if (!c.leg) continue;
      c.progress += c.speed * dt;
      if (c.progress >= c.leg.len) {
        c.from = c.leg.from;
        c.at = c.leg.to;
        c.leg = null;
        c.progress = 0;
        _areaWalkerPickLeg(c);
        if (!c.leg) continue;
      }
      const u = c.leg.len ? Math.min(1, c.progress / c.leg.len) : 0;
      const x = c.leg.ax + (c.leg.bx - c.leg.ax) * u;
      const y = c.leg.ay + (c.leg.by - c.leg.ay) * u;
      let tf = `translate(${x.toFixed(1)} ${y.toFixed(1)})`;
      if (c.ship) {
        const ang = Math.atan2(c.leg.by - c.leg.ay, c.leg.bx - c.leg.ax) * 180 / Math.PI;
        tf += ` rotate(${ang.toFixed(1)})`;
      }
      c.g.setAttribute('transform', tf);
    }
    _amCartRAF = requestAnimationFrame(frame);
  };
  _amCartRAF = requestAnimationFrame(frame);
}


const LY_COLORS = { 'Л': '#4a8a5a', 'Н': '#7a6e5a', 'НЛ': '#8a3a2a' };
const LY_LABELS = { 'Л': 'Лояльные', 'Н': 'Нейтральные', 'НЛ': 'Нелояльные' };
// Детерминированный цвет культа по ИМЕНИ: одинаковый в карте и дашборде,
// в любой клетке, независимо от порядка в списке. FAITH_KNOWN/FAITH_PALETTE
// продублированы в player.html — держать синхронными (см. MINIAPP.md).
const FAITH_PALETTE = ['#c8a84a', '#6a8ab0', '#a06ab0', '#4a8a5a', '#b07a4a', '#5ab0a8',
  '#b0526a', '#7a8a3a', '#8a6ac0', '#c07a9a', '#4a7ac0', '#9a9a4a', '#c05a4a', '#5a9ac0'];
const FAITH_KNOWN = ['Мизеракль', 'Кипона', 'Тенета', 'Лето', 'Айдан «Кот»', 'Омнус', 'Бурий',
  'Природный культ (друидизм)', 'Тёмный культ', 'Светлый культ', 'Культ войны', 'Культ разума', 'Местный культ'];
function faithColor(name) {
  const i = FAITH_KNOWN.indexOf(name);
  if (i >= 0) return FAITH_PALETTE[i % FAITH_PALETTE.length];
  let h = 0; for (let k = 0; k < name.length; k++) h = (h * 31 + name.charCodeAt(k)) >>> 0;
  return FAITH_PALETTE[h % FAITH_PALETTE.length];
}

function pct(n, d) { return d > 0 ? Math.round(n / d * 100) : 0; }

function mightBlock(m) {
  if (!m) return '';
  const cls = m.total > 0 ? 'pos' : m.total < 0 ? 'neg' : 'zero';
  const fmtN = x => Number.isInteger(x) ? x : x.toFixed(1);
  const pct = v => (v >= 0 ? '+' : '') + v + '%';
  // Диапазон: показываем min–max если есть ополчение, иначе одно число
  const hasRange = (m.militia || 0) > 0;
  const rangeStr = hasRange ? `${m.total_min}–${m.total_max}` : String(m.total);
  // Тултип: ядро + бросок ополчения + множитель
  const sumParts = [`лоял. ${pct(m.loyalty_pct)}`, `база +${m.defense_pct}%`];
  if (m.cult_war_pct > 0) sumParts.push(`культ войны +${m.cult_war_pct}%`);
  if (m.tags_pct) sumParts.push(`теги ${pct(m.tags_pct)}`);
  const coreDesc = `ядро (${m.core_src || m.fighters_src}) = ${fmtN(m.core_sum != null ? m.core_sum : m.fighters_sum)}`;
  const militiaDesc = hasRange ? ` + ополч. ${m.militia_src}` : '';
  const tip = `Боевая мощь (оборона) ${rangeStr}\n${coreDesc}${militiaDesc}\n× ${fmtN(m.mult)}\nΣ% (${sumParts.join(', ')})`;
  // Видимая строка разбивки
  const coreVal = m.core_sum != null ? m.core_sum : m.fighters_sum;
  const parts = [
    `<span class="np-might-part"><b>${fmtN(coreVal)}</b> ядро <span style="color:var(--muted);font-size:0.75em">(${m.core_src || m.fighters_src})</span></span>`,
  ];
  if (hasRange) parts.push(`<span class="np-might-part">ополч. <b>${m.militia_src}</b></span>`);
  parts.push(`<span class="np-might-part">лоял. <b>${pct(m.loyalty_pct)}</b></span>`);
  parts.push(`<span class="np-might-part">оборона <b>+${m.defense_pct}%</b></span>`);
  if (m.cult_war_pct > 0) parts.push(`<span class="np-might-part">культ войны <b>+${m.cult_war_pct}%</b></span>`);
  const tl = m.tag_list || [];
  if (tl.length) parts.push(`<span class="np-might-part">теги <b>${pct(m.tags_pct)}</b></span>`);
  parts.push(`<span class="np-might-part">× ${fmtN(m.mult)} = <b>${rangeStr}</b></span>`);
  return `<div class="np-stat"><span class="np-stat-label">Боевая мощь (оборона):</span> `
    + `<span class="np-might ${cls}" title="${esc(tip)}">⚔ ${rangeStr}</span></div>`
    + `<div class="np-might-breakdown">${parts.join(' · ')}</div>`;
}

function loyaltyBlock(ly, houses, might) {
  if (!ly) return '';
  const supporters = ly.supporters || {};
  const opponents = ly.opponents || {};
  const rows = [['Л', ly['Л'] || 0], ['Н', ly['Н'] || 0], ['НЛ', ly['НЛ'] || 0]];
  const denom = houses || rows.reduce((a, r) => a + r[1], 0)
              + Object.values(supporters).reduce((a, v) => a + v, 0)
              + Object.values(opponents).reduce((a, v) => a + v, 0);
  const bar = rows.filter(r => r[1] > 0).map(r =>
    `<span style="width:${pct(r[1], denom)}%;background:${LY_COLORS[r[0]]}"></span>`).join('')
    + Object.entries(supporters).filter(([, v]) => v > 0).map(([, v]) =>
    `<span style="width:${pct(v, denom)}%;background:#c8a84a"></span>`).join('')
    + Object.entries(opponents).filter(([, v]) => v > 0).map(([, v]) =>
    `<span style="width:${pct(v, denom)}%;background:#b5533f"></span>`).join('');
  const legend = rows.map(r =>
    `<span><span class="np-dot" style="background:${LY_COLORS[r[0]]}"></span>${LY_LABELS[r[0]]} <b>${r[1]} · ${pct(r[1], denom)}%</b></span>`).join('')
    + Object.entries(supporters).filter(([, v]) => v > 0).map(([who, v]) =>
    `<span><span class="np-dot" style="background:#c8a84a"></span>Сторонники ${esc(who)} <b>${v} · ${pct(v, denom)}%</b></span>`).join('')
    + Object.entries(opponents).filter(([, v]) => v > 0).map(([who, v]) =>
    `<span><span class="np-dot" style="background:#b5533f"></span>Противники ${esc(who)} <b>${v} · ${pct(v, denom)}%</b></span>`).join('');
  const uklad = ly['уклад'] || ly['Тип'];
  // Модификатор лояльности (та же логика, что в дашборде): бейдж «мод ±N» + причины.
  // Данные считаются и для нейтралов (generate_miniapp_data), просто не рисовались.
  const mod = ly.mod || 0;
  const modCls = mod > 0 ? 'pos' : mod < 0 ? 'neg' : 'zero';
  const modBadge = ` <span class="np-ly-mod ${modCls}">мод ${mod > 0 ? '+' : ''}${mod}</span>`;
  const reasons = ly.reasons || [];
  const reasonsHtml = reasons.length
    ? `<ul class="np-ly-reasons">${reasons.map(r => {
        const c = r.startsWith('+') ? 'pos' : (r.startsWith('−') || r.startsWith('-')) ? 'neg' : '';
        return `<li class="${c}">${esc(r)}</li>`;
      }).join('')}</ul>`
    : '';
  // Вклад лояльности в боевую мощь виден только в тултипе мощи, а на мобиле тултипов нет —
  // дублируем сюда явной строкой (для нейтралов это mod + база +2 ополчения).
  const mLoy = might ? (might.loyalty || 0) : null;
  const mightHint = (mLoy != null && might.neutral && mLoy !== mod)
    ? ` <span class="np-ly-hint">(мод ${mod > 0 ? '+' : ''}${mod} + ${mLoy - mod} ополчение)</span>` : '';
  const mCls = mLoy > 0 ? 'pos' : mLoy < 0 ? 'neg' : 'zero';
  const mightLine = (mLoy != null)
    ? `<div class="np-ly-might">Вклад в боевую мощь: <b class="${mCls}">${mLoy >= 0 ? '+' : ''}${mLoy}</b>${mightHint}</div>` : '';
  return `<div class="np-sub">Лояльность${uklad ? ' · ' + esc(uklad) : ''}${modBadge}</div>`
    + `<div class="np-bar">${bar}</div>`
    + `<div class="np-bar-legend">${legend}</div>`
    + reasonsHtml
    + mightLine;
}

function faithBlock(f, title) {
  if (!f || !f.cults || !f.cults.length) return '';
  const cults = f.cults;
  const bar = cults.map(c =>
    `<span style="width:${c.pct}%;background:${faithColor(c.name)}"></span>`).join('')
    + (f.neutral_pct > 0 ? `<span style="width:${f.neutral_pct}%;background:#3a3520"></span>` : '');
  const legend = cults.map(c =>
    `<span><span class="np-dot" style="background:${faithColor(c.name)}"></span>${esc(c.name)} <b>${c.count} · ${c.pct}%</b></span>`).join('')
    + (f.neutral > 0 ? `<span><span class="np-dot" style="background:#3a3520"></span>без культа <b>${f.neutral} · ${f.neutral_pct}%</b></span>` : '');
  return `<div class="np-sub">${title || 'Религия'}</div>`
    + `<div class="np-bar">${bar}</div>`
    + `<div class="np-bar-legend">${legend}</div>`;
}

// Сводная религия по всей клетке: суммируем дома по культам во всех НП.
// pct считаем от общего числа душ культа+без-культа, чтобы аггрегат был
// сопоставим с per-НП полосами (те же цвета — faithColor по имени).
function faithAggregate(settlements) {
  const tally = {}; let neutral = 0, total = 0;
  for (const s of settlements) {
    const f = s.faith; if (!f) continue;
    for (const c of (f.cults || [])) { tally[c.name] = (tally[c.name] || 0) + c.count; total += c.count; }
    if (f.neutral) { neutral += f.neutral; total += f.neutral; }
  }
  if (total <= 0) return '';
  const cults = Object.entries(tally)
    .map(([name, count]) => ({ name, count, pct: Math.round(count / total * 100) }))
    .sort((a, b) => b.count - a.count);
  const agg = { cults, neutral, neutral_pct: Math.round(neutral / total * 100) };
  return `<div class="area-faith-agg">${faithBlock(agg, 'Религия области')}</div>`;
}

function promyslyBlock(promysly) {
  if (!promysly || !promysly.length) return '';
  const rows = promysly.map(p => {
    const td = (p.tier && /\d/.test(p.tier)) ? p.tier.match(/\d/)[0] : null;
    const badge = td ? `<span class="np-tier-badge">Т${td}</span>` : '';
    const chain = (p.chain && p.chain !== '—') ? ` <span class="np-chain">${esc(p.chain)}</span>` : '';
    const owner = (p.owner && p.owner !== '—') ? `<span class="np-prom-owner">${esc(p.owner)}</span>` : '';
    return `<div class="np-prom-row"><span>${esc(p.name)}${badge}${chain}</span>${owner}</div>`;
  }).join('');
  return `<div class="np-sub">Промыслы</div>${rows}`;
}

function treasuryBlock(t) {
  if (!t) return '';
  const pct = t.pct;
  const col = pct >= 70 ? '#4a8a5a' : pct >= 40 ? '#b0904a' : '#8a3a2a';
  const razor = t.razoreno
    ? ` <span class="np-razoreno">Разорено</span>` : '';
  return `<div class="np-stat"><span class="np-stat-label">Казна:</span> `
    + `<b style="color:${col}">${pct}%</b>${razor}</div>`
    + `<div class="np-bar"><span style="width:${pct}%;background:${col}"></span></div>`;
}

function renderNeutralNPCard(s) {
  const houses_m = String(s.houses || '').match(/\d+/);
  const houses = houses_m ? parseInt(houses_m[0]) : 0;
  return `<div class="np-card">
    <div class="np-card-name">${esc(s.name)}</div>
    ${s.population ? `<div class="np-stat"><span class="np-stat-label">Население:</span> ${esc(s.population)}</div>` : ''}
    ${s.houses ? `<div class="np-stat"><span class="np-stat-label">Домов:</span> ${esc(s.houses)}</div>` : ''}
    ${treasuryBlock(s.treasury)}
    ${mightBlock(s.might)}
    ${npRoadsLine(s.name)}
    ${loyaltyBlock(s.loyalty, houses, s.might)}
    ${faithBlock(s.faith)}
    ${promyslyBlock(s.promysly)}
  </div>`;
}
</script>

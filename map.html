<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта — Сумерки мира</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0e0c;
    color: #c8b89a;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #8a7a5a;
    margin-bottom: 24px;
  }

  .map-wrap {
    width: 100%;
    overflow: hidden;
    position: relative;
    touch-action: none;
    cursor: grab;
  }
  .map-wrap:active { cursor: grabbing; }

  .map-zoom {
    display: inline-block;
    transform-origin: 0 0;
    will-change: transform;
  }

  .map {
    display: grid;
    grid-template-columns: 36px repeat(7, 64px);
    grid-template-rows: 24px repeat(5, 64px);
    gap: 3px;
    user-select: none;
    position: relative;
  }

  /* Дороги между клетками — SVG-оверлей поверх грида, клики проходят сквозь. */
  .world-roads { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
  .wr-line { stroke: #9a8548; stroke-width: 1.4; stroke-linecap: round; opacity: 0.4; }
  .wr-line-sea { stroke: #3a8ec8; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 5 4; opacity: 0.7; }
  /* Тележки торговцев / кораблики на морском пути (позицию двигает rAF) */
  .wr-cart { opacity: 0.85; }
  .wr-ship { opacity: 0.9; }
  /* Лёгкое «дыхание» бейджей поселений (фазы разведены inline animation-delay) */
  .cell-city { animation: cityBob 3.2s ease-in-out infinite; }
  @keyframes cityBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }

  .axis-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    color: #5a5040;
  }

  .cell {
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: default;
    position: relative;
    transition: filter 0.15s;
    border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
  }

  .cell-bg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    opacity: 0.13;
    pointer-events: none;
    z-index: 0;
    user-select: none;
  }

  .cell-code, .cell-coord { position: relative; z-index: 1; }

  /* Бейдж города — угловой маркер поверх ландшафта (не заменяет тип клетки) */
  .cell-city {
    position: absolute;
    top: 1px;
    right: 2px;
    font-size: 0.7rem;
    line-height: 1;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 0 1px rgba(0,0,0,0.9));
  }

  /* Бейдж руин — угловой маркер (левый верх, чтобы не перекрывать город) */
  .cell-ruins {
    position: absolute;
    top: 1px;
    left: 2px;
    font-size: 0.7rem;
    line-height: 1;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 0 1px rgba(0,0,0,0.9));
  }

  .cell:hover { filter: brightness(1.25); }
  .cell[data-tip] { cursor: pointer; }
  .cell.selected { filter: brightness(1.4); outline: 2px solid rgba(255,255,255,0.3); outline-offset: -1px; }

  .cell-code {
    font-size: 0.75rem;
    font-weight: bold;
    letter-spacing: 0.05em;
  }

  .cell-coord {
    font-size: 0.5rem;
    opacity: 0.5;
    margin-top: 2px;
  }

  /* info panel at bottom for mobile tap */
  .info-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1a1814;
    border-top: 1px solid #4a4030;
    padding: 14px 18px 20px;
    font-size: 0.82rem;
    line-height: 1.5;
    color: #c8b89a;
    display: none;
    z-index: 50;
  }
  .info-panel strong { color: #e0d090; display: block; margin-bottom: 4px; }
  .info-panel .tip-coord { color: #5a5040; font-size: 0.68rem; }

  /* types */
  .t-unknown  { background: #1a1814; border-color: #2a2520; }
  .t-unknown .cell-code { color: #3a3530; }

  .t-player-lak { background: linear-gradient(135deg, #1a2a3a, #0f1f30); border-color: #2a5a8a; }
  .t-player-lak .cell-code { color: #5aade0; }

  .t-player-klo { background: linear-gradient(135deg, #2a1a0f, #1f1008); border-color: #8a5a2a; }
  .t-player-klo .cell-code { color: #e0a05a; }

  .t-player-dun { background: linear-gradient(135deg, #1a2a1a, #0f1f0f); border-color: #3a7a3a; }
  .t-player-dun .cell-code { color: #6acf6a; }

  /* Слоты игроков по порядку (world_map_to_toon.py: t-player-1..6). 1-3 = тот же синий/оранж/зелёный. */
  .t-player-1 { background: linear-gradient(135deg, #1a2a3a, #0f1f30); border-color: #2a5a8a; }
  .t-player-1 .cell-code { color: #5aade0; }
  .t-player-2 { background: linear-gradient(135deg, #2a1a0f, #1f1008); border-color: #8a5a2a; }
  .t-player-2 .cell-code { color: #e0a05a; }
  .t-player-3 { background: linear-gradient(135deg, #1a2a1a, #0f1f0f); border-color: #3a7a3a; }
  .t-player-3 .cell-code { color: #6acf6a; }
  .t-player-4 { background: linear-gradient(135deg, #261a2e, #160f1f); border-color: #6a3a8a; }
  .t-player-4 .cell-code { color: #b07ad0; }
  .t-player-5 { background: linear-gradient(135deg, #2e1a1a, #1f0f0f); border-color: #8a3a3a; }
  .t-player-5 .cell-code { color: #e07a7a; }
  .t-player-6 { background: linear-gradient(135deg, #1a2e2c, #0f1f1d); border-color: #2a8a7a; }
  .t-player-6 .cell-code { color: #5ad0c0; }

  /* Присоединённые клетки игроков (t-owned-N): заливка = цвет игрока N, но клик
     нейтральный (клетка сохраняет своё имя/НП, не открывает область игрока). */
  .t-owned-1 { background: linear-gradient(135deg, #1a2a3a, #0f1f30); border-color: #2a5a8a; }
  .t-owned-1 .cell-code { color: #5aade0; }
  .t-owned-2 { background: linear-gradient(135deg, #2a1a0f, #1f1008); border-color: #8a5a2a; }
  .t-owned-2 .cell-code { color: #e0a05a; }
  .t-owned-3 { background: linear-gradient(135deg, #1a2a1a, #0f1f0f); border-color: #3a7a3a; }
  .t-owned-3 .cell-code { color: #6acf6a; }
  .t-owned-4 { background: linear-gradient(135deg, #261a2e, #160f1f); border-color: #6a3a8a; }
  .t-owned-4 .cell-code { color: #b07ad0; }
  .t-owned-5 { background: linear-gradient(135deg, #2e1a1a, #1f0f0f); border-color: #8a3a3a; }
  .t-owned-5 .cell-code { color: #e07a7a; }
  .t-owned-6 { background: linear-gradient(135deg, #1a2e2c, #0f1f1d); border-color: #2a8a7a; }
  .t-owned-6 .cell-code { color: #5ad0c0; }

  .t-mountain { background: linear-gradient(135deg, #252320, #1a1816); border-color: #4a4540; }
  .t-mountain .cell-code { color: #7a7060; }

  .t-ocean { background: linear-gradient(135deg, #0a1828, #071020); border-color: #1a3a5a; }
  .t-ocean .cell-code { color: #3a7aaa; }

  /* Шхеры/архипелаг — вода-суша вперемешку: сине-песочный градиент */
  .t-skerry { background: linear-gradient(135deg, #12222e, #1c2418); border-color: #2a6a6a; }
  .t-skerry .cell-code { color: #6ab0a8; }

  .t-evil { background: linear-gradient(135deg, #2a0f0f, #1f0808); border-color: #6a1a1a; }
  .t-evil .cell-code { color: #cc4444; }

  .t-neutral { background: linear-gradient(135deg, #1e1c16, #161410); border-color: #3a3520; }
  .t-neutral .cell-code { color: #9a8a5a; }

  /* Лес — густой зелёный */
  .t-forest { background: linear-gradient(135deg, #16241a, #0f1a12); border-color: #2a6a3a; }
  .t-forest .cell-code { color: #5ab070; }

  /* Болото — мутный зелёно-бурый */
  .t-swamp { background: linear-gradient(135deg, #1e2418, #161c10); border-color: #4a5a2a; }
  .t-swamp .cell-code { color: #8aa050; }

  /* tooltip (desktop hover) */
  .tooltip {
    position: fixed;
    background: #1e1c16;
    border: 1px solid #4a4030;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.78rem;
    color: #c8b89a;
    pointer-events: none;
    z-index: 100;
    max-width: 220px;
    line-height: 1.5;
    display: none;
  }
  .tooltip strong { color: #e0d090; display: block; margin-bottom: 4px; }
  .tooltip .tip-coord { color: #5a5040; font-size: 0.68rem; }
  @media (hover: none) { .tooltip { display: none !important; } }

  /* ── Area overlay ── */
  .area-overlay {
    position: fixed;
    inset: 0;
    background: #0f0e0c;
    z-index: 200;
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }
  .area-overlay.open { display: flex; }

  .area-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #2e2a22;
    flex-shrink: 0;
  }
  .area-back {
    background: none;
    border: 1px solid #3a3020;
    color: #9a8a6a;
    font: inherit;
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .area-back:hover { background: #1a1814; }
  .area-title { flex: 1; font-size: 0.95rem; color: #e0d090; letter-spacing: 0.05em; }
  .area-dash {
    font-size: 0.65rem;
    color: #7a6e5a;
    text-decoration: none;
    border: 1px solid #2e2a22;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .area-nps {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .np-card {
    background: #1a1814;
    border: 1px solid #2e2a22;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .np-card-name {
    font-size: 0.9rem;
    color: #c8a84a;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .np-stat { font-size: 0.78rem; color: #c8b89a; margin-bottom: 4px; }
  .np-stat-label { color: #7a6e5a; }
  .np-buildings {
    font-size: 0.7rem;
    color: #7a6e5a;
    margin-top: 8px;
    line-height: 1.5;
  }
  .np-roads {
    font-size: 0.7rem;
    color: #b89a52;
    margin-top: 6px;
    line-height: 1.5;
  }
  .area-loading { padding: 32px; text-align: center; color: #5a5040; font-size: 0.85rem; }
  .area-desc { font-size: 0.78rem; color: #9a8a6a; line-height: 1.55; padding: 10px 14px 0; }

  /* Внутренняя карта области (drill-down 4×4) — синхр. с player.html .am-* */
  .am-wrap { display:flex; justify-content:center; padding:6px 4px 2px; max-height:70vh; overflow:auto; }
  .am-svg { width:100%; max-width:360px; height:auto; max-height:70vh; overflow:visible; }
  .am-block { fill:none; stroke:#8a7a4a; stroke-width:1.5; opacity:.55; }
  .am-block-hole { fill:#0d0b07; stroke:#241f16; stroke-width:1; opacity:.5; }
  .am-grid { stroke:#241f16; stroke-width:1; }
  .am-road { stroke:#8a7a4a; stroke-width:2.4; stroke-linecap:round; }
  .am-road-edge { stroke-dasharray:5 4; opacity:.8; }
  .am-road-sea { stroke:#3a8ec8; stroke-width:2.6; stroke-dasharray:5 4; stroke-linecap:round; opacity:.85; }
  .am-arrow-sea { fill:#3a8ec8; opacity:.9; }
  .am-edge-label-sea { fill:#5aa8d0; }
  .am-cart { opacity:.9; pointer-events:none; }
  @keyframes am-house-breathe { 0%,100%{opacity:.82; transform:scale(1)} 50%{opacity:1; transform:scale(1.09)} }
  .am-node { fill:#c8a84a; stroke:#000; stroke-width:1; cursor:pointer; transform-box:fill-box; transform-origin:center; animation:am-house-breathe 3.4s ease-in-out infinite; }
  .am-node-sel { stroke:#fff; stroke-width:2; }
  .am-road-hi { stroke:#f0dc8e !important; stroke-width:3.6 !important; opacity:1 !important; }
  .am-arrow { fill:#8a7a4a; opacity:.9; }
  .am-label { fill:#c8bfa8; font-size:10px; }
  .am-pop { fill:#8a7e64; font-size:8.5px; }
  .am-edge-label { fill:#7a6e5a; font-size:10px; cursor:pointer; }
  .am-edge-label-go { text-decoration: underline; text-decoration-style: dotted; }
  .am-note { color:#7a6e5a; font-size:11px; text-align:center; padding:2px 8px 8px; }
  .am-frame { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .am-nav {
    display:grid;
    grid-template-columns:repeat(3, 20px);
    grid-template-rows:repeat(3, 20px);
    gap:2px;
    flex-shrink:0;
  }
  .am-nav-btn {
    width:20px; height:20px; padding:0;
    background:#1a1814; border:1px solid #3a3020; color:#c8a84a;
    border-radius:3px; cursor:pointer; font-size:9px; line-height:1;
    font-family:inherit;
  }
  .am-nav-btn:hover:not(:disabled) { background:#2a2418; border-color:#6a5820; color:#e0d090; }
  .am-nav-btn:disabled { opacity:.28; cursor:default; }
  .am-nav-n  { grid-column:2; grid-row:1; }
  .am-nav-nw { grid-column:1; grid-row:1; }
  .am-nav-ne { grid-column:3; grid-row:1; }
  .am-nav-w  { grid-column:1; grid-row:2; }
  .am-nav-c  {
    grid-column:2; grid-row:2;
    display:flex; align-items:center; justify-content:center;
    font-size:6px; color:#6a5e4a; text-align:center; line-height:1.05;
    pointer-events:none; user-select:none;
  }
  .am-nav-e  { grid-column:3; grid-row:2; }
  .am-nav-sw { grid-column:1; grid-row:3; }
  .am-nav-s  { grid-column:2; grid-row:3; }
  .am-nav-se { grid-column:3; grid-row:3; }

  /* neutral NP card blocks */
  .np-might { font-weight: bold; white-space: nowrap; cursor: help; }
  .np-might.pos { color: #c8a84a; }
  .np-might.neg { color: #8a3a2a; }
  .np-might.zero { color: #7a6e5a; }
  .np-might-breakdown { font-size: 0.66rem; color: #7a6e5a; margin: 2px 0 4px; display: flex; flex-wrap: wrap; gap: 2px 6px; }
  .np-might-part b { color: #a89a7a; }
  .np-sub { font-size: 0.72rem; color: #7a6e5a; margin: 8px 0 4px; letter-spacing: 0.03em; }
  .np-ly-mod { font-weight: bold; margin-left: 6px; }
  .np-ly-mod.pos { color: #c8a84a; }
  .np-ly-mod.neg { color: #8a3a2a; }
  .np-ly-mod.zero { color: #7a6e5a; }
  .np-razoreno { display: inline-block; font-size: 0.62rem; font-weight: bold; color: #1a1814;
    background: #8a3a2a; border-radius: 3px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
  .np-ly-reasons { list-style: none; margin: 4px 0 0; padding: 0; font-size: 0.66rem; color: #9a8a6a; }
  .np-ly-reasons li { line-height: 1.5; }
  .np-ly-reasons li.pos { color: #7aa87a; }
  .np-ly-reasons li.neg { color: #b06a5a; }
  .np-ly-might { font-size: 0.68rem; color: #9a8a6a; margin-top: 4px; }
  .np-ly-might b.pos { color: #c8a84a; }
  .np-ly-might b.neg { color: #8a3a2a; }
  .np-ly-might b.zero { color: #7a6e5a; }
  .np-ly-hint { color: #6a6050; }
  .np-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin: 3px 0 5px; background: #2e2a22; }
  .np-bar span { height: 100%; }
  .np-bar-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.68rem; color: #9a8a6a; }
  .np-bar-legend b { color: #c8b89a; font-weight: normal; }
  .np-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .np-promysly { font-size: 0.72rem; color: #9a8a6a; margin-top: 4px; }
  .np-promysly .np-stat-label { color: #7a6e5a; }
  .np-prom-row { font-size: 0.74rem; color: #c8b89a; display: flex; justify-content: space-between; gap: 8px; margin: 3px 0; }
  .np-prom-owner { color: #7a6e5a; font-size: 0.68rem; }
  .np-tier-badge { display: inline-block; font-size: 0.62rem; font-weight: bold; color: #1a1814;
    background: #c8a84a; border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: middle; }
  .np-chain { color: #7a6e5a; font-size: 0.68rem; }

  /* ── Атмосферные анимации (amb-*) ── еле заметный фоновый слой ── */

  /* Морской блик на ocean/skerry клетках */
  .cell.t-ocean::before, .cell.t-skerry::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 42%, rgba(150,200,235,.12) 50%, transparent 58%);
    transform: translateX(-120%);
    animation: amb-wave 8s ease-in-out infinite;
  }
  @keyframes amb-wave {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(120%); }
  }
  /* Разнобой бликов по nth-child чтобы не «моргали хором» */
  .cell.t-ocean:nth-child(3n+1)::before, .cell.t-skerry:nth-child(3n+1)::before { animation-delay: -2.5s; }
  .cell.t-ocean:nth-child(3n+2)::before, .cell.t-skerry:nth-child(3n+2)::before { animation-delay: -5.1s; }
  .cell.t-ocean:nth-child(3n)::before,   .cell.t-skerry:nth-child(3n)::before   { animation-delay: -1.3s; }

  /* Пасущаяся живность на нейтральных клетках */
  .amb-goat {
    position: absolute;
    font-size: 11px;
    opacity: .20;
    pointer-events: none;
    animation: amb-graze ease-in-out infinite;
  }
  @keyframes amb-graze {
    0%,100% { transform: translateX(0); }
    50%     { transform: translateX(3px); }
  }

  /* Дымок над домиками на карте области */
  @keyframes amb-smoke {
    0%   { opacity: 0;    transform: translateY(0)     scale(.5); }
    30%  { opacity: .16; }
    100% { opacity: 0;    transform: translateY(-15px) scale(1.3); }
  }
  .amb-smoke circle { transform-box: fill-box; transform-origin: center; }

  /* Пульсация воды на водных краях карты области */
  @keyframes amb-water-pulse {
    0%,100% { opacity: .85; }
    50%     { opacity: .5;  }
  }
  .amb-water { animation: amb-water-pulse 6s ease-in-out infinite; }

  /* Флажок на постройках admin/military в панораме */
  @keyframes pano-flag-wave { 0%,100% { transform: skewX(-3deg); } 50% { transform: skewX(3deg); } }
  @keyframes pano-particle-fall {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(110vh) translateX(var(--drift, 0)) rotate(360deg); opacity: 0; }
  }

  /* legend */
  .legend {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    justify-content: center;
    max-width: 480px;
  }

  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    color: #7a6a4a;
  }

  .leg-dot {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* ── Панорама поселения (pano-overlay) ── */
  #pano-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: none;
    flex-direction: column;
    background: #0a0908;
  }
  #pano-overlay.open { display: flex; }
  .pano-header {
    display: flex;
    align-items: center;

    overflow: hidden;
    display: flex;
    align-items: stretch;
    position: relative;
  }
  #pano-stage svg {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%">
  <h1 id="map-title" style="flex:1">Карта</h1>
  <div style="display:flex;gap:6px">
    <select id="run-sel" style="background:#1a1814;border:1px solid #2e2a22;color:#c8b89a;font:inherit;font-size:0.7rem;padding:4px 8px;border-radius:4px;cursor:pointer" onchange="switchRun(this.value)"><!-- забеги подставляются динамически из map_cells.toon --></select>
    <a href="player.html" style="font-size:0.65rem;color:#7a6e5a;text-decoration:none;border:1px solid #2e2a22;padding:4px 8px;border-radius:4px">👤 Дашборд</a>
  </div>
</div>

<div class="map-wrap" id="map-wrap">
  <div class="map-zoom" id="map-zoom">
    <div class="map" id="map"></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="info-panel" id="info-panel"></div>

<div id="area-overlay" class="area-overlay">
  <div class="area-header">
    <button class="area-back" onclick="closeArea()">← Карта</button>
    <div class="area-title" id="area-title"></div>
    <a class="area-dash" id="area-dash" href="player.html">Дашборд ↗</a>

  <div class="area-nps" id="area-nps"></div>

<!-- Панорама поселения -->
<div id="pano-overlay">
  <div class="pano-header">
    <button class="pano-back" onclick="closePano()">← Назад</button>
    <div class="pano-title" id="pano-title"></div>

  </div>
  <div id="pano-stage" onclick="closeBldCard()"></div>
  <div id="pano-bld-card" style="display:none;position:absolute;bottom:0;left:0;right:0;background:rgba(12,10,6,0.97);border-top:1px solid #4a3a20;padding:14px 16px 20px;z-index:10" onclick="event.stopPropagation()">
    <button onclick="closeBldCard()" style="float:right;background:none;border:none;color:#9a8a6a;font-size:1rem;cursor:pointer;padding:0 4px">✕</button>

</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#1a5a8a"></div>Область игрока</div>
  <div class="leg-item"><div class="leg-dot" style="background:#3a3520;border:1px solid #5a5030"></div>Нейтральная зона</div>
  <div class="leg-item"><div class="leg-dot" style="background:#252320"></div>Горный хребет</div>
  <div class="leg-item"><div class="leg-dot" style="background:#0f1a12;border:1px solid #2a6a3a"></div>Лес</div>
  <div class="leg-item"><div class="leg-dot" style="background:#161c10;border:1px solid #4a5a2a"></div>Болото</div>
  <div class="leg-item"><div class="leg-dot" style="background:#071020"></div>Море</div>
  <div class="leg-item"><div class="leg-dot" style="background:#1c2418;border:1px solid #2a6a6a"></div>Шхеры</div>
  <div class="leg-item"><div class="leg-dot" style="background:#2a0f0f"></div>Опасная область</div>
  <div class="leg-item"><div class="leg-dot" style="background:#1a1814;border:1px solid #2a2520"></div>Неизвестно</div>
  <div class="leg-item"><span style="font-size:0.8rem">🏰</span>&nbsp;Город</div>
  <div class="leg-item"><span style="font-size:0.8rem">🏛</span>&nbsp;Руины</div>

<script>
// Ячейки карты грузятся из data/map_cells.toon (секции по забегам). Список забегов — динамический,
// собирается из ключей toon (как дашборды по data/{run}_{player}.json). Новый забег появляется сам.
let RUNS_META = {};      // run_id -> { label, cells }
let CELLS = {};
let currentRun = null;

function runLabel(run) {
  const n = (String(run).match(/(\d+)/) || [])[1];
  return n ? ("Забег " + n) : run;
}

function switchRun(run) {
  currentRun = run;
  const meta = RUNS_META[run] || { cells: {} };
  CELLS = meta.cells || {};
  rebuildPlayerMeta();
  const t = "Карта — " + runLabel(run);
  document.getElementById("map-title").textContent = t;
  document.title = t;
  rebuildMap();
}

// Слоты t-player-N — ПОСТЕЙЗОННЫ: в разных забегах номер 1 — разные игроки.
// Поэтому PLAYER_META перестраиваем ТОЛЬКО из клеток текущего забега (при switchRun и init).
// Легаси-ключи lak/klo/dun (run_004) не трогаем — они не пересекаются с новыми числовыми.
function rebuildPlayerMeta() {
  Object.keys(PLAYER_META).forEach(k => { if (/^\w+$/.test(k) && !['lak','klo','dun'].includes(k)) delete PLAYER_META[k]; });
  const cells = ((RUNS_META[currentRun] || { cells: {} }).cells) || {};
  Object.values(cells).forEach(c => {
    const pm = (typeof c === 'object' && c.type ? c.type : '').match(/^t-player-(\w+)$/);
    if (pm && c.player) PLAYER_META[pm[1]] = { key: c.player, name: c.name };
  });
}

const MARGIN = 2;  // фог-кольцо вокруг клеток: область героя не на границе, карта расширяема
let X_MIN = -3, X_MAX = 3, Y_MIN = -2, Y_MAX = 2;

// Границы грида = bbox клеток забега + поле MARGIN (дальние пустые клетки = туман войны)
function computeBounds() {
  const keys = Object.keys(CELLS);
  if (!keys.length) { X_MIN = -3; X_MAX = 3; Y_MIN = -2; Y_MAX = 2; return; }
  const xs = [], ys = [];
  for (const k of keys) { const p = k.split(','); xs.push(+p[0]); ys.push(+p[1]); }
  X_MIN = Math.min(...xs) - MARGIN; X_MAX = Math.max(...xs) + MARGIN;
  Y_MIN = Math.min(...ys) - MARGIN; Y_MAX = Math.max(...ys) + MARGIN;
}

const mapEl   = document.getElementById('map');
const zoomEl  = document.getElementById('map-zoom');
const wrapEl  = document.getElementById('map-wrap');
const tip     = document.getElementById('tooltip');
const panel   = document.getElementById('info-panel');

let selectedCell = null;

function infoHtml(data, x, y) {
  const pop = data.pop ? ' <span class="tip-coord">(~' + data.pop + ' чел.)</span>' : '';
  return '<strong>' + data.name + '</strong>' + pop + '<br>' +
    data.note +
    '<br><span class="tip-coord">(' + (x>0?'+':'') + x + ', ' + (y>0?'+':'') + y + ')</span>';
}

// ── Build/rebuild grid ───────────────────────────────────────────────────────
function rebuildMap() {
  mapEl.innerHTML = '';
  if (selectedCell) { selectedCell = null; panel.style.display = 'none'; }

  computeBounds();
  mapEl.style.gridTemplateColumns = '36px repeat(' + (X_MAX - X_MIN + 1) + ', 64px)';
  mapEl.style.gridTemplateRows = '24px repeat(' + (Y_MAX - Y_MIN + 1) + ', 64px)';

  const corner = document.createElement('div');
  corner.className = 'axis-label';
  mapEl.appendChild(corner);
  for (let x = X_MIN; x <= X_MAX; x++) {
    const lbl = document.createElement('div');
    lbl.className = 'axis-label';
    lbl.textContent = (x > 0 ? '+' : '') + x;
    mapEl.appendChild(lbl);
  }

  const cellDivs = {};
  for (let y = Y_MAX; y >= Y_MIN; y--) {
    const ylbl = document.createElement('div');
    ylbl.className = 'axis-label';
    ylbl.textContent = (y > 0 ? '+' : '') + y;
    mapEl.appendChild(ylbl);

    for (let x = X_MIN; x <= X_MAX; x++) {
      const key = x + ',' + y;
      const data = CELLS[key];
      const cell = document.createElement('div');
      cell.className = 'cell ' + (data ? data.type : 't-unknown');

      if (data && data.icon) {
        const bg = document.createElement('div');
        bg.className = 'cell-bg';
        bg.textContent = data.icon;
        cell.appendChild(bg);
      }

      if (data && data.city) {
        const cb = document.createElement('div');
        cb.className = 'cell-city';
        cb.style.animationDelay = (((x * 7 + y * 13) % 32) / 10).toFixed(1) + 's';
        cb.textContent = data.city;
        cell.appendChild(cb);
      }

      if (data && data.ruins) {
        const rb = document.createElement('div');
        rb.className = 'cell-ruins';
        rb.textContent = data.ruins;
        cell.appendChild(rb);
      }

      const code = document.createElement('div');
      code.className = 'cell-code';
      code.textContent = data ? data.code : '---';
      cell.appendChild(code);

      const coord = document.createElement('div');
      coord.className = 'cell-coord';
      coord.textContent = (x > 0 ? '+' : '') + x + ' ' + (y > 0 ? '+' : '') + y;
      cell.appendChild(coord);

      if (data) {
        cell.setAttribute('data-tip', '1');

        cell.addEventListener('mouseenter', e => {
          tip.style.display = 'block';
          tip.innerHTML = infoHtml(data, x, y);
        });
        cell.addEventListener('mousemove', e => {
          const tw = tip.offsetWidth, th = tip.offsetHeight;
          const vw = window.innerWidth, vh = window.innerHeight;
          let lft = e.clientX + 14, top = e.clientY - 10;
          if (lft + tw > vw - 8) lft = e.clientX - tw - 14;
          if (top + th > vh - 8) top = e.clientY - th - 10;
          tip.style.left = Math.max(8, lft) + 'px';
          tip.style.top  = Math.max(8, top) + 'px';
        });
        cell.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

        cell.addEventListener('click', e => {
          if (isPinching) return;
          const pm = data.type.match(/^t-player-(\w+)$/);
          if (pm) { openCell(data, pm[1], x, y); e.stopPropagation(); return; }
          // Присоединённая клетка игрока (t-owned-N) — маршрутируем в дашборд владельца.
          const om = data.type.match(/^t-owned-(\w+)$/);
          if (om && data.player) {
            const ownerKey = Object.keys(PLAYER_META).find(k => PLAYER_META[k].key === data.player);
            if (ownerKey) { openCell(data, ownerKey, x, y); e.stopPropagation(); return; }
          }
          // Любая не-игрока клетка (нейтрал/горы/море/опасная/шхеры/туман) —
          // единый оверлей: описание + НП, если они заведены. Тип клетки НЕ
          // влияет на клик: значок — визуальная подсказка, а не гейт данных.
          openCellDetails(data, x, y);
          e.stopPropagation();
        });
      }

      // Живность на нейтральных клетках (~25% через детерминированный хэш)
      if (data && data.type === 't-neutral') {
        const h = (x * 73856093 ^ y * 19349663) >>> 0;
        if (h % 4 === 0) {
          const goat = document.createElement('span');
          goat.className = 'amb-goat';
          // позиция и скорость — детерминированы от координат
          const bPct  = 15 + (h % 40);       // bottom 15-54%
          const lPct  = 12 + ((h >> 4) % 60); // left 12-71%
          const dur   = 6 + (h % 4);           // 6-9 сек
          const delay = ((h >> 8) % 30) / 10;  // 0-2.9 сек
          goat.textContent = '🐐';
          goat.style.cssText = `bottom:${bPct}%;left:${lPct}%;animation-duration:${dur}s;animation-delay:-${delay}s`;
          cell.appendChild(goat);
        }
      }

      mapEl.appendChild(cell);
      cellDivs[key] = cell;
    }
  }
  drawWorldRoads(cellDivs);
  centerMap();
}

// Дороги мировой карты: линии между центрами клеток (координаты берём из DOM —
// gap/размеры клеток учитываются сами). Оверлей поверх грида, клики проходят сквозь.
let _cartRAF = null;
// Строим телегу через createElementNS (НЕ g.innerHTML): innerHTML на SVG-элементе
// в WKWebView (Telegram iOS) создаёт детей в HTML-namespace — <rect>/<circle> не
// рендерятся, телега пустая/невидимая. createElementNS гарантирует SVG-namespace.
const _CART_SHAPES_WORLD = [
  ['rect', { x: -8.4, y: -6.6, width: 16.8, height: 8.4, rx: 2.2, fill: '#7a5a34', stroke: '#4a3820', 'stroke-width': 1.1 }],
  ['rect', { x: -8.4, y: -10.2, width: 12, height: 4.3, rx: 1.3, fill: '#9a7648', opacity: 0.9 }],
  ['circle', { cx: -4.6, cy: 3.4, r: 2.8, fill: '#2e2214', stroke: '#5a4428', 'stroke-width': 1 }],
  ['circle', { cx: 4.6, cy: 3.4, r: 2.8, fill: '#2e2214', stroke: '#5a4428', 'stroke-width': 1 }],
];
// Кораблик для #морской_путь (корпус + парус)
const _SHIP_SHAPES_WORLD = [
  ['ellipse', { cx: 0, cy: 3.2, rx: 9.5, ry: 3.4, fill: '#6a4a2e', stroke: '#3a2818', 'stroke-width': 1 }],
  ['path', { d: 'M -7 2.5 Q 0 -1 7 2.5', fill: 'none', stroke: '#8a6a42', 'stroke-width': 1.2 }],
  ['line', { x1: 0, y1: 2, x2: 0, y2: -10, stroke: '#4a3820', 'stroke-width': 1.3 }],
  ['path', { d: 'M 0 -10 L 8 -2 L 0 1 Z', fill: '#d8e6f2', stroke: '#6a8aaa', 'stroke-width': 0.8 }],
];
const _CART_SHAPES_AREA = [
  ['rect', { x: -7, y: -5, width: 14, height: 7, rx: 1.6, fill: '#7a5a34', stroke: '#4a3820', 'stroke-width': 0.9 }],
  ['rect', { x: -7, y: -8, width: 10, height: 3.4, rx: 1.1, fill: '#9a7648', opacity: 0.9 }],
  ['circle', { cx: -3.6, cy: 2.6, r: 2.1, fill: '#2e2214', stroke: '#5a4428', 'stroke-width': 0.8 }],
  ['circle', { cx: 3.6, cy: 2.6, r: 2.1, fill: '#2e2214', stroke: '#5a4428', 'stroke-width': 0.8 }],
];
function _buildCartG(SVGNS, cls, shapes) {
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', cls);
  for (const [tag, attrs] of shapes) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    g.appendChild(e);
  }
  return g;
}
// Цвета своих дорог: индекс (dir_color из toon) → hex. Совпадают с яркими
// цветами .t-player-N .cell-code в CSS, чтобы дорога была цвета клетки владельца.
const OWNER_ROAD_COLORS = {
  1: '#5aade0', 2: '#e0a05a', 3: '#6acf6a',
  4: '#b07ad0', 5: '#e07a7a', 6: '#5ad0c0',
};
function drawWorldRoads(cellDivs) {
  const SVGNS = 'http://www.w3.org/2000/svg';
  if (_cartRAF) { cancelAnimationFrame(_cartRAF); _cartRAF = null; }
  const old = document.getElementById('world-roads');
  if (old) old.remove();
  const edges = (RUNS_META[currentRun] || {}).roads || [];
  if (!edges.length) return;
  const W = mapEl.offsetWidth, H = mapEl.offsetHeight;
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('id', 'world-roads');
  svg.setAttribute('class', 'world-roads');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  const cen = d => [d.offsetLeft + d.offsetWidth / 2, d.offsetTop + d.offsetHeight / 2];
  const landSegs = [], seaSegs = [];
  for (const edge of edges) {
    const a = edge.a, b = edge.b;
    const da = cellDivs[a[0] + ',' + a[1]], db = cellDivs[b[0] + ',' + b[1]];
    if (!da || !db) continue;
    const [ax, ay] = cen(da), [bx, by] = cen(db);
    const ln = document.createElementNS(SVGNS, 'line');
    const isSea = !!edge.sea;
    ln.setAttribute('class', isSea ? 'wr-line wr-line-sea' : 'wr-line');
    ln.setAttribute('x1', ax); ln.setAttribute('y1', ay);
    ln.setAttribute('x2', bx); ln.setAttribute('y2', by);
    if (!isSea) {
      const oc = (edge.color != null) ? OWNER_ROAD_COLORS[edge.color] : null;
      if (oc) {
        // style=, не presentation-attribute: CSS .wr-line { stroke } иначе перебивает
        ln.setAttribute('style', `stroke:${oc};stroke-opacity:0.85;stroke-width:2.2`);
        ln.classList.add('wr-line-own');
      }
    }
    svg.appendChild(ln);
    const ak = a[0] + ',' + a[1], bk = b[0] + ',' + b[1];
    const seg = { ax, ay, bx, by, len: Math.hypot(bx - ax, by - ay), ak, bk };
    (isSea ? seaSegs : landSegs).push(seg);
  }
  // Телеги / корабли: в каждой точке случайно выбирают следующую дорогу и едут.
  const MAX_CARTS = 8, CART_SPEED = 22;
  const MAX_SHIPS = 4, SHIP_SPEED = 16;
  const landAdj = _worldRoadAdj(landSegs);
  const seaAdj = _worldRoadAdj(seaSegs);
  const landKeys = Object.keys(landAdj);
  const seaKeys = Object.keys(seaAdj);
  const movers = [];
  for (let i = 0; i < Math.min(MAX_CARTS, Math.max(landKeys.length, landSegs.length)); i++) {
    if (!landKeys.length) break;
    const g = _buildCartG(SVGNS, 'wr-cart', _CART_SHAPES_WORLD);
    svg.appendChild(g);
    const at = landKeys[(Math.random() * landKeys.length) | 0];
    movers.push({ g, adj: landAdj, at, from: null, leg: null, progress: 0, speed: CART_SPEED, ship: false });
  }
  for (let i = 0; i < Math.min(MAX_SHIPS, Math.max(seaKeys.length, seaSegs.length)); i++) {
    if (!seaKeys.length && !seaSegs.length) break;
    const g = _buildCartG(SVGNS, 'wr-ship', _SHIP_SHAPES_WORLD);
    svg.appendChild(g);
    // если граф моря связный — тот же random-walk; иначе катаемся по одному ребру туда-сюда
    if (seaKeys.length) {
      const at = seaKeys[(Math.random() * seaKeys.length) | 0];
      movers.push({ g, adj: seaAdj, at, from: null, leg: null, progress: 0, speed: SHIP_SPEED, ship: true });
    } else {
      const s = seaSegs[i % seaSegs.length];
      const adj = _worldRoadAdj([s]);
      movers.push({ g, adj, at: s.ak, from: null, leg: null, progress: 0, speed: SHIP_SPEED, ship: true });
    }
  }
  mapEl.insertBefore(svg, mapEl.firstChild);
  if (!movers.length) return;
  // Сразу выбрать первый отрезок
  movers.forEach(c => _worldWalkerPickLeg(c));
  let lastTs = null;
  const frame = ts => {
    if (lastTs === null) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    for (const c of movers) {
      if (!c.leg) _worldWalkerPickLeg(c);
      if (!c.leg) continue;
      c.progress += c.speed * dt;
      if (c.progress >= c.leg.len) {
        c.from = c.leg.from;
        c.at = c.leg.to;
        c.leg = null;
        c.progress = 0;
        _worldWalkerPickLeg(c);
        if (!c.leg) continue;
      }
      const u = c.leg.len ? Math.min(1, c.progress / c.leg.len) : 0;
      const x = c.leg.ax + (c.leg.bx - c.leg.ax) * u;
      const y = c.leg.ay + (c.leg.by - c.leg.ay) * u;
      let tf = `translate(${x.toFixed(1)} ${y.toFixed(1)})`;
      if (c.ship) {
        const ang = Math.atan2(c.leg.by - c.leg.ay, c.leg.bx - c.leg.ax) * 180 / Math.PI;
        tf += ` rotate(${ang.toFixed(1)})`;
      }
      c.g.setAttribute('transform', tf);
    }
    _cartRAF = requestAnimationFrame(frame);
  };
  _cartRAF = requestAnimationFrame(frame);
}

/** Граф дорог: key клетки → [{to, seg, flip}]. */
function _worldRoadAdj(segs) {
  const adj = {};
  for (const s of segs) {
    if (!s.ak || !s.bk || s.len < 2) continue;
    (adj[s.ak] = adj[s.ak] || []).push({ to: s.bk, seg: s, flip: false });
    (adj[s.bk] = adj[s.bk] || []).push({ to: s.ak, seg: s, flip: true });
  }
  return adj;
}

/** В текущей точке — случайный выбор следующей дороги (без немедленного разворота, если есть выбор). */
function _worldWalkerPickLeg(c) {
  let opts = (c.adj[c.at] || []).filter(e => e.to !== c.from);
  if (!opts.length) opts = c.adj[c.at] || [];
  if (!opts.length) { c.leg = null; return; }
  const pick = opts[(Math.random() * opts.length) | 0];
  const s = pick.seg;
  c.leg = pick.flip
    ? { ax: s.bx, ay: s.by, bx: s.ax, by: s.ay, len: s.len, from: s.bk, to: s.ak }
    : { ax: s.ax, ay: s.ay, bx: s.bx, by: s.by, len: s.len, from: s.ak, to: s.bk };
  c.progress = 0;
}

// Click outside → deselect
document.addEventListener('click', () => {
  if (selectedCell) { selectedCell.classList.remove('selected'); selectedCell = null; }
  panel.style.display = 'none';
});

// ── Pinch-to-zoom + pan ─────────────────────────────────────────────────────
let scale = 1, tx = 0, ty = 0;
let isPinching = false;

// Center the map initially
function centerMap() {
  const mw = mapEl.offsetWidth, mh = mapEl.offsetHeight;
  const ww = wrapEl.offsetWidth, wh = wrapEl.offsetHeight;
  tx = Math.max(0, (ww - mw) / 2);
  ty = Math.max(0, (wh - mh) / 2);
  applyT();
}

function applyT() {
  zoomEl.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

// clamp translation so map doesn't fly off
function clampT() {
  const mw = mapEl.offsetWidth * scale;
  const mh = mapEl.offsetHeight * scale;
  const ww = wrapEl.offsetWidth;
  const wh = wrapEl.offsetHeight;
  const margin = 60;
  tx = Math.min(margin, Math.max(ww - mw - margin, tx));
  ty = Math.min(margin, Math.max(wh - mh - margin, ty));
}

// wrap height = map height (initial scale)
wrapEl.style.height = (mapEl.offsetHeight || 360) + 'px';

let ptrs = {};
let lastPinchDist = 0, pinchOriginX = 0, pinchOriginY = 0;
let startTx = 0, startTy = 0, startScale = 1;
let panStartX = 0, panStartY = 0;

wrapEl.addEventListener('pointerdown', e => {
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  // no setPointerCapture — it redirects click events to wrapEl, breaking cell clicks
  const ids = Object.keys(ptrs);
  if (ids.length === 1) {
    panStartX = e.clientX - tx;
    panStartY = e.clientY - ty;
  } else if (ids.length === 2) {
    isPinching = true;
    const p0 = ptrs[ids[0]], p1 = ptrs[ids[1]];
    lastPinchDist = Math.hypot(p0.x - p1.x, p0.y - p1.y);
    pinchOriginX = (p0.x + p1.x) / 2;
    pinchOriginY = (p0.y + p1.y) / 2;
    startScale = scale;
    startTx = tx; startTy = ty;
  }
});

wrapEl.addEventListener('pointermove', e => {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  const ids = Object.keys(ptrs);
  if (ids.length === 2) {
    const p0 = ptrs[ids[0]], p1 = ptrs[ids[1]];
    const dist = Math.hypot(p0.x - p1.x, p0.y - p1.y);
    const newScale = Math.min(4, Math.max(0.4, startScale * dist / lastPinchDist));
    // zoom around pinch origin
    const ratio = newScale / startScale;
    tx = pinchOriginX - ratio * (pinchOriginX - startTx);
    ty = pinchOriginY - ratio * (pinchOriginY - startTy);
    scale = newScale;
    clampT();
    applyT();
  } else if (ids.length === 1 && !isPinching) {
    tx = e.clientX - panStartX;
    ty = e.clientY - panStartY;
    clampT();
    applyT();
  }
});

const endPtr = e => {
  delete ptrs[e.pointerId];
  if (Object.keys(ptrs).length < 2) {
    setTimeout(() => { isPinching = false; }, 100);
  }
};
wrapEl.addEventListener('pointerup', endPtr);
wrapEl.addEventListener('pointercancel', endPtr);

// Mouse wheel zoom
wrapEl.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(4, Math.max(0.4, scale * delta));
  const rect = wrapEl.getBoundingClientRect();
  const ox = e.clientX - rect.left, oy = e.clientY - rect.top;
  tx = ox - (newScale / scale) * (ox - tx);
  ty = oy - (newScale / scale) * (oy - ty);
  scale = newScale;
  clampT();
  applyT();
}, { passive: false });

window.addEventListener('resize', centerMap);

// ── TOON loader ───────────────────────────────────────────────────────────────
function parseToon(text) {
  const root = {};
  const stack = [{ indent: -1, obj: root }];
  for (const raw of text.split('\n')) {
    const trimmed = raw.trim();
    if (!trimmed || trimmed.startsWith('#')) continue;
    const indent = raw.search(/\S/);
    const ci = trimmed.indexOf(':');
    if (ci === -1) continue;
    const key = trimmed.slice(0, ci).trim();
    const val = trimmed.slice(ci + 1).trim();
    while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
    const parent = stack[stack.length - 1].obj;
    if (val) { parent[key] = val; }
    else { parent[key] = {}; stack.push({ indent, obj: parent[key] }); }
  }
  return root;
}

// Блок roads из toon: { e0: "x1,y1 x2,y2 [color|sea]", ... } →
//   [ { a:[x1,y1], b:[x2,y2], color: N|null, sea: bool }, ... ].
function parseRoadEdges(obj) {
  const out = [];
  if (!obj || typeof obj !== 'object') return out;
  for (const v of Object.values(obj)) {
    if (typeof v !== 'string') continue;
    const parts = v.trim().split(/\s+/);
    if (parts.length < 2) continue;
    const a = parts[0].split(',').map(Number);
    const b = parts[1].split(',').map(Number);
    let color = null, sea = false;
    if (parts.length >= 3) {
      if (parts[2].toLowerCase() === 'sea') sea = true;
      else {
        const n = parseInt(parts[2], 10);
        if (!isNaN(n)) color = n;
      }
    }
    out.push({ a, b, color, sea });
  }
  return out;
}

// Direct Link Mini App: t.me/twilightsHelperBot/map?startapp=<mode>-<...>
// Апп один (map.html), поэтому режим кодируется в start_param:
//   map-<run>            → показать карту забега
//   dash-<player>-<run>  → это /dash из группы: редиректим на дашборд
// start_param допускает только [A-Za-z0-9_-]; run_006 и имена игроков без «-», разделитель «-» безопасен.
function startParamRun() {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); if (tg.expand) tg.expand(); }
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (!sp) return null;
  const parts = sp.split("-");
  const mode = parts[0];
  if (mode === "dash") {
    const player = parts[1] || "";
    const run = parts.slice(2).join("-");
    const q = [];
    if (player) q.push("player=" + encodeURIComponent(player));
    if (run) q.push("run=" + encodeURIComponent(run));
    location.replace("player.html" + (q.length ? "?" + q.join("&") : ""));
    return "__redirect__";
  }
  if (mode === "map") return parts.slice(1).join("-") || null;
  return null;
}

async function initMap() {
  const spRun = startParamRun();
  if (spRun === "__redirect__") return;  // ушли на дашборд
  try {
    const res = await fetch(`data/map_cells.toon?_=${Date.now()}`);
    const parsed = parseToon(await res.text());
    const runs = Object.keys(parsed).sort().reverse(); // последний забег — первым/по умолчанию
    RUNS_META = {};
    runs.forEach(r => {
      const raw = parsed[r] || {};
      const roads = parseRoadEdges(raw.roads);
      delete raw.roads;  // «roads» — не клетка: убрать из cells, иначе computeBounds получит NaN
      RUNS_META[r] = { label: runLabel(r), cells: raw, roads };
    });
    const sel = document.getElementById("run-sel");
    sel.innerHTML = runs.map(r => `<option value="${r}">${runLabel(r)}</option>`).join("");
    // ?run=run_005 в URL → открыть конкретный забег (для нескольких активных); иначе последний.
    const urlRun = new URLSearchParams(location.search).get("run") || spRun;
    currentRun = (urlRun && RUNS_META[urlRun]) ? urlRun : (runs[0] || "run_004");
    sel.value = currentRun;
    CELLS = (RUNS_META[currentRun] || { cells: {} }).cells;
    rebuildPlayerMeta();  // Слоты t-player-N — только по клеткам currentRun (см. rebuildPlayerMeta).
    const t = "Карта — " + runLabel(currentRun);
    document.getElementById("map-title").textContent = t;
    document.title = t;
  } catch (e) {
    mapEl.innerHTML = `<div style="grid-column:1/-1;padding:32px;color:#c8883a">Ошибка загрузки map_cells.toon: ${e.message}</div>`;
    return;
  }
  rebuildMap();
  // Deep-link: map.html?run=…&cx=4&cy=-2 → сразу открыть клетку (с подписи дороги).
  const _spOpen = new URLSearchParams(location.search);
  const _ocx = _spOpen.get('cx'), _ocy = _spOpen.get('cy');
  if (_ocx != null && _ocy != null && !Number.isNaN(+_ocx) && !Number.isNaN(+_ocy)) {
    setTimeout(() => openCellAt(+_ocx, +_ocy), 0);
  }
}
window.addEventListener('load', initMap);

// ── Area overlay ─────────────────────────────────────────────────────────────
// Legacy (run_004 toon с t-player-lak/klo/dun). Слотовые забеги (t-player-1..) дополняют это
// динамически в initMap из поля player: каждой клетки. Нужен только key (dir игрока для дашборда).
let PLAYER_META = {
  lak: { key: 'valter', name: 'Область Лаки' },
  klo: { key: 'danil',  name: 'Область Клода' },
  dun: { key: 'misha',  name: 'Область Дунара' },
};
const areaCache = {};
let currentExternals = [];
const areaOverlay = document.getElementById('area-overlay');
const areaNps     = document.getElementById('area-nps');
const areaTitle   = document.getElementById('area-title');
const areaDash    = document.getElementById('area-dash');

async function openCell(cellData, playerType, cx, cy) {
  _amViewX = (cx == null ? null : +cx);
  _amViewY = (cy == null ? null : +cy);
  const meta = PLAYER_META[playerType];
  if (!meta) return;
  areaTitle.textContent = cellData.pop ? `${cellData.name} (~${cellData.pop} чел.)` : cellData.name;
  areaDash.href = `player.html?player=${meta.key}&run=${currentRun}`;
  areaDash.style.display = '';
  areaOverlay.classList.add('open');

  // Area description from map data
  const descHtml = cellData.note
    ? `<div class="area-desc">${cellData.note}</div>`
    : '';

  areaNps.innerHTML = descHtml + '<div class="area-loading">Загрузка НП…</div>';

  const cacheKey = currentRun + '_' + meta.key;
  if (!areaCache[cacheKey]) {
    try {
      const res = await fetch(`data/${cacheKey}.json?_=${Date.now()}`);
      areaCache[cacheKey] = await res.json();
    } catch {
      areaNps.innerHTML = descHtml + amWithNav('') + '<div class="area-loading">Ошибка загрузки данных</div>';
      return;
    }
  }
  // Тап по клетке = увеличенная карта ТОЛЬКО этой клетки (один блок 4×4), НЕ
  // сшитые владения игрока. Вырезаем блок клетки (cx,cy) из общей area_map и
  // показываем НП только этой клетки. Фолбэк (нет коорд/блока) — прежнее
  // поведение: вся область по имени + сшитая карта.
  const all = areaCache[cacheKey].settlements || [];
  const amFull = areaCache[cacheKey].area_map;
  const cellMap = (amFull && cx != null && cy != null) ? cellAreaMap(amFull, cx, cy) : null;
  const cellNames = cellMap ? new Set(cellMap.nodes.map(n => n.name)) : null;
  const inArea = cellNames
    ? all.filter(s => cellNames.has(s.name))
    : all.filter(s => (s.area || s.name) === cellData.name);
  const settlements = (inArea.length ? inArea : all).slice().sort((a, b) =>
    (a.name === cellData.name ? 0 : 1) - (b.name === cellData.name ? 0 : 1));
  const amHtml = cellMap ? renderAreaMap(cellMap)
    : (amFull ? renderAreaMap(amFull) : '');
  // Короткая сводка по религии области — та же логика, что у нейтралов.
  const agg = settlements.length > 1 ? faithAggregate(settlements) : '';
  NP_ROADS = buildRoadsByNp(((cellMap || amFull) || {}).roads);
  // Заполняем словарь имя→settlement для панорамы
  panoSetts = {};
  settlements.forEach(s => { panoSetts[s.name] = s; });
  currentPanoSeasonName = (areaCache[cacheKey] && areaCache[cacheKey].season_name) || null;
  currentExternals = (areaCache[cacheKey] && areaCache[cacheKey].external_buildings) || [];
  const npHtml = settlements.length
    ? settlements.map(renderNPCard).join('')
    : '<div class="area-loading">НП не найдены в данных</div>';
  areaNps.innerHTML = descHtml + amWithNav(amHtml) + agg + npHtml;
  animateAreaCarts(areaNps);
}

function closeArea() {
  areaOverlay.classList.remove('open');
  if (_amCartRAF) { cancelAnimationFrame(_amCartRAF); _amCartRAF = null; }
}

// Любая прочая клетка (горы / море / шхеры / опасная область): открываем тот же
// оверлей с названием, типом, координатами и примечанием — без разбивки НП.
const TYPE_LABELS = {
  't-mountain': 'Горы / хребет',
  't-ocean': 'Море',
  't-skerry': 'Шхеры / архипелаг',
  't-evil': 'Опасная область',
  't-unknown': 'Туман — неизвестно',
};

// Единый оверлей для НЕ-игрока клетки: тип-подпись + координаты + описание,
// и разбивка НП, если она есть в neutrals JSON. Раньше нейтралы шли в один
// путь, а горы/море/опасная/шхеры — в другой (без НП-поиска). Теперь путь
// один: значок клетки — визуальная подсказка, а не гейт данных. Некоторые
// клетки будут БЕЗ НП — это нормально, просто раздел не отрисовывается.
async function openCellDetails(cellData, x, y) {
  _amViewX = (x == null ? null : +x);
  _amViewY = (y == null ? null : +y);
  areaTitle.textContent = cellData.pop ? `${cellData.name} (~${cellData.pop} чел.)` : cellData.name;
  areaDash.style.display = 'none';
  areaOverlay.classList.add('open');
  const label = TYPE_LABELS[cellData.type] || (/^t-owned-/.test(cellData.type) ? 'Присоединённая клетка' : '');
  const coord = `(${x > 0 ? '+' : ''}${x}, ${y > 0 ? '+' : ''}${y})`;
  const headHtml = `<div class="area-desc" style="opacity:.7">${label ? label + ' · ' : ''}${coord}</div>`;
  const descHtml = cellData.note ? `<div class="area-desc">${cellData.note}</div>` : '';
  areaNps.innerHTML = headHtml + descHtml + amWithNav('');

  // Пытаемся найти клетку в neutrals JSON забега — если есть, добавим блок НП.
  // Если файла нет / клетки нет / список НП пуст — блок не рисуем (некоторые
  // клетки в принципе без НП: море, скалы, туман).
  if (!neutralCache[currentRun]) {
    try {
      const res = await fetch(`data/${currentRun}_neutrals.json?_=${Date.now()}`);
      neutralCache[currentRun] = res.ok ? await res.json() : { cells: [] };
    } catch (e) { console.warn('neutrals fetch failed:', e); neutralCache[currentRun] = { cells: [] }; }
  }
  const norm = t => (t || '').trim().toLowerCase();
  // c.area = "Название — нейтральная клетка (x, y)"; из toon приходит только «Название».
  const areaHead = c => norm((c.area || '').split(' — ')[0]);
  const cells = neutralCache[currentRun].cells || [];
  const cell = cells.find(c => areaHead(c) === norm(cellData.name)
                            || norm(c.file) === norm(cellData.name));
  if (cell && cell.settlements && cell.settlements.length) {
    // Карта области (drill-down 4×4) — первым блоком, если данные есть.
    const mapHtml = cell.area_map ? renderAreaMap(cell.area_map) : '';
    // Сводку по религии показываем, только если НП больше одного — для
    // единственного НП аггрегат дублировал бы его же полосу.
    const agg = cell.settlements.length > 1 ? faithAggregate(cell.settlements) : '';
    NP_ROADS = buildRoadsByNp((cell.area_map || {}).roads);
    // Заполняем словарь имя→settlement для панорамы
    panoSetts = {};
    cell.settlements.forEach(s => { panoSetts[s.name] = s; });
    const anyC = Object.values(areaCache)[0];
    currentPanoSeasonName = (anyC && anyC.season_name) || null;
    areaNps.innerHTML = headHtml + descHtml + amWithNav(mapHtml) + agg + cell.settlements.map(renderNeutralNPCard).join('');
    animateAreaCarts(areaNps);
  } else if (cellData.type === 't-ocean' && !(cell && cell.settlements && cell.settlements.length)) {
    // Морская клетка без НП — рисуем пустую сетку-плейсхолдер (на будущее).
    areaNps.innerHTML = headHtml + descHtml + amWithNav(renderEmptyAreaMap('Море'));
  } else {
    areaNps.innerHTML = headHtml + descHtml + amWithNav('');
  }
}

// Тап по подписи «→ Сосед» на миникарте области → открыть клетку назначения.
function openCellAt(x, y) {
  const key = x + ',' + y;
  const data = (CELLS && CELLS[key]) || null;
  if (!data) return false;
  const pm = (data.type || '').match(/^t-player-(\w+)$/);
  if (pm) { openCell(data, pm[1], x, y); return true; }
  const om = (data.type || '').match(/^t-owned-(\w+)$/);
  if (om && data.player) {
    const ownerKey = Object.keys(PLAYER_META).find(k => PLAYER_META[k].key === data.player);
    if (ownerKey) { openCell(data, ownerKey, x, y); return true; }
  }
  openCellDetails(data, x, y);
  return true;
}
function amGo(cx, cy) {
  openCellAt(+cx, +cy);
}

let _amViewX = null, _amViewY = null;
function amFmtXY(x, y) {
  return ((x > 0 ? '+' : '') + x) + ', ' + ((y > 0 ? '+' : '') + y);
}
function amHasCell(x, y) {
  return !!(CELLS && CELLS[x + ',' + y]);
}
function amNavHtml(x, y) {
  if (x == null || y == null || Number.isNaN(+x) || Number.isNaN(+y)) return '';
  x = +x; y = +y;
  const mk = (dx, dy, cls, glyph, title) => {
    const nx = x + dx, ny = y + dy;
    const ok = amHasCell(nx, ny);
    return `<button type="button" class="am-nav-btn ${cls}"${ok ? '' : ' disabled'} title="${ok ? title + ' · ' + amFmtXY(nx, ny) : title + ' — нет клетки'}" aria-label="${title}" onclick="amStep(${dx},${dy})">${glyph}</button>`;
  };
  return `<div class="am-nav" role="navigation" aria-label="Соседние клетки">`
    + mk(-1, 1, 'am-nav-nw', '↖', 'СЗ')
    + mk( 0, 1, 'am-nav-n',  '▲', 'Север')
    + mk( 1, 1, 'am-nav-ne', '↗', 'СВ')
    + mk(-1, 0, 'am-nav-w',  '◀', 'Запад')
    + `<span class="am-nav-c" title="${amFmtXY(x, y)}">·</span>`
    + mk( 1, 0, 'am-nav-e',  '▶', 'Восток')
    + mk(-1,-1, 'am-nav-sw', '↙', 'ЮЗ')
    + mk( 0,-1, 'am-nav-s',  '▼', 'Юг')
    + mk( 1,-1, 'am-nav-se', '↘', 'ЮВ')
    + `</div>`;
}
function amWithNav(mapHtml) {
  const nav = amNavHtml(_amViewX, _amViewY);
  if (!nav) return mapHtml || '';
  return `<div class="am-frame">${nav}${mapHtml || ''}</div>`;
}
function amStep(dx, dy) {
  if (_amViewX == null || _amViewY == null) return;
  amGo(_amViewX + dx, _amViewY + dy);
}

// Словарь имя НП → объект settlement для панорамы (заполняется в openCell/openCellDetails)
let panoSetts = {};
let currentPanoSeasonName = null;

// Дороги на НП: из area_map.roads строим name → [соседи]. internal — в обе
// стороны, edge — только у якоря (from = НП области, to = внешний сосед).
let NP_ROADS = {};
function buildRoadsByNp(roads) {
  const m = {};
  const add = (a, b) => { (m[a] = m[a] || []); if (!m[a].includes(b)) m[a].push(b); };
  (roads || []).forEach(rd => {
    if (rd.type === 'internal') { add(rd.from, rd.to); add(rd.to, rd.from); }
    else { add(rd.from, rd.to); }
  });
  return m;
}
function npRoadsLine(name) {
  const nb = NP_ROADS[name] || [];
  return nb.length ? `<div class="np-roads">Дороги: ${nb.map(esc).join(', ')}</div>` : '';
}

function renderNPCard(s) {
  const blds = (s.buildings || []).map(b => b.name).join(', ');
  const extHere = (currentExternals || []).filter(e => e.host === s.name);
  const extLine = extHere.length
    ? `<div class="np-buildings">Ваши в этом НП: ${extHere.map(e => esc(e.name)).join(', ')}</div>`
    : '';
  const staff = (s.staff || []).map(st =>
    `<div class="np-stat"><span class="np-stat-label">${st.category}:</span> ${st.fact}/${st.norm} ${st.status}</div>`
  ).join('');
  const growth = (s.growth != null && s.growth !== '') ? s.growth : null;
  const houses_m = String(s.houses || '').match(/\d+/);
  const houses = houses_m ? parseInt(houses_m[0]) : 0;
  return `<div class="np-card">
    <div class="np-card-name">${s.name}</div>
    ${s.population != null ? `<div class="np-stat"><span class="np-stat-label">Население:</span> ${s.population}</div>` : ''}
    ${growth != null ? `<div class="np-stat"><span class="np-stat-label">Рост:</span> ${growth}</div>` : ''}
    ${mightBlock(s.might)}
    ${staff}
    ${blds ? `<div class="np-buildings">Постройки: ${blds}</div>` : ''}
    ${extLine}
    ${npRoadsLine(s.name)}
    ${loyaltyBlock(s.loyalty, houses, s.might)}
    ${faithBlock(s.faith)}
    ${promyslyBlock(s.promysly)}
  </div>`;
}

// ── Нейтральная клетка: описание области + упрощённые НП ─────────────────────
const neutralCache = {};

function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Внутренняя карта области (drill-down): один блок 4×4 для нейтральной клетки.
// Возвращает HTML-строку (SVG + подпись) или '' если данных нет. Контракт am —
// как в player.html (cols/rows/blocks/nodes/roads), синхронно держать оба.
// Вырезает из сшитой карты владений (несколько блоков клеток) карту ОДНОЙ
// клетки (cx,cy) как самостоятельный блок 4×4. НП блока → локальные коорд 1..4.
// Дороги: внутри блока → internal; из блока наружу (в др. клетку/за границу) →
// edge со стрелкой в сторону соседа. Возвращает am-объект для renderAreaMap или
// null, если блока клетки нет.
function cellAreaMap(am, cx, cy) {
  if (!am || !am.blocks || !am.nodes) return null;
  const G = 4;
  const b = am.blocks.find(bl => bl.coord[0] === cx && bl.coord[1] === cy);
  if (!b) return null;
  const c0 = b.col0, r0 = b.row0;
  const blockOf = (n) => (am.blocks.find(bb =>
    n.col >= bb.col0 && n.col < bb.col0 + G && n.row >= bb.row0 && n.row < bb.row0 + G) || {}).coord;
  const nodeCoord = {};
  am.nodes.forEach(n => { nodeCoord[n.name] = blockOf(n); });
  const nodes = am.nodes
    .filter(n => n.col >= c0 && n.col < c0 + G && n.row >= r0 && n.row < r0 + G)
    .map(n => ({ name: n.name, col: n.col - c0 + 1, row: n.row - r0 + 1, terrain: n.terrain || '', owner: n.owner || '', pop: n.pop || 0 }));
  const names = new Set(nodes.map(n => n.name));
  const roads = [];
  (am.roads || []).forEach(rd => {
    if (rd.type === 'internal') {
      const fIn = names.has(rd.from), tIn = names.has(rd.to);
      if (fIn && tIn) {
        const e = { type: 'internal', from: rd.from, to: rd.to };
        if (rd.sea) e.sea = true;
        if (rd.own) e.own = true;
        if (rd.player) e.player = rd.player;
        roads.push(e);
        return;
      }
      if (!fIn && !tIn) return;
      const inN = fIn ? rd.from : rd.to, outN = fIn ? rd.to : rd.from;
      const oc = nodeCoord[outN];
      if (!oc) return;
      // Угол по реальным позициям НП на сшитой карте (не только знак клеток).
      const inNode = am.nodes.find(n => n.name === inN);
      const outNode = am.nodes.find(n => n.name === outN);
      let dx, dy;
      if (inNode && outNode) {
        dx = outNode.col - inNode.col;           // восток+
        dy = inNode.row - outNode.row;           // север+ (ряд растёт вниз)
      } else {
        dx = Math.sign(oc[0] - cx);
        dy = Math.sign(oc[1] - cy);
      }
      if (dx || dy) {
        const e = { type: 'edge', from: inN, to: outN, dir: { dx, dy } };
        if (rd.sea) e.sea = true;
        if (rd.own) e.own = true;
        if (rd.player) e.player = rd.player;
        if (rd.to_coord) e.to_coord = rd.to_coord;
        else if (oc) e.to_coord = oc;
        roads.push(e);
      }
    } else if (names.has(rd.from)) {
      roads.push(rd);
    }
  });
  const blk = { coord: [cx, cy], col0: 1, row0: 1, owned: true };
  if ((b.water || []).length) blk.water = b.water;   // водные края переносим в кроп клетки
  // Метки местности этого блока (глобальные col/row → локальные 1..4)
  const tiles = (am.tiles || [])
    .filter(t => {
      const tc = t.col != null ? t.col : (1 + (t.x || 0));
      const tr = t.row != null ? t.row : (G - (t.y || 0));
      return tc >= c0 && tc < c0 + G && tr >= r0 && tr < r0 + G;
    })
    .map(t => {
      const tc = t.col != null ? t.col : (1 + (t.x || 0));
      const tr = t.row != null ? t.row : (G - (t.y || 0));
      return {
        x: t.x, y: t.y,
        col: tc - c0 + 1,
        row: tr - r0 + 1,
        terrain: t.terrain || '',
      };
    });
  return { area: am.area, cols: G, rows: G, blocks: [blk], nodes, roads, tiles };
}

// Тап по домику НП: подсветить дороги + открыть панораму поселения.
function amHi(ev, idx) {
  ev.stopPropagation();
  const svg = ev.target.ownerSVGElement;
  if (!svg) return;
  const already = ev.target.classList.contains("am-node-sel");
  svg.querySelectorAll(".am-node-sel").forEach(el => el.classList.remove("am-node-sel"));
  svg.querySelectorAll(".am-road-hi").forEach(el => el.classList.remove("am-road-hi"));
  if (already) return;
  ev.target.classList.add("am-node-sel");
  svg.querySelectorAll(".am-road").forEach(r => {
    if ((r.getAttribute("data-i") || "").split(" ").includes(String(idx))) r.classList.add("am-road-hi");
  });
  const labels = svg.querySelectorAll(".am-label");
  const nm = labels[idx] ? labels[idx].textContent.trim() : null;
  if (nm) {
    const s = panoSetts[nm] || null;
    const terrainHint = panoTerrainFor(nm, (_panoNodes[idx] && _panoNodes[idx].terrain) || '');
    openPano(nm, s, terrainHint);
  }
}

function panoEcoCount(settlement, needles){
  if(!settlement) return 0;
  const hit=s=>needles.some(n=>String(s).toLowerCase().includes(n));
  if(hit('лавк') && settlement.shops!=null){ const v=parseInt(String(settlement.shops).replace(/[^\d]/g,''),10); if(v) return v; }
  if(hit('торгов') && settlement.traders!=null){ const v=parseInt(String(settlement.traders).replace(/[^\d]/g,''),10); if(v) return v; }
  for(const row of (settlement.economy||[])){ if(hit(row.type||'')) return parseInt(row.count,10)||0; }
  for(const row of (settlement.income||[])){
    if(hit(row.label||'')){ const m=String(row.label).match(/(\d+)/); if(m) return parseInt(m[1],10)||0; }
  }
  return 0;
}

// Стража на панораме: staff «Стража» fact; иначе сумма might.units[].count (нейтралы); иначе 0.
function panoGuardCount(settlement){
  if(!settlement) return 0;
  let staffSum=0, staffHit=false;
  for(const row of (settlement.staff||[])){
    if(!/страж/i.test(String(row.category||''))) continue;
    staffHit=true;
    staffSum+=parseInt(String(row.fact||'').replace(/[^\d]/g,''),10)||0;
  }
  if(staffHit) return staffSum;
  let unitSum=0;
  for(const u of ((settlement.might&&settlement.might.units)||[])){
    unitSum+=parseInt(u.count,10)||0;
  }
  return unitSum||0;
}

  const groundY = VH*0.66;

  const rng=()=>{ _vseed=(_vseed+0x6D2B79F5)>>>0; let t=_vseed; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };

  const SHOP_SPRITES=['assets/shops/01.png','assets/shops/02.png','assets/shops/03.png','assets/shops/04.png','assets/shops/05.png','assets/shops/06.png','assets/shops/07.png','assets/shops/08.png'];
  const GUARD_SPRITES=['assets/guards/01.png?v=3','assets/guards/02.png?v=3','assets/guards/03.png?v=3','assets/guards/04.png?v=3','assets/guards/05.png?v=3','assets/guards/06.png?v=3','assets/guards/07.png?v=3','assets/guards/08.png?v=3'];
  function miniHut(x,y,sc){
    const bw=30*sc, bh=bw*1.22;
    const src=HOUSE_SPRITES[Math.floor(rng()*HOUSE_SPRITES.length)];

  }
  function miniShop(x,y,sc){
    const bw=34*sc, bh=bw*1.18;

  }
  function miniGuard(x,y,sc){
    const bw=46*sc, bh=bw*1.9;

  // Сетка с джиттером: при большом числе дворов мельчаем масштаб, чтобы все влезли.
  const _huts=[];

    const n=hutCount;

    for(let k=0;k<n;k++){
      const col=k%cols, row=Math.floor(k/cols);

  function win(x,y,w,h,lit){ const c=lit?'#ffdf9e':'#a9c4d0'; return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" stroke="#4a3420" stroke-width="1"/><line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="#4a3420" stroke-width="0.7"/><line x1="${x}" y1="${y+h/2}" x2="${x+w}" y2="${y+h/2}" stroke="#4a3420" stroke-width="0.7"/>`; }
  function gableRoof(L,R,wallTop,peak,roof){ const over=(R-L)*0.12, cx=(L+R)/2; let s=''; s+=`<path d="M ${L-over} ${wallTop} L ${cx} ${peak} L ${cx} ${wallTop} Z" fill="${shade(roof,1.12)}"/>`; s+=`<path d="M ${cx} ${peak} L ${R+over} ${wallTop} L ${cx} ${wallTop} Z" fill="${shade(roof,0.82)}"/>`; s+=`<path d="M ${L-over} ${wallTop} L ${cx} ${peak} L ${R+over} ${wallTop}" fill="none" stroke="${shade(roof,0.6)}" stroke-width="1"/>`; return s; }
  function bodyResidential(cx,baseY,bw,bh,wall,roof,timber,lit){ const wallTop=baseY-bh*0.6, L=cx-bw/2, R=cx+bw/2, peak=baseY-bh; let s=`<rect x="${L}" y="${wallTop}" width="${bw}" height="${baseY-wallTop}" fill="${wall}"/>`; s+=`<rect x="${cx}" y="${wallTop}" width="${bw/2}" height="${baseY-wallTop}" fill="${shade(wall,0.88)}"/>`; if(timber){ const bm='#5a3d24'; s+=`<line x1="${L}" y1="${wallTop}" x2="${R}" y2="${baseY}" stroke="${bm}" stroke-width="1.4"/><line x1="${R}" y1="${wallTop}" x2="${L}" y2="${baseY}" stroke="${bm}" stroke-width="1.4"/><line x1="${cx}" y1="${wallTop}" x2="${cx}" y2="${baseY}" stroke="${bm}" stroke-width="1.2"/><rect x="${L}" y="${wallTop}" width="${bw}" height="${baseY-wallTop}" fill="none" stroke="${bm}" stroke-width="1.6"/>`; } s+=gableRoof(L,R,wallTop,peak,roof); s+=win(cx-bw*0.32,wallTop+bh*0.12,bw*0.2,bh*0.18,lit); s+=win(cx+bw*0.12,wallTop+bh*0.12,bw*0.2,bh*0.18,lit); s+=`<rect x="${cx-bw*0.1}" y="${baseY-bh*0.3}" width="${bw*0.2}" height="${bh*0.3}" fill="#3a2414"/>`; return {svg:s, chimneyX:cx+bw*0.3, chimneyY:wallTop-bh*0.02}; }

  function drawBuilding(b,i,cx,baseY,bw,bh,isBuilding){

  function bldLabel(item,cx,baseY){ const nm=buildingPanoLabel(item.b.name||''); const w=nm.length*5.6+10; return `<g pointer-events="none"><rect x="${cx-w/2}" y="${baseY+5}" width="${w}" height="13" rx="6" fill="#1a1206" opacity="0.55"/><text x="${cx}" y="${baseY+14}" font-size="9" fill="#f0e4c8" text-anchor="middle">${E(nm)}</text></g>`; }

  function bldGroup(item, cx, baseY, bw, bh){ const {b,i}=item; const st=(b.status||'').toLowerCase(); const isBuilding=st.includes('🔨')||st.includes('строит')||st.includes('в работе'); const d=drawBuilding(b,i,cx,baseY,bw,bh,isBuilding); const shadow=`<ellipse cx="${cx}" cy="${baseY+2}" rx="${bw*0.66}" ry="${bw*0.12}" fill="#000000" opacity="0.18" pointer-events="none"/>`; let scaffold=''; if(isBuilding){ const L=cx-bw/2,R=cx+bw/2,T=baseY-bh*0.7; scaffold=`<g pointer-events="none" stroke="#caa24a" stroke-width="1" opacity="0.8"><line x1="${L}" y1="${T}" x2="${R}" y2="${baseY}" stroke-dasharray="3 2"/><line x1="${R}" y1="${T}" x2="${L}" y2="${baseY}" stroke-dasharray="3 2"/><line x1="${L}" y1="${baseY-bh*0.4}" x2="${R}" y2="${baseY-bh*0.4}" stroke-dasharray="3 2"/></g>`; } const op=isBuilding?0.6:1; return `${shadow}<g class="pano-bld" opacity="${op}" onclick="openBldCard(${i});event.stopPropagation()" cursor="pointer">${d.inner}${scaffold}${d.flag}${d.smoke}</g>`; }

  const monumental = n => ['uprava','karaulka','chasovnya','lekarnya'].includes(buildingPanoType(n));
  const back=[], front=[];
  buildings.forEach((b,i)=>{ (monumental(b.name||'')?back:front).push({b,i}); });
  if(!front.length && back.length>3){ while(back.length>3 && front.length<back.length){ front.unshift(back.pop()); } }

  const emptyMsg = '';

  const sun = evil? '' : `<circle cx="640" cy="90" r="80" fill="#fff6d8" opacity="0.35" pointer-events="none"/><circle cx="640" cy="90" r="34" fill="#fff2c4" opacity="0.9" pointer-events="none"/>`;
  const cloud=(cx,cy,s,o)=>`<g pointer-events="none" opacity="${o}" fill="#ffffff"><ellipse cx="${cx}" cy="${cy}" rx="${46*s}" ry="${16*s}"/><ellipse cx="${cx-30*s}" cy="${cy+6*s}" rx="${30*s}" ry="${12*s}"/><ellipse cx="${cx+34*s}" cy="${cy+5*s}" rx="${28*s}" ry="${11*s}"/></g>`;
  const clouds = cloud(180,80,1,0.85)+cloud(430,54,0.7,0.7)+cloud(700,120,0.9,0.8);
  const peaks=`<path d="M 0 ${groundY-20} L 120 ${VH*0.34} L 210 ${groundY-30} L 330 ${VH*0.28} L 430 ${groundY-24} L 560 ${VH*0.32} L 680 ${groundY-34} L 800 ${VH*0.36} L 800 ${groundY} L 0 ${groundY} Z" fill="${mtn}" opacity="0.5" pointer-events="none"/>`;
  const softHills=`<path d="M 0 ${groundY-10} Q 130 ${groundY-46} 260 ${groundY-16} Q 400 ${groundY-50} 540 ${groundY-14} Q 680 ${groundY-44} 800 ${groundY-18} L 800 ${groundY} L 0 ${groundY} Z" fill="${mtn}" opacity="0.4" pointer-events="none"/>`;
  let treeline=''; { let tl=''; for(let k=0;k<15;k++){ const bx=k*57+(k%2?16:0); const by=groundY-4; const tw=30+(k%3)*10; const th=48+(k%4)*16; tl+=`<polygon points="${bx-tw/2},${by} ${bx},${by-th} ${bx+tw/2},${by}" fill="${shade(hillBack,0.85)}" opacity="${(0.55+(k%3)*0.12).toFixed(2)}" pointer-events="none"/>`; } treeline=`<g pointer-events="none">${tl}</g>`; }
  const seaBand=`<rect x="0" y="${groundY-40}" width="${VW}" height="40" fill="${mtn}" opacity="0.3" pointer-events="none"/><path d="M 0 ${groundY-40} q 60 8 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 80 0" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25" pointer-events="none"/>`;
  let bog=''; { const humps=`<path d="M 0 ${groundY-6} Q 160 ${groundY-30} 320 ${groundY-8} Q 480 ${groundY-28} 640 ${groundY-8} Q 720 ${groundY-20} 800 ${groundY-10} L 800 ${groundY} L 0 ${groundY} Z" fill="${mtn}" opacity="0.4" pointer-events="none"/>`; let dead=''; for(const dx of [120,300,470,650]){ const dy=groundY-8; dead+=`<g pointer-events="none" opacity="0.5" stroke="${shade(mtn,0.6)}" stroke-width="1.4" fill="none"><line x1="${dx}" y1="${dy}" x2="${dx}" y2="${dy-26}"/><line x1="${dx}" y1="${dy-18}" x2="${dx-8}" y2="${dy-24}"/><line x1="${dx}" y1="${dy-14}" x2="${dx+9}" y2="${dy-22}"/></g>`; } bog=humps+dead; }
  const horizon = (terrain.match(/t-mountain|гор|▲|предгор/)||evil) ? peaks
    : terrain.match(/t-forest|лес|🌲/) ? treeline
    : terrain.match(/t-ocean|t-skerry|мор|〰|шхер/) ? seaBand
    : terrain.match(/t-swamp|болот|🌿/) ? bog
    : softHills;
  const hills=`<path d="M 0 ${groundY-8} Q 160 ${groundY-64} 320 ${groundY-20} Q 470 ${groundY-58} 620 ${groundY-16} Q 720 ${groundY-40} 800 ${groundY-22} L 800 ${groundY} L 0 ${groundY} Z" fill="${hillBack}" pointer-events="none"/><path d="M 0 ${groundY+8} Q 140 ${groundY-30} 300 ${groundY+6} Q 460 ${groundY-24} 640 ${groundY+8} Q 730 ${groundY-14} 800 ${groundY+2} L 800 ${VH} L 0 ${VH} Z" fill="${hillFront}" pointer-events="none"/>`;

  const tree=(x,y,s)=>`<g pointer-events="none"><rect x="${x-2*s}" y="${y-9*s}" width="${4*s}" height="${11*s}" fill="#6a4a2c"/><circle cx="${x}" cy="${y-14*s}" r="${10*s}" fill="#4a7a3a"/><circle cx="${x-7*s}" cy="${y-9*s}" r="${7*s}" fill="#3f6f32"/><circle cx="${x+7*s}" cy="${y-9*s}" r="${7*s}" fill="#568a44"/></g>`;
  const trees = tree(46,VH-8,1.3)+tree(766,VH-4,1.5);

</svg>`;
  stage.innerHTML = svg;

  // Сезонная тонировка (z-index:2) и частицы (z-index:3) поверх SVG-сцены
  const SEASON_VIS = {
    'зима':  { tint: 'rgba(180,210,255,0.13)', particles: 'snow' },

  let tintEl = document.getElementById('pano-season-tint');

    tintEl.id = 'pano-season-tint';
    tintEl.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:2;transition:background 0.6s';
    stage.appendChild(tintEl);

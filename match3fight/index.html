      });
      m3fUpdateStocksUI();
      break;
    }
    case 'EDIT_RES': {
      // Named resources (стрелы/заряды): SET overwrites, CHANGE adds (Android EditResourcesExecutor).
      // C8: Android editPersonResources has NO maxAmount clamp (a CHANGE may go negative) and
      // EditResourcesExecutor maps ALL -> ENEMY only (editPersonResources(effect, false)), not both.
      const ty = (effect.type || 'CHANGE').toUpperCase();
      const rn = (effect.resName != null ? effect.resName : effect.name);
      const resTargets = ((effect.target || 'SELF').toUpperCase() === 'ALL') ? [m3f.enemy] : targets;
      resTargets.forEach(t => {
        const r = (t.resources || []).find(x => x.name === rn);
        if (!r) return; // only edits an existing resource
        r.amount = (ty === 'SET') ? baseValue : r.amount + baseValue;
        m3fLog(`${t.name}: ${rn} = ${r.amount}.`);
      });
      m3fUpdateStocksUI();
      break;
    }
    case 'EDIT_STATUS': {
      const ty = (effect.type || 'CHANGE').toUpperCase();
      targets.forEach(t => {
        const stDef = effect.status || {};
        const ns = m3fMkStatus(stDef);
        // effect-level value overrides the incoming status magnitude
        if (effect.value != null) ns.value = +effect.value;
        // Android EditStatusHandler: merge into existing status by name.
        // SET overwrites value, CHANGE adds to it, TIMES adjusts times;
        // a new status is added only when none with that name exists.
        const existing = t.statuses.find(s => s.name === ns.name);
        if (existing) {
          // C5: Android updateExistingStatus — for ANY existing status first overwrite
          // duration with the incoming status's duration. Then by type:
          //   SET    => value = effectValue; times = effectStatus.times (even if null).
          //   CHANGE => value += effectValue (times untouched).
          //   TIMES  => only when effectStatus.times != null: value = effectValue AND
          //             times = existing.times?.plus(timesToAdd) (null existing stays null).
          existing.duration = ns.duration;
          if (ty === 'SET') {
            existing.value = ns.value;
            existing.times = ns.times; // allow null
          } else if (ty === 'TIMES') {
            if (ns.times != null) {
              existing.value = ns.value;
              if (existing.times != null) existing.times = existing.times + ns.times;
            }
          } else { // CHANGE (default)
            existing.value += ns.value;
          }
        } else {
          t.statuses.push(ns);
        }
        m3fLog(`${t.name}: статус «${ns.name}».`);
      });
      break;
    }
    case 'INFO':
      // C9: Android Info branch — when title != null, emit a dash/separator entry
      // («Прочерк» CUSTOM_MESSAGE), regardless of message; otherwise log message if present.
      if (effect.title != null) m3fLog('—');
      else if (effect.message) m3fLog(effect.message);
      break;
    case 'FINISH':
    case 'FINISH_BATTLE':
    case 'FINISHBATTLE': {
      // explicit battle end; `win` field (or type WIN/LOSE) decides outcome, default hero win
      const w = (effect.win != null) ? !!effect.win
        : ((effect.type || 'WIN').toUpperCase() !== 'LOSE');
      m3fFinish(w);
      break;
    }
    default:
      // unknown command: ignore gracefully
      break;
  }
}

// ---------- ATTACK resolution (mirror PerkExecutor.attackPerson +
// changeEffectByPersonsStatuses + ApplyAttackExecutor) ----------
//
// `srcOwner` is the acting side ('hero'|'enemy') — Android's isHeroPerk = (srcOwner==='hero').
// `effect` carries the help/ignore* flags (Effect.Attack):
//   help, ignoreEvasion, ignoreAcc, ignoreWeak, ignoreStrong, ignoreVul, ignoreArmor,
//   ignoreDodge, ignoreCounterAttacks, ignoreAnswer.
//
// `ignoreAnswer` is set by counterattacks (answerOnAttack) to suppress recursion.

// isWork(): roll Random(0..100) <= probability AND status currently active. Mirrors
// Status.isWork(). One fresh roll per call; `times` is NOT consumed here (caller does it
// only on a successful application).
function m3fIsWork(s) { return m3fIsActive(s) && m3fRoll(s.probability); }

// shouldApplyStatusEffect: does an effect targeting scope `target` (from owner `srcOwner`)
// apply to the person on side `pIsHero`? Mirrors PerkExecutor.effectChangeByPersonStatuses.
function m3fShouldApplyStatusEffect(target, pIsHero, srcIsHero) {
  switch ((target || 'SELF').toUpperCase()) {
    case 'ALL': return true;
    case 'SELF': return pIsHero === srcIsHero;
    case 'FOE': return pIsHero !== srcIsHero;
    case 'HERO': return pIsHero;
    case 'ENEMY': return !pIsHero;
    default: return pIsHero === srcIsHero; // SELF default
  }
}

function m3fAttack(src, tgt, value, type, selfTarget, srcOwner, effect) {
  srcOwner = srcOwner || (src === m3f.hero ? 'hero' : 'enemy');
  effect = effect || {};
  const help = !!effect.help;
  const srcIsHero = (srcOwner === 'hero');
  const target = effect.target;

  let v = value;
  // changeEffectByPersonsStatuses — SKIPPED ENTIRELY for self-attacks (B7): raw value.
  if (!selfTarget) {
    // WEAK/STRONG keyed to the attack SOURCE side; VUL/ARMOR keyed to effect.target scope.
    // Iterate BOTH persons (mirror effectChangeByPersonStatuses called for hero then enemy).
    [m3f.hero, m3f.enemy].forEach(p => {
      const pIsHero = (p === m3f.hero);
      const isPersonPerk = (pIsHero === srcIsHero); // p is the source side
      const inScope = m3fShouldApplyStatusEffect(target, pIsHero, srcIsHero);
      p.statuses.forEach(s => {
        if (!m3fIsWork(s)) return; // active + probability roll
        // WEAK/STRONG: only on the attack source's statuses; skip under help/ignore.
        if (isPersonPerk) {
          if (s.type === 'WEAK') { if (!help && !effect.ignoreWeak) { v -= s.value; m3fDecreaseTimes(s); } }
          else if (s.type === 'STRONG') { if (!help && !effect.ignoreStrong) { v += s.value; m3fDecreaseTimes(s); } }
        }
        // VUL/ARMOR: gated by target scope; skip under ignoreVul/ignoreArmor.
        if (inScope) {
          if (s.type === 'VULNERABLE' || s.type === 'VUL') { if (!effect.ignoreVul) { v += s.value; m3fDecreaseTimes(s); } }
          else if (s.type === 'ARMOR') { if (!effect.ignoreArmor) { v -= s.value; m3fDecreaseTimes(s); } }
        }
      });
    });
    if (v < 0) v = 0; // coerceAtLeast(0) before resistance (Effect.Attack)
    // RESISTANCE multiplier on the TARGET (non-source) person. Mirror applyResistanceMultiplier:
    // sum isWork RESISTANCE values, multiplier=1-total/100, value=(value*mult).toInt().coerceAtLeast(0).
    // Android does NOT consume `times` for resistance, and ignoreArmor does not gate it.
    let totalResistance = 0;
    tgt.statuses.forEach(s => { if (s.type === 'RESISTANCE' && m3fIsWork(s)) totalResistance += s.value; });
    if (totalResistance) v = Math.max(0, Math.trunc(v * (1 - totalResistance / 100)));
  } else {
    if (v < 0) v = 0;
  }

  // hit chance + dodge (skip for self-target). countHitChance: EVASION (target, unless
  // ignoreEvasion) decreases; ACCURACY (source, unless help/ignoreAcc) increases.
  // A miss or a dodge negates the damage but counterattacks STILL fire (Android runs the
  // answerOnAttack block outside the hit/miss branch), so we flow to the shared counter call.
  let landed = true;
  if (!selfTarget) {
    let chance = 100;
    if (!effect.ignoreEvasion) {
      tgt.statuses.forEach(s => { if (s.type === 'EVASION' && m3fIsWork(s)) { chance -= s.value; m3fDecreaseTimes(s); } });
    }
    if (!help && !effect.ignoreAcc) {
      src.statuses.forEach(s => { if (s.type === 'ACCURACY' && m3fIsWork(s)) { chance += s.value; m3fDecreaseTimes(s); } });
    }
    if (chance < (rng() * 100)) {
      m3fLog(`${src.name} → ${tgt.name}: Промах!`); m3fFloat(tgt, 'Промах', 'miss');
      landed = false;
    } else {
      // applyAttackOrUseDodge: after the hit succeeds, target SMART_DODGE then DODGE negates it.
      // SMART_DODGE fires only when smartValue != null && attack.value (post-mods) > smartValue.
      const smart = tgt.statuses.find(s => (s.type === 'SMART_DODGE') && m3fIsWork(s) && s.smartValue != null && v > s.smartValue);
      if (smart) {
        m3fDecreaseTimes(smart);
        m3fLog(`${tgt.name} уворачивается.`); m3fFloat(tgt, 'Уворот', 'miss');
        landed = false;
      } else {
        const dodge = tgt.statuses.find(s => (s.type === 'DODGE') && m3fIsActive(s));
        if (dodge && !effect.ignoreDodge) {
          m3fDecreaseTimes(dodge);
          m3fLog(`${tgt.name} уворачивается.`); m3fFloat(tgt, 'Уворот', 'miss');
          landed = false;
        }
      }
    }
  }

  if (landed) m3fAttackDealDamage(src, tgt, v, type, selfTarget, help);

  // answerOnAttack: counterattacks fire after a non-self, non-help,
  // non-ignoreCounterAttacks, non-ignoreAnswer attack — whether it hit, missed, or was dodged.
  if (!selfTarget && !help && !effect.ignoreCounterAttacks && !effect.ignoreAnswer) {
    m3fAnswerOnAttacks(src, tgt, srcOwner, effect);
  }
}

// Shield/HP application + VAMP. Split out so a missed/dodged attack can still run
// counterattacks without dealing damage.
function m3fAttackDealDamage(src, tgt, v, type, selfTarget, help) {
  // attack landed (not a miss/dodge): mark touched (mirror ApplyAttackExecutor.touch()).
  // Self-attacks (fromStatusOrSelfAttack) suppress touch/hit flags.
  if (!selfTarget) {
    tgt.wasTouchedByPreviousEffect = true;
    tgt.touches = (tgt.touches || 0) + 1;
  }

  const ty = type || 'BOTH';
  let hpDamage = 0, blocked = 0;
  if (ty === 'HP') {
    hpDamage = v;
  } else if (ty === 'SP') {
    blocked = Math.min(v, tgt.shield);
    tgt.shield = Math.max(0, tgt.shield - v);
  } else { // BOTH
    const absorbed = Math.min(v, tgt.shield);
    blocked = absorbed;
    tgt.shield -= absorbed;
    hpDamage = v - absorbed;
  }
  if (hpDamage > 0) {
    tgt.hp = Math.max(0, tgt.hp - hpDamage);
    // hit() only when HP actually reduced and target not dropped to exactly 0 (mirror damageHp)
    if (tgt.hp !== 0 && !selfTarget) { tgt.wasHitByPreviousEffect = true; tgt.hits = (tgt.hits || 0) + 1; }
    // hero stock decay on taking damage (damageKeepStrategy)
    if (tgt === m3f.hero) m3fApplyDamageKeep();
    m3fFloat(tgt, '−' + hpDamage, 'dmg'); m3fFlash(tgt);
  } else if (blocked > 0) {
    m3fFloat(tgt, '🛡−' + blocked, 'block');
  }
  // VAMP (restoreHpByVamp): runs on ANY landed non-self, non-help attack — Android calls it
  // regardless of damage amount, so a 0-HP-damage hit still consumes VAMP times (heal=0).
  if (!selfTarget && !help) {
    tgt.statuses.forEach(s => {
      if (s.type !== 'VAMP' || !m3fIsWork(s)) return;
      const heal = Math.floor(hpDamage * s.value / 100);
      if (heal > 0) tgt.hp = Math.min(tgt.maxHp, tgt.hp + heal);
      m3fDecreaseTimes(s);
      m3fLog(`${tgt.name} высасывает ${heal} здоровья (${s.name}).`);
      if (heal > 0) m3fFloat(tgt, '+' + heal, 'heal');
    });
  }
  m3fLog(`${src.name} → ${tgt.name}: ${v} урона${ty !== 'BOTH' ? ' (' + ty + ')' : ''}.`);
}

// answerOnAttack (PerkExecutor.kt:1153) — the target's active COUNTERATTACK/HARM/REACTION
// statuses retaliate. COUNTERATTACK/HARM return a BOTH attack at the original attacker
// (HARM as help => no source-status amplification, no vamp, no re-counter); REACTION runs
// its reactionPerk/reactionEffect through the executeIfAvailable gate.
// `times`: decremented for COUNTERATTACK on each fire (1156-1158) and for REACTION only
// after a successful availability check (1210); HARM never decrements times in this path.
function m3fAnswerOnAttacks(src, tgt, srcOwner, effect) {
  if (effect && effect.ignoreAnswer) return;
  const tgtOwner = (tgt === m3f.hero) ? 'hero' : 'enemy';
  // snapshot — answer effects may push/remove statuses
  const answers = tgt.statuses.filter(s =>
    (s.type === 'COUNTERATTACK' || s.type === 'HARM' || s.type === 'REACTION') && m3fIsWork(s));
  answers.forEach(s => {
    if (s.type === 'COUNTERATTACK' || s.type === 'HARM') {
      // Android answerOnAttack (PerkExecutor.kt:1156-1158): times consumed ONLY for
      // COUNTERATTACK. HARM never calls decreaseTimes() in this path.
      if (s.type === 'COUNTERATTACK') m3fDecreaseTimes(s);
      m3fLog(`У ${tgt.name} срабатывает ${s.name}(${s.value}).`);
      // counter targets the original attacker; HARM is a "help" attack.
      m3fAttack(tgt, src, s.value, 'BOTH', false, tgtOwner,
        { target: (src === m3f.hero ? 'HERO' : 'ENEMY'), help: (s.type === 'HARM'), ignoreAnswer: true });
    } else if (s.type === 'REACTION') {
      // REACTION fires reactionPerk (preferred) or reactionEffect (legacy) with the
      // target as the acting owner. Android (PerkExecutor.kt:1190-1219) routes this
      // through executeIfAvailable / canExecuteLikeRegularPerk: canShow
      // (conditionsForDisplay) THEN the full availability gate (probability+pFunc,
      // charges, cooldown, conditionsForEnable, resources, prices). Effects fire,
      // charges are spent and `times` is decremented ONLY when the perk is available.
      const rp = s.reactionPerk || (s.reactionEffect ? { name: s.name, effects: [s.reactionEffect] } : null);
      if (!rp || !Array.isArray(rp.effects) || !rp.effects.length) return;
      // E1 — REACTION (deferred from block B) routes through the shared availability gate.
      // canShow (conditionsForDisplay) THEN m3fExecuteIfAvailable (probability+pFunc, charges,
      // reload, conditionsForEnable, resources, prices). The reaction-perk's charges, prices,
      // reload and effects are all handled inside the gate; the REACTION status `times` is
      // decremented ONLY on a successful fire (PerkExecutor.kt:1208-1210).
      if (!m3fCheckConditions(rp.conditionsForDisplay, tgtOwner)) return;
      if (m3fExecuteIfAvailable(rp, tgtOwner)) {
        m3fDecreaseTimes(s);
        m3fLog(`У ${tgt.name} срабатывает ${s.name}(${s.value}).`);
      }
    }
  });
}

// ---------- Stock decay ----------
// updatePersonStocksAfterTurn(isHero): decay a side's stock pool by gemSettings.turnKeepStrategy
// (EditStockExecutor lines 138-161), modified by that side's CHANGE_TURN_KEEP_STRATEGY statuses,
// clamped >= 0. Hero pool decays at handover to hero; enemy pool decays at enemy-turn start
// (prepareEnemyBeforeActions -> updatePersonStocksAfterTurn(false)).
function m3fApplyTurnKeep(owner) {
  owner = owner || 'hero';
  const pool = owner === 'enemy' ? m3f.enemyStocks : m3f.stocks;
  const actor = owner === 'enemy' ? m3f.enemy : m3f.hero;
  Object.keys(pool).forEach(gt => {
    const gs = m3f.gemSettings[gt];
    let keep = gs ? gs.turnKeepStrategy : 50;
    // CHANGE_TURN_KEEP_STRATEGY statuses on the acting side
    actor.statuses.forEach(s => { if (m3fIsActive(s) && s.type === 'CHANGE_TURN_KEEP_STRATEGY' && s.gemTypes.includes(+gt)) keep += s.value; });
    if (keep < 0) keep = 0;
    // F7 — Android Int arithmetic stock.value*keep/100 truncates toward zero.
    pool[gt].value = Math.trunc(pool[gt].value * keep / 100);
  });
}

function m3fApplyDamageKeep() {
  Object.keys(m3f.stocks).forEach(gt => {
    const gs = m3f.gemSettings[gt];
    const keep = gs ? gs.damageKeepStrategy : 100;
    // F7 — truncate toward zero (Int division), not round.
    m3f.stocks[gt].value = Math.trunc(m3f.stocks[gt].value * keep / 100);
  });
  m3fUpdateStocksUI();
}

// ---------- Status ticking ----------
function m3fTickStatuses(person, when) {
  // when: 'start' (end:false) before turn, 'end' (end:true) after turn
  const wantEnd = (when === 'end');
  // Only statuses scheduled for this phase fire this tick.
  const active = person.statuses.filter(s => s.end === wantEnd);

  // Android applyPersonStatus (EndTurnExecutor.kt:221-283) applies statuses in a FIXED
  // type order regardless of their order in the list: ALL DEFEND first (so a shield raised
  // this tick protects against same-tick DAMAGE), then DAMAGE, then DAMAGE_HP, then HEAL,
  // then GENERATE. We mirror that with findWorkStatuses-style per-type passes.
  const typeOrder = ['DEFEND', 'DAMAGE', 'DAMAGE_HP', 'HEAL', 'GENERATE'];
  typeOrder.forEach(type => {
    active.forEach(s => {
      if (s.type !== type) return;
      if (!m3fIsActive(s)) return;
      if (!m3fRoll(s.probability)) return;
      switch (s.type) {
        case 'DEFEND':
          person.shield += s.value;
          break;
        case 'DAMAGE': {
          const absorbed = Math.min(s.value, person.shield);
          person.shield -= absorbed;
          person.hp = Math.max(0, person.hp - (s.value - absorbed));
          m3fLog(`${person.name}: «${s.name}» ${s.value} урона.`);
          break;
        }
        case 'DAMAGE_HP':
          person.hp = Math.max(0, person.hp - s.value);
          m3fLog(`${person.name}: «${s.name}» ${s.value} урона по HP.`);
          break;
        case 'HEAL':
          person.hp = Math.min(person.maxHp, person.hp + s.value);
          m3fLog(`${person.name}: «${s.name}» +${s.value} HP.`);
          break;
        case 'GENERATE': {
          // Start/end-of-turn auto-points (Android applyPersonStatus GENERATE branch,
          // EndTurnExecutor lines 272-281): grant a flat s.value per gemType to the acting
          // side's own stock pool, routed by which person owns this status. This is the ONLY
          // place GENERATE grants points — m3fAccumulateStocks has no GENERATE branch (parity
          // with Android addValueFromCrushedGems).
          const genOwner = (person === m3f.enemy) ? 'enemy' : 'hero';
          (s.gemTypes || []).forEach(gt => {
            m3fAddStock(gt, s.value, genOwner);
            m3fLog(`${person.name}: «${s.name}» +${s.value} очков (${(m3f.gemSettings[gt] || {}).name || gt}).`);
          });
          break;
        }
        default: break;
      }
    });
  });
  // STUN / passive types (ARMOR/WEAK/...) are handled at turn level / checked inline.

  // Separate duration pass (mirrors Android updatePersonStatus): decrement duration ONLY
  // for statuses that are isActive() AND scheduled for this phase. At duration 0 set
  // value=0 and KEEP the object in the list (Condition STATUS HAVE/EMPTY checks rely on
  // the object still existing). Other-phase / inactive / infinite (-1) statuses untouched.
  person.statuses.forEach(s => {
    if (s.end !== wantEnd) return;
    if (!m3fIsActive(s)) return;
    if (s.duration > 0) {
      s.duration -= 1;
      if (s.duration === 0) s.value = 0;
    }
  });
}

// Active STUN gate: only stuns that pass isActive() (duration/value/times) count.
function m3fIsStunned(person) {
  return person.statuses.some(s => s.type === 'STUN' && m3fIsActive(s));
}

// Consume one use of the FIRST active STUN on a person — call once per attempted/suppressed
// action (mirrors PerkExecutor: findActiveStatus(STUN) then decreaseTimes on that one stun).
// Returns true if a stun was present (and consumed).
function m3fConsumeStun(person) {
  const stun = person.statuses.find(s => s.type === 'STUN' && m3fIsActive(s));
  if (stun) { m3fDecreaseTimes(stun); return true; }
  return false;
}

// C3 — STUN-at-perk-time. Mirror PerkExecutor.execute (lines 200-205): the perk's COST
// has already been paid by the caller (prices/charges/resources/reload bookkeeping); here
// we run the perk's EFFECTS only when the acting side is NOT stunned. If it IS stunned,
// the effects are SUPPRESSED (logged «Оглушение не позволило применить навык») and ONE
// active STUN is consumed (decreaseTimes). This is the per-perk layer, distinct from the
// turn-level stun handling. Use for every perk whose effects fire through execute() in
// Android (hero hand perk, enemy action, TimePerk, StockPerk, sector perk, TRIGGER cell).
function m3fApplyPerkEffects(perk, owner) {
  const actor = owner === 'hero' ? m3f.hero : m3f.enemy;
  if (m3fIsStunned(actor)) {
    m3fLog('Оглушение не позволило применить навык');
    m3fConsumeStun(actor);
    return;
  }
  (perk.effects || []).forEach(eff => m3fApplyEffect(eff, owner));
}

// ---------- Real-time scene timer + TimePerks ----------
// Android parity (GameScreen.kt CountDownTimer, TIMER_TICK=1000L; TimePerkExecutor):
//   • The turn timer runs in REAL TIME (1 tick/sec) while the hero's board is OPEN
//     (decision phase, before the successful swap). It RESETS to 0 at the start of
//     each hero turn and STOPS on the first successful swap (logs "Время хода: Ns").
//   • Each tick advances seconds by 1 and fires every TimePerk (hero + enemy) whose
//     `time == currentSeconds` (EXACT equality). Stateless: no fired-memory, so the
//     same TimePerk re-fires if the counter revisits a value in a later turn.
//   • Firing is gated by perk.conditionsForDisplay and by charges. The order mirrors
//     GameScreenViewModel.checkTime: persist seconds -> updatePersonsStates -> fire.

// Fire all TimePerks for `owner` whose time matches the current second.
function m3fRunTimePerks(owner) {
  const list = owner === 'hero' ? m3f.heroTimePerks : m3f.enemyTimePerks;
  if (!list || !list.length) return;
  list.forEach(tp => {
    if (tp.time !== m3f.timeSec) return;
    // E1 — TimePerkExecutor: canShow (conditionsForDisplay) THEN executeIfAvailable
    // (probability+pFunc, charges, reload, conditionsForEnable, resources, prices).
    if (!m3fCheckConditions(tp.perk.conditionsForDisplay, owner)) return;
    if (m3fExecuteIfAvailable(tp.perk, owner)) {
      m3fLog(`Время (${m3f.timeSec}с): «${tp.perk.name}».`);
    }
  });
}

// checkTime(seconds): GameScreenViewModel.checkTime order (line 240) — persist seconds,
// re-evaluate auto-statuses (TIME-parameter conditions flip per tick), THEN fire hero
// TimePerks (isHero=true) and enemy TimePerks (isHero=false) at this exact second.
function m3fCheckTime(seconds) {
  m3f.timeSec = seconds;
  m3fUpdateTimer();
  m3fUpdatePersonsStates();
  m3fRunTimePerks('hero');
  if (m3f.done) return;
  m3fRunTimePerks('enemy');
}

// Live round-time display (current turn seconds). Ticks while the board is open; freezes after the swap.
function m3fUpdateTimer() {
  const el = document.getElementById('m3f-timer');
  if (!el) return;
  el.textContent = '⏱ ' + (m3f.timeSec || 0) + 'с';
  el.classList.toggle('stopped', !m3f.timerRunning);
}

// Start (or restart) the per-turn real-time timer. Called when the hero's board opens.
// Resets the second counter to 0 (Android startTurnTimer). Never duplicates the interval.
function m3fStartTurnTimer() {
  m3fStopTurnTimer();                 // guard against duplicate intervals
  if (m3f.done) return;
  m3f.turnElapsedMs = 0;
  m3f.timeSec = 0;
  m3f.timerRunning = true;
  m3fUpdateTimer();
  m3f.turnTimer = setInterval(() => {
    if (!m3f.timerRunning || m3f.done) return;
    m3f.turnElapsedMs += 1000;
    const seconds = Math.floor(m3f.turnElapsedMs / 1000); // first tick => 1
    m3fCheckTime(seconds);
    if (m3f.done) { m3fStopTurnTimer(); m3fUpdateAllUI(); m3fRender(); return; }
    m3fUpdateAllUI();
  }, 1000);
}

// Stop and clear the per-turn timer (idempotent; safe on game end / next turn).
function m3fStopTurnTimer() {
  m3f.timerRunning = false;
  if (m3f.turnTimer != null) { clearInterval(m3f.turnTimer); m3f.turnTimer = null; }
  m3fUpdateTimer();
}

// Called on the first successful swap (Android onHandleMatches): stop the turn timer
// and log "Время хода: Ns" = whole seconds from turn start to the match.
function m3fStopTurnTimerOnSwap() {
  if (!m3f.timerRunning) return;
  const spent = Math.floor(m3f.turnElapsedMs / 1000);
  m3fStopTurnTimer();
  m3fLog(`Время хода: ${spent}с.`);
}

// Snapshot HERO stocks at the start of the hero turn (baseline for the "За ход" delta).
function m3fSnapshotHeroStocks() {
  const snap = {};
  Object.keys(m3f.stocks).forEach(gt => { snap[gt] = m3f.stocks[gt].value; });
  m3f.turnStockSnap = snap;
}

// "За ход: <тип>:+N, …" — positive per-type stock gains vs the hero-turn-start snapshot
// (GameScreenViewModel.logPoints). Only positive gains shown; none => "За ход очков не собрано".
function m3fLogPointsForTurn() {
  const snap = m3f.turnStockSnap || {};
  const parts = [];
  Object.keys(m3f.stocks).forEach(gt => {
    const gained = m3f.stocks[gt].value - (snap[gt] || 0);
    if (gained > 0) {
      const gs = m3f.gemSettings[gt] || {};
      parts.push(`${gs.displayName || ('тип ' + gt)}:+${gained}`);
    }
  });
  m3fLog(parts.length ? ('За ход: ' + parts.join(', ')) : 'За ход очков не собрано');
}

// ---------- Hands / perks UI ----------
function m3fStockDot(gemType) {
  const c = (m3f.gemSettings[gemType] || {}).colorHex || '#999';
  return `<span class="m3f-stock-dot" style="background:${c}"></span>`;
}

// ---------- BLOCK E: perk reload / category / availability gate ----------

// E2 — reloadType-aware isReloading() (Perk.isReloading, Perk.kt:112-118): with no coolDown a
// perk is never reloading; otherwise it is reloading while reload < coolDown. The reload counter
// itself is advanced per reloadType (TURN per round, PERK reset per round, COMBO per action /
// reset to 0 at end of turn). The predicate is identical for every type.
function m3fIsReloading(perk) {
  if (!perk.coolDown) return false;
  return (m3f.perkReload[perk.name] || 0) < perk.coolDown;
}

// E3 — category exclusivity (PerkExecutor.ifPerkHasReloadDownTimeIt, lines 228-248): on ANY use of
// a perk (hero, enemy, auto, reaction, trigger, sector), set reload=0 for the used perk AND every
// perk that shares its `category` — across BOTH hands, any coolDown, any reloadType. Siblings are
// then blocked by their own coolDown via the shared reload counter (no separate categoryLocked map).
function m3fSetCategoryReload(perk) {
  m3f.perkReload[perk.name] = 0;
  const cat = perk.category;
  if (!cat) return;
  [...m3f.heroHands, ...m3f.enemyHands].forEach(h => h.perks.forEach(p => {
    if (p.category === cat) m3f.perkReload[p.name] = 0;
  }));
}

// E2 — per-action reload advance (Perk.reloadPerkAfterUse, Perk.kt:195-210), invoked for EVERY perk
// on every perk use (PerkExecutor.reloadPerksAfterUse): TURN does nothing; PERK and COMBO advance
// reload by 1 when the perk is shown AND still reloading. Mirrors counting other actions in the turn.
function m3fReloadAfterUse(actorOwner) {
  const advance = (perk, owner) => {
    if (perk.reloadType === 'TURN') return;
    const shown = m3fCheckConditions(perk.conditionsForDisplay, owner);
    if (shown && m3fIsReloading(perk)) m3f.perkReload[perk.name] = (m3f.perkReload[perk.name] || 0) + 1;
  };
  m3f.heroHands.forEach(h => h.perks.forEach(p => advance(p, 'hero')));
  m3f.enemyHands.forEach(h => h.perks.forEach(p => advance(p, 'enemy')));
}

// E5/E6 — single round-boundary reload step (EndTurnExecutor.reloadPerksWithTurn, lines 142-182),
// run once inside m3fGiveTurnToHero after the turn-number increment, for BOTH sides:
//   TURN  -> reload += 1 only when show && isReloading() (capped at coolDown);
//   PERK  -> reset to coolDown (ready) when reloading;
//   COMBO -> hero side resets to 0 (on cooldown); enemy side resets to coolDown (Android `else` branch).
function m3fReloadPerksWithTurn() {
  m3f.heroHands.forEach(h => h.perks.forEach(p => {
    if (p.reloadType === 'TURN') {
      if (m3fCheckConditions(p.conditionsForDisplay, 'hero') && m3fIsReloading(p)) {
        m3f.perkReload[p.name] = Math.min((m3f.perkReload[p.name] || 0) + 1, p.coolDown || 0);
      }
    } else if (p.reloadType === 'PERK') {
      if (m3fIsReloading(p)) m3f.perkReload[p.name] = p.coolDown || 0;
    } else { // COMBO
      m3f.perkReload[p.name] = 0;
    }
  }));
  m3f.enemyHands.forEach(h => h.perks.forEach(p => {
    if (p.reloadType === 'TURN') {
      if (m3fCheckConditions(p.conditionsForDisplay, 'enemy') && m3fIsReloading(p)) {
        m3f.perkReload[p.name] = Math.min((m3f.perkReload[p.name] || 0) + 1, p.coolDown || 0);
      }
    } else { // PERK and COMBO: enemy `else` branch -> reset to coolDown
      if (m3fIsReloading(p)) m3f.perkReload[p.name] = p.coolDown || 0;
    }
  }));
}

// E1/E4 — shared availability gate + execution for AUTO and TRIGGER/REACTION-style perks
// (PerkExecutor.executeIfAvailable + canExecuteLikeRegularPerk, lines 89-163). Enforces the FULL
// gate: probability (+pFunc) roll, currentCharges != 0, !isReloading() (by reloadType),
// conditionsForEnable, resource sufficiency, price vs the owner's stocks. ONLY on pass does it:
// per-action reload advance for all perks, decrement this perk's charges, set reload=0 for the perk
// and its category siblings, pay prices, spend resources, then apply effects (STUN-suppressed via
// m3fApplyPerkEffects). Returns true iff the perk fired. Hand-perk hero/enemy paths keep their own
// inline cost flow (animation-driven); this routes the auto/sector/trigger perks through one gate.
function m3fExecuteIfAvailable(perk, owner) {
  owner = owner || 'hero';
  // 1) probability (+pFunc) roll — canExecuteLikeRegularPerk 1104-1116 (Random.nextInt(0,101) > prob)
  let prob = (perk.probability != null ? perk.probability : 100);
  prob += m3fFuncValue(perk.pFunc, owner);
  if (!(Math.floor(rng() * 101) <= prob)) return false;
  // 2) charges != 0 (null = unlimited)
  if (perk.charges != null && (m3f.perkCharges[perk.name] || 0) <= 0) return false;
  // 3) not reloading (per reloadType)
  if (m3fIsReloading(perk)) return false;
  // 4) conditionsForEnable (AND)
  if (!m3fCheckConditions(perk.conditionsForEnable, owner)) return false;
  // 5) resource sufficiency
  const actorF = owner === 'hero' ? m3f.hero : m3f.enemy;
  for (const r of (perk.resources || [])) {
    if (m3fResAmount(actorF, r.name) < r.amount) return false;
  }
  // 6) prices vs the owner's own stock pool
  const pool = m3fStockPool(owner);
  for (const pr of (perk.prices || [])) {
    if (pr.value === 0) continue;
    const st = pool[pr.gemType];
    if (!st || st.value < pr.value) return false;
  }
  // --- passed: execute exactly like PerkExecutor.execute (lines 178-216) ---
  m3fReloadAfterUse(owner);                 // reloadPerksAfterUse (per-action advance of others)
  if (perk.charges != null) m3f.perkCharges[perk.name] = Math.max(0, (m3f.perkCharges[perk.name] || 0) - 1); // decreaseCharges
  (perk.resources || []).forEach(rc => { const r = (actorF.resources || []).find(x => x.name === rc.name); if (r) r.amount = Math.max(0, r.amount - rc.amount); }); // spend resources
  m3fSetCategoryReload(perk);               // ifPerkHasReloadDownTimeIt (reload=0 + category siblings)
  (perk.prices || []).forEach(pr => { const st = pool[pr.gemType]; if (st) st.value = Math.max(0, st.value - pr.value); }); // payPriceForPerk
  m3fApplyPerkEffects(perk, owner);         // effects (STUN-suppressed inside)
  m3fUpdatePersonsStates();
  return true;
}

// PerkExecutor.execute (PerkExecutor.kt:178-216) WITHOUT the availability gate — the
// unconditional execution path used by MatchPerkExecutor.execute (MatchPerkExecutor.kt:22-24),
// which fires each matched HeroRule via perkExecutor.execute(rule.perk, heroTurn) directly (NOT
// executeIfAvailable — match rules have no probability/charges/reload gate on FIRING). It still
// runs the FULL bookkeeping: reloadPerksAfterUse (per-action advance of others), usePerkCharge
// (decreaseCharges if charged), usePerkResources, ifPerkHasReloadDownTimeIt (reload=0 + category
// siblings, both hands), payPriceForPerk, and STUN suppression of effects (a stunned actor's
// effects are skipped and one STUN is consumed via m3fApplyPerkEffects).
function m3fExecutePerk(perk, owner) {
  owner = owner || 'hero';
  m3fReloadAfterUse(owner);                 // reloadPerksAfterUse
  if (perk.charges != null) m3f.perkCharges[perk.name] = Math.max(0, (m3f.perkCharges[perk.name] || 0) - 1); // usePerkCharge / decreaseCharges
  const actorF = owner === 'hero' ? m3f.hero : m3f.enemy;
  (perk.resources || []).forEach(rc => { const r = (actorF.resources || []).find(x => x.name === rc.name); if (r) r.amount = Math.max(0, r.amount - rc.amount); }); // usePerkResources
  m3fSetCategoryReload(perk);               // ifPerkHasReloadDownTimeIt (reload=0 + category siblings)
  const pool = m3fStockPool(owner);
  (perk.prices || []).forEach(pr => { const st = pool[pr.gemType]; if (st) st.value = Math.max(0, st.value - pr.value); }); // payPriceForPerk
  m3fApplyPerkEffects(perk, owner);         // effects (STUN-suppressed inside)
  m3fUpdatePersonsStates();
}

function m3fPerkEnabled(perk, source) {
  if (perk.charges != null && (m3f.perkCharges[perk.name] || 0) <= 0) return false;
  if (m3fIsReloading(perk)) return false;
  // perk-level conditionsForEnable: visible but blocked when conditions fail
  if (!m3fCheckConditions(perk.conditionsForEnable, source)) return false;
  // prices — checked against the ACTING side's own stock pool
  // (Android: hero prices vs hero stocks, enemy prices vs enemy stocks).
  {
    const pool = m3fStockPool(source);
    for (const pr of perk.prices) {
      const st = pool[pr.gemType];
      if (!st || st.value < pr.value) return false;
    }
  }
  // resource cost (стрелы/заряды) — checked against the acting side's resources
  const srcF = source === 'hero' ? m3f.hero : m3f.enemy;
  for (const r of (perk.resources || [])) {
    if (m3fResAmount(srcF, r.name) < r.amount) return false;
  }
  return true;
}

function m3fRenderHands() {
  const wrap = document.getElementById('m3f-hands');
  wrap.innerHTML = '';
  // D3: a stunned hero may STILL click a perk (cost paid, effects suppressed in m3fApplyPerkEffects,
  // one STUN consumed). Android does not disable the button on stun, so it is NOT part of `enabled`.
  m3f.heroHands.forEach(hand => {
    // hand-level conditionsForDisplay: hide the WHOLE hand if conditions fail (AND)
    if (!m3fCheckConditions(hand.conditionsForDisplay, 'hero')) return;
    // perks visible after perk-level conditionsForDisplay filter.
    // E7 — a perk at 0 charges is HIDDEN, not visible-disabled (UpdatePerksStateExecutor
    // .changePerkDisplay sets show=false when currentCharges==0).
    const visiblePerks = hand.perks.filter(p =>
      !(p.charges != null && (m3f.perkCharges[p.name] || 0) <= 0)
      && m3fCheckConditions(p.conditionsForDisplay, 'hero'));
    if (!visiblePerks.length) return;
    const hEl = document.createElement('div');
    hEl.className = 'm3f-hand';
    const lbl = document.createElement('div');
    lbl.className = 'm3f-hand-label';
    lbl.innerHTML = `${m3fStockDot(hand.gemType)} ${hand.name || ('Тип ' + hand.gemType)}`;
    hEl.appendChild(lbl);
    const perksEl = document.createElement('div');
    perksEl.className = 'm3f-perks';
    visiblePerks.forEach(perk => {
      const btn = document.createElement('button');
      btn.className = 'm3f-perk';
      const enabled = !m3f.done && m3f.turn === 'hero' && m3fPerkEnabled(perk, 'hero');
      btn.disabled = !enabled;
      const costParts = perk.prices.map(pr => `${pr.value}${m3fStockDot(pr.gemType)}`)
        .concat((perk.resources || []).map(rc => `${rc.amount} ${rc.name}`));
      const costHtml = costParts.length ? costParts.join(' ') : 'бесплатно';
      let extra = '';
      if (perk.charges != null) extra += ` · заряды: ${m3f.perkCharges[perk.name] || 0}`;
      btn.innerHTML = `<div class="m3f-perk-name">${perk.icon ? perk.icon + ' ' : ''}${perk.name}</div>` +
        `<div class="m3f-perk-cost">${costHtml}${extra}</div>` +
        (perk.description ? `<div class="m3f-perk-desc">${perk.description}</div>` : '');
      btn.onclick = () => m3fUsePerk(perk);
      perksEl.appendChild(btn);
    });
    hEl.appendChild(perksEl);
    wrap.appendChild(hEl);
  });
}

// ============================================================
// SLIDE-OUT HAND PANELS + PERKS OVERLAY + TWO-STEP TARGETING
// New presentation layer over the existing engine. Selection/aiming is the ONLY thing that
// changes; application still goes through m3fUsePerk -> m3fApplyPerkEffects. State machine:
//   plane1 (board+panels) -> slideout(hand list) -> perks overlay -> [targeting] -> apply.
// ============================================================
// Targeting state: { perk, hand } while we wait for the player to pick an enemy limb/panel.
let m3fAim = null;
// Which slide-out (if any) is open: 'hero' | 'enemy' | null.
let m3fSlideoutOpen = null;
// Which hand's perks overlay is open ({side, handIndex}) — kept so updates re-render it.
let m3fPerksOverlayRef = null;

// A hero perk needs an ENEMY target if it is offensive (m3fPerkAimedAtFoe) OR it gates on a
// "Цель: X" sector status (a condition naming one of the enemySectors' perk names). Returns
// the list of gating sector indices (possibly empty even when targeting is required).
function m3fPerkSectorDeps(perk) {
  const sectorNames = (m3f.enemySectors || []).map(s => s.perk && s.perk.name).filter(Boolean);
  const deps = [];
  const scan = conds => (conds || []).forEach(c => {
    if (!c || !c.name) return;
    const param = (c.parameter || 'STATUS').toUpperCase();
    if (param !== 'STATUS') return;
    const idx = (m3f.enemySectors || []).findIndex(s => s.perk && s.perk.name === c.name);
    if (idx >= 0 && deps.indexOf(idx) < 0) deps.push(idx);
  });
  scan(perk.conditionsForDisplay); scan(perk.conditionsForEnable);
  return deps;
}
// True when using this perk should enter ENEMY-targeting mode (vs. apply-to-self immediately).
function m3fPerkNeedsEnemyTarget(perk) {
  if ((m3f.enemySectors || []).length && m3fPerkSectorDeps(perk).length) return true;
  return m3fPerkAimedAtFoe(perk);
}

// ---- Slide-out open/close ----
function m3fToggleSlideout(side) {
  if (m3fSlideoutOpen === side) { m3fCloseSlideout(side); return; }
  if (m3fSlideoutOpen) m3fCloseSlideout(m3fSlideoutOpen);
  m3fOpenSlideout(side);
}
function m3fOpenSlideout(side) {
  m3fCancelTargeting(true); m3fClosePerksOverlay(true);
  m3fRenderSlideout(side);
  document.getElementById(side === 'hero' ? 'm3f-slideout-hero' : 'm3f-slideout-enemy').classList.add('open');
  m3fSlideoutOpen = side;
}
function m3fCloseSlideout(side) {
  document.getElementById(side === 'hero' ? 'm3f-slideout-hero' : 'm3f-slideout-enemy').classList.remove('open');
  if (m3fSlideoutOpen === side) m3fSlideoutOpen = null;
}

// Render the list of a side's hands into its slide-out. Hero hands are tappable (open perks);
// enemy hands are read-only (open a greyed, non-applying perks overlay).
function m3fRenderSlideout(side) {
  const isHero = side === 'hero';
  const hands = isHero ? m3f.heroHands : m3f.enemyHands;
  const owner = isHero ? 'hero' : 'enemy';
  const listEl = document.getElementById(isHero ? 'm3f-slideout-hero-list' : 'm3f-slideout-enemy-list');
  listEl.innerHTML = '';
  let any = false;
  hands.forEach((hand, hi) => {
    if (!m3fCheckConditions(hand.conditionsForDisplay, owner)) return;
    const visiblePerks = hand.perks.filter(p =>
      !(p.charges != null && (m3f.perkCharges[p.name] || 0) <= 0)
      && m3fCheckConditions(p.conditionsForDisplay, owner));
    if (!visiblePerks.length) return;
    any = true;
    const card = document.createElement('button');
    card.className = 'm3f-handcard' + (isHero ? '' : ' ro');
    card.innerHTML = `${m3fStockDot(hand.gemType)}` +
      `<div><div class="m3f-hc-name">${hand.name || ('Тип ' + hand.gemType)}</div>` +
      `<div class="m3f-hc-sub">приёмов: ${visiblePerks.length}${isHero ? '' : ' · просмотр'}</div></div>`;
    card.onclick = () => m3fOpenPerksOverlay(side, hi);
    listEl.appendChild(card);
  });
  if (!any) listEl.innerHTML = '<div class="m3f-slideout-empty">Нет доступных рук.</div>';
}

// ---- Perks overlay (plane 2) ----
function m3fOpenPerksOverlay(side, handIndex) {
  const hand = (side === 'hero' ? m3f.heroHands : m3f.enemyHands)[handIndex];
  if (!hand) return;
  m3fCloseSlideout(side);
  m3fCancelTargeting(true);
  m3fPerksOverlayRef = { side, handIndex };
  m3fRenderPerksList(side, handIndex);
  document.getElementById('m3f-perks-overlay').classList.add('show');
  document.getElementById('m3f-board-wrap').classList.add('m3f-dimmed');
}
// Build the perks-overlay title+list for a hand. Re-callable on state change (conditionsForDisplay).
function m3fRenderPerksList(side, handIndex) {
  const isHero = side === 'hero';
  const hand = (isHero ? m3f.heroHands : m3f.enemyHands)[handIndex];
  if (!hand) return;
  const owner = isHero ? 'hero' : 'enemy';
  const titleEl = document.getElementById('m3f-perks-overlay-title');
  titleEl.innerHTML = `${m3fStockDot(hand.gemType)} <span>${hand.name || ('Тип ' + hand.gemType)}</span>` +
    (isHero ? '' : ' <span class="m3f-readonly">(просмотр)</span>');
  const listEl = document.getElementById('m3f-perks-overlay-list');
  listEl.innerHTML = '';
  const visiblePerks = hand.perks.filter(p =>
    !(p.charges != null && (m3f.perkCharges[p.name] || 0) <= 0)
    && m3fCheckConditions(p.conditionsForDisplay, owner));
  if (!visiblePerks.length) { listEl.innerHTML = '<div class="m3f-slideout-empty">Нет видимых приёмов.</div>'; }
  visiblePerks.forEach(perk => {
    // Reuse the existing perk-button rendering (same markup/classes as m3fRenderHands).
    const btn = document.createElement('button');
    btn.className = 'm3f-perk';
    const enabled = isHero && !m3f.done && m3f.turn === 'hero' && m3fPerkEnabled(perk, 'hero');
    btn.disabled = !enabled; // enemy perks always disabled (read-only inspection)
    const costParts = perk.prices.map(pr => `${pr.value}${m3fStockDot(pr.gemType)}`)
      .concat((perk.resources || []).map(rc => `${rc.amount} ${rc.name}`));
    const costHtml = costParts.length ? costParts.join(' ') : 'бесплатно';
    let extra = '';
    if (perk.charges != null) extra += ` · заряды: ${m3f.perkCharges[perk.name] || 0}`;
    btn.innerHTML = `<div class="m3f-perk-name">${perk.icon ? perk.icon + ' ' : ''}${perk.name}</div>` +
      `<div class="m3f-perk-cost">${costHtml}${extra}</div>` +
      (perk.description ? `<div class="m3f-perk-desc">${perk.description}</div>` : '');
    if (isHero) btn.onclick = () => m3fChoosePerk(perk);
    listEl.appendChild(btn);
  });
}
function m3fClosePerksOverlay(silent) {
  document.getElementById('m3f-perks-overlay').classList.remove('show');
  m3fPerksOverlayRef = null;
  if (!silent && !m3fAim) document.getElementById('m3f-board-wrap').classList.remove('m3f-dimmed');
}

// A hero perk was tapped in the overlay. The target sector is pre-selected on the enemy
// (tap a body-part first to set «Цель: X»); the perk applies directly to whatever is selected.
function m3fChoosePerk(perk) {
  if (m3f.done || m3f.turn !== 'hero') return;
  m3fClosePerksOverlay(true);
  document.getElementById('m3f-board-wrap').classList.remove('m3f-dimmed');
  m3fUsePerk(perk);
}

// ---- Two-step targeting (plane 2) ----
function m3fStartTargeting(perk) {
  m3fAim = { perk: perk };
  const deps = m3fPerkSectorDeps(perk);
  const overlay = document.getElementById('m3f-target-overlay');
  const hint = document.getElementById('m3f-target-hint');
  const secWrap = document.getElementById('m3f-target-sectors');
  hint.textContent = `Приём: «${perk.name}»`;
  secWrap.innerHTML = '';
  const sectors = m3f.enemySectors || [];
  // Always offer ALL limbs/sectors as targets — the player chooses where to strike.
  // (Perk conditions like EMPTY "Цель: Голова" are gates, NOT a forced single target.)
  const offered = sectors.map((_, i) => i);
  offered.forEach(i => {
    const s = sectors[i]; if (!s) return;
    const icon = M3F_SECTOR_ICONS[s.iconResName] || '🎯';
    const b = document.createElement('button');
    b.className = 'm3f-tgt';
    b.textContent = `${icon} ${s.name}`;
    b.onclick = () => m3fPickTarget(i);
    secWrap.appendChild(b);
  });
  // No sectors at all -> the enemy PANEL itself is the target (highlight + tap).
  if (!sectors.length) {
    const ee = document.getElementById('m3f-enemy');
    if (ee) { ee.classList.add('m3f-aim-target'); ee.onclick = m3fPickEnemyPanel; }
  }
  overlay.classList.add('show');
  document.getElementById('m3f-board-wrap').classList.add('m3f-dimmed');
}
// Limb chosen: run that sector's target-setter, then apply the aimed perk.
function m3fPickTarget(sectorIndex) {
  if (!m3fAim) return;
  const perk = m3fAim.perk;
  m3fExitTargeting();
  m3fUsePerk(perk, sectorIndex);
}
// Enemy panel chosen (no sector needed): apply the aimed perk directly at the enemy.
function m3fPickEnemyPanel() {
  if (!m3fAim) return;
  const perk = m3fAim.perk;
  m3fExitTargeting();
  m3fUsePerk(perk);
}
function m3fCancelTargeting(silent) {
  if (!m3fAim && silent) return;
  m3fExitTargeting();
  if (!silent) document.getElementById('m3f-board-wrap').classList.remove('m3f-dimmed');
}
// Tear down targeting UI (overlay, panel highlight) without applying anything.
function m3fExitTargeting() {
  m3fAim = null;
  document.getElementById('m3f-target-overlay').classList.remove('show');
  const ee = document.getElementById('m3f-enemy');
  if (ee) { ee.classList.remove('m3f-aim-target'); ee.onclick = null; }
  document.getElementById('m3f-board-wrap').classList.remove('m3f-dimmed');
}
// Show/hide the edge tabs (called from m3fUpdateAllUI). Hidden when the game is over.
function m3fUpdateHandTabs() {
  const show = m3f && !m3f.done;
  const lt = document.getElementById('m3f-handtab-left'), rt = document.getElementById('m3f-handtab-right');
  if (lt) lt.style.display = show ? 'flex' : 'none';
  if (rt) rt.style.display = (m3f && m3f.enemyHands && m3f.enemyHands.length) ? 'flex' : 'none';
}

// Apply a hero perk. `preSector` (optional): an enemySectors index to run FIRST (sets the
// matching "Цель: X" status) before this perk's own effects — used by the two-step targeting
// flow. The cost/charges/reload/effect logic below is identical to the original; preSector
// only injects the limb-selection step that a direct sector tap would otherwise have done.
function m3fUsePerk(perk, preSector) {
  // C3: a stunned hero may still CLICK a perk — the cost is paid and one STUN consumed,
  // but the effects are suppressed (handled in m3fApplyPerkEffects). No early stun return.
  if (m3f.done || m3f.turn !== 'hero') return;
  // run the chosen limb's target-setting perk first (mirrors a manual m3fTapSector), so the
  // perk's "Цель: X" gate is satisfied before we check/apply it.
  if (preSector != null) {
    const sec = (m3f.enemySectors || [])[preSector];
    if (sec && sec.perk && m3fCheckConditions(sec.perk.conditionsForDisplay, 'hero')) {
      if (m3fExecuteIfAvailable(sec.perk, 'hero')) m3fLog(`Цель: «${sec.name}».`);
      m3fUpdateAllUI();
      if (m3fCheckEnd()) return;
    }
  }
  if (!m3fPerkEnabled(perk, 'hero')) return;
  // deduct prices
  perk.prices.forEach(pr => { const st = m3f.stocks[pr.gemType]; if (st) st.value = Math.max(0, st.value - pr.value); });
  // spend resource cost (стрелы/заряды)
  (perk.resources || []).forEach(rc => { const r = (m3f.hero.resources || []).find(x => x.name === rc.name); if (r) r.amount = Math.max(0, r.amount - rc.amount); });
  m3fLog(`Герой: «${perk.name}».`);
  m3fUpdateAllUI(); // reflect the cost deduction before the cast flies
  // Fly the skill icon, then apply effects on arrival.
  // E2/E3 — per-action reload advance for all perks (reloadPerksAfterUse) BEFORE this perk's
  // own reset, then decrement charges, set reload=0 for the perk + its category siblings.
  m3fReloadAfterUse('hero');
  m3fCastAnim('hero', perk, () => {
    m3fApplyPerkEffects(perk, 'hero'); // C3: suppress effects + consume STUN if stunned
    m3fUpdatePersonsStates(); // PerkExecutor.execute line 207: re-eval auto-statuses after effects
    if (perk.charges != null) m3f.perkCharges[perk.name] = Math.max(0, (m3f.perkCharges[perk.name] || 0) - 1);
    m3fSetCategoryReload(perk); // E3: reload=0 for this perk AND every category sibling (both sides)
    m3fUpdateAllUI();
    m3fCheckEnd();
  });
}

// ---------- Turn flow ----------
function m3fEndTurn() {
  if (m3f.done || m3f.turn !== 'hero') return;
  m3f.turn = 'enemy';
  m3fStopTurnTimer(); // board closed; per-turn scene timer must not tick during enemy turn
  // D5: EndTurnExecutor.execute() line 66 — clear the HERO's per-turn HITS/TOUCHES counters
  // (the hero just finished acting) before applying end-of-turn statuses.
  m3fClearHitsAndTouches(m3f.hero);
  m3fTickStatuses(m3f.hero, 'end');
  if (m3fCheckEnd()) return;
  m3fApplyTurnKeep();
  // E6 — reload advancement is NOT done here anymore; it is consolidated into a single
  // round-boundary step in m3fGiveTurnToHero (after the turn-number increment), per reloadType.
  m3fUpdateAllUI();
  setTimeout(m3fEnemyTurn, 600);
}

// Enumerate every adjacent swap that produces a match (Android GameBoard.findPossibleMoves).
// Returns [{r1,c1,r2,c2}]. Tries each swap on the grid, tests m3fFindMatches, reverts.
function m3fFindPossibleMoves() {
  const moves = [];
  const test = (r1, c1, r2, c2) => {
    if (m3f.grid[r1][c1] < 0 || m3f.grid[r2][c2] < 0) return;
    [m3f.grid[r1][c1], m3f.grid[r2][c2]] = [m3f.grid[r2][c2], m3f.grid[r1][c1]];
    [m3f.gmeta[r1][c1], m3f.gmeta[r2][c2]] = [m3f.gmeta[r2][c2], m3f.gmeta[r1][c1]];
    const has = m3fFindMatches().cells.length > 0;
    [m3f.grid[r1][c1], m3f.grid[r2][c2]] = [m3f.grid[r2][c2], m3f.grid[r1][c1]];
    [m3f.gmeta[r1][c1], m3f.gmeta[r2][c2]] = [m3f.gmeta[r2][c2], m3f.gmeta[r1][c1]];
    if (has) moves.push({ r1, c1, r2, c2 });
  };
  for (let r = 0; r < M3F_SIZE; r++) {
    for (let c = 0; c < M3F_SIZE; c++) {
      if (c + 1 < M3F_SIZE) test(r, c, r, c + 1);
      if (r + 1 < M3F_SIZE) test(r, c, r + 1, c);
    }
  }
  return moves;
}

// makeEnemyMove == true: pick ONE random legal swap, perform it, run cascades in enemy
// mode (heroTurn=false: enemy stocks + enemy match-rules), then invoke `then` once settled.
// If no legal move exists, no swap happens and `then` runs immediately.
function m3fEnemyBoardMove(then) {
  const moves = m3fFindPossibleMoves();
  if (!moves.length) { then(); return; }
  const mv = moves[Math.floor(rng() * moves.length)];
  m3f.animating = true;
  // D6: two-stage makeMove log (GameScreenViewModel.messageAboutEvaluateMove / messageAboutMakeMove):
  // first «Противник думает...», then «Противник ходит» when the swap is actually performed.
  m3fLog('Противник думает...');
  m3fLog('Противник ходит');
  [m3f.grid[mv.r1][mv.c1], m3f.grid[mv.r2][mv.c2]] = [m3f.grid[mv.r2][mv.c2], m3f.grid[mv.r1][mv.c1]];
  [m3f.gmeta[mv.r1][mv.c1], m3f.gmeta[mv.r2][mv.c2]] = [m3f.gmeta[mv.r2][mv.c2], m3f.gmeta[mv.r1][mv.c1]];
  m3fLog(`${m3f.enemy.name}: совмещение.`);
  m3fRender();
  // cascades in enemy mode; on settle, continue to perks
  m3fEnemyCascade(then);
}

// Cascade loop in ENEMY mode (heroTurn=false): awards enemy stocks, fires enemy rules,
// suppresses HeroRules. Mirrors m3fCascade but routes accumulation through owner='enemy'.
function m3fEnemyCascade(onSettle) {
  const { cells: matches, unique, groups } = m3fFindMatches();
  if (!matches.length) {
    m3f.animating = false; m3fRender();
    if (typeof onSettle === 'function') onSettle();
    return;
  }
  m3fAccumulateStocks(matches, groups, 'enemy');
  m3fUpdateStocksUI();
  const board = document.getElementById('m3f-board');
  unique.forEach(({ r, c }) => { const el = board.children[r * M3F_SIZE + c]; if (el) el.classList.add('removing'); });
  setTimeout(() => {
    unique.forEach(({ r, c }) => { m3f.grid[r][c] = -1; m3f.gmeta[r][c] = null; });
    m3fFallAnim(() => setTimeout(() => m3fEnemyCascade(onSettle), 60));
  }, 250);
}

function m3fEnemyTurn() {
  if (m3f.done) return;
  // prepareEnemyBeforeActions order (EndTurnExecutor.prepareEnemyBeforeActions):
  //   updatePersonStocksAfterTurn(false) -> clearEnemyShields() -> applyPersonStatus(false) -> updatePersonStatus(false).
  // 1) decay the ENEMY stock pool by turnKeepStrategy (mirrors updatePersonStocksAfterTurn(false));
  //    otherwise makeEnemyMove-accumulated enemy stocks would carry over at 100% forever.
  m3fApplyTurnKeep('enemy');
  // 2) zero enemy shield BEFORE re-applying start statuses
  // (Android clearEnemyShields() in prepareEnemyBeforeActions — shields last one turn,
  //  persistent DEFEND statuses re-grant their shield each turn).
  m3f.enemy.shield = 0;
  // prepareEnemyBeforeActions: enemy start-of-turn statuses (DEFEND/DAMAGE/HEAL/GENERATE), decrement.
  m3fTickStatuses(m3f.enemy, 'start');
  m3fUpdatePersonsStates(); // enemy turn start: re-eval auto-statuses
  if (m3fCheckEnd()) { return; }
  // E6 — enemy reloads are NO LONGER advanced here; the single round-boundary reload step
  // lives in m3fGiveTurnToHero (handles both hero and enemy hands per reloadType).

  // BRANCH on makeEnemyMove: with a board move (swap+cascades) BEFORE perks, or straight to perks.
  // D4: a stunned enemy STILL performs its board move — Android chooses makeMove() purely on
  // BattleSettings.MAKE_ENEMY_MOVE and never gates the swap on stun (stun only suppresses the
  // subsequent perk effects in enemyActions). So no !m3fIsStunned guard here.
  if (m3f.settings.makeEnemyMove) {
    m3fEnemyBoardMove(() => { if (!m3fCheckEnd()) m3fEnemyActions(); });
  } else {
    m3fEnemyActions();
  }
}

// enemyActions() — cast EVERY eligible enemy perk (show && enable), iterating hands
// top-to-bottom and perks top-to-bottom. No early break / no "pick one" (Android parity).
function m3fEnemyActions() {
  if (m3f.done) return;
  // D2: NO whole-turn stun skip. Android's enemyActions() iterates every eligible perk even when
  // the enemy is stunned — PerkExecutor.execute still pays prices/charges/resources and reloads,
  // and only SUPPRESSES the effects (decrementing one STUN per attempted perk). That per-perk
  // suppression lives in m3fApplyPerkEffects (C3), so we do NOT early-return here.
  // Ordered candidate list (hands top-to-bottom, perks top-to-bottom). Fired SEQUENTIALLY with a
  // delay so the player sees each action's animation; eligibility re-checked at fire time.
  const queue = [];
  for (const hand of m3f.enemyHands) {
    if (!m3fCheckConditions(hand.conditionsForDisplay, 'enemy')) continue;
    for (const perk of hand.perks) queue.push(perk);
  }
  let used = false;
  const step = (i) => {
    if (m3f.done) return;
    if (i >= queue.length) { if (!used) m3fLog(`${m3f.enemy.name}: бездействует.`); m3fEnemyFinish(); return; }
    const perk = queue[i];
    // D1: NO extra per-perk probability roll. Android enemyActions() fires every show&&enable perk
    // deterministically (perk.probability only decorates the displayed name); effect-level
    // probability is handled inside m3fApplyEffect, not as a gate on casting.
    if (!m3fCheckConditions(perk.conditionsForDisplay, 'enemy') || !m3fPerkEnabled(perk, 'enemy')) { step(i + 1); return; }
    m3fLog(`${m3f.enemy.name}: «${perk.name}».`);
    perk.prices.forEach(pr => { const st = m3f.enemyStocks[pr.gemType]; if (st) st.value = Math.max(0, st.value - pr.value); });
    (perk.resources || []).forEach(rc => { const r = (m3f.enemy.resources || []).find(x => x.name === rc.name); if (r) r.amount = Math.max(0, r.amount - rc.amount); });
    used = true;
    // E2/E3 — per-action reload advance for all perks (reloadPerksAfterUse).
    m3fReloadAfterUse('enemy');
    m3fUpdateAllUI();
    // Fly the enemy's skill icon, then apply effects on arrival — shows the enemy's move.
    m3fCastAnim('enemy', perk, () => {
      m3fApplyPerkEffects(perk, 'enemy'); // C3: suppress effects + consume STUN if stunned
      m3fUpdatePersonsStates();
      if (perk.charges != null) m3f.perkCharges[perk.name] = Math.max(0, (m3f.perkCharges[perk.name] || 0) - 1);
      m3fSetCategoryReload(perk); // E3: reload=0 for this perk AND every category sibling (both sides)
      m3fUpdateAllUI();
      if (m3fCheckEnd()) { m3fRender(); return; }
      setTimeout(() => step(i + 1), 450); // пауза между действиями врага
    });
  };
  step(0);
}

// afterEnemyAction: enemy end-of-turn statuses, then hand the turn back to the hero.
function m3fEnemyFinish() {
  // D5: afterEnemyAction() line 372 — clear the ENEMY's per-turn HITS/TOUCHES counters
  // (e.g. hits accrued via counterattacks) before its end-of-turn statuses.
  m3fClearHitsAndTouches(m3f.enemy);
  m3fTickStatuses(m3f.enemy, 'end');
  m3fUpdateAllUI();
  if (m3fCheckEnd()) return;
  m3fGiveTurnToHero();
}

// giveTurnToHero(): hand control back to the player, start the hero turn + scene timer.
function m3fGiveTurnToHero() {
  m3f.turn = 'hero';
  m3f.matchDone = false; // новый ход — снова доступно одно совмещение
  m3f.turnNum += 1;
  // E5/E6 — single round-boundary reload step (EndTurnExecutor.giveTurnToHero: increment THEN
  // reloadPerksWithTurn). Advances BOTH hero and enemy hands per reloadType, gating the TURN
  // `+1` on show && isReloading() so hidden perks stay frozen.
  m3fReloadPerksWithTurn();
  // hero stock decay at turn handover (turnKeepStrategy), then snapshot baseline for "За ход".
  m3fSnapshotHeroStocks();
  // zero hero shield BEFORE re-applying hero start statuses (Android clearPersonShield(true)
  // in giveTurnToHero — shields last one turn; persistent DEFEND re-grants each turn).
  m3f.hero.shield = 0;
  m3fTickStatuses(m3f.hero, 'start');
  m3fUpdatePersonsStates(); // giveTurnToHero (EndTurnExecutor line 130): re-eval auto-statuses on handover
  if (m3fCheckEnd()) { m3fStopTurnTimer(); m3fUpdateAllUI(); m3fRender(); return; }
  m3fUpdateAllUI();
  m3fRender();
  // hero's board opens: start the real-time per-turn scene timer (resets seconds to 0).
  m3fStartTurnTimer();
}

// ---------- Rendering of fighters / stocks ----------
// Human-readable hint per status type (shown under the name).
const M3F_STATUS_DESC = {
  DAMAGE: 'урон/ход', DAMAGE_HP: 'урон по HP/ход', HEAL: 'лечение/ход', DEFEND: 'щит/ход',
  ARMOR: 'броня (шанс −урон)', WEAK: 'слабее атака', STRONG: 'сильнее атака',
  VULNERABLE: 'уязвимость +урон', VUL: 'уязвимость +урон', RESISTANCE: 'сопротивление %',
  STUN: 'оглушён — пропуск', GENERATE: 'очки/ход', CHANGE_STOCK: 'мод. сбора очков',
  EVASION: 'уклонение', ACCURACY: 'точность', INFO: '', CHANGE_DEFEND: 'мод. щита',
  CHANGE_TURN_KEEP_STRATEGY: 'сохранение очков'
};
function m3fStatusChips(fighter) {
  const bad = ['DAMAGE','DAMAGE_HP','WEAK','VULNERABLE','VUL','STUN'];
  // hide skipZero statuses sitting at value 0 (e.g. non-selected "Цель: X" target flags)
  const list = fighter.statuses.filter(s => !(s.skipZero && (s.value === 0)));
  if (!list.length) return '';
  return '<div class="m3f-statuses">' + list.map(s => {
    const cls = bad.includes(s.type) ? 'm3f-status-chip bad' : 'm3f-status-chip';
    const dur = (s.duration === -1) ? '∞' : (s.duration != null ? s.duration : '');
    const e = s.end ? '⤵' : '';
    const hint = s.description || M3F_STATUS_DESC[s.type] || '';
    const valTxt = (s.type === 'INFO') ? '' : `<b>${s.value}</b>`;
    return `<span class="${cls}" title="${(s.description||s.type||'').replace(/"/g,'')}">` +
      `<span class="m3f-st-name">${s.name}${e}</span>` +
      `<span class="m3f-st-meta">${valTxt}${dur !== '' ? ' ⏳' + dur : ''}${hint ? ' · ' + hint : ''}</span>` +
      `</span>`;
  }).join('') + '</div>';
}

// --- Action animations: floating numbers + hit flash over a fighter panel ---
function m3fSideEl(p) { return document.getElementById(p === m3f.enemy ? 'm3f-enemy' : 'm3f-hero'); }
function m3fFloat(p, text, kind) {
  const el = m3fSideEl(p); if (!el) return;
  const s = document.createElement('span');
  s.className = 'm3f-float ' + (kind || 'dmg');
  s.textContent = text;
  el.appendChild(s);
  setTimeout(() => { try { el.removeChild(s); } catch (e) {} }, 950);
}
function m3fFlash(p) {
  const el = m3fSideEl(p); if (!el) return;
  el.classList.remove('m3f-hit'); void el.offsetWidth; el.classList.add('m3f-hit');
  setTimeout(() => { try { el.classList.remove('m3f-hit'); } catch (e) {} }, 340);
}
// Which side a perk is aimed at: offensive (any ATTACK / debuff vs foe) → opponent, else self.
function m3fPerkAimedAtFoe(perk) {
  return (perk.effects || []).some(e => {
    const c = (e.command || '').toUpperCase();
    if (c === 'ATTACK') return true;
    const tg = (e.target || '').toUpperCase();
    return (c === 'EDIT_STATUS' || c === 'EDIT_STOCK' || c === 'EDIT_RES') && (tg === 'ENEMY' || tg === 'FOE');
  });
}
// Fly the perk's icon from caster panel to target panel, then run cb (effects land on arrival).
function m3fCastAnim(casterSide, perk, cb) {
  const fromP = casterSide === 'hero' ? m3f.hero : m3f.enemy;
  const foeP = casterSide === 'hero' ? m3f.enemy : m3f.hero;
  const toP = m3fPerkAimedAtFoe(perk) ? foeP : fromP;
  const fe = m3fSideEl(fromP), te = m3fSideEl(toP);
  if (!fe || !te) { if (cb) cb(); return; }
  const a = fe.getBoundingClientRect(), b = te.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  const bx = b.left + b.width / 2, by = b.top + b.height / 2;
  const s = document.createElement('div');
  s.className = 'm3f-cast';
  s.textContent = perk.icon || '✨';
  s.style.left = ax + 'px'; s.style.top = ay + 'px';
  document.body.appendChild(s);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    s.style.transform = `translate(calc(-50% + ${bx - ax}px), calc(-50% + ${by - ay}px)) scale(1.35)`;
    if (toP === fromP) s.style.opacity = '0.7';
  }));
  setTimeout(() => { try { document.body.removeChild(s); } catch (e) {} if (cb) cb(); }, 460);
}

function m3fRenderFighter(elId, f, isEnemy) {
  const el = document.getElementById(elId);
  const pct = Math.max(0, Math.min(100, f.hp / f.maxHp * 100));
  const woundsHtml = (f.maxWounds != null)
    ? ' · <span class="m3f-wounds" title="Раны">' + '✚'.repeat(Math.max(0, f.maxWounds - f.wounds)) + '✖'.repeat(Math.max(0, f.wounds)) + '</span>'
    : '';
  // Render content into a child (.m3f-fc) so floating-number/flash overlay children of the
  // panel survive re-renders.
  let fc = el.querySelector('.m3f-fc');
  if (!fc) { fc = document.createElement('div'); fc.className = 'm3f-fc'; el.appendChild(fc); }
  fc.innerHTML =
    `<div class="m3f-fighter-head"><span class="m3f-fighter-name">${isEnemy ? '👹 ' : '🛡 '}${f.name}</span>` +
    `<span class="m3f-fighter-hp-text">HP ${f.hp}/${f.maxHp}${f.shield > 0 ? ' · <span class="m3f-shield">🛡 ' + f.shield + '</span>' : ''}${woundsHtml}</span></div>` +
    `<div class="combat-hp-bar"><div class="combat-hp-fill" style="width:${pct}%"></div></div>` +
    (isEnemy && f.info ? `<div class="m3f-info">${f.info}</div>` : '') +
    ((f.resources && f.resources.length)
      ? `<div class="m3f-resources">${f.resources.map(r => `<span class="m3f-res-chip">${r.name}: ${r.amount}${r.maxAmount != null ? '/' + r.maxAmount : ''}</span>`).join(' ')}</div>`
      : '') +
    m3fStatusChips(f) +
    (isEnemy ? m3fSectorButtons() : '');
}

// EnemySectors -> tappable body-part buttons. Hero "aims" at a limb; tapping runs the
// sector perk's effects (owner 'hero') — typically SET "Цель: X" INFO statuses on the enemy.
const M3F_SECTOR_ICONS = { ic_helmet: '🪖', ic_hands: '✋', ic_legs: '🦵' };
function m3fSectorButtons() {
  const sectors = (m3f && m3f.enemySectors) || [];
  if (!sectors.length) return '';
  const disabled = m3f.done || m3f.turn !== 'hero';
  return '<div class="m3f-sectors">' + sectors.map((s, i) => {
    const icon = M3F_SECTOR_ICONS[s.iconResName] || '🎯';
    // mark the currently-selected limb: its "Цель: X" INFO status is VALUE 1 on the enemy.
    // (Existence alone is insufficient — selecting a limb SETs the other limbs' statuses to 0
    //  rather than removing them, so all "Цель: X" statuses can coexist; only the active one
    //  carries value 1. The sector's perk name equals the "Цель: X" status name it sets.)
    const active = m3fStatusValue(m3f.enemy, s.perk.name) === 1;
    return `<button class="m3f-sector${active ? ' active' : ''}" ${disabled ? 'disabled' : ''} onclick="m3fTapSector(${i})">${icon} ${s.name}</button>`;
  }).join('') + '</div>';
}

function m3fTapSector(i) {
  if (m3f.done || m3f.turn !== 'hero') return;
  const s = (m3f.enemySectors || [])[i];
  if (!s || !s.perk) return;
  // E1 — sector perks route through the full availability gate (canShow conditionsForDisplay
  // first, then probability+pFunc/charges/reload/conditionsForEnable/resources/prices); charges
  // spent, prices paid, reload set, effects applied only on pass.
  if (!m3fCheckConditions(s.perk.conditionsForDisplay, 'hero')) return;
  if (m3fExecuteIfAvailable(s.perk, 'hero')) {
    m3fLog(`Цель: «${s.name}».`);
  }
  m3fUpdateAllUI();
  m3fCheckEnd();
}

function m3fUpdateStocksUI() {
  const el = document.getElementById('m3f-stocks');
  el.innerHTML = Object.keys(m3f.stocks).map(gt => {
    const st = m3f.stocks[gt];
    const gs = m3f.gemSettings[gt] || {};
    return `<div class="m3f-stock">${m3fStockDot(+gt)}${st.value}<span style="font-weight:400;color:var(--tg-theme-hint-color,#aaa)">${gs.displayName || ''}</span></div>`;
  }).join('');
}

function m3fUpdateAllUI() {
  m3fRenderFighter('m3f-enemy', m3f.enemy, true);
  m3fRenderFighter('m3f-hero', m3f.hero, false);
  m3fUpdateStocksUI();
  m3fRenderHands();
  m3fUpdateHandTabs();
  // keep an open slide-out list in sync with engine state (charges/conditions may change).
  if (m3fSlideoutOpen) m3fRenderSlideout(m3fSlideoutOpen);
  const etb = document.getElementById('m3f-endturn');
  // Завершить ход можно всегда в свой ход — даже без совмещения (можно пропустить ход).
  etb.disabled = (m3f.done || m3f.turn !== 'hero');
  etb.textContent = m3f.matchDone ? 'Завершить ход ▶' : 'Завершить ход (без совмещения) ▶';
  m3fUpdateCover();
  m3fUpdateTimer();
  // держим открытый оверлей приёмов в синхроне (conditionsForDisplay зависят от статусов/целей)
  if (m3fPerksOverlayRef && document.getElementById('m3f-perks-overlay').classList.contains('show'))
    m3fRenderPerksList(m3fPerksOverlayRef.side, m3fPerksOverlayRef.handIndex);
}

// Полупрозрачная крышка над доской, когда поле «закрыто» (ход сделан или ходит враг) — coverBoard.
function m3fUpdateCover() {
  const cover = document.getElementById('m3f-board-cover');
  if (!cover) return;
  const enemyTurn = m3f.turn === 'enemy';
  const locked = m3f.done || enemyTurn || m3f.matchDone;
  cover.classList.toggle('show', !!locked);
  const sp = cover.querySelector('span');
  if (sp) sp.textContent = m3f.done ? 'Бой окончен' : (enemyTurn ? 'Ход противника' : 'Ход сделан');
}

function m3fLog(msg) {
  m3f.log.push(msg);
  const el = document.getElementById('m3f-log');
  el.innerHTML = m3f.log.slice(-6).map(m => `<div>${m}</div>`).join('');
}

// ---------- Wounds ----------
// PARITY NOTE (verified against the Android source, not just the guide):
//   `grep -rn wounds app/src/main/java` shows wounds/maxWounds appear ONLY as model
//   fields on Person/Hero/Enemy and in two GameScreen render lines
//   ("${it.wounds}/${it.maxWounds} Ран"). There is NO revive, NO hp-restore, and NO
//   defeat-at-maxWounds anywhere in the engine. Defeat is decided SOLELY by hp <= 0.
//   We deliberately do NOT add a wound-revive: doing so would DIVERGE from the Android
//   engine and break the 1:1-parity mandate. wounds/maxWounds are display-only here too
//   (parsed at load, rendered in m3fStatusChips), matching Android exactly.
function m3fIsDefeated(person) {
  // Sole defeat condition, identical to the Android engine.
  return person.hp <= 0;
}

// ---------- Win / lose ----------
function m3fCheckEnd() {
  if (m3f.done) return true;
  if (m3fIsDefeated(m3f.enemy)) { m3fFinish(true); return true; }
  if (m3fIsDefeated(m3f.hero)) { m3fFinish(false); return true; }
  return false;
}

function m3fFinish(win) {
  if (m3f.done) return;
  m3f.done = true;
  m3f.animating = false;
  m3fStopTurnTimer(); // game over: stop & clear the per-turn scene timer
  // tear down any open selection/aim UI from the new presentation layer
  m3fCancelTargeting(true); m3fClosePerksOverlay(true);
  if (m3fSlideoutOpen) m3fCloseSlideout(m3fSlideoutOpen);
  const banner = document.getElementById('m3f-result');
  banner.style.display = '';
  banner.className = 'result-banner ' + (win ? 'result-good' : 'result-bad');
  banner.textContent = win ? '⚔️ Победа!' : '💀 Поражение';
  document.getElementById('m3f-endturn').disabled = true;
  m3fRender();
  m3fRenderHands();
  setTimeout(() => sendResultToBot({
    game: 'match3fight',
    win: win,
    outcome: win ? 'Победа' : 'Поражение',
    turns: m3f.turnNum,
    heroHpLeft: Math.max(0, m3f.hero.hp),
    enemyHpLeft: Math.max(0, m3f.enemy.hp)
  }), 900);
}

// ---------- Entry ----------
function initM3F() {
  document.getElementById('m3f-game').style.display = '';
  // Скрыть общие заголовки (h1 «Twilights» + подзаголовок) — больше места под бой.
  const _h1 = document.querySelector('h1'); if (_h1) _h1.style.display = 'none';
  const _sub = document.getElementById('subtitle'); if (_sub) _sub.style.display = 'none';
  document.body.style.padding = '6px 8px';
  m3fLoadScene();
  m3fInitBoard();
  m3fTickStatuses(m3f.hero, 'start'); // pre-turn statuses for hero's first turn
  m3fUpdatePersonsStates();           // seed auto-statuses before the first turn
  m3fSnapshotHeroStocks();            // baseline for the first turn's "За ход" delta
  m3fRender();
  m3fUpdateAllUI();
  m3fLog('Бой начался. Собирай ряды, копи ресурсы, применяй навыки.');
  if (m3fCheckEnd()) return;
  // hero's board opens: start the real-time per-turn scene timer (seconds reset to 0;
  // first tick fires at seconds=1, so a TimePerk with time:0 never fires — matches Android,
  // where second 0 is the initial display only and is never passed to checkTime).
  m3fStartTurnTimer();
}

// ?scene=NAME (or gameData.scene): fetch scenes/NAME.json (relative to this page) and use
// it as the raw scene (either format). On any error, fall back to gameData/demo. The name
// is sanitized to a bare file stem to avoid path traversal.
function m3fFetchScene() {
  let name = null;
  try { name = new URLSearchParams(window.location.search).get('scene'); } catch (e) {}
  if (!name && gameData && gameData.scene) name = gameData.scene;
  if (!name) return Promise.resolve();
  name = String(name).replace(/[^A-Za-z0-9_-]/g, '');
  if (!name) return Promise.resolve();
  const sub = document.getElementById('subtitle');
  if (sub) sub.textContent = 'Загрузка…';
  return fetch('scenes/' + name + '.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => { m3fSceneOverride = j; })
    .catch(e => { m3fSceneOverride = null; /* fall back to gameData/demo */ });
}

// Path implies the game: fetch any ?scene= file first, then auto-start.
setTimeout(() => { m3fFetchScene().then(initM3F); }, 0);
</script>

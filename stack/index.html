<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Twilights — Башня</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/styles.css">
<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#eee);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;user-select:none;-webkit-user-select:none;}
.wrap{width:100%;max-width:380px;text-align:center;}
.ready-title{font-size:1.45rem;font-weight:700;margin-bottom:8px;}
.ready-info{font-size:0.92rem;color:var(--tg-theme-hint-color,#aaa);margin-bottom:16px;line-height:1.45;}
.hud{display:flex;justify-content:space-around;margin-bottom:12px;padding:8px;background:rgba(255,255,255,0.05);border-radius:12px;}
.hud-item{text-align:center;}
.hud-l{font-size:0.65rem;color:var(--tg-theme-hint-color,#aaa);text-transform:uppercase;}
.hud-v{font-size:1.15rem;font-weight:700;}
.hint{font-size:0.8rem;color:var(--tg-theme-hint-color,#aaa);margin-top:10px;min-height:1.2em;}
.result{display:none;margin-top:14px;}
.result-t{font-size:1.35rem;font-weight:700;margin-bottom:6px;}
.result-s{font-size:0.95rem;color:var(--tg-theme-hint-color,#aaa);}
.play{display:none;}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;}
.chip-btn{padding:12px 18px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:inherit;font-size:1rem;font-weight:700;cursor:pointer;min-width:64px;}
.chip-btn:active{transform:scale(0.96);}
.chip-btn.active{border-color:#00b894;background:rgba(0,184,148,0.2);}
.chip-btn.bad{border-color:#e74c3c;background:rgba(231,76,60,0.2);}
.bar-track{width:100%;height:28px;border-radius:14px;background:rgba(255,255,255,0.08);position:relative;overflow:hidden;margin:12px 0;}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:14px;width:0%;}
.sweet{position:absolute;top:0;bottom:0;background:rgba(0,184,148,0.35);border-left:2px solid #00b894;border-right:2px solid #00b894;}
.field{width:100%;aspect-ratio:1;max-height:360px;border-radius:16px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);position:relative;touch-action:none;overflow:hidden;margin:0 auto;}
.grid{display:grid;gap:6px;width:100%;}
#st{width:100%;height:320px;border-radius:16px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);position:relative;overflow:hidden;}.blk{position:absolute;height:22px;border-radius:6px;background:#6c5ce7;}
</style>
</head>
<body>
<div class="wrap" id="g-wrap">
  <div id="g-ready">
    <div class="ready-title" id="g-title">🏗️ Башня</div>
    <div class="ready-info" id="g-info">Тапни, чтобы сбросить блок. Сложи башню.</div>
    <div class="ready-info" id="g-cond" style="margin-top:6px;font-weight:600;"></div>
    <button class="confirm-btn" onclick="gStart()">Начать</button>
  </div>
  <div class="play" id="g-play">
    <div class="hud" id="g-hud"></div>
    <div id="st"></div><button class="confirm-btn" onclick="drop()">Сброс</button>
    <div class="hint" id="g-hint"></div>
    <div class="result" id="g-result">
      <div class="result-t" id="g-rt"></div>
      <div class="result-s" id="g-rs"></div>
    </div>
  </div>
</div>
<script src="../shared/core.js"></script>
<script>

function tierBy(pct){
  if(pct>=0.9)return {outcome:'Идеально',level:4};
  if(pct>=0.75)return {outcome:'Отлично',level:3};
  if(pct>=0.55)return {outcome:'Хорошо',level:2};
  if(pct>=0.35)return {outcome:'Неплохо',level:1};
  return {outcome:'Слабо',level:0};
}
function showReady(defTitle, defInfo){
  document.getElementById('g-title').textContent=gameData.prompt||defTitle;
  document.getElementById('g-info').textContent=defInfo;
  const goal=Math.max(5,Math.min(15,gameData.goal||8));
  document.getElementById('g-cond').textContent=`🎯 цель ${goal}`;
}
function goPlay(){
  document.getElementById('g-ready').style.display='none';
  document.getElementById('g-play').style.display='block';
}
function finish(game, payload, title, sub){
  const el=document.getElementById('g-result');
  document.getElementById('g-rt').textContent=title;
  document.getElementById('g-rs').textContent=sub;
  el.style.display='block';
  setTimeout(()=>sendResultToBot(Object.assign({game},payload)),800);
}

let S={},RAF;
function gStart(){
  goPlay();
  const goal=Math.max(5,Math.min(15,gameData.goal||8));
  S={goal,stack:[],y:280,w:160,x:80,movX:20,dir:1,curW:160,score:0,done:false,start:Date.now()};
  placeMoving(); RAF=requestAnimationFrame(anim); hud();
}
function hud(){document.getElementById('g-hud').innerHTML=`<div class="hud-item"><div class="hud-l">Этажи</div><div class="hud-v">${S.score}/${S.goal}</div></div>`;}
function placeMoving(){
  const el=document.getElementById('st');
  let m=document.getElementById('mov'); if(m)m.remove();
  m=document.createElement('div'); m.id='mov'; m.className='blk';
  m.style.width=S.curW+'px'; m.style.left=S.movX+'px'; m.style.top=(S.y-24)+'px'; m.style.background='#a29bfe';
  el.appendChild(m);
}
function anim(){ if(S.done)return;
  S.movX+=S.dir*2.4; if(S.movX<=0||S.movX+S.curW>=320)S.dir*=-1;
  const m=document.getElementById('mov'); if(m)m.style.left=S.movX+'px';
  RAF=requestAnimationFrame(anim);
}
function drop(){ if(S.done)return;
  const left=Math.max(S.x,S.movX), right=Math.min(S.x+S.w,S.movX+S.curW);
  const nw=right-left;
  if(nw<12){ end(false); return; }
  S.x=left; S.w=nw; S.curW=nw; S.score++; S.y-=24;
  const b=document.createElement('div'); b.className='blk';
  b.style.width=nw+'px'; b.style.left=left+'px'; b.style.top=S.y+'px';
  document.getElementById('st').appendChild(b);
  document.getElementById('mov')?.remove();
  hud();
  if(S.score>=S.goal){ end(true); return; }
  placeMoving();
}
function end(win){ S.done=true; cancelAnimationFrame(RAF);
  const pct=S.score/S.goal; const t=win?{outcome:'Идеально',level:4}:tierBy(pct);
  finish('stack',{floors:S.score,goal:S.goal,win,outcome:t.outcome,level:t.level,timeSpent:Math.round((Date.now()-S.start)/1000)},t.outcome,S.score+'/'+S.goal);}
showReady('🏗️ Башня','Тапай «Сброс», чтобы класть блоки');

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Twilights — Сражение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #1a1a2e);
    color: var(--tg-theme-text-color, #eee);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 8px; text-align: center; }
  .subtitle { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 16px; text-align: center; }

  /* THRESHOLDS */
  .thresholds-panel { width: 100%; max-width: 360px; margin-bottom: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
  .threshold-chip {
    flex: 1; min-width: 60px; padding: 6px 8px; border-radius: 10px; text-align: center;
    font-size: 0.75rem; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  }
  .threshold-chip .t-range { font-weight: 700; font-size: 0.85rem; display: block; }
  .threshold-chip .t-label { color: var(--tg-theme-hint-color, #aaa); font-size: 0.7rem; }
  .threshold-chip.active { border-color: #00b894; background: rgba(0,184,148,0.18); }
  .threshold-chip.active .t-label { color: #00b894; }

  /* CHOICE */
  #choice-game { width: 100%; max-width: 360px; }
  .choice-prompt { text-align: center; font-size: 1rem; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; line-height: 1.5; }
  .choice-buttons { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s; }
  .choice-btn:hover { border-color: var(--tg-theme-button-color, #6c5ce7); }
  .choice-btn.selected { border-color: #00b894; background: rgba(0,184,148,0.2); }
  .choice-hint { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: rgba(162,155,254,0.12); border: 1px solid rgba(162,155,254,0.3); font-size: 0.9rem; color: #a29bfe; line-height: 1.5; }

  /* BLACKJACK */
  #bj-game { width: 100%; max-width: 360px; }
  .bj-info { display: flex; justify-content: space-between; margin-bottom: 16px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
  .bj-info-item { text-align: center; }
  .bj-info-label { font-size: 0.7rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 2px; }
  .bj-info-val { font-size: 1.3rem; font-weight: bold; }
  .bj-cards { min-height: 60px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card { width: 44px; height: 60px; border-radius: 8px; background: #fff; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.4); line-height: 1.1; }
  .card.red { color: #e74c3c; }
  .bj-section-label { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 6px; }
  .bj-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: var(--tg-theme-button-color, #6c5ce7); color: var(--tg-theme-button-text-color, #fff); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--tg-theme-text-color, #fff); }

  .result-banner { padding: 12px; border-radius: 12px; text-align: center; font-size: 1.1rem; font-weight: bold; margin-top: 12px; display: none; }
  .result-good { background: rgba(0,184,148,0.2); border: 2px solid #00b894; color: #00b894; }
  .result-mid  { background: rgba(255,193,7,0.15); border: 2px solid #ffc107; color: #ffc107; }
  .result-bad  { background: rgba(231,76,60,0.2); border: 2px solid #e74c3c; color: #e74c3c; }

  /* MODIFIERS (toggle/choice) */
  .modifiers-panel { width: 100%; margin-bottom: 14px; }
  .modifiers-label { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 8px; }
  .modifier-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .modifier-name { font-size: 0.85rem; color: var(--tg-theme-text-color, #eee); flex: 1; min-width: 80px; }
  .mod-btn { padding: 6px 14px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); background: transparent; color: var(--tg-theme-hint-color, #aaa); font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.15s; min-width: 48px; text-align: center; }
  .mod-btn:disabled { opacity: 0.35; cursor: default; }
  .mod-btn.active-plus { border-color: #00b894; background: rgba(0,184,148,0.2); color: #00b894; }
  .mod-btn.active-minus { border-color: #e74c3c; background: rgba(231,76,60,0.2); color: #e74c3c; }

  /* FORESIGHT / DISCARD (shared row layout) */
  .foresight-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .foresight-name { font-size: 0.85rem; color: var(--tg-theme-text-color, #eee); flex: 1; min-width: 80px; }
  .foresight-btn {
    padding: 6px 14px; border-radius: 20px; border: 2px solid #a29bfe;
    background: transparent; color: #a29bfe; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .foresight-btn:disabled { opacity: 0.35; cursor: default; }
  .foresight-btn.used { border-color: rgba(255,255,255,0.2); color: var(--tg-theme-hint-color, #aaa); background: transparent; cursor: default; }
  .foresight-hint {
    width: 100%; margin-top: 4px; padding: 8px 12px; border-radius: 10px;
    background: rgba(162,155,254,0.12); border: 1px solid rgba(162,155,254,0.3);
    font-size: 0.9rem; color: #a29bfe; font-weight: 600; text-align: center;
  }
  .discard-btn {
    padding: 6px 14px; border-radius: 20px; border: 2px solid #fd79a8;
    background: transparent; color: #fd79a8; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .discard-btn:disabled { opacity: 0.35; cursor: default; }
  .discard-btn.used { border-color: rgba(255,255,255,0.2); color: var(--tg-theme-hint-color, #aaa); background: transparent; cursor: default; }

  .confirm-btn { width: 100%; margin-top: 20px; padding: 14px; border-radius: 14px; border: none; background: var(--tg-theme-button-color, #6c5ce7); color: var(--tg-theme-button-text-color, #fff); font-size: 1.05rem; font-weight: 700; cursor: pointer; }
  .confirm-btn:disabled { opacity: 0.25; cursor: default; }

  /* TIMING */
  #timing-game { width: 100%; max-width: 360px; text-align: center; }
  .timing-prompt { font-size: 0.95rem; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; line-height: 1.5; }
  .timing-wrap { position: relative; height: 72px; border-radius: 14px; overflow: hidden; margin-bottom: 10px; background: #e74c3c; }
  .timing-zone { position: absolute; top: 0; bottom: 0; }
  .timing-marker { position: absolute; top: 0; bottom: 0; width: 5px; background: #fff; border-radius: 3px; transform: translateX(-50%); box-shadow: 0 0 10px rgba(255,255,255,0.9); pointer-events: none; transition: none; }
  .timing-live-label { font-size: 1rem; font-weight: 700; min-height: 1.4rem; margin-bottom: 6px; text-align: center; transition: color 0.1s; }
  .timing-result-label { font-size: 1.2rem; font-weight: 700; min-height: 1.8rem; margin-bottom: 16px; }
  .timing-stop-btn { padding: 14px; border-radius: 12px; border: none; background: var(--tg-theme-button-color, #6c5ce7); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; }
  .timing-stop-btn:disabled { opacity: 0.4; cursor: default; }

  /* MATCH-3 */
  #match3-game { width: 100%; max-width: 360px; }
  .m3-status { display: flex; justify-content: space-around; margin-bottom: 10px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 12px; }
  .m3-status-item { text-align: center; }
  .m3-status-label { font-size: 0.7rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 2px; }
  .m3-status-val { font-size: 1.3rem; font-weight: bold; }
  .m3-thresholds { font-size: 0.75rem; color: var(--tg-theme-hint-color, #aaa); text-align: center; margin-bottom: 6px; }
  .m3-combo { font-size: 0.95rem; font-weight: 700; text-align: center; min-height: 1.4rem; color: #f1c40f; margin-bottom: 6px; }
  .m3-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 10px; touch-action: none; }
  .m3-cell { aspect-ratio: 1; border-radius: 50%; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; }
  .m3-cell.selected { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 10px rgba(255,255,255,0.5); }
  .m3-cell.removing { transition: transform 0.22s cubic-bezier(0.4,0,1,1), opacity 0.22s ease-in !important; transform: scale(0) !important; opacity: 0 !important; }
  .m3-cell.dead { background: rgba(255,255,255,0.04) !important; cursor: default; }
  .m3-time-bar-wrap { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 8px; overflow: hidden; display: none; }
  .m3-time-bar { height: 100%; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }

  /* SEQUENCE */
  #sequence-game { width: 100%; max-width: 360px; }
  .seq-ready-title { font-size: 1.3rem; font-weight: 700; text-align: center; margin-bottom: 10px; }
  .seq-ready-info { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); text-align: center; margin-bottom: 24px; }
  .seq-progress-wrap { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .seq-progress-bar { height: 100%; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .seq-counter { font-size: 0.8rem; color: var(--tg-theme-hint-color, #aaa); text-align: right; margin-bottom: 8px; }
  .seq-question { font-size: 1.05rem; font-weight: 600; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 14px; line-height: 1.5; text-align: center; }
  #seq-options { display: flex; flex-direction: column; gap: 8px; }
  .seq-opt-btn { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 0.95rem; cursor: pointer; text-align: left; transition: border-color 0.2s, background 0.2s; }
  .seq-opt-btn:disabled { cursor: default; }
  .seq-opt-correct { border-color: #00b894 !important; background: rgba(0,184,148,0.15) !important; }
  .seq-opt-wrong { border-color: #e74c3c !important; background: rgba(231,76,60,0.15) !important; }
  .seq-feedback { margin-top: 10px; font-size: 1rem; font-weight: 700; text-align: center; min-height: 1.4rem; }
  .seq-result-wrap { text-align: center; }
  .seq-result-score { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
  .seq-result-total { font-size: 0.9rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 16px; }
  .seq-result-label { font-size: 1.2rem; font-weight: 700; padding: 12px 20px; border-radius: 12px; display: inline-block; }

  /* COMPARE */
  #compare-game { width: 100%; max-width: 360px; }
  .cmp-timer-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 14px; overflow: hidden; }
  .cmp-timer-fill { height: 100%; background: #00b894; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .cmp-prompt { text-align: center; font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
  .cmp-pair { display: flex; gap: 12px; width: 100%; margin-bottom: 10px; }
  .cmp-card { flex: 1; min-height: 110px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; transition: all 0.15s; line-height: 1.3; }
  .cmp-card:active { transform: scale(0.96); }
  .cmp-card.correct { border-color: #00b894; background: rgba(0,184,148,0.25); }
  .cmp-card.wrong { border-color: #e74c3c; background: rgba(231,76,60,0.2); }
  .cmp-card:disabled { cursor: default; }
  .cmp-progress { text-align: center; font-size: 0.82rem; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 6px; }
  .cmp-feedback { text-align: center; min-height: 1.4rem; font-size: 1.1rem; font-weight: 700; }

  /* MEMORY */
  #memory-game { width: 100%; max-width: 400px; }
  .mem-header { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); margin-bottom: 8px; }
  .mem-grid { display: grid; gap: 5px; margin-bottom: 8px; }
  .mem-card { aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(255,255,255,0.12); background: rgba(108,92,231,0.12); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; user-select: none; -webkit-tap-highlight-color: transparent; transition: background 0.15s, border-color 0.15s; }
  .mem-card.face-down { color: transparent !important; font-size: 0; }
  .mem-card.face-down::after { content: '?'; color: rgba(255,255,255,0.18); font-size: 1rem; }
  .mem-card.matched { border-color: #00b894; background: rgba(0,184,148,0.2); cursor: default; }
  .mem-card.wrong-pair { border-color: #e74c3c; background: rgba(231,76,60,0.18); }
  @keyframes mem-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* ODDONE */
  #oddone-game { width: 100%; max-width: 360px; }
  .oo-grid { display: grid; gap: 8px; margin-bottom: 10px; }
  .oo-cell { aspect-ratio: 1; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; user-select: none; -webkit-tap-highlight-color: transparent; transition: all 0.12s; }
  .oo-cell.correct { border-color: #00b894; background: rgba(0,184,148,0.2); }
  .oo-cell.wrong-tap { border-color: #e74c3c; background: rgba(231,76,60,0.18); animation: mem-shake 0.3s; }

  /* REACTION */
  #reaction-game { width: 100%; max-width: 360px; text-align: center; }
  .rx-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 10px; font-size: 0.85rem; color: var(--tg-theme-hint-color,#aaa); }
  .rx-display { font-size: 4.5rem; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 20px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); margin-bottom: 14px; transition: background 0.1s, border-color 0.1s; }
  .rx-display.rx-target { background: rgba(108,92,231,0.15); border-color: rgba(108,92,231,0.4); }
  .rx-tap-btn { width: 100%; padding: 20px; border-radius: 16px; border: none; background: var(--tg-theme-button-color,#6c5ce7); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
  .rx-tap-btn:active { transform: scale(0.96); }
  .rx-tap-btn:disabled { opacity: 0.4; cursor: default; }

  /* SORTING */
  #sorting-game { width: 100%; max-width: 360px; }
  .sort-round-label { font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); text-align: center; margin-bottom: 8px; }
  .sort-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .sort-item { padding: 12px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color,#fff); cursor: pointer; text-align: left; font-size: 1rem; display: flex; align-items: center; gap: 10px; user-select: none; -webkit-tap-highlight-color: transparent; transition: all 0.15s; }
  .sort-item.selected { border-color: #00b894; background: rgba(0,184,148,0.15); cursor: default; }
  .sort-badge { width: 24px; height: 24px; border-radius: 50%; background: #00b894; color: #fff; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; visibility: hidden; }

  /* ESTIMATE */
  #estimate-game { width: 100%; max-width: 360px; text-align: center; }
  .est-round-label { font-size: 0.82rem; color: var(--tg-theme-hint-color,#aaa); margin-bottom: 8px; text-align: center; }
  .est-display { width: 100%; height: 150px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); margin-bottom: 14px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: rgba(255,255,255,0.2); }
  .est-dot-el { position: absolute; font-size: 1.2rem; line-height: 1; color: var(--tg-theme-text-color,#fff); }
  .est-slider-wrap { margin-bottom: 12px; }
  .est-slider { width: 100%; accent-color: var(--tg-theme-button-color,#6c5ce7); }
  .est-slider-val { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }

  /* FINDALL */
  #findall-game { width: 100%; max-width: 400px; }
  .fa-timer-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
  .fa-timer-fill { height: 100%; background: #00b894; border-radius: 3px; transition: width 0.1s linear, background 0.3s; }
  .fa-target-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .fa-target-label { font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }
  .fa-target-val { font-size: 2rem; padding: 6px 14px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); }
  .fa-grid { display: grid; gap: 5px; margin-bottom: 10px; }
  .fa-cell { aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--tg-theme-text-color, #fff); font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.12s, background 0.12s; -webkit-tap-highlight-color: transparent; user-select: none; }
  .fa-cell:active:not([disabled]) { transform: scale(0.88); }
  .fa-cell.found { border-color: #00b894; background: rgba(0,184,148,0.3); cursor: default; }
  .fa-cell.wrong { border-color: #e74c3c; background: rgba(231,76,60,0.25); cursor: default; animation: fa-shake 0.25s; }
  .fa-cell[disabled] { cursor: default; }
  @keyframes fa-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-3px)} 75%{transform:translateX(3px)} }
  .fa-progress { text-align: center; font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }

  /* COMBAT */
  #combat-game { width: 100%; max-width: 400px; }
  .combat-enemies { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .combat-enemy { padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1); }
  .combat-enemy.dead { opacity: 0.35; }
  .combat-enemy-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .combat-enemy-name { font-weight: 700; font-size: 1rem; }
  .combat-enemy-hp-text { font-size: 0.85rem; color: var(--tg-theme-hint-color, #aaa); }
  .combat-hp-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 8px; }
  .combat-hp-fill { height: 100%; border-radius: 4px; background: #e74c3c; transition: width 0.4s; }
  .combat-enemy-vals { display: flex; gap: 16px; margin-bottom: 8px; font-size: 0.95rem; }
  .combat-val-def { color: #74b9ff; font-weight: 700; }
  .combat-val-atk { color: #ff7675; font-weight: 700; }
  .combat-atk-slot { flex: 1 1 calc(50% - 3px); box-sizing: border-box; padding: 7px 10px; border-radius: 8px; border: 1.5px dashed rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.83rem; color: var(--tg-theme-hint-color, #aaa); transition: all 0.15s; }
  .combat-atk-slot:hover { border-color: rgba(255,255,255,0.4); }
  .combat-atk-slot.has-die { border-style: solid; border-color: #e74c3c; background: rgba(231,76,60,0.1); color: var(--tg-theme-text-color, #fff); }
  .combat-damage-2 { color: #fdcb6e; font-weight: 700; }
  .combat-damage-1 { color: #a29bfe; font-weight: 700; }
  .combat-damage-0 { color: #636e72; font-weight: 700; text-decoration: line-through; }
  .combat-enemy-slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

  </div>

<div id="combat-game" style="display:none">
  <div id="combat-prompt" class="subtitle" style="margin-bottom:12px;text-align:left;font-size:0.88rem;padding:10px 12px;background:rgba(255,255,255,0.05);border-radius:10px;line-height:1.5;display:none"></div>
  <div id="combat-round-label" class="combat-round-label"></div>
  <div id="combat-timer" class="combat-timer" style="display:none"></div>

  <div id="combat-supports" class="combat-enemies"></div>

  <div id="combat-mods" class="combat-mods"></div>

  <div id="combat-summary-banner" class="result-banner"></div>
  <div id="combat-summary-stats" class="combat-round-label"></div>
  <div class="combat-section-label">📜 Лог боя</div>
  <div id="combat-summary-log" class="combat-log"></div>
  <button class="confirm-btn" onclick="combatFinish()">Завершить</button>
</div>

<script src="../shared/core.js"></script>
<script>
const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
const JOKER = 0;  // вайлд-грань: подходит под любое требование, даёт максимум
function dieFace(v) { return v === JOKER ? '🃏' : DICE_FACES[v - 1]; }
let combatState = null, combatSelectedDie = null;
let combatMergePending = null, combatMergeAbilityIdx = null;
let combatResult = null;

function combatPRNG(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 0x100000000; };
}

// Требование слота: {type:'exact'|'any'|'odd'|'even'|'gt'|'lt', value?}
function parseReq(spec) {
  if (spec && typeof spec === 'object') return spec;
  const t = String(spec ?? '').trim().toLowerCase();
  if (t === 'any' || t === 'любой' || t === '*') return {type: 'any'};
  if (t === 'odd' || t === 'нечёт' || t === 'нечет') return {type: 'odd'};
  if (t === 'even' || t === 'чёт' || t === 'чет') return {type: 'even'};
  let m;
  if ((m = t.match(/^>\s*(\d)/))) return {type: 'gt', value: +m[1]};
  if ((m = t.match(/^<\s*(\d)/))) return {type: 'lt', value: +m[1]};
  if ((m = t.match(/^(\d)$/))) return {type: 'exact', value: +m[1]};
  return {type: 'exact', value: Math.max(1, Math.min(6, parseInt(t) || 1))};
}
function reqKey(req) { return req.type + (req.value ?? ''); }
function reqLabel(req) {
  switch (req.type) {
    case 'exact': return `${req.value}`;
    case 'any': return 'любой';
    case 'odd': return 'нечёт';
    case 'even': return 'чёт';
    case 'gt': return `> ${req.value}`;
    case 'lt': return `< ${req.value}`;
  }
  return '?';
}
function reqMet(die, req) {
  if (die === JOKER) return true;  // джокер подходит под любое
  switch (req.type) {
    case 'exact': return die === req.value;
    case 'any': return true;
    case 'odd': return die % 2 === 1;
    case 'even': return die % 2 === 0;
    case 'gt': return die > req.value;
    case 'lt': return die < req.value;
  }
  return false;
}
// Урон по слоту поражения: точный — 2/1/0 (нюанс ±1), остальные — бинарно 2/0; джокер — максимум
function calcDefeatDamage(die, req) {
  if (die === JOKER) return 2;
  if (req.type === 'exact') { const d = Math.abs(die - req.value); return d === 0 ? 2 : d === 1 ? 1 : 0; }
  return reqMet(die, req) ? 2 : 0;
}
// Поглощение блоком: точный — 0/1/2 (нюанс ±1), остальные — бинарно 0/2; джокер — чистый блок
function calcBlockTaken(die, req) {
  if (die === JOKER) return 0;
  if (req.type === 'exact') { const d = Math.abs(die - req.value); return d === 0 ? 0 : d === 1 ? 1 : 2; }
  return reqMet(die, req) ? 0 : 2;
}
// Случайное значение для заданного типа требования
function rollReqOfType(type, pool, rng) {
  if (type === 'odd') return {type: 'odd'};
  if (type === 'even') return {type: 'even'};
  if (type === 'any') return {type: 'any'};
  if (type === 'gt') return {type: 'gt', value: 1 + Math.floor(rng() * 5)};   // >1..>5
  if (type === 'lt') return {type: 'lt', value: 2 + Math.floor(rng() * 5)};   // <2..<6
  return {type: 'exact', value: pool[Math.floor(rng() * pool.length)]};
}
// Случайное требование из пула значений и набора типов; avoid — не повторять (для «разных» слотов)
function genReq(pool, types, rng, avoid) {
  for (let tries = 0; tries < 24; tries++) {
    const req = rollReqOfType(types[Math.floor(rng() * types.length)], pool, rng);
    if (!avoid || reqKey(req) !== reqKey(avoid)) return req;
  }
  return rollReqOfType('exact', pool, rng);
}
// Особенность врага: {kind:'dodge', chance} или {kind:'charge'}. Шанс уклонения через '=' (dodge=0.2 или dodge=20)
function parseSpecial(spec) {
  if (!spec) return null;
  if (typeof spec === 'object') return spec;
  const s = String(spec).trim().toLowerCase();
  if (s.startsWith('dodge') || s.startsWith('уклон')) {
    let chance = 0.15;
    const m = s.match(/[=:]\s*([\d.]+)\s*%?/);
    if (m) { let v = parseFloat(m[1]); chance = v > 1 ? v / 100 : v; }
    return {kind: 'dodge', chance};
  }
  if (s.startsWith('charge') || s.startsWith('заряд')) return {kind: 'charge'};
  return null;
}
// Деривация требования на новый раунд по режиму keep: always — то же; type — тот же тип, новое значение; random — всё заново
function deriveReq(base, keep, pool, types, rng, avoid) {
  if (keep === 'always') return {...base};
  for (let tries = 0; tries < 24; tries++) {
    const req = keep === 'random' ? genReq(pool, types, rng, null) : rollReqOfType(base.type, pool, rng);
    if (!avoid || reqKey(req) !== reqKey(avoid)) return req;
  }
  return {...base};
}

// Каталог способностей героя. target=true → нужен выбранный кубик; pair=true → нужен второй кубик (слить).
const ABILITY_CATALOG = {
  extra_die: {icon: '🎲', name: 'Доп. кубик', target: false},
  flip:      {icon: '🔄', name: 'Переворот',  target: true},
  set:       {icon: '🎯', name: 'Грань',      target: true},
  split:     {icon: '✂️', name: 'Сплит',      target: true},
  save:      {icon: '💾', name: 'Сохранить',  target: true},
  merge:     {icon: '➕', name: 'Слить',       target: true, pair: true},
};

// Парсинг конфигурации способностей: массив строк ("set=4:2:1") или объектов ({id,uses,cooldown,value})
function parseAbilities(raw) {
  if (!Array.isArray(raw)) return [];
  const out = [];
  raw.forEach(a => {
    let id, uses = 1, cooldown = 0, value = null;
    if (a && typeof a === 'object') {
      id = a.id; uses = a.uses ?? 1; cooldown = a.cooldown ?? 0; value = a.value ?? null;
    } else {
      const m = String(a).trim().match(/^([a-z_]+)(?:=(\d+))?(?::(\d+))?(?::(\d+))?$/i);
      if (!m) return;
      id = m[1].toLowerCase();
      if (m[2] != null) value = +m[2];
      if (m[3] != null) uses = +m[3];
      if (m[4] != null) cooldown = +m[4];
    }
    if (!ABILITY_CATALOG[id]) return;
    if (id === 'set' && value == null) value = 4;
    if (id === 'set') value = Math.max(1, Math.min(6, value));
    out.push({
      id, uses, cooldown, value,
      usesLeft: uses === 0 ? Infinity : uses,  // uses=0 → безлимит
      availableRound: 1,
    });
  });
  return out;
}

// Грань из спеки: число 1–6 или 'joker'/'j'/'*' → JOKER
function parseFace(x) {
  const t = String(x).trim().toLowerCase();
  if (t === 'joker' || t === 'j' || t === '🃏' || t === '*') return JOKER;
  const n = parseInt(t);
  return (n >= 1 && n <= 6) ? n : null;
}

// Кастомные грани по конкретным кубам (только базовые). Массив наборов: dice_faces[i] = [грани] или null
function parseDiceFaces(raw) {
  if (!Array.isArray(raw)) return null;
  return raw.map(set => {
    if (!Array.isArray(set) || !set.length) return null;
    const faces = set.map(parseFace).filter(f => f !== null);
    return faces.length ? faces : null;
  });
}

// Источники-«обстрел»: неубиваемые, одна атака (блок-слот), 1 урон, без особенностей
function parseSupports(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(x => {
    if (x && typeof x === 'object') return {name: x.name || 'Обстрел', blockSpec: x.block != null ? parseReq(x.block) : null};
    const t = String(x).trim();
    const ci = t.indexOf(':');
    const name = (ci >= 0 ? t.slice(0, ci) : t).trim() || 'Обстрел';
    const reqStr = ci >= 0 ? t.slice(ci + 1).trim() : '';
    return {name, blockSpec: reqStr ? parseReq(reqStr) : null};
  });
}

function initCombat() {
  document.getElementById('subtitle').textContent = '⚔️ Сражение';
  const raw = (gameData.enemies || [{name:'Противник', hp:3, danger:2}]).slice(0, 4);
  // Пул значений для случайных «точных» требований (по умолчанию 1–6, можно сузить)
  const slotPool = (Array.isArray(gameData.slot_pool) && gameData.slot_pool.length) ? gameData.slot_pool : [1,2,3,4,5,6];
  // Набор типов требований для случайной генерации (по умолчанию только точные = как раньше)
  const slotTypes = (Array.isArray(gameData.slot_types) && gameData.slot_types.length) ? gameData.slot_types : ['exact'];
  const enemies = raw.map(e => ({
    ...e, max_hp: e.max_hp ?? e.hp,
    // явные спеки слотов (фиксированы на бой) либо null → генерим случайно каждый раунд
    defeatSpec: Array.isArray(e.defeat) ? e.defeat.map(parseReq) : null,
    blockSpec: Array.isArray(e.block) ? e.block.map(parseReq) : (e.block != null ? [parseReq(e.block)] : null),
    // число атак за раунд (опционально): по умолч. 1 (или сколько задано блок-слотов)
    attacks: Math.max(1, e.attacks ?? (Array.isArray(e.block) ? e.block.length : 1)),
    // особенность врага (опционально) + требование слота нейтрализации (по умолч. любой куб)
    special: parseSpecial(e.special),
    specialReq: e.special_req != null ? parseReq(e.special_req) : {type: 'any'},
    charged: false,              // заряжен на ТЕКУЩИЙ раунд (даёт +1 атаку)
    defeatSlots: [], blockReqs: [],
  }));
  const playerHp = Math.min(5, gameData.player_hp ?? 3);
  combatState = {
    enemies, playerHp, maxPlayerHp: playerHp,
    slotPool, slotTypes,
    // keep: always — слоты держатся весь бой; type — тип держится, значение меняется; random — всё меняется
    keep: ['always', 'type', 'random'].includes(gameData.keep) ? gameData.keep : 'type',
    round: 1, maxRounds: gameData.max_rounds ?? 3,
    dice: [], diceCount: 4,
    // Движение — хаотичная карта, по дефолту включена; пара значений −3..+3 меняется каждый раунд
    movement: gameData.movement !== false, movementPair: [0, 0], movementUsed: false,
    // Контрол ±1 — стабильный, опциональный (мастер включает через control или card_name)
    control: !!(gameData.control || gameData.card_name), controlUsed: false,
    cardName: gameData.card_name || null,
    hasReroll: !!(gameData.reroll || gameData.reroll_name), rerollUsed: false,
    rerollName: gameData.reroll_name || null,
    // Способности героя (опц.) + кубики, отложенные на следующий раунд (💾 Сохранить)
    abilities: parseAbilities(gameData.abilities), savedDice: [],
    // Кастомные грани по конкретным базовым кубам (опц.); источники-«обстрел» (опц.)
    diceFaces: parseDiceFaces(gameData.dice_faces),
    supports: parseSupports(gameData.support),
    // Счётчик заряда 0/N (опц.): копится, при заполнении даёт куб-джокер
    counter: gameData.counter ? {n: gameData.counter, value: 0} : null,
    // Лимит времени на раунд в секундах (опц., по умолч. выкл) — для подстёгивания
    roundTime: Math.max(0, parseInt(gameData.round_time) || 0),
    timer: null, timeLeft: 0,
    assignments: {}, roundLogs: [],
    rng: combatPRNG(gameData.seed || 42), done: false,
  };
  if (gameData.prompt) {
    const pe = document.getElementById('combat-prompt');
    pe.textContent = gameData.prompt; pe.style.display = '';
  }
  combatShowReady();
}

function combatShowReady() {
  const s = combatState;
  const enemyNames = s.enemies.map(e => `${e.name} (${e.max_hp}❤️)`).join(', ');
  const tools = [];
  if (s.movement) tools.push('🏃 Движение — раз в раунд сдвинуть кубик на случайную дельту (нужно ПОПАСТЬ в число, а не выжать максимум)');
  if (s.control) tools.push(`${s.cardName ? '✨ ' + s.cardName : '✏️ ±1'} — раз в раунд сдвинуть кубик на ±1`);
  if (s.hasReroll) tools.push(`${s.rerollName ? '✨ ' + s.rerollName : '🔄 Переброс'} — перебросить кубик (раз в бой)`);
  s.abilities.forEach(ab => {
    const m = ABILITY_CATALOG[ab.id];
    if (m) tools.push(`${m.icon} ${m.name}${ab.id === 'set' ? ' ' + ab.value : ''}`);
  });
  if (s.counter) tools.push(`🔢 Счётчик ${s.counter.n} — копи (скинь кубик / повергни не раненного), заполнишь → кубик-джокер 🃏`);
  const extras = [];
  if (s.supports.length) extras.push(`🏹 Обстрел: ${s.supports.map(x => x.name).join(', ')} — по 1 урону, только блокируются`);
  if (s.diceFaces && s.diceFaces.some(f => f && f.length)) extras.push('🎲 У части твоих кубиков особые грани (возможен 🃏 джокер)');

  let html = `
    <div class="ready-sec"><b>Противник</b>${enemyNames}${s.supports.length ? ' · ' + s.supports.length + ' обстрел' : ''}</div>
    <div class="ready-sec"><b>Как играть</b>
      <ul>
        <li>Бросаешь кубики и распределяешь их: <b>⚔️</b> в слоты поражения врага, <b>🛡</b> на его атаки.</li>
        <li>Чтобы повергнуть врага — закрой <b>оба</b> слота поражения (макс 2 урона с кубика).</li>
        <li>Точный слот: ровно = 2, ±1 = 1, мимо = 0. Прочие (любой/чёт/нечёт/&gt;/&lt;) — бинарны.</li>
        <li>Непокрытая атака врага = <b>2 урона</b>, обстрел = <b>1 урон</b>.</li>
        <li>Чистая оборона (только блоки, без урона) → <b>+1 кубик</b> в следующем раунде.</li>
      </ul>
    </div>
    <div class="ready-sec"><b>Твои силы</b>Герой: ${s.maxPlayerHp}❤️ · раундов: ${s.maxRounds}${s.roundTime ? ` · ⏱ ${s.roundTime} с/раунд` : ''}
      ${tools.length ? '<ul>' + tools.map(t => `<li>${t}</li>`).join('') + '</ul>' : ''}
    </div>`;
  if (extras.length) html += `<div class="ready-sec"><b>Особое</b><ul>${extras.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
  if (s.roundTime) html += `<div class="ready-sec" style="color:#ff5a5a"><b>⏱ Лимит времени</b>${s.roundTime} с на раунд. Не успел распределить — раунд разыграется как есть (непокрытое = урон).</div>`;

  document.getElementById('combat-ready-rules').innerHTML = html;
  document.getElementById('combat-ready').style.display = '';
}

function combatBegin() {
  document.getElementById('combat-ready').style.display = 'none';
  document.getElementById('combat-game').style.display = '';
  combatStartRound();
}

function combatClearTimer() {
  if (combatState && combatState.timer) { clearInterval(combatState.timer); combatState.timer = null; }
}

function combatStartTimer() {
  const s = combatState;
  const el = document.getElementById('combat-timer');
  combatClearTimer();
  if (!s.roundTime || s.done) { el.style.display = 'none'; return; }
  s.timeLeft = s.roundTime;
  el.style.display = '';
  const upd = () => { el.textContent = `⏱ ${s.timeLeft} с`; el.className = 'combat-timer' + (s.timeLeft <= 3 ? ' combat-timer-low' : ''); };
  upd();
  s.timer = setInterval(() => {
    s.timeLeft--;
    if (s.timeLeft <= 0) { combatClearTimer(); el.textContent = '⏱ время вышло!'; combatResolve(); return; }
    upd();
  }, 1000);
}

function combatRollEnemies() {
  const s = combatState;
  s.enemies.forEach(e => {
    if (e.hp <= 0) { e.defeatSlots = []; e.blockReqs = []; return; }
    // База задаётся один раз (раунд 1): явная спека или случайная пара «разных» слотов
    if (!e.defeatBase) {
      if (e.defeatSpec) {
        e.defeatBase = e.defeatSpec.map(r => ({...r}));
      } else {
        const r0 = genReq(s.slotPool, s.slotTypes, s.rng, null);
        const r1 = genReq(s.slotPool, s.slotTypes, s.rng, r0);
        e.defeatBase = [r0, r1];
      }
      e.blockBase = e.blockSpec ? e.blockSpec.map(r => ({...r})) : [];
    }
    // эффективное число атак с учётом заряда (заряд даёт +1 атаку на этот раунд)
    const eff = e.attacks + (e.charged ? 1 : 0);
    while (e.blockBase.length < eff) e.blockBase.push(genReq(s.slotPool, s.slotTypes, s.rng, null));
    // На текущий раунд — по режиму keep (слоты поражения держим «разными»)
    const d0 = deriveReq(e.defeatBase[0], s.keep, s.slotPool, s.slotTypes, s.rng, null);
    const d1 = deriveReq(e.defeatBase[1], s.keep, s.slotPool, s.slotTypes, s.rng, d0);
    e.defeatSlots = [d0, d1];
    e.blockReqs = [];
    for (let i = 0; i < eff; i++) e.blockReqs.push(deriveReq(e.blockBase[i], s.keep, s.slotPool, s.slotTypes, s.rng, null));
  });
}

// Источники-«обстрел»: каждый — одна атака (блок-слот) с требованием по keep
function combatRollSupports() {
  const s = combatState;
  s.supports.forEach(sp => {
    if (!sp.blockBase) sp.blockBase = sp.blockSpec ? {...sp.blockSpec} : genReq(s.slotPool, s.slotTypes, s.rng, null);
    sp.blockReq = deriveReq(sp.blockBase, s.keep, s.slotPool, s.slotTypes, s.rng, null);
  });
}

// Бросок базового кубика i: кастомные грани (если заданы) либо обычные 1–6
function combatRollDie(i) {
  const f = combatState.diceFaces && combatState.diceFaces[i];
  if (f && f.length) return f[Math.floor(combatState.rng() * f.length)];
  return Math.floor(combatState.rng() * 6) + 1;
}

function combatStartRound() {
  if (combatState.done) return;
  combatRollEnemies();
  combatRollSupports();
  combatState.enemies.forEach(e => e.hpAtStart = e.hp);  // для счётчика: «убил НЕ раненного»
  combatState.dice = Array.from({length: combatState.diceCount}, (_, i) => combatRollDie(i));
  // Отложенные кубики (💾) возвращаются в пул этого раунда
  if (combatState.savedDice.length) { combatState.dice.push(...combatState.savedDice); combatState.savedDice = []; }
  combatState.assignments = {};
  combatState.controlUsed = false;
  combatRollMovement();
  combatSelectedDie = null;
  combatMergePending = null; combatMergeAbilityIdx = null;
  combatState.abilityLog = [];
  document.getElementById('combat-log').innerHTML = '';
  combatRender();
  combatStartTimer();
}

function combatRender() {
  const s = combatState;

  document.getElementById('combat-round-label').textContent = `Раунд ${s.round} / ${s.maxRounds}`;

  const enemiesEl = document.getElementById('combat-enemies');
  enemiesEl.innerHTML = '';
  s.enemies.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'combat-enemy' + (e.hp <= 0 ? ' dead' : '');
    const pct = Math.max(0, e.hp / e.max_hp * 100);

    let atkSlotHtml = '', blkSlotHtml = '';
    if (e.hp > 0) {
      // Оба слота поражения видны сразу, у каждого своё требование
      e.defeatSlots.forEach((req, si) => {
        const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'attack' && a.enemyIndex === i && a.slotIndex === si);
        if (entry) {
          const dv = s.dice[+entry[0]];
          const dmg = calcDefeatDamage(dv, req);
          const dmgClass = dmg === 2 ? 'combat-damage-2' : dmg === 1 ? 'combat-damage-1' : 'combat-damage-0';
          const dmgText = dmg === 2 ? '2 урона!' : dmg === 1 ? '1 урон' : 'промах';
          atkSlotHtml += `<div class="combat-atk-slot has-die" onclick="combatUnassignDie(${+entry[0]})">${dieFace(dv)} <span class="${dmgClass}">→ ${dmgText}</span> <span style="margin-left:auto;opacity:0.5;font-size:0.7rem">✕</span></div>`;
        } else {
          atkSlotHtml += `<div class="combat-atk-slot" onclick="combatAssignAttack(${i},${si})">🗡 Удар — <span class="combat-val-def">${reqLabel(req)}</span></div>`;
        }
      });
      // Слоты блока: по одному на каждую атаку врага (две атаки → два слота)
      e.blockReqs.forEach((req, bi) => {
        const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'block' && a.enemyIndex === i && a.slotIndex === bi);
        if (entry) {
          const dv = s.dice[+entry[0]];
          const taken = calcBlockTaken(dv, req);
          const blkClass = taken === 0 ? 'combat-block-0' : taken === 1 ? 'combat-block-1' : 'combat-block-full';
          const blkText = taken === 0 ? 'блок!' : taken === 1 ? '1 урон' : '2 урона';
          blkSlotHtml += `<div class="combat-blk-slot has-die" onclick="combatUnassignBlk(${i},${bi})">${dieFace(dv)} <span class="${blkClass}">→ ${blkText}</span> <span style="margin-left:auto;opacity:0.5;font-size:0.7rem">✕</span></div>`;
        } else {
          blkSlotHtml += `<div class="combat-blk-slot" onclick="combatAssignBlock(${i},${bi})">🛡 Блок — <span class="combat-val-atk">${reqLabel(req)}</span></div>`;
        }
      });
      // Слот «Особенность» (опциональный): уклонение / заряд — нейтрализуется кубом
      if (e.special) {
        const spEntry = Object.entries(s.assignments).find(([_, a]) => a.type === 'special' && a.enemyIndex === i);
        const spName = e.special.kind === 'dodge' ? `🌀 Уклонение ${Math.round(e.special.chance*100)}%` : '⚡ Заряд';
        if (spEntry) {
          const dv = s.dice[+spEntry[0]];
          const ok = reqMet(dv, e.specialReq);
          const cls = ok ? 'combat-block-0' : 'combat-block-full';
          const txt = ok ? 'нейтрализовано' : 'не подходит';
          blkSlotHtml += `<div class="combat-blk-slot has-die" onclick="combatUnassignSpecial(${i})">${dieFace(dv)} <span class="${cls}">→ ${txt}</span> <span style="margin-left:auto;opacity:0.5;font-size:0.7rem">✕</span></div>`;
        } else {
          blkSlotHtml += `<div class="combat-blk-slot" onclick="combatAssignSpecial(${i})">✨ ${spName} — <span class="combat-val-atk">снять: ${reqLabel(e.specialReq)}</span></div>`;
        }
      }
    }

    div.innerHTML = `
      <div class="combat-enemy-header">
        <span class="combat-enemy-name">${e.hp<=0?'💀 ':''}${e.name}</span>
        <span class="combat-enemy-hp-text">${Math.max(0,e.hp)}/${e.max_hp}❤️</span>
      </div>
      <div class="combat-hp-bar"><div class="combat-hp-fill" style="width:${pct}%"></div></div>
      ${e.hp > 0 ? `<div class="combat-enemy-slots">${atkSlotHtml}${blkSlotHtml}</div>` : ''}`;
    enemiesEl.appendChild(div);
  });

  // Источники-«обстрел»: неубиваемые, только слот блока (их атака, 1 урон)
  const supEl = document.getElementById('combat-supports');
  supEl.innerHTML = '';
  s.supports.forEach((sp, si) => {
    const div = document.createElement('div');
    div.className = 'combat-enemy';
    const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'sblock' && a.supportIndex === si);
    let slot;
    if (entry) {
      const dv = s.dice[+entry[0]];
      const blocked = reqMet(dv, sp.blockReq);
      const cls = blocked ? 'combat-block-0' : 'combat-block-full';
      const txt = blocked ? 'блок!' : '1 урон';
      slot = `<div class="combat-blk-slot has-die" onclick="combatUnassignSBlock(${si})">${dieFace(dv)} <span class="${cls}">→ ${txt}</span> <span style="margin-left:auto;opacity:0.5;font-size:0.7rem">✕</span></div>`;
    } else {
      slot = `<div class="combat-blk-slot" onclick="combatAssignSBlock(${si})">🛡 Блок — <span class="combat-val-atk">${reqLabel(sp.blockReq)}</span></div>`;
    }
    div.innerHTML = `
      <div class="combat-enemy-header">
        <span class="combat-enemy-name">🏹 ${sp.name}</span>
        <span class="combat-enemy-hp-text">обстрел · 1 урон</span>
      </div>
      <div class="combat-enemy-slots">${slot}</div>`;
    supEl.appendChild(div);
  });

  const diceEl = document.getElementById('combat-dice-row');
  diceEl.innerHTML = '';
  s.dice.forEach((val, i) => {
    const used = i in s.assignments;
    const div = document.createElement('div');
    div.className = 'combat-die' + (used ? ' used' : '') + ((combatSelectedDie === i || combatMergePending === i) ? ' selected' : '');
    div.textContent = dieFace(val);
    div.onclick = () => {
      if (used) return;
      if (combatMergePending !== null) {
        if (i === combatMergePending) { combatMergePending = null; combatMergeAbilityIdx = null; combatRender(); return; }
        combatDoMerge(combatMergePending, i); return;
      }
      combatSelectedDie = combatSelectedDie === i ? null : i; combatRender();
    };
    diceEl.appendChild(div);
  });

  const canMod = combatSelectedDie !== null && !(combatSelectedDie in s.assignments);
  const modsEl = document.getElementById('combat-mods');
  let modsHtml = '';
  if (s.movement) {
    const mvLabel = '🏃 Движение';
    const mvHint = `<span class="combat-mod-hint">(случайно, раз в раунд)</span>`;
    const fmt = d => d > 0 ? `+${d}` : `${d}`;
    if (s.movementUsed) {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${mvLabel}</span>${mvHint}<span class="combat-mod-used">использовано</span></div>`;
    } else if (canMod) {
      const [a, b] = s.movementPair;
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${mvLabel}</span>${mvHint}<button class="combat-card-btn" onclick="combatApplyMovement(${a})">${fmt(a)}</button><button class="combat-card-btn" onclick="combatApplyMovement(${b})">${fmt(b)}</button></div>`;
    } else {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${mvLabel}</span>${mvHint}<span class="combat-mod-hint">выбери кубик</span></div>`;
    }
  }
  if (s.control) {
    const cardLabel = s.cardName ? `✨ ${s.cardName}` : '✏️ ±1';
    const cardHint = `<span class="combat-mod-hint">(±1, раз в раунд)</span>`;
    if (s.controlUsed) {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${cardLabel}</span>${cardHint}<span class="combat-mod-used">использован</span></div>`;
    } else if (canMod) {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${cardLabel}</span>${cardHint}<button class="combat-card-btn" onclick="combatApplyCard(1)">+1</button><button class="combat-card-btn" onclick="combatApplyCard(-1)">−1</button></div>`;
    } else {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${cardLabel}</span>${cardHint}<span class="combat-mod-hint">выбери кубик</span></div>`;
    }
  }
  if (s.hasReroll) {
    const rerollLabel = s.rerollName ? `✨ ${s.rerollName}` : '🔄 Переброс';
    const rerollHint = `<span class="combat-mod-hint">(переброс, раз в бой)</span>`;
    if (s.rerollUsed) {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${rerollLabel}</span>${rerollHint}<span class="combat-mod-used">использован</span></div>`;
    } else if (canMod) {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${rerollLabel}</span>${rerollHint}<button class="combat-card-btn" onclick="combatReroll()">Использовать</button></div>`;
    } else {
      modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${rerollLabel}</span>${rerollHint}<span class="combat-mod-hint">выбери кубик</span></div>`;
    }
  }
  const freeDice = s.dice.length - Object.keys(s.assignments).length;
  s.abilities.forEach((ab, idx) => {
    const meta = ABILITY_CATALOG[ab.id];
    const label = `${meta.icon} ${meta.name}${ab.id === 'set' ? ' ' + ab.value : ''}`;
    const budget = ab.usesLeft === Infinity ? '∞' : `×${ab.usesLeft}`;
    const cd = ab.cooldown > 0 ? `, перез. ${ab.cooldown}` : '';
    const hint = `<span class="combat-mod-hint">(${budget}${cd})</span>`;
    let ctrl;
    if (ab.usesLeft <= 0) ctrl = `<span class="combat-mod-used">израсходовано</span>`;
    else if (s.round < ab.availableRound) ctrl = `<span class="combat-mod-used">перезарядка</span>`;
    else if (combatMergePending !== null && combatMergeAbilityIdx === idx) ctrl = `<span class="combat-mod-hint">выбери второй кубик</span>`;
    else if (meta.pair && freeDice < 2) ctrl = `<span class="combat-mod-hint">нужно 2 кубика</span>`;
    else if (meta.target && !canMod) ctrl = `<span class="combat-mod-hint">выбери кубик</span>`;
    else ctrl = `<button class="combat-card-btn" onclick="combatUseAbility(${idx})">Использовать</button>`;
    modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${label}</span>${hint}${ctrl}</div>`;
  });
  if (s.counter) {
    const c = s.counter;
    const cLabel = `🔢 Счётчик ${c.value}/${c.n}`;
    const cHint = `<span class="combat-mod-hint">(скинь куб / повергни не раненного)</span>`;
    let cCtrl = '';
    if (c.value >= c.n) cCtrl = `<button class="combat-card-btn" onclick="combatUseCounter()">🃏 Кубик-джокер</button>`;
    else if (canMod) cCtrl = `<button class="combat-card-btn" onclick="combatDepositDie()">Скинуть куб +1</button>`;
    else cCtrl = `<span class="combat-mod-hint">выбери кубик чтобы скинуть</span>`;
    modsHtml += `<div class="combat-mod-row"><span class="combat-mod-label">${cLabel}</span>${cHint}${cCtrl}</div>`;
  }
  modsEl.innerHTML = modsHtml;

  document.getElementById('combat-confirm').disabled = Object.keys(s.assignments).length === 0;
  const hearts = '❤️'.repeat(Math.max(0, s.playerHp)) + '🖤'.repeat(Math.max(0, s.maxPlayerHp - s.playerHp));
  document.getElementById('combat-player-hp').textContent = `Герой: ${hearts}`;
}

function combatAssignAttack(ei, si) {
  if (combatSelectedDie === null) return;
  const s = combatState;
  // один куб на слот: если слот занят — освобождаем
  const occupied = Object.entries(s.assignments).find(([_, a]) => a.type === 'attack' && a.enemyIndex === ei && a.slotIndex === si);
  if (occupied) delete s.assignments[+occupied[0]];
  delete s.assignments[combatSelectedDie];
  s.assignments[combatSelectedDie] = {type: 'attack', enemyIndex: ei, slotIndex: si};
  combatSelectedDie = null; combatRender();
}

function combatUnassignDie(di) {
  delete combatState.assignments[di];
  combatRender();
}

function combatAssignBlock(ei, bi) {
  if (combatSelectedDie === null) return;
  const s = combatState;
  const occupied = Object.entries(s.assignments).find(([_, a]) => a.type === 'block' && a.enemyIndex === ei && a.slotIndex === bi);
  if (occupied) delete s.assignments[+occupied[0]];
  delete s.assignments[combatSelectedDie];
  s.assignments[combatSelectedDie] = {type: 'block', enemyIndex: ei, slotIndex: bi};
  combatSelectedDie = null; combatRender();
}

function combatUnassignBlk(ei, bi) {
  const s = combatState;
  const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'block' && a.enemyIndex === ei && a.slotIndex === bi);
  if (entry) { delete s.assignments[+entry[0]]; combatRender(); }
}

function combatAssignSpecial(ei) {
  if (combatSelectedDie === null) return;
  const s = combatState;
  const occupied = Object.entries(s.assignments).find(([_, a]) => a.type === 'special' && a.enemyIndex === ei);
  if (occupied) delete s.assignments[+occupied[0]];
  delete s.assignments[combatSelectedDie];
  s.assignments[combatSelectedDie] = {type: 'special', enemyIndex: ei};
  combatSelectedDie = null; combatRender();
}

function combatUnassignSpecial(ei) {
  const s = combatState;
  const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'special' && a.enemyIndex === ei);
  if (entry) { delete s.assignments[+entry[0]]; combatRender(); }
}

function combatAssignSBlock(si) {
  if (combatSelectedDie === null) return;
  const s = combatState;
  const occupied = Object.entries(s.assignments).find(([_, a]) => a.type === 'sblock' && a.supportIndex === si);
  if (occupied) delete s.assignments[+occupied[0]];
  delete s.assignments[combatSelectedDie];
  s.assignments[combatSelectedDie] = {type: 'sblock', supportIndex: si};
  combatSelectedDie = null; combatRender();
}

function combatUnassignSBlock(si) {
  const s = combatState;
  const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'sblock' && a.supportIndex === si);
  if (entry) { delete s.assignments[+entry[0]]; combatRender(); }
}

function combatApplyCard(delta) {
  if (combatSelectedDie === null || combatState.controlUsed) return;
  const s = combatState, b = s.dice[combatSelectedDie];
  s.dice[combatSelectedDie] = Math.max(1, Math.min(6, b + delta));
  s.abilityLog.push(`${s.cardName ? '✨ ' + s.cardName : '±1'}: ${dieFace(b)}→${dieFace(s.dice[combatSelectedDie])}`);
  s.controlUsed = true;
  combatSelectedDie = null;
  combatRender();
}

function combatRollMovement() {
  if (!combatState.movement) { combatState.movementUsed = true; return; }
  const r = () => Math.floor(combatState.rng() * 7) - 3; // −3..+3
  let a = r(), b = r(), guard = 0;
  while (b === a && guard++ < 12) b = r();
  combatState.movementPair = [a, b];
  combatState.movementUsed = false;
}

function combatApplyMovement(delta) {
  if (combatSelectedDie === null || combatState.movementUsed) return;
  const s = combatState, b = s.dice[combatSelectedDie];
  s.dice[combatSelectedDie] = Math.max(1, Math.min(6, b + delta));
  s.abilityLog.push(`🏃 движение ${delta > 0 ? '+' + delta : delta}: ${dieFace(b)}→${dieFace(s.dice[combatSelectedDie])}`);
  s.movementUsed = true;
  combatSelectedDie = null;
  combatRender();
}

function combatReroll() {
  if (combatSelectedDie === null || combatState.rerollUsed) return;
  const s = combatState, b = s.dice[combatSelectedDie];
  s.dice[combatSelectedDie] = Math.floor(s.rng() * 6) + 1;
  s.abilityLog.push(`🔄 переброс ${dieFace(b)}→${dieFace(s.dice[combatSelectedDie])}`);
  s.rerollUsed = true;
  combatSelectedDie = null;
  combatRender();
}

// Удаляет кубик и пересобирает индексы назначений
function combatRemoveDie(idx) {
  const s = combatState;
  s.dice.splice(idx, 1);
  const na = {};
  for (const [k, v] of Object.entries(s.assignments)) {
    const ki = +k;
    if (ki === idx) continue;
    na[ki > idx ? ki - 1 : ki] = v;
  }
  s.assignments = na;
}

function combatConsumeAbility(ab) {
  if (ab.usesLeft !== Infinity) ab.usesLeft--;
  ab.availableRound = combatState.round + 1 + ab.cooldown;
}

function combatDepositDie() {
  const s = combatState;
  if (!s.counter || s.counter.value >= s.counter.n) return;
  if (combatSelectedDie === null || combatSelectedDie in s.assignments) return;
  const v = s.dice[combatSelectedDie];
  combatRemoveDie(combatSelectedDie);
  combatSelectedDie = null;
  s.counter.value = Math.min(s.counter.n, s.counter.value + 1);
  s.abilityLog.push(`🔢 скинул куб ${dieFace(v)} → счётчик ${s.counter.value}/${s.counter.n}`);
  combatRender();
}

function combatUseCounter() {
  const s = combatState;
  if (!s.counter || s.counter.value < s.counter.n) return;
  s.counter.value = 0;
  s.dice.push(JOKER);
  s.abilityLog.push(`🃏 счётчик использован → кубик-джокер`);
  combatRender();
}

function combatUseAbility(idx) {
  const s = combatState;
  const ab = s.abilities[idx];
  if (!ab || ab.usesLeft <= 0 || s.round < ab.availableRound) return;
  const meta = ABILITY_CATALOG[ab.id];
  const sel = combatSelectedDie;
  if (meta.target && (sel === null || sel in s.assignments)) return;
  if (ab.id === 'merge') {
    if (s.dice.length - Object.keys(s.assignments).length < 2) return;
    combatMergePending = sel; combatMergeAbilityIdx = idx;
    combatSelectedDie = null; combatRender(); return;
  }
  const face = v => dieFace(v);
  if (ab.id === 'extra_die') {
    const nv = Math.floor(s.rng() * 6) + 1;
    s.dice.push(nv);
    s.abilityLog.push(`🎲 доп. кубик ${face(nv)}`);
  } else if (ab.id === 'flip') {
    const b = s.dice[sel]; s.dice[sel] = 7 - b;
    s.abilityLog.push(`🔄 переворот ${face(b)}→${face(s.dice[sel])}`);
  } else if (ab.id === 'set') {
    const b = s.dice[sel]; s.dice[sel] = ab.value;
    s.abilityLog.push(`🎯 грань ${face(b)}→${face(ab.value)}`);
  } else if (ab.id === 'split') {
    const v = s.dice[sel];
    if (v < 2) return;
    const v1 = 1 + Math.floor(s.rng() * (v - 1));  // 1..v-1, остаток v-v1 тоже ≥1
    s.dice[sel] = v1; s.dice.push(v - v1);
    s.abilityLog.push(`✂️ сплит ${face(v)} → ${face(v1)}+${face(v - v1)}`);
  } else if (ab.id === 'save') {
    const sv = s.dice[sel];
    s.savedDice.push(sv);
    combatRemoveDie(sel);
    s.abilityLog.push(`💾 отложил ${face(sv)} (вернётся в след. раунд)`);
  }
  combatConsumeAbility(ab);
  combatSelectedDie = null;
  combatRender();
}

function combatDoMerge(a, b) {
  const s = combatState;
  const ab = s.abilities[combatMergeAbilityIdx];
  if (!ab) { combatMergePending = null; combatMergeAbilityIdx = null; combatRender(); return; }
  const va = s.dice[a], vb = s.dice[b];
  const merged = Math.min(6, va + vb);
  const lo = Math.min(a, b), hi = Math.max(a, b);
  s.dice[lo] = merged;
  combatRemoveDie(hi);
  s.abilityLog.push(`➕ слил ${dieFace(va)}+${dieFace(vb)} → ${dieFace(merged)}`);
  combatConsumeAbility(ab);
  combatMergePending = null; combatMergeAbilityIdx = null;
  combatSelectedDie = null;
  combatRender();
}

function combatResolve() {
  const s = combatState;
  combatClearTimer();
  // Лог начинается с действий игрока над кубиками (движение/способности/контрол/переброс)
  const log = (s.abilityLog || []).slice();

  // Нейтрализация особенностей: куб в слот «Особенность», подходящий под требование
  s.enemies.forEach((e, i) => {
    e.specNeutralized = false;
    if (e.hp <= 0 || !e.special) return;
    const sp = Object.entries(s.assignments).find(([_, a]) => a.type === 'special' && a.enemyIndex === i);
    if (sp) e.specNeutralized = reqMet(s.dice[+sp[0]], e.specialReq);
  });

  s.enemies.forEach((e, i) => {
    if (e.hp <= 0) return;
    // Уклонение: если не нейтрализовано — шанс, что все удары игрока промахиваются
    if (e.special && e.special.kind === 'dodge' && !e.specNeutralized && s.rng() < e.special.chance) {
      e.dodgedThisRound = true;
    } else {
      e.dodgedThisRound = false;
    }
    const atkEntries = Object.entries(s.assignments).filter(([_, a]) => a.type === 'attack' && a.enemyIndex === i);
    if (atkEntries.length === 0) return;
    if (e.dodgedThisRound) { log.push(`🌀 ${e.name}: уклонился — удары мимо`); return; }
    let dmg = 0; const faces = [];
    atkEntries.forEach(([di, a]) => {
      const dv = s.dice[+di];
      dmg += calcDefeatDamage(dv, e.defeatSlots[a.slotIndex]);
      faces.push(dieFace(dv));
    });
    if (dmg > 0) {
      const actual = Math.min(dmg, e.hp);
      e.hp = Math.max(0, e.hp - dmg);
      log.push(`⚔️ ${e.name}: -${actual}❤️${e.hp <= 0 ? ' (повержен!)' : ''}`);
      // Счётчик: убил не раненного (полное HP на начало раунда) за один ход → +1
      if (e.hp <= 0 && s.counter && e.hpAtStart === e.max_hp) {
        s.counter.value = Math.min(s.counter.n, s.counter.value + 1);
        log.push(`🔢 счётчик +1 (${s.counter.value}/${s.counter.n}) — повержен не раненный`);
      }
    } else {
      log.push(`💨 ${e.name}: промах (${faces.join('')})`);
    }
  });

  let totalTaken = 0;
  s.enemies.forEach((e, i) => {
    if (e.hp <= 0) return;
    e.blockReqs.forEach((req, bi) => {
      const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'block' && a.enemyIndex === i && a.slotIndex === bi);
      if (entry) {
        const dv = s.dice[+entry[0]];
        const taken = calcBlockTaken(dv, req);
        if (taken === 0) log.push(`🛡 ${e.name}: блок! (${dieFace(dv)} ✓ ${reqLabel(req)})`);
        else { log.push(`🛡 ${e.name}: ${dieFace(dv)} → ${taken} урона`); totalTaken += taken; }
      } else {
        log.push(`💔 ${e.name} атакует: 2 урона`); totalTaken += 2;
      }
    });
    // Заряд: если не нейтрализован — следующий раунд +1 атака
    if (e.special && e.special.kind === 'charge') {
      e.charged = !e.specNeutralized;
      if (e.charged) log.push(`⚡ ${e.name}: заряд накоплен — в следующий раунд две атаки`);
      else log.push(`✨ ${e.name}: заряд сбит`);
    }
  });
  // Обстрел (поддержка врага): один куб атаки, только блокируется (бинарно)
  s.supports.forEach((sp, si) => {
    const entry = Object.entries(s.assignments).find(([_, a]) => a.type === 'sblock' && a.supportIndex === si);
    if (entry) {
      const dv = s.dice[+entry[0]];
      if (reqMet(dv, sp.blockReq)) log.push(`🏹 ${sp.name}: блок! (${dieFace(dv)} ✓ ${reqLabel(sp.blockReq)})`);
      else { log.push(`🏹 ${sp.name}: ${dieFace(dv)} → 1 урон`); totalTaken += 1; }
    } else {
      log.push(`💥 ${sp.name} обстрел: 1 урон`); totalTaken += 1;
    }
  });

  if (totalTaken > 0) { s.playerHp = Math.max(0, s.playerHp - totalTaken); log.push(`Герой: ${s.playerHp}❤️ (−${totalTaken})`); }
  else if (s.enemies.some(e => e.hp > 0)) log.push('✅ Весь урон поглощён');

  // Чистая оборона: были только блоки (ни одной атаки) и урона не получено → +1 куб на след. раунд.
  // Не требуется занять ВСЕ кубы — достаточно блокировать без атак и без урона (часть кубов может остаться).
  const attackCount = Object.values(s.assignments).filter(a => a.type === 'attack').length;
  const blockCount = Object.values(s.assignments).filter(a => a.type === 'block' || a.type === 'sblock').length;
  const fullDefense = attackCount === 0 && blockCount > 0 && totalTaken === 0;
  s.diceCount = fullDefense ? 5 : 4;
  if (fullDefense) log.push('🛡 Чистая оборона — +1 кубик в следующем раунде (5)');

  s.roundLogs.push({round: s.round, dice: [...s.dice], log: [...log]});
  s.round++;
  document.getElementById('combat-log').innerHTML = log.join('<br>');

  const alive = s.enemies.filter(e => e.hp > 0).length;
  if (s.playerHp <= 0 || alive === 0) {
    s.done = true; setTimeout(combatEnd, 900);
  } else if (s.round > s.maxRounds) {
    s.sceneRevisit = true;
    s.done = true; setTimeout(combatEnd, 900);
  } else {
    document.getElementById('combat-confirm').disabled = true;
    setTimeout(combatStartRound, 1300);
  }
}

function combatEnd() {
  const s = combatState;
  combatClearTimer();
  document.getElementById('combat-timer').style.display = 'none';
  const defeated = s.enemies.filter(e => e.hp <= 0).length;
  const allDefeated = defeated === s.enemies.length;
  const playerAlive = s.playerHp > 0;
  let outcome, level, label, cls;
  if (playerAlive && allDefeated) {
    outcome = 'victory'; level = 3; label = '⚔️ Победа!'; cls = 'result-good';
  } else if (!playerAlive) {
    outcome = 'defeat'; level = 0; label = '💀 Поражение'; cls = 'result-bad';
  } else if (s.sceneRevisit) {
    outcome = 'scene_revisit'; level = 2;
    label = `⏱ Пересмотр сцены (${s.maxRounds} раунд.)`; cls = 'result-mid';
  } else if (defeated > 0) {
    outcome = 'partial'; level = 1; label = '🩸 Частичная победа'; cls = 'result-mid';
  } else {
    outcome = 'escape'; level = 0; label = '🌪 Бой прерван'; cls = 'result-bad';
  }
  combatResult = {
    game: 'combat', outcome, level, victory: outcome === 'victory',
    scene_revisit: !!s.sceneRevisit,
    rounds: s.round - 1, max_rounds: s.maxRounds,
    enemies_defeated: defeated, enemies_total: s.enemies.length,
    player_hp_remaining: s.playerHp, rounds_log: s.roundLogs,
  };
  combatShowSummary(label, cls, defeated);
}

function combatShowSummary(label, cls, defeated) {
  const s = combatState;
  document.getElementById('combat-game').style.display = 'none';
  const banner = document.getElementById('combat-summary-banner');
  banner.className = 'result-banner ' + cls;
  banner.textContent = label;
  const hearts = '❤️'.repeat(Math.max(0, s.playerHp)) + '🖤'.repeat(Math.max(0, s.maxPlayerHp - s.playerHp));
  document.getElementById('combat-summary-stats').innerHTML =
    `Раундов: ${s.round - 1} · Повержено: ${defeated}/${s.enemies.length} · Герой: ${hearts || '—'}`;
  let html = '';
  s.roundLogs.forEach(r => {
    html += `<div style="margin-bottom:10px"><b>Раунд ${r.round}</b> &nbsp;${r.dice.map(dieFace).join(' ')}<br>${r.log.join('<br>')}</div>`;
  });
  document.getElementById('combat-summary-log').innerHTML = html || '—';
  document.getElementById('combat-summary').style.display = '';
}

function combatFinish() {
  if (combatResult) sendResultToBot(combatResult);
}

initCombat();
</script>
